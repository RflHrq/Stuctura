# Feedback em tres etapas (RF17): validacao, contradicao, reconstrucao.
#
# ATENCAO — TEXTO A REVISAR. Estes moldes foram redigidos junto com o
# motor, nao extraidos de fonte. Sao a unica parte do dominio que nao veio
# do autor, e sao lidos pelo participante. Revisar antes do congelamento.
#
# ------------------------------------------------------------------------
# POR QUE ESTE ARQUIVO NAO CONTEM NADA SOBRE PONTEIROS
#
# Os moldes falam de RACIOCINIO, nao de C: "voce confirmou X, e X e Y nao
# podem valer juntos". O conteudo entra pelos marcadores, que o motor
# preenche a partir do grafo. Trocar os YAMLs troca o dominio sem tocar
# aqui — que e o principio §1.
#
# ------------------------------------------------------------------------
# SIMETRIA ENTRE OS BRACOS
#
# O feedback e apresentado nos DOIS bracos, nos mesmos tres pontos. O §8.1
# lista o que e identico entre socratico e direto; feedback nao esta na
# lista porque nao existia ainda. Se um braco recebesse elaboracao verbal
# que o outro nao recebe, a variavel isolada deixaria de ser a geracao
# ativa — e o experimento mediria duas coisas ao mesmo tempo.
#
# `tests/test_feedback.py` afirma essa simetria.
#
# ------------------------------------------------------------------------
# MARCADORES DISPONIVEIS (o validador recusa qualquer outro)
#
#   {belief}       o que a crenca detectada afirma
#   {support}      as premissas que sustentam o no, em lista
#   {node}         o enunciado do no em questao
#   {conclusion}   a conclusao do KC
#   {kc_name}      o nome do KC

schema_version: 1

feedback:

  # ETAPA 1 — VALIDACAO
  #
  # Antes de refutar, reconhecer o que ha de legitimo no raciocinio. Nao e
  # cortesia: um aluno que se sente corrigido defende a posicao; um aluno
  # que se sente ouvido examina a propria premissa. E o que faz a refutacao
  # socratica ser examinada em vez de aceita por autoridade.
  validation:
    misconception: >-
      Sua resposta nao foi aleatoria. Ela segue de uma ideia coerente:
      {belief} Muita gente boa em programacao pensa assim, e o motivo de
      pensar assim quase sempre e razoavel. Vamos examinar de onde ela vem.
    gap: >-
      Ate aqui voce nao afirmou nada errado. O que aparece e uma peca que
      ainda nao foi colocada, nao um engano. Vamos coloca-la.
    unknown: >-
      Este topico ainda nao foi construido com voce. Nao ha o que corrigir:
      ha o que montar, do comeco.

  # ETAPA 2 — CONTRADICAO
  #
  # Apresentada no momento em que o traversal chega ao no que a crenca
  # nega, e nao antes. O aluno ja confirmou as premissas; a contradicao e
  # entre coisas que ELE afirmou, nao entre ele e o sistema.
  #
  # NAO repete {support} aqui de proposito. A pergunta logo abaixo ja
  # lista as premissas, uma por linha; repeti-las na prosa fazia o aluno
  # ler a mesma lista duas vezes na mesma tela. O marcador continua
  # disponivel — so nao esta em uso.
  contradiction:
    template: >-
      Antes, voce respondeu partindo de que {belief} Mas as premissas que
      voce acabou de confirmar, logo abaixo, levam a outro lugar. As duas
      coisas nao podem valer ao mesmo tempo — qual delas voce sustenta?
    without_belief: >-
      O passo seguinte decorre do que voce ja confirmou — e so disso.

  # ETAPA 3 — RECONSTRUCAO
  #
  # No fecho. Nao repete a conclusao: diz de onde ela veio. E a diferenca
  # entre "a resposta certa e X" e "voce chegou a X, e foi por aqui".
  reconstruction:
    socratic: >-
      Repare no caminho: {conclusion} Isso nao lhe foi dito. Cada premissa
      dessa cadeia foi uma resposta sua, e a conclusao veio delas.
    direct: >-
      Repare no caminho: {conclusion} Cada passo apoia o seguinte, e nenhum
      deles precisa ser decorado: eles decorrem uns dos outros.
    after_correction: >-
      A ideia que voce trazia no comeco deste topico levava a outro lugar.
      Compare com o que a cadeia acima sustenta.

  # ETAPA 3b — FECHAMENTO EM ABERTO
  #
  # So aparece quando o KC e deixado sem ser construido: o aluno recusou o
  # mesmo passo tres vezes, estourou o limite de rodadas, ou o dominio nao
  # tinha atividade para fechar o topico. Antes, nesse caso, a sessao
  # simplesmente pulava para o proximo KC — e a pessoa saia dali com a
  # crenca com que entrou, sem nunca ler a frase certa. Nao da para exigir
  # que ele construa; da para nao deixa-lo sair sem saber.
  #
  # O nome tecnico NAO entra aqui: nomear e o fecho de quem construiu
  # (RF10), e este nao construiu.
  # NAO usa {conclusion}: a conclusao ja aparece no quadro logo acima, e
  # repeti-la fazia o participante ler a mesma frase duas vezes na mesma
  # tela — o mesmo problema que tirou {support} da contradicao. O marcador
  # continua disponivel.
  closure:
    with_belief: >-
      Vamos parar por aqui neste topico. Voce entrou partindo de que
      {belief} A frase acima e o que as premissas sustentam. Fique com as
      duas lado a lado: a distancia entre elas e o que ficou em aberto.
    without_belief: >-
      Este topico fica em aberto, e nao ha nada de errado nisso. A frase
      acima nao precisa ser decorada: ela decorre dos passos, e eles
      continuam aqui quando voce voltar.

# ------------------------------------------------------------------------
# MOLDES DAS PERGUNTAS DO TRAVERSAL
#
# Estavam embutidos em engine/socratic.py. Sao texto que o aluno le, entao
# sao dominio — e o motor nao pode conter uma linha deles (§1).
#
# Marcadores:
#   {node}          o enunciado do no, sem o nome tecnico
#   {support}       as premissas que o sustentam, em prosa corrida
#   {support_list}  as mesmas, uma por linha, com marcador
#
# POR QUE HA DUAS VARIANTES PARA NO-BASE
#
# "Olhando o diagrama" so pode ser dito quando ha um diagrama NA TELA. O
# confronto visual (RF08) acontece antes do traversal e so quando a crenca
# nega um no-base; na maioria dos traversals nao ha diagrama nenhum, e a
# pergunta mandava o aluno olhar para algo que nao existe.
#
# O motor escolhe a variante conforme o diagrama estar de fato sendo
# apresentado junto da pergunta.

prompts:

  # No BASE: fato observavel. Nao ha premissa anterior para invocar.
  base_with_diagram: "Olhando o diagrama: {node}, certo?"
  base_plain: "Confirme comigo: {node}, certo?"

  # No de INFERENCIA: cita o suporte que o aluno JA confirmou e pede a
  # conclusao. E aqui que o socratico morde — ele nao consegue
  # reinterpretar uma conclusao construida com as respostas dele.
  # Uma premissa por linha. Em prosa corrida, tres premissas em linguagem
  # corrente viram um paragrafo em que nao se ve onde uma acaba e a outra
  # comeca — e a inferencia depende justamente de ve-las separadas.
  # {support} (prosa corrida) continua disponivel se preferir.
  #
  # SEM conector proprio antes de {node}. O enunciado dos nos de inferencia
  # ja traz o seu — "Entao...", "Por isso...", "Mas...", "Juntando..." —, e
  # ele precisa estar la: o braco direto apresenta o mesmo texto SEM molde
  # nenhum, e sem o conector a frase chegaria solta. Com um conector aqui,
  # o participante lia "Juntando: Entao p e a caixa...".
  inference: |-
    Você já confirmou:
    {support_list}
    {node}, certo?
  inference_no_support: "{node}, certo?"

  # Primeira tentativa depois de um erro: em vez de mudar de assunto,
  # torna visivel a cadeia que sustenta a conclusao pedida.
  retry_base_with_diagram: "Olhe de novo o diagrama. {node} — é o que você vê?"
  retry_base_plain: "Vamos com calma. {node} — você concorda?"
  retry_inference: |-
    Vamos por partes. Você já confirmou:
    {support_list}
    Juntando: {node}
