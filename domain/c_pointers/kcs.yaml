# Structura -- dominio declarativo: ponteiros em C
# Os ids sao ESTAVEIS. teaching_order deriva de prerequisites e nao
# deve ser usado como identidade. Renumerar kc_* quebra o event log.
domain: c_pointers
schema_version: 1

kcs:
  - id: kc_01
    name: Modelo de memoria
    conclusion: >-
      A memoria do processo tem regioes com regras de vida diferentes:
      a stack e gerenciada pelo compilador, o heap pelo programador.
    conclusion_node: I2
    prerequisites: []
    teaching_order: 1

  - id: kc_02
    name: O que e um ponteiro
    conclusion: >-
      Um ponteiro e uma variavel cujo valor e o endereco de outro objeto.
      O ponteiro e o objeto apontado sao duas entidades separadas.
    conclusion_node: I2
    prerequisites: [kc_01]
    teaching_order: 2

  - id: kc_03
    name: Declaracao e inicializacao
    conclusion: >-
      int *p; cria so o ponteiro, com valor indeterminado. Nao cria nem
      inicializa o objeto apontado.
    conclusion_node: I3
    prerequisites: [kc_02]
    teaching_order: 3

  - id: kc_04
    name: Dereferencia (* e &)
    conclusion: >-
      &x produz o endereco de x; *p acessa o objeto no endereco guardado
      em p. Sao operacoes inversas sobre objetos que ocupam memoria.
    conclusion_node: I3
    prerequisites: [kc_02, kc_03]
    teaching_order: 4

  - id: kc_05
    name: Ponteiro NULL
    conclusion: >-
      NULL e um valor de ponteiro que garantidamente nao designa objeto
      algum. Desreferencia-lo e comportamento indefinido.
    conclusion_node: I3
    prerequisites: [kc_03, kc_04]
    teaching_order: 5

  - id: kc_06
    name: Passagem por referencia
    conclusion: >-
      C passa tudo por valor. Uma funcao recebe copia do argumento; para
      modificar o objeto do chamador, precisa receber o endereco dele.
    conclusion_node: I5
    prerequisites: [kc_04]
    teaching_order: 6

  - id: kc_07
    name: Ponteiro e array
    conclusion: >-
      Array e ponteiro sao tipos distintos. Em quase toda expressao o nome
      do array converte-se no endereco do primeiro elemento, mas o array
      nao e um ponteiro.
    conclusion_node: I1
    prerequisites: [kc_04, kc_06]
    teaching_order: 7

  - id: kc_11
    name: Aritmetica de ponteiros
    conclusion: >-
      p + n avanca n elementos do tipo apontado, nao n bytes. A escala vem
      do tipo, e o compilador a aplica sozinho.
    conclusion_node: I2
    prerequisites: [kc_04, kc_07]
    teaching_order: 8

  - id: kc_08
    name: Alocacao dinamica
    conclusion: >-
      malloc reserva um bloco no heap e devolve seu endereco, ou NULL se
      falhar. O bloco nao e inicializado e vive ate o free.
    conclusion_node: I4
    prerequisites: [kc_01, kc_02, kc_05]
    teaching_order: 9

  - id: kc_09
    name: free() e dangling pointer
    conclusion: >-
      free(p) devolve o bloco ao alocador. p continua existindo com o mesmo
      endereco, que agora nao designa objeto valido.
    conclusion_node: I4
    prerequisites: [kc_08, kc_06]
    teaching_order: 10

  - id: kc_12
    name: Dangling por escopo
    conclusion: >-
      Uma variavel local deixa de existir quando a funcao retorna. Um
      ponteiro para ela sobrevive e passa a nao designar objeto valido,
      sem que nenhum free tenha sido chamado.
    conclusion_node: I3
    prerequisites: [kc_01, kc_04, kc_06]
    teaching_order: 11

  - id: kc_10
    name: Ponteiro para ponteiro
    conclusion: >-
      int **pp e uma variavel cujo valor e o endereco de um int *. Cada *
      desfaz exatamente um nivel de indirecao.
    conclusion_node: I2
    prerequisites: [kc_04, kc_06, kc_07]
    teaching_order: 12
