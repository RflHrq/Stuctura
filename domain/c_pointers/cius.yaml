# Cognitive Interaction Units.
#
# Toda alternativa errada carrega um misconception_id do catalogo. Sem isso
# a CIU vira avaliacao, nao diagnostico: o sistema saberia que o aluno errou,
# nao qual crenca produziu o erro.
#
# targets: nos do grafo que a CIU avalia.
# phase:   diagnostic | traversal | variation
# visual:  especificacao do diagrama de memoria quando a CIU o exige.
#          Obrigatorio quando a CIU ataca um no-base (ver validador).
schema_version: 1

cius:

  # =============== KC 01 ===============
  - id: ciu_kc01_001
    kc: kc_01
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [I2]
    prompt: |
      int x = 10;
      int *p = malloc(sizeof(int));
      Onde ficam guardados x e o bloco pedido ao malloc?
    options:
      - text: "x na stack; o bloco no heap."
        correct: true
      - text: "Os dois no mesmo lugar: memoria e memoria."
        misconception: memory_is_uniform
      - text: "x na stack; o bloco em disco."
        misconception: memory_is_uniform

  - id: ciu_kc01_002
    kc: kc_01
    nivel: 1
    type: prediction
    phase: diagnostic
    targets: [B2, I1]
    prompt: |
      void f(void) { int y = 5; }
      Depois que f retorna, o que acontece com y?
    options:
      - text: "Deixa de existir; o espaco dela e reaproveitado."
        correct: true
      - text: "Continua existindo ate o programa terminar."
        misconception: memory_is_uniform

  - id: ciu_kc01_003
    kc: kc_01
    nivel: 2
    type: fill_blank
    phase: traversal
    targets: [B3, I1]
    prompt: |
      Um bloco pedido ao malloc so deixa de existir quando ______.
    answer: "o programa chama free"
    accept: ["free", "chamar free", "o programador libera"]
    distractor_patterns:
      - pattern: ["a funcao retorna", "acaba a funcao"]
        misconception: memory_is_uniform
      - pattern: ["o sistema libera", "sozinho", "automatico"]
        misconception: system_frees_auto
    visual:
      kind: memory_diagram
      regions: [stack, heap]
      states: [dentro_da_funcao, apos_o_retorno]
      controlled_by: student
      caption: "O quadro da funcao sumiu. E o bloco no heap?"

  # =============== KC 02 ===============
  - id: ciu_kc02_001
    kc: kc_02
    nivel: 1
    type: mcq
    phase: diagnostic
    targets: [I1]
    prompt: |
      int v = 42;
      int *p = &v;
      Quantas variaveis existem nesse trecho?
    options:
      - text: "Duas: v e p, cada uma com seu proprio espaco."
        correct: true
      - text: "Uma: p e apenas outro nome para v."
        misconception: pointer_is_data
      - text: "Uma: p e o proprio valor 42."
        misconception: pointer_is_data

  - id: ciu_kc02_002
    kc: kc_02
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I2]
    prompt: |
      int *p = malloc(sizeof(int));
      A variavel p esta guardada em qual regiao?
    options:
      - text: "Na stack; so o bloco apontado esta no heap."
        correct: true
      - text: "No heap, junto do bloco que ela aponta."
        misconception: pointer_lives_in_heap
    visual:
      kind: memory_diagram
      regions: [stack, heap]
      show: ["p na stack com seta", "bloco no heap"]
      caption: "Onde esta a caixa chamada p?"

  - id: ciu_kc02_003
    kc: kc_02
    nivel: 3
    type: mcq
    phase: traversal
    targets: [I3]
    prompt: |
      int n = 1000;
      int *p = (int *) n;
      Isso e valido?
    options:
      - text: "Compila, mas p nao passa a designar objeto algum valido."
        correct: true
      - text: "Sim: ponteiro e inteiro, so muda o nome do tipo."
        misconception: pointer_is_integer

  - id: ciu_kc02_004
    kc: kc_02
    nivel: 3
    type: mcq
    phase: traversal
    targets: [I3]
    prompt: |
      void *v;
      int (*f)(int);
      v = f;
      Isso e garantido pelo padrao C?
    options:
      - text: "Nao: void * e generico para ponteiros de objeto, nao de funcao."
        correct: true
      - text: "Sim: void * aceita qualquer ponteiro, inclusive de funcao."
        misconception: voidptr_is_universal
      - text: "Sim, desde que se faca o cast de volta antes de chamar."
        misconception: voidptr_is_universal

  # =============== KC 03 ===============
  - id: ciu_kc03_001
    kc: kc_03
    nivel: 1
    type: mcq
    phase: diagnostic
    targets: [I1]
    prompt: |
      int *p;
      Depois dessa linha, quanto de memoria foi reservado?
    options:
      - text: "So o espaco de p; nenhum int foi criado."
        correct: true
      - text: "O espaco de p e de um int para ele apontar."
        misconception: declaration_allocates
      - text: "Nada ainda; a declaracao nao reserva espaco."
        misconception: declaration_allocates

  - id: ciu_kc03_002
    kc: kc_03
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I2]
    prompt: |
      int *p;
      if (p == NULL) printf("nulo");
      O que esse programa imprime?
    options:
      - text: "Indefinido: p contem lixo, nao necessariamente NULL."
        correct: true
      - text: "Sempre imprime nulo: p comeca em NULL."
        misconception: uninitialized_is_null

  - id: ciu_kc03_003
    kc: kc_03
    nivel: 2
    type: parsons
    phase: traversal
    targets: [I1, I3]
    prompt: "Ordene os passos para usar um ponteiro com seguranca."
    steps_correct:
      - "Declarar o ponteiro"
      - "Fazer o ponteiro apontar para algo valido"
      - "Desreferenciar"
    common_wrong_orders:
      - order: ["Declarar o ponteiro", "Desreferenciar", "Fazer o ponteiro apontar para algo valido"]
        misconception: declaration_allocates

  # =============== KC 11 ===============
  - id: ciu_kc11_001
    kc: kc_11
    nivel: 3
    type: prediction
    phase: diagnostic
    targets: [I2, I3]
    prompt: |
      int a[5], *ip = a;
      for (int i = 0; i < 5; i++) a[i] = i;
      printf("%d", *(ip + 3 * sizeof(int)));
      O que esse programa imprime?
    options:
      - text: "Lixo: o deslocamento foi escalado duas vezes."
        correct: true
      - text: "Imprime 3, que e a[3]."
        misconception: ptr_arith_is_bytes
      - text: "Erro de compilacao."
        misconception: ptr_arith_is_bytes
    notes: "Item diagnostico mais forte do dominio: FAQ 4.4, com a saida observavel em execucao."

  - id: ciu_kc11_002
    kc: kc_11
    nivel: 1
    type: mcq
    phase: traversal
    targets: [I1, I2]
    prompt: |
      double *d aponta para o inicio de um vetor de double.
      Quantos bytes d + 1 avanca?
    options:
      - text: "sizeof(double) bytes: um elemento."
        correct: true
      - text: "Um byte."
        misconception: ptr_arith_is_bytes

  - id: ciu_kc11_003
    kc: kc_11
    nivel: 2
    type: fill_blank
    phase: traversal
    targets: [I4]
    prompt: "Escrever a[i] equivale exatamente a escrever ______."
    answer: "*(a + i)"
    accept: ["*(a+i)", "* (a + i)"]

  - id: ciu_kc11_004
    kc: kc_11
    nivel: 2
    type: prediction
    phase: traversal
    targets: [I5]
    prompt: |
      void *v = malloc(100);
      v = v + 1;
      Quantos bytes v avancou?
    options:
      - text: "Nenhum: nao ha aritmetica em void * no padrao, porque void nao tem tamanho."
        correct: true
      - text: "Um byte, como em qualquer ponteiro."
        misconception: voidptr_arith_ok
      - text: "sizeof(void) bytes, que vale 1."
        misconception: voidptr_arith_ok

  - id: ciu_kc11_005
    kc: kc_11
    nivel: 3
    type: mcq
    phase: variation
    targets: [I1, I2]
    prompt: |
      char buf[64];
      char *c = buf;
      int  *i = (int *) buf;
      c + 1 e i + 1 avancam a mesma quantidade de bytes?
    options:
      - text: "Nao: c avanca 1 e i avanca sizeof(int). A escala vem do tipo do ponteiro."
        correct: true
      - text: "Sim: os dois avancam 1 byte, porque somei 1."
        misconception: ptr_arith_is_bytes
      - text: "Sim: os dois avancam sizeof(int), porque apontam para o mesmo buffer."
        misconception: ptr_arith_is_bytes
    notes: "Variacao do KC 11: mesmo invariante de ciu_kc11_001, codigo sem array de int e sem sizeof explicito."

  - id: ciu_kc11_006
    kc: kc_11
    nivel: 1
    type: mcq
    phase: diagnostic
    targets: [I1]
    prompt: |
      int *p aponta para o primeiro de varios ints, um do lado do outro.
      Escrevendo p + 1, voce chega onde?
    options:
      - text: "No proximo int."
        correct: true
      - text: "No proximo byte."
        misconception: ptr_arith_is_bytes

  # O degrau do meio. Sem ele o KC ia do conceito (nivel 1) direto ao
  # deslocamento escalado duas vezes (nivel 3). Aqui o mesmo conceito
  # aparece num trecho de tres linhas, para PREVER em vez de afirmar.
  # A alternativa certa e a mais CURTA de proposito: o dominio tem vies de
  # comprimento (a correta e em media a mais longa), e a atividade nova
  # nao deve reforca-lo.
  - id: ciu_kc11_007
    kc: kc_11
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I1, I2]
    prompt: |
      int a[3] = {10, 20, 30};
      int *p = a;
      printf("%d", *(p + 1));
      O que e impresso?
    options:
      - text: "20: o segundo elemento."
        correct: true
      - text: "Um valor sem sentido: p + 1 andou so um byte e caiu no meio do 10."
        misconception: ptr_arith_is_bytes
      - text: "11: o + 1 soma no valor apontado."
  # =============== KC 09 ===============
  - id: ciu_kc09_001
    kc: kc_09
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [I1, I2]
    prompt: |
      int *p = malloc(sizeof(int));
      free(p);
      O que free(p) liberou?
    options:
      - text: "So o bloco no heap; p continua na stack com o mesmo valor."
        correct: true
      - text: "Tanto p quanto o bloco no heap."
        misconception: free_kills_pointer
      - text: "O bloco, e p passou a valer NULL."
        misconception: free_nullifies

  - id: ciu_kc09_002
    kc: kc_09
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I3, I5]
    prompt: |
      free(p);
      printf("%d", *p);
      O que acontece nessa segunda linha?
    options:
      - text: "Comportamento indefinido: o bloco nao e mais valido."
        correct: true
      - text: "Imprime o valor normalmente: o dado ainda esta la."
        misconception: heap_persists
    visual:
      kind: memory_diagram
      states: [antes_do_free, depois_do_free]
      controlled_by: student
      caption: "Alterne entre antes e depois. O que mudou? O que nao mudou?"

  - id: ciu_kc09_003
    kc: kc_09
    nivel: 3
    type: contrast
    phase: variation
    targets: [I4, I6]
    prompt: |
      Dois trechos liberam memoria. Um deles fica seguro contra uso posterior.
      Qual, e por que?
        A:  free(p);
        B:  free(p); p = NULL;
    options:
      - text: "B: atribuir NULL registra que p nao designa mais nada."
        correct: true
      - text: "Os dois: free ja deixa p em NULL."
        misconception: null_after_free_redundant
      - text: "Os dois: depois do free nao da para usar p de qualquer jeito."
        misconception: double_free_is_safe

  - id: ciu_kc09_004
    kc: kc_09
    nivel: 1
    type: mcq
    phase: diagnostic
    targets: [I2]
    prompt: |
      int *p = malloc(sizeof(int));
      free(p);
      Depois dessas linhas, o que aconteceu com a caixa p?
    options:
      - text: "Continua com o mesmo endereco."
        correct: true
      - text: "Passou a valer NULL."
        misconception: free_nullifies
      - text: "Sumiu junto com o pedaco devolvido."
  # =============== KC 04 ===============
  - id: ciu_kc04_001
    kc: kc_04
    nivel: 1
    type: mcq
    phase: diagnostic
    targets: [I1]
    prompt: |
      void f(int *ip);
      Por que a chamada f(&5); nao compila?
    options:
      - text: "Porque 5 e um valor, nao um objeto: nao ha endereco para tomar."
        correct: true
      - text: "Porque falta um cast: bastaria f((int *) &5)."
        misconception: ampersand_takes_value
      - text: "Porque & so funciona com variaveis do tipo declarado no parametro."
        misconception: ampersand_takes_value

  - id: ciu_kc04_002
    kc: kc_04
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [B4]
    prompt: |
      char *p;
      *p = malloc(10);
      O compilador reclama. O que esta errado?
    options:
      - text: "A atribuicao e em p, nao em *p: quem recebe o endereco e o ponteiro."
        correct: true
      - text: "Nada: *p e a forma de se referir ao ponteiro p."
        misconception: star_assigns_pointer
      - text: "Falta alocar antes: era preciso um malloc para p e outro para *p."
        misconception: star_assigns_pointer
    visual:
      kind: annotated_declaration
      show:
        - "int *p  ->  o * pertence ao TIPO: p e um ponteiro para int"
        - "*p = v  ->  o * e OPERADOR: escreve no objeto apontado"
      caption: "O mesmo simbolo, dois papeis. Onde ele aparece muda o que faz."

  - id: ciu_kc04_003
    kc: kc_04
    nivel: 2
    type: prediction
    phase: traversal
    targets: [I2, I3]
    prompt: |
      int x = 7;
      int *p = &x;
      *p = 9;
      printf("%d", x);
      O que e impresso?
    options:
      - text: "9: *p e o proprio x, entao escrever em *p escreve em x."
        correct: true
      - text: "7: *p e uma copia; x nao muda."
        misconception: star_assigns_pointer

  - id: ciu_kc04_004
    kc: kc_04
    nivel: 2
    type: fill_blank
    phase: traversal
    targets: [I3]
    prompt: "Para qualquer variavel x, a expressao *(&x) vale sempre ______."
    answer: "x"
    accept: ["o proprio x", "o valor de x"]
    distractor_patterns:
      - pattern: ["o endereco", "&x", "o endereco de x"]
        misconception: ampersand_takes_value

  # =============== KC 05 ===============
  - id: ciu_kc05_001
    kc: kc_05
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I3]
    prompt: |
      int *p = NULL;
      printf("%d", *p);
      O que acontece na segunda linha?
    options:
      - text: "Comportamento indefinido: nao ha objeto nesse endereco para ler."
        correct: true
      - text: "Imprime 0, porque NULL vale 0."
        misconception: null_is_safe_to_deref
      - text: "Imprime lixo, mas o programa segue normalmente."
        misconception: null_is_safe_to_deref

  - id: ciu_kc05_002
    kc: kc_05
    nivel: 3
    type: mcq
    phase: diagnostic
    targets: [I4]
    prompt: |
      Uma implementacao de C pode representar o ponteiro nulo internamente
      com um padrao de bits diferente de zero?
    options:
      - text: "Pode. A constante 0 no codigo-fonte e convertida para o que a implementacao usar."
        correct: true
      - text: "Nao: NULL e zero, entao os bits tem de ser zero."
        misconception: null_is_zero_always

  - id: ciu_kc05_003
    kc: kc_05
    nivel: 1
    type: mcq
    phase: traversal
    targets: [I1, I2]
    prompt: |
      if (p) { ... }
      O que essa condicao faz?
    options:
      - text: "Compara p com o ponteiro nulo; nao acessa o objeto apontado."
        correct: true
      - text: "Le o valor apontado por p e verifica se e diferente de zero."
        misconception: null_is_safe_to_deref

  - id: ciu_kc05_004
    kc: kc_05
    nivel: 2
    type: fill_blank
    phase: traversal
    targets: [I1]
    prompt: "NULL nao e ausencia de valor: e um valor de ponteiro que nao designa ______."
    answer: "objeto algum"
    accept: ["nenhum objeto", "objeto nenhum", "nada"]

  # =============== KC 06 ===============
  - id: ciu_kc06_001
    kc: kc_06
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I1]
    prompt: |
      void dobra(int v) { v = v * 2; }
      int main(void) { int n = 5; dobra(n); printf("%d", n); }
      O que e impresso?
    options:
      - text: "5: dobra recebeu uma copia de n."
        correct: true
      - text: "10: a funcao trabalhou sobre o proprio n."
        misconception: function_gets_original

  - id: ciu_kc06_002
    kc: kc_06
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I4]
    prompt: |
      void aloca(int *q) { q = malloc(sizeof(int)); }
      int main(void) { int *p = NULL; aloca(p); /* p aqui vale o que? */ }
      Depois da chamada, quanto vale p?
    options:
      - text: "Continua NULL: aloca alterou a copia q, nao p."
        correct: true
      - text: "Aponta para o bloco recem-alocado."
        misconception: pointer_copy_is_alias
      - text: "Aponta para o mesmo bloco, porque q e p sao a mesma variavel."
        misconception: pointer_copy_is_alias

  - id: ciu_kc06_003
    kc: kc_06
    nivel: 2
    type: mcq
    phase: traversal
    targets: [I2, I3]
    prompt: |
      void inc(int *q) { (*q)++; }
      int main(void) { int n = 5; inc(&n); printf("%d", n); }
      Imprime 6. Por que funcionou, se C passa tudo por valor?
    options:
      - text: "q e copia do endereco de n; *q chega ao proprio n."
        correct: true
      - text: "Porque com & a passagem deixa de ser por valor."
        misconception: function_gets_original

  - id: ciu_kc06_004
    kc: kc_06
    nivel: 3
    type: contrast
    phase: variation
    targets: [I3, I4]
    prompt: |
      Dentro de uma funcao que recebeu int *q:
        A:  *q = 10;
        B:  q = &outra;
      Qual das duas o chamador enxerga?
    options:
      - text: "So A. B muda apenas a copia local do endereco."
        correct: true
      - text: "As duas: q e o ponteiro do chamador."
        misconception: pointer_copy_is_alias

  # =============== KC 07 ===============
  - id: ciu_kc07_001
    kc: kc_07
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [I1]
    prompt: |
      int a[5];
      int *p = a;
      Depois dessas linhas, a e p sao a mesma coisa?
    options:
      - text: "Nao: p e uma variavel ponteiro; a nomeia os 5 ints e nao e reatribuivel."
        correct: true
      - text: "Sim: array e ponteiro sao a mesma coisa em C."
        misconception: array_is_pointer
      - text: "Sim: a e apenas um ponteiro constante para o primeiro elemento."
        misconception: array_is_pointer

  - id: ciu_kc07_002
    kc: kc_07
    nivel: 3
    type: prediction
    phase: diagnostic
    targets: [I3]
    prompt: |
      int a[10];
      int *p = a;
      printf("%zu %zu", sizeof(a), sizeof(p));
      Supondo int de 4 bytes e ponteiro de 8, o que e impresso?
    options:
      - text: "40 8: sizeof(a) mede o array; sizeof(p) mede o ponteiro."
        correct: true
      - text: "40 40: os dois se referem ao mesmo array."
        misconception: sizeof_array_via_pointer
      - text: "8 8: em expressao, a vira ponteiro."
        misconception: array_is_pointer

  - id: ciu_kc07_003
    kc: kc_07
    nivel: 2
    type: prediction
    phase: traversal
    targets: [I2]
    prompt: |
      char destino[10];
      char *origem = "abc";
      destino = origem;
      Por que a terceira linha nao compila?
    options:
      - text: "O nome do array nao e modificavel: nao ha o que atribuir a ele."
        correct: true
      - text: "Falta um cast entre char[10] e char *."
        misconception: array_is_assignable
      - text: "Compila sim; o problema e so o tamanho diferente."
        misconception: array_is_assignable

  - id: ciu_kc07_004
    kc: kc_07
    nivel: 2
    type: prediction
    phase: traversal
    targets: [I4]
    prompt: |
      void f(int a[10]) { printf("%zu", sizeof(a)); }
      Chamada com um array de 10 ints, o que f imprime?
    options:
      - text: "O tamanho de um ponteiro: o parametro foi reescrito como int *a."
        correct: true
      - text: "40, o tamanho do array declarado no parametro."
        misconception: sizeof_array_via_pointer
      - text: "40, porque arrays sao passados por referencia."
        misconception: array_passed_by_reference

  - id: ciu_kc07_005
    kc: kc_07
    nivel: 3
    type: mcq
    phase: traversal
    targets: [I5]
    prompt: |
      int arr[5];
      Qual a diferenca entre arr e &arr?
    options:
      - text: "Apontam para o mesmo endereco, mas tem tipos diferentes: int * e int (*)[5]."
        correct: true
      - text: "Nenhuma: sao a mesma coisa escrita de dois jeitos."
        misconception: arr_equals_addr_of_arr

  - id: ciu_kc07_006
    kc: kc_07
    nivel: 2
    type: mcq
    phase: variation
    targets: [B1]
    prompt: |
      char *s = "abc";
      char t[] = "abc";
      As duas linhas armazenam a string do mesmo jeito?
    options:
      - text: "Nao: t e um array de 4 chars copiado; s aponta para um literal que nao deve ser alterado."
        correct: true
      - text: "Sim: as duas criam um array de caracteres."
        misconception: string_literal_is_array
    visual:
      kind: memory_diagram
      regions: [stack, literais]
      show:
        - "t: 4 caixas de char na stack, com copia de a b c \\0"
        - "s: uma caixa de ponteiro na stack, com seta para o literal"
      caption: "Mesma aparencia no codigo. Duas coisas diferentes na memoria."

  - id: ciu_kc07_007
    kc: kc_07
    nivel: 1
    type: mcq
    phase: diagnostic
    targets: [B1]
    prompt: |
      int a[5];
      Quantas caixas de inteiro essa linha cria?
    options:
      - text: "Cinco, uma ao lado da outra."
        correct: true
      - text: "Uma, que guarda onde as outras comecam."
        misconception: array_is_pointer
      - text: "Nenhuma ainda: so quando a for usada."
  # =============== KC 08 ===============
  - id: ciu_kc08_001
    kc: kc_08
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I3]
    prompt: |
      int *p = malloc(sizeof(int));
      printf("%d", *p);
      O que e impresso?
    options:
      - text: "Indefinido: malloc nao define o conteudo do bloco."
        correct: true
      - text: "0, porque malloc zera a memoria que devolve."
        misconception: malloc_initializes_zero

  - id: ciu_kc08_002
    kc: kc_08
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [I2]
    prompt: |
      int *p = malloc(n * sizeof(int));
      p[0] = 1;
      Por que a segunda linha e arriscada?
    options:
      - text: "malloc pode ter devolvido NULL; e preciso testar antes de usar."
        correct: true
      - text: "Nao e: malloc sempre devolve um bloco valido."
        misconception: malloc_always_succeeds

  - id: ciu_kc08_003
    kc: kc_08
    nivel: 1
    type: mcq
    phase: traversal
    targets: [I1]
    prompt: |
      int *p = malloc(sizeof(int));
      Quantas coisas foram criadas, e onde?
    options:
      - text: "Duas: a variavel p na stack e o bloco no heap."
        correct: true
      - text: "Uma: o bloco no heap, e p e o proprio bloco."
        misconception: pointer_lives_in_heap

  - id: ciu_kc08_004
    kc: kc_08
    nivel: 2
    type: fill_blank
    phase: traversal
    targets: [I4]
    prompt: "Um bloco devolvido por malloc so volta ao alocador quando ______."
    answer: "o programa chama free"
    accept: ["free", "chamar free", "o programador libera"]
    distractor_patterns:
      - pattern: ["a funcao termina", "sai do escopo", "acaba a funcao"]
        misconception: pointer_lives_in_heap
      - pattern: ["o sistema libera", "automaticamente", "sozinho"]
        misconception: system_frees_auto

  # =============== KC 12 ===============
  - id: ciu_kc12_001
    kc: kc_12
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I1, I2]
    prompt: |
      int *f(void) { int x = 42; return &x; }
      int main(void) { int *p = f(); printf("%d", *p); }
      O que acontece?
    options:
      - text: "Comportamento indefinido: x deixou de existir quando f retornou."
        correct: true
      - text: "Imprime 42: o endereco foi retornado, entao o valor veio junto."
        misconception: local_survives_return
      - text: "Imprime 42, porque x continua na memoria ate o programa acabar."
        misconception: local_survives_return

  - id: ciu_kc12_002
    kc: kc_12
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [I4]
    prompt: |
      int *g(void) { static int x = 42; return &x; }
      Aqui retornar o endereco passou a ser valido. Por que?
    options:
      - text: "static muda a duracao de x, que passa a existir enquanto o programa roda."
        correct: true
      - text: "static torna x global, entao o escopo deixou de importar."
        misconception: static_is_scope

  - id: ciu_kc12_003
    kc: kc_12
    nivel: 3
    type: contrast
    phase: traversal
    targets: [I3]
    prompt: |
      Dois ponteiros invalidos:
        A:  int *p = malloc(4); free(p);
        B:  int *p = f();   /* f retorna &local */
      O que os dois casos tem em comum, e o que os separa?
    options:
      - text: "Os dois deixam um endereco que nao designa objeto; em B nenhum free foi chamado."
        correct: true
      - text: "Sao o mesmo caso: em B o compilador libera a local, que e um free implicito."
        misconception: local_survives_return

  - id: ciu_kc12_004
    kc: kc_12
    nivel: 3
    type: path_choice
    phase: variation
    targets: [I5]
    prompt: |
      Uma funcao precisa devolver ao chamador um vetor de 100 inteiros ja preenchido.
      Qual dos dois caminhos e valido?
    paths:
      - label: A
        correct: true
        steps:
          - "O chamador reserva o armazenamento"
          - "O chamador passa o endereco desse armazenamento para a funcao"
          - "A funcao escreve atraves do ponteiro recebido"
      - label: B
        misconception: local_survives_return
        steps:
          - "A funcao declara um vetor local"
          - "A funcao preenche o vetor local"
          - "A funcao retorna o endereco do vetor"
    notes: >-
      Nao e parsons: os dois caminhos tem passos distintos, nao sao permutacao
      um do outro. Renderizar como arrastar-e-soltar tornaria o distrator
      inatingivel. A interface apresenta os dois caminhos e o aluno escolhe.

  # =============== KC 10 ===============
  - id: ciu_kc10_001
    kc: kc_10
    nivel: 2
    type: prediction
    phase: diagnostic
    targets: [I3]
    prompt: |
      void f(int *ip) { static int dummy = 5; ip = &dummy; }
      int main(void) { int *ip = NULL; f(ip); /* ip aqui? */ }
      Depois da chamada, quanto vale ip no main?
    options:
      - text: "Continua NULL. Para f alterar ip, precisaria receber &ip, do tipo int **."
        correct: true
      - text: "Aponta para dummy: f recebeu o ponteiro e o inicializou."
        misconception: modify_pp_changes_p
      - text: "Aponta para dummy, porque ponteiro ja e passagem por referencia."
        misconception: modify_pp_changes_p

  - id: ciu_kc10_002
    kc: kc_10
    nivel: 2
    type: mcq
    phase: diagnostic
    targets: [I2]
    prompt: |
      int v = 7;
      int *p = &v;
      int **pp = &p;
      A que se refere *pp?
    options:
      - text: "Ao ponteiro p. Para chegar ao 7 sao precisos dois: **pp."
        correct: true
      - text: "Ao valor 7: pp aponta para o dado final."
        misconception: double_deref_is_data
      - text: "Ao valor 7, porque int **pp e int *p sao equivalentes."
        misconception: double_deref_is_data

  - id: ciu_kc10_003
    kc: kc_10
    nivel: 3
    type: prediction
    phase: traversal
    targets: [I4]
    prompt: |
      void f(int **m);
      int a[3][4];
      f(a);
      Por que o compilador reclama?
    options:
      - text: "a decai para int (*)[4], nao para int **: e um bloco contiguo, nao um vetor de ponteiros."
        correct: true
      - text: "Por nada de fundo: um cast para (int **) resolve o problema."
        misconception: array2d_is_double_pointer
      - text: "Falta alocar as linhas; matriz e sempre int **."
        misconception: array2d_is_double_pointer

  - id: ciu_kc10_004
    kc: kc_10
    nivel: 2
    type: fill_blank
    phase: traversal
    targets: [I1, I3]
    prompt: "Para uma funcao alterar o ponteiro p do chamador, ela precisa receber ______."
    answer: "&p"
    accept: ["o endereco de p", "&p, do tipo int **"]
    distractor_patterns:
      - pattern: ["p", "o proprio p", "o ponteiro p"]
        misconception: modify_pp_changes_p
