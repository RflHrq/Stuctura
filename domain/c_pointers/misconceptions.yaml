# Catalogo de misconceptions com proveniencia declarada.
#
# grade:
#   D -- documentada: achado empirico com fonte e pagina localizadas
#   T -- transposta: documentada em outra linguagem; analogia declarada
#   L -- literatura tecnica de C: registrada como erro comum em obra
#        tecnica revisada; testemunho de especialista, nao medicao
#   N -- norma tecnica: o ERRO esta catalogado (CERT C, CWE), a CRENCA nao
#   E -- elaborada: derivada da notional machine; sem fonte; hipotese a testar
#
# negates: no exato do grafo que a crenca nega. Se um item nao ancora em
# nenhum no, falta um no. Se ancora em dois, sao duas misconceptions.
schema_version: 1

misconceptions:

  # ---------------- KC 01 ----------------
  - id: memory_is_uniform
    kc: kc_01
    negates: I2
    belief: "Memoria e uma regiao unica, sem distincao de regras de vida."
    grade: T
    sources: ["Kaczmarczyk et al. (2010), p. 109, Tabela 1, tema T1"]
    patterns: ["memoria e toda igual", "nao tem diferenca entre elas", "e tudo o mesmo lugar"]

  - id: system_frees_auto
    kc: kc_01
    negates: B3
    belief: "O sistema libera a memoria do heap automaticamente."
    grade: L
    sources: ["FAQ comp.lang.c 7.24", "FAQ comp.lang.c 7.25"]
    patterns: ["o sistema libera", "libera sozinho", "nao precisa dar free"]

  # ---------------- KC 02 ----------------
  - id: pointer_is_data
    kc: kc_02
    negates: I1
    belief: "O ponteiro e o proprio dado, nao o endereco."
    grade: T
    sources: ["Sorva (2012), p. 360, item 14 (Sorva 2008; Doukakis et al. 2007)"]
    patterns: ["o ponteiro e o valor", "p guarda o dado", "p e o numero"]

  - id: pointer_lives_in_heap
    kc: kc_02
    negates: I2
    belief: "O ponteiro mora no heap porque aponta para la."
    grade: L
    sources: ["FAQ comp.lang.c 7.22"]
    patterns: ["p esta no heap", "p fica junto do bloco", "p mora onde aponta"]

  - id: pointer_is_integer
    kc: kc_02
    negates: I3
    belief: "Ponteiro e apenas um inteiro; da para trocar um pelo outro."
    grade: L
    sources: ["FAQ comp.lang.c 4.14", "FAQ comp.lang.c 4.15"]
    patterns: ["e so um numero", "e um inteiro", "posso guardar int no ponteiro"]

  - id: voidptr_is_universal
    kc: kc_02
    negates: I3
    belief: "void * aceita qualquer coisa, inclusive ponteiro de funcao."
    grade: L
    sources: ["FAQ comp.lang.c 4.13", "FAQ comp.lang.c 4.6"]
    patterns: ["void star serve para tudo", "aceita qualquer ponteiro"]

  # ---------------- KC 03 ----------------
  - id: declaration_allocates
    kc: kc_03
    negates: I1
    belief: "int *p ja cria o dado apontado automaticamente."
    grade: T
    sources: ["Kaczmarczyk et al. (2010), p. 109, Tabela 2, MMR4", "FAQ comp.lang.c 7.10"]
    patterns: ["declarar ja cria", "ja tem espaco", "ja reservou o dado"]

  - id: uninitialized_is_null
    kc: kc_03
    negates: I2
    belief: "Ponteiro nao inicializado vale NULL."
    grade: D
    sources: ["Sorva (2012), p. 359, item 10 (du Boulay 1986; Samurcay 1989)"]
    patterns: ["comeca como NULL", "ja vem nulo", "e zero por padrao"]

  # ---------------- KC 04 ----------------
  - id: ampersand_takes_value
    kc: kc_04
    negates: I1
    belief: "O operador & se aplica a qualquer expressao, inclusive constantes."
    grade: L
    sources: ["FAQ comp.lang.c 4.10"]
    patterns: ["endereco do 5", "&5", "pega o endereco do valor"]

  - id: star_assigns_pointer
    kc: kc_04
    negates: B4
    belief: "Na expressao, *p designa o proprio ponteiro (ex.: *p = malloc(10))."
    grade: L
    sources: ["FAQ comp.lang.c 4.2", "FAQ comp.lang.c 7.10"]
    patterns: ["*p recebe o malloc", "*p e o ponteiro", "atribuo em *p"]

  # ---------------- KC 05 ----------------
  - id: null_is_zero_always
    kc: kc_05
    negates: I4
    belief: "NULL e o inteiro 0 em todos os contextos, inclusive na memoria."
    grade: L
    sources: ["FAQ comp.lang.c 5.13", "FAQ comp.lang.c 5.16"]
    patterns: ["NULL e zero", "e o mesmo que 0", "os bits sao zero"]

  - id: null_is_safe_to_deref
    kc: kc_05
    negates: I3
    belief: "Acessar *p com p igual a NULL devolve 0."
    grade: N
    sources: ["CERT C EXP34-C (Do not dereference null pointers)", "CWE-476 NULL Pointer Dereference"]
    notes: >-
      A crenca em si nao esta documentada; o ERRO esta, e com peso: CWE-476 e
      o 11o do CWE Top 25 de 2024. Contexto de confusao em FAQ 5.14 e 5.15.
      A formulacao exata da crenca continua sendo hipotese a testar na Q-matrix.
    patterns: ["retorna zero", "da zero", "nao acontece nada"]

  # ---------------- KC 06 ----------------
  - id: function_gets_original
    kc: kc_06
    negates: I1
    belief: "A funcao recebe a variavel original, nao uma copia."
    grade: T
    sources: ["Sorva (2012), p. 363, item 67 (Ma 2007)", "FAQ comp.lang.c 4.11"]
    patterns: ["recebe a variavel", "e a mesma variavel", "altera direto"]

  - id: pointer_copy_is_alias
    kc: kc_06
    negates: I4
    belief: "A copia do ponteiro e o original sao a mesma variavel."
    grade: T
    sources: ["Sorva (2012), p. 363, itens 74-75 (Holland et al. 1997)"]
    patterns: ["e o mesmo ponteiro", "aponta sempre para o mesmo", "muda os dois"]

  # ---------------- KC 07 ----------------
  - id: array_is_pointer
    kc: kc_07
    negates: I1
    belief: "Array e ponteiro sao a mesma coisa."
    grade: L
    sources: ["FAQ comp.lang.c 6.2", "FAQ comp.lang.c 6.9", "FAQ comp.lang.c 6.10"]
    patterns: ["array e ponteiro", "sao identicos", "e um ponteiro constante"]

  - id: array_is_assignable
    kc: kc_07
    negates: I2
    belief: "Da para atribuir ao nome de um array, como em str = f()."
    grade: L
    sources: ["FAQ comp.lang.c 6.5", "FAQ comp.lang.c 6.6", "FAQ comp.lang.c 6.7"]
    patterns: ["atribuo no array", "str recebe", "copio direto"]

  - id: sizeof_array_via_pointer
    kc: kc_07
    negates: I3
    belief: "sizeof(p) devolve o tamanho do array apontado."
    grade: L
    sources: ["FAQ comp.lang.c 6.21", "FAQ comp.lang.c 7.28"]
    patterns: ["sizeof me da o tamanho", "sizeof do array", "conta os elementos"]

  - id: array_passed_by_reference
    kc: kc_07
    negates: I4
    belief: "Arrays sao passados por referencia, diferente do resto de C."
    grade: L
    sources: ["FAQ comp.lang.c 6.4b"]
    patterns: ["array vai por referencia", "passa o array inteiro"]

  - id: arr_equals_addr_of_arr
    kc: kc_07
    negates: I5
    belief: "arr e &arr sao a mesma coisa."
    grade: L
    sources: ["FAQ comp.lang.c 6.12"]
    patterns: ["e a mesma coisa", "&arr e igual a arr"]

  - id: string_literal_is_array
    kc: kc_07
    negates: B1
    belief: "char *s = \"abc\" e char s[] = \"abc\" armazenam do mesmo jeito."
    grade: L
    sources: ["FAQ comp.lang.c 6.6b"]
    patterns: ["e a mesma declaracao", "os dois criam array", "da no mesmo"]

  # ---------------- KC 11 ----------------
  - id: ptr_arith_is_bytes
    kc: kc_11
    negates: I2
    belief: "A aritmetica de ponteiro conta bytes; e preciso multiplicar por sizeof na mao."
    grade: L
    sources: ["FAQ comp.lang.c 4.4"]
    patterns: ["multiplico por sizeof", "anda um byte", "p mais 1 e o proximo byte"]

  - id: voidptr_arith_ok
    kc: kc_11
    negates: I5
    belief: "Da para fazer aritmetica em void * como em qualquer ponteiro."
    grade: L
    sources: ["FAQ comp.lang.c 4.6"]
    patterns: ["void star mais 1", "ando no void star"]

  # ---------------- KC 08 ----------------
  - id: malloc_always_succeeds
    kc: kc_08
    negates: I2
    belief: "Verificar NULL apos malloc e desnecessario porque malloc sempre funciona."
    grade: N
    sources: ["CERT C MEM52-C (Detect and handle memory allocation errors)", "CWE-252 Unchecked Return Value", "CWE-690 Unchecked Return Value to NULL Pointer Dereference"]
    notes: >-
      Realocada do antigo KC 11. O erro esta catalogado em norma; a crenca que
      o produz, nao. CWE-690 nomeia exatamente a cadeia: retorno nao verificado
      levando a desreferencia de ponteiro nulo.
    patterns: ["malloc sempre funciona", "nao precisa checar", "nunca falha"]

  - id: malloc_initializes_zero
    kc: kc_08
    negates: I3
    belief: "malloc inicializa a memoria com zero."
    grade: L
    sources: ["FAQ comp.lang.c 7.31", "Sorva (2012), p. 359, item 10"]
    patterns: ["ja vem zerado", "comeca com zero", "malloc limpa"]

  # ---------------- KC 09 ----------------
  - id: free_nullifies
    kc: kc_09
    negates: I1
    belief: "p vira NULL depois de free()."
    grade: L
    sources: ["FAQ comp.lang.c 7.21"]
    patterns: ["vira NULL", "fica nulo", "free zera o ponteiro"]

  - id: free_kills_pointer
    kc: kc_09
    negates: I2
    belief: "free(p) apaga a variavel p."
    grade: L
    sources: ["FAQ comp.lang.c 7.21 (resposta)", "CERT C MEM30-C", "Sorva (2012), p. 359, item 5"]
    patterns: ["free apaga p", "p e removido", "p deixa de existir", "p some"]

  - id: heap_persists
    kc: kc_09
    negates: I3
    belief: "O bloco ainda e valido depois de free()."
    grade: L
    sources: ["FAQ comp.lang.c 7.20", "CERT C MEM30-C"]
    patterns: ["ainda esta la", "o dado continua", "ainda da para usar"]

  - id: double_free_is_safe
    kc: kc_09
    negates: I3
    belief: "Chamar free() duas vezes no mesmo ponteiro e seguro."
    grade: N
    sources: ["CWE-415 Double Free", "CERT C MEM31-C"]
    notes: "O erro esta catalogado em norma; a crenca em si nao esta documentada."
    patterns: ["free duas vezes", "nao tem problema liberar de novo"]

  - id: null_after_free_redundant
    kc: kc_09
    negates: I6
    belief: "Atribuir NULL apos free() e redundante porque free ja cuida disso."
    grade: L
    sources: ["FAQ comp.lang.c 7.21 (resposta)"]
    patterns: ["e redundante", "free ja faz isso", "nao precisa"]

  # ---------------- KC 12 ----------------
  - id: local_survives_return
    kc: kc_12
    negates: I2
    belief: "Retornar o endereco de uma variavel local funciona; ela continua la."
    grade: T
    sources: ["Kumar (2001), ITiCSE", "Sorva (2012), p. 359, item 5 (du Boulay 1986)"]
    patterns: ["continua existindo", "o valor fica", "retorno o endereco dela"]

  - id: static_is_scope
    kc: kc_12
    negates: I4
    belief: "static muda o escopo da variavel, por isso retornar o endereco passa a valer."
    grade: T
    sources: ["Sorva (2012), p. 114"]
    notes: >-
      Sorva lista "scope vs. lifetime" entre as distincoes transliminais que
      exigem uma visao dinamica do programa para serem compreendidas. Nao e
      achado sobre C; e a distincao conceitual documentada como dificil.
      Explica por que local_survives_return sobrevive: as vezes o codigo
      parece funcionar.
    patterns: ["static deixa global", "static muda o escopo"]

  # ---------------- KC 10 ----------------
  - id: modify_pp_changes_p
    kc: kc_10
    negates: I3
    belief: "Modificar o parametro ponteiro dentro da funcao altera o p do chamador."
    grade: L
    sources: ["FAQ comp.lang.c 4.8"]
    patterns: ["altera o de fora", "muda o ponteiro do chamador", "inicializa o ponteiro"]

  - id: double_deref_is_data
    kc: kc_10
    negates: I2
    belief: "**pp acessa o dado final diretamente; um nivel a mais resolve sozinho."
    grade: L
    sources: ["FAQ comp.lang.c 4.9"]
    notes: "Absorve o antigo item double_pointer_same_level."
    patterns: ["chega direto no dado", "os dois sao iguais", "e o mesmo nivel"]

  - id: array2d_is_double_pointer
    kc: kc_10
    negates: I4
    belief: "int a[N][M] pode ser passado onde se espera int **."
    grade: L
    sources: ["FAQ comp.lang.c 6.18"]
    patterns: ["matriz e ponteiro duplo", "a e int duplo ponteiro"]
