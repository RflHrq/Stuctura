- id: ciu_kc00_003
  node: kc00:B2
  nivel: 1
  formato: achar_o_erro
  tipo: teorica
  uso: diagnostico
  codigo: ''
  enunciado: >
    Um colega diz: "Enquanto eu não atribuo um valor, a variável não
    existe de verdade — é só uma promessa." Certo ou errado?
  alternativas:
    a: Errado — a memória já foi reservada na declaração
    b: "Certo: sem valor, não há nada reservado"
    c: Errado, mas só porque o compilador já põe zero ali
  gabarito: a
  crencas:
    b: no_value_no_memory
    c: declaration_zeroes

