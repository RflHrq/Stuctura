- id: ciu_kc00_010
  node: kc00:I1
  nivel: 2
  formato: comparar_casos
  tipo: codigo
  uso: diagnostico
  codigo: |
    int x;
    3 = x;
  enunciado: "Esse código compila?"
  # "recusa" fica, e aqui é correto: `3 = x;` é violação de restrição,
  # e o gcc a recusa MESMO COM -w. Não é como `-Wint-conversion`, que
  # uma flag rebaixa a aviso. Conferido.
  alternativas:
    a: Não — o compilador recusa, 3 não é um lugar que recebe valor
    b: "Sim, é igual a x = 3;"
    c: Sim, mas aí o valor vai parar no lado errado da conta
  gabarito: a
  crencas:
    b: assignment_symmetric
    c: assignment_symmetric

