# As terceiras alternativas do kc_00 — candidato, NÃO é domínio.
#
# POR QUE ESTE ARQUIVO EXISTE. O kc_00 passa a ser a porta de entrada de
# todo mundo: é ele que verifica o domínio básico sem o qual os outros
# doze não se sustentam. E hoje ele é o tópico mais fraco do projeto:
#
#     itens binários no projeto inteiro ........ 13, TODOS no kc_00
#     nós do kc_00 com mais de um binário ....... 5 de 5
#                                                 (B3, B4 e I1 têm três)
#     a regra de docs/linguagem.md .............. no máximo UM por nó
#
# Com duas alternativas o acaso é 50%. Um tópico que decide se a pessoa
# tem base para seguir não pode ser decidido na moeda. Com três, cai
# para 33%.
#
# ISTO MUDA O QUE UM ACERTO NO kc_00 SIGNIFICA, e é por isso que é
# candidato e não edição: quem decide mexer no acaso do tópico de
# entrada é você e o orientador.
#
# ---------------------------------------------------------------------
# DOZE DE TREZE. O `ciu_kc00_t02` ficou de fora, e a razão é de regra:
# ele pergunta se o nome da variável é só um lembrete para o programador.
# O kc_00 catalogou cinco crenças, e nenhuma fala de NOME — são sobre
# tipo, memória sem valor, zeragem, histórico e simetria da atribuição.
# Não dá para escrever um terceiro distrator que aponte crença que não
# existe, e inventar uma é o que `docs/linguagem.md` proíbe: "uma crença
# sem procedência é uma invenção sua que vai virar dado".
#
# O MESMO ITEM JÁ TEM, HOJE, um distrator sem crença ("Não há erro: nome
# é comentário"). Então a decisão é anterior a este arquivo: ou o kc_00
# ganha uma crença sobre o nome da variável, com procedência, ou o t02
# continua binário e sem mapeamento.
#
# ---------------------------------------------------------------------
# DUAS COISAS QUE EU CONSERTEI DE PASSAGEM, as duas achadas pela
# auditoria do domínio:
#
#  1. `ciu_kc00_003` começava com "Rafael diz:". A lista de
#     `docs/linguagem.md` proíbe nome de pessoa no enunciado, e os
#     outros itens do tópico usam "Um colega diz". Trocado.
#  2. Os distratores curtos demais ("Certo", "0, sempre") ganharam a
#     frase que a crença diria. "Certo" sozinho não é a crença dita bem
#     — é um botão.
#
# E OS ACENTOS. Seis itens de treino estão sem acento no domínio ("Nao
# ha erro", "espaco") — é dívida antiga do kc_00. Como este arquivo
# reescreve a cédula inteira, esses seis saem daqui ACENTUADOS. O
# conferidor listou exatamente quais gabaritos mudaram, e a mudança é
# só essa: `ciu_kc00_t01`, `t04`, `t05`, `t06`, `t08` e `t10`, acento e
# nada mais.
#
# NENHUM GABARITO MUDOU DE SENTIDO. Em doze de doze, a alternativa
# certa é a mesma frase; o que entrou foi a terceira opção. O resto da
# dívida de acento do kc_00, fora destes seis, continua de pé.
#
# ---------------------------------------------------------------------
# CONFERIDO: a alternativa certa não é visivelmente a mais longa em
# nenhum dos doze (o corte é 10 caracteres a mais E 40% mais longa), e
# todo distrator aponta crença que existe no catálogo do kc_00.

