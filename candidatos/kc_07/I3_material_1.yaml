# Material de ensino do I3 do kc_07 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 12/11/2026. A conclusão do tópico, e o nó com a
# crença mais citada do FAQ: três perguntas diferentes dizem a mesma
# coisa.
#
# ---------------------------------------------------------------------
# A CRENÇA, E A FONTE SÃO TRÊS PERGUNTAS
#
# `array_is_pointer` — "array e ponteiro são a mesma coisa". Grade `L`,
# FAQ comp.lang.c 6.2 ("But I heard that char a[] was identical to
# char *a."), 6.9 ("Someone explained to me that arrays were really
# just constant pointers.") e 6.10.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES
#
#   caso resolvido   `a[1]` e `p[1]` dando o MESMO elemento, e logo
#                    depois dando elementos diferentes — porque um dos
#                    dois pôde ir embora.
#   outra rota       O ponteiro indo para NULL e voltando, com o
#                    conjunto intacto o tempo todo.
#
# O CASO RESOLVIDO MOSTRA A SEMELHANÇA ANTES DA DIFERENÇA, e nessa
# ordem de propósito. A crença não é um descuido: `a[1]` e `p[1]` são
# iguais em muitos programas inteiros, e quem nunca viu os dois
# divergirem tem boa razão para achar que são a mesma coisa. A
# demonstração dá razão à pessoa na primeira linha e tira na segunda.
#
# O ITEM `ciu_kc07_021` PERGUNTA EXATAMENTE ISSO — "as duas dão 2; isso
# quer dizer que a e p são iguais?" — e é de degrau 3. Ele mede se a
# pessoa resiste à conclusão; o cartão mostra o caso em que a conclusão
# falha. Não é a mesma pergunta: o item para na semelhança, e o cartão
# continua.
#
# O QUE FICA FORA
#
#   `sizeof a` contra `sizeof p`   -> `ciu_kc07_t20`, e também o
#                                     exemplo deste nó, que fica
#   o `extern char *a` de outro
#     arquivo                      -> `ciu_kc07_020`
#   `int **q = &a; f(*q);`         -> `ciu_kc07_t21`
#
# O `sizeof` FICA DE FORA DAS DEMONSTRAÇÕES e permanece no exemplo, que
# não muda: o exemplo é a forma curta da diferença, e o item `t20` a
# mede. As duas rotas atacam pela mobilidade, que nenhum item usa.
#
# NARRAÇÃO: não entra.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): as saídas abaixo estão
# transcritas da execução.

