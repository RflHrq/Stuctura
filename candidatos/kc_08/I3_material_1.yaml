# Material de ensino do I3 do kc_08 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 12/11/2026. A conclusão do tópico: suporte em `I1`,
# e a refutação percorre B2 -> I1 -> I3.
#
# E A DERIVAÇÃO VEM DO I1: se o ponteiro é uma variável e o bloco é
# outra coisa, então o fim da variável não é o fim do bloco. Quem
# acaba com um é o fim do escopo; quem acaba com o outro é uma chamada
# que você escreve.
#
# ---------------------------------------------------------------------
# A CRENÇA
#
# `system_frees_auto` — "o sistema libera a memória do heap
# automaticamente". Grade `L`, FAQ comp.lang.c 7.22:
#
#   "When I call malloc to allocate memory for a pointer which is local
#   to a function, do I have to explicitly free it?"
#
# A PERGUNTA JÁ TRAZ A CONFUSÃO MONTADA: ela liga a vida do bloco ao
# fato de o ponteiro ser local. É por isso que este nó depende do I1 —
# desfeita a confusão entre as duas coisas, a resposta vem sozinha.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES
#
#   caso resolvido   O bloco atravessando o fim do escopo em que foi
#                    pedido: a variável de dentro some, e ele fica.
#   outra rota       Dois lotes, um devolvido e o outro não: o free
#                    acerta um bloco, e não todos.
#
# O CASO RESOLVIDO USA UM BLOCO DE CÓDIGO, e não uma função, de
# propósito. Três itens deste nó já usam funções — `ciu_kc08_011`,
# `t17` e `t18` —, e o bloco entre chaves mostra a mesma coisa com
# menos peças: não há chamada, não há retorno, e mesmo assim a variável
# de dentro acaba e o lote não.
#
# E O `t17` RETORNA O BLOCO de uma função e pergunta por que funciona;
# o caso resolvido não retorna nada — ele guarda o endereço numa
# variável de fora antes de o escopo fechar. É o mesmo fato por um
# caminho que o item não usa.
#
# NENHUMA DAS DUAS DEIXA LOTE SEM DEVOLVER. Um cartão que ensina que
# ninguém libera por você não pode ensinar pela forma que ele mesmo
# esquece — e os dois trechos terminam com os seus `free`.
#
# O QUE FICA FORA
#
#   o que o programa acumula em mil chamadas -> `ciu_kc08_017`
#   array local contra malloc sem free       -> `ciu_kc08_018`, grau 3
#   o retorno do bloco por uma funcao        -> `ciu_kc08_t17`
#   o que falta no fim de `usa`              -> `ciu_kc08_t18`
#
# NARRAÇÃO: não entra.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): as saídas abaixo estão
# transcritas da execução.

topico: kc_08
node: kc08:I3
premissa: "O bloco vive até o free: ninguém o libera por você."
crenca_que_nega: system_frees_auto

gerado_por: Claude Opus 5, 12/11/2026
revisado_por: ____
revisado_sha: ____


# A AMPLIAÇÃO. O primeiro parágrafo é a DERIVAÇÃO do I1; o segundo diz
# de onde vem a ideia contrária; o terceiro, o que ela custa.
ampliacao: >
  Isto não é regra nova: é o I1 levado adiante. O ponteiro e o bloco
  são duas coisas, e cada uma acaba do seu jeito. A variável que guarda
  o endereço some quando o escopo dela fecha — e o bloco, que não é
  ela, continua reservado até alguém devolvê-lo.

  A ideia contrária tem de onde vir. Variáveis comuns somem sozinhas no
  fim da função, e isso funciona tão bem que passa despercebido; quando
  o programa termina, o sistema operacional recolhe tudo mesmo. Entre
  um e outro, porém, está o tempo em que o programa roda — e é nesse
  tempo que o bloco não recolhido fica.

  Por isso o free é seu. Enquanto o programa vive, cada bloco pedido e
  não devolvido continua ocupado, e o alocador não tem como saber que
  você não precisa mais dele. Num programa que pede muitas vezes, o
  que se acumula não é um erro visível: é memória que some aos poucos,
  sem nada quebrar na hora.


# O exemplo que já está no domínio, repetido para quem revisa. NÃO MUDA.
exemplo: |
  int *p = malloc(40);
  free(p);     /* quem devolve e voce */


# O CASO RESOLVIDO: o bloco atravessa o escopo.
caso_resolvido:
  - prosa: "Vamos resolver um junto."
  - codigo: |
      int *fora = NULL;

      {
          int *dentro = malloc(sizeof(int));

          if (dentro == NULL) {
              return 1;
          }
          *dentro = 77;
          fora = dentro;
      }
      printf("o bloco atravessou o fim do bloco de codigo: %d\n", *fora);
      free(fora);
  - prosa: "Pergunta: a variável dentro não existe mais depois da chave. E o lote que ela indicava?"
  - prosa: >
      Continua lá. O que a chave encerrou foi a caixa de ponteiro —
      uma variável local, como qualquer outra. O bloco foi pedido ao
      alocador, e o alocador não ficou sabendo de chave nenhuma.
  - prosa: "A máquina confirma:"
  - saida: |
      o bloco atravessou o fim do bloco de codigo: 77
  - prosa: >
      O 77 estava lá para ser lido. O endereço tinha sido copiado para
      uma variável de fora antes do fim do escopo — e sem essa cópia o
      bloco continuaria existindo do mesmo jeito, só que sem ninguém
      sabendo chegar nele.


# A OUTRA ROTA: um devolvido, o outro não.
reexplicacao:
  - prosa: >
      Outro caminho. Devolva um lote e veja o que acontece com o
      vizinho.
  - codigo: |
      int *um = malloc(sizeof(int));
      int *outro = malloc(sizeof(int));

      if (um == NULL || outro == NULL) {
          return 1;
      }
      *um = 1;
      *outro = 2;
      free(um);
      printf("devolvi um lote, e o outro continua meu: %d\n", *outro);
      free(outro);
  - prosa: >
      O free recebeu o endereço de um bloco, e foi sobre ele que agiu.
      O segundo lote não foi mencionado naquela linha.
  - prosa: "A máquina confirma:"
  - saida: |
      devolvi um lote, e o outro continua meu: 2
  - prosa: >
      O dois continua acessível. A devolução é por bloco, e é sempre
      uma linha que alguém escreveu — não há nada no programa nem no
      sistema varrendo o que sobrou enquanto ele roda.
