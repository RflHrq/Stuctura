# Material de ensino do B3 do kc_08 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 12/11/2026. E É UM CARTÃO DE CONTEÚDO
# INDETERMINADO, da mesma família do `kc_00:B3`, do `kc_03:B3` e do
# `kc_03:I2`. Vale a regra daqueles:
#
#   NENHUMA DEMONSTRAÇÃO ESCRITA AQUI LÊ UM BLOCO RECÉM-PEDIDO.
#
# Ler para mostrar o que há dentro é exatamente o que o nó ensina a não
# fazer. A evidência do nó no grafo resolve isso com a TERCEIRA FORMA
# do contrato — o compilador diagnostica `'*b' may be used
# uninitialized` e o programa não roda. Um cartão não tem essa forma,
# então ele demonstra o que É demonstrável: que todo valor lido teve um
# autor.
#
# ---------------------------------------------------------------------
# A CRENÇA
#
# `malloc_initializes_zero` — "malloc inicializa a memória com zero".
# Grade `L`, FAQ comp.lang.c 7.31: "What's the difference between
# calloc and malloc? ... Is it safe to take advantage of calloc's
# zero-filling?"
#
# A PERGUNTA DA FONTE É SOBRE calloc, e é dela que vem a forma da
# crença: existe uma função que zera, e a existência dela é a prova de
# que a outra não zera. O cartão diz isso na ampliação sem mostrar
# calloc em código — o `ciu_kc08_009` compara as duas, e é lá que a
# escolha se mede.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES
#
#   caso resolvido   Uma soma dentro do bloco em que a primeira linha
#                    escreve o zero: todo valor com autor.
#   outra rota       Uma função que preenche o bloco antes de qualquer
#                    leitura — a disciplina de quem pede.
#
# O `ciu_kc08_008` É A MESMA SOMA QUEBRADA, e o caso resolvido é a soma
# certa. Não é o mesmo: o item mostra o defeito e pergunta por que a
# conta pode sair errada; o cartão mostra a versão correta e nomeia o
# que a linha `*soma = 0;` comprou.
#
# NARRAÇÃO: não entra.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): as saídas abaixo estão
# transcritas da execução.

topico: kc_08
node: kc08:B3
premissa: "O bloco devolvido não tem conteúdo definido."
crenca_que_nega: malloc_initializes_zero

