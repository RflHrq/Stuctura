# Material de ensino do I4 do kc_06 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 12/11/2026. O sexto e último do tópico, e o único com
# `role: conclusao`. Ele não acrescenta fato: ele JUNTA os cinco
# anteriores numa regra só, e é por isso que a cadeia dele é a mais
# longa do grafo: `_plano` devolve SEIS passos — B1 -> B2 -> I1 -> I2 ->
# I3 -> I4 —, que é o tópico inteiro. Quem chega aqui pela refutação
# percorreu os outros cinco nós antes.
#
# E É AQUI QUE A METÁFORA DO TÓPICO FECHA. O cabeçalho do grafo declarou
# onde ela cala, e nomeou quem resolve:
#
#   "Copiar o bilhete" sugere que há cópia de coisa e cópia de endereço,
#   e que são operações diferentes. NÃO SÃO: é a MESMA cópia, e o que
#   muda é só o que estava escrito. Quando a metáfora empurrar para
#   "endereço é passado de outro jeito", ela cala — é esse "outro jeito"
#   que não existe em C, E É A CONCLUSÃO DO TÓPICO.
#
# O cartão do I2 teve uma frase retirada por isto: ela dizia "não
# existem dois modos de passar em C — há um só", que é afirmação sobre a
# LINGUAGEM, e lá o nó só podia afirmar sobre aquela chamada. A frase é
# deste cartão, e ela entra aqui sem ressalva.
#
# ---------------------------------------------------------------------
# A CRENÇA, E AS DUAS METADES DELA
#
# `pointer_copy_is_alias` — "a cópia do ponteiro e o original são a
# mesma variável". Grade `T`, e a fonte são DOIS itens, não um:
#
#   Sorva (2012), p. 363, item 74: "Once a variable references an
#     object, it will always reference that object"
#                                               (Holland et al. 1997)
#   Sorva (2012), p. 363, item 75: "Two different variables must refer
#     to two different objects"                 (Holland et al. 1997)
#
# São duas afirmações diferentes, e a demonstração escolhida derruba as
# DUAS, no mesmo programa de seis linhas:
#
#   o 74 cai quando `b` para de apontar para x  (`b = &y`)
#   o 75 cai quando `a` e `b` apontam para x    (`*b = 50` muda x)
#
# Se cópia e original fossem a mesma variável, C teria passagem por
# referência — é exatamente a conclusão que esta crença nega.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES, e a ordem delas é a decisão do arquivo
#
#   caso resolvido   A cópia de um ponteiro SEM CHAMADA NENHUMA: dois
#                    ponteiros no mesmo escopo, um copiado do outro.
#   outra rota       O endereço copiado DUAS vezes, de main para meio e
#                    de meio para fundo, e a escrita lá no fundo
#                    aparecendo em x lá no topo.
#
# POR QUE O CASO RESOLVIDO NÃO TEM CHAMADA. A crença não é sobre
# chamada: ela diz que a cópia e o original são a mesma VARIÁVEL. O
# lugar mais limpo para derrubar isso é onde a cópia acontece sozinha,
# sem parâmetro, sem casa nova, sem nada do maquinário que os cinco nós
# anteriores já resolveram. `int *b = a;` é uma atribuição comum, e ela
# faz exatamente o que a chamada faz — que é a frase inteira deste nó.
#
# E A OUTRA ROTA PÕE A CHAMADA DE VOLTA, duas vezes, para que a ponte
# não fique só na prosa: o mesmo endereço é copiado em três caixas
# diferentes (o `p` de meio, o `meu` de meio, o `p` de fundo), e as três
# chegam em x. O item 75 da fonte cai outra vez, agora atravessando
# chamadas.
#
# ---------------------------------------------------------------------
# O QUE FICA FORA
#
#   `int **`, e como uma função troca o ponteiro do chamador
#                                      -> `ciu_kc06_t13`, `ciu_kc06_015`
#   a casa nova sumir no fim da função -> kc_01
#
# E OS ITENS DESTE NÓ ESTÃO TODOS DE FORA DAS DEMONSTRAÇÕES, de
# propósito. Eles cobrem o terreno quase inteiro, e cada um deles é um
# programa que o cartão não repete:
#
#   `ciu_kc06_017`  `*p = 9; p = NULL;` na mesma função, e a saída com
#                   as duas metades — degrau 2
#   `ciu_kc06_018`  `a(int v)` contra `b(int *v)`, a comparação valor
#                   contra endereço — degrau 3
#   `ciu_kc06_t17`  `p = &y` com y local, e `*q` depois
#   `ciu_kc06_t18`  a troca de dois ponteiros dentro da função
#
# O `ciu_kc06_018` é o que mais dói deixar de lado: a comparação entre
# passar `int` e passar `int *` é a maneira mais direta de dizer "é a
# mesma operação". Mas ela é a PERGUNTA de um item de degrau 3 ("as duas
# copiam o argumento; então por que só uma muda x?"), e escrevê-la
# resolvida no cartão faria o item medir memória. A ampliação diz o
# princípio; o caso trabalhado fica com o item.
#
# A TROCA DE PONTEIROS TAMBÉM FICA FORA por uma segunda razão, e ela é
# regra do banco: "nenhum item usa troca de variáveis como superfície de
# outra coisa". Vale para o material pelo mesmo motivo — quem se perde
# no `int *t = a` erra por atenção, não por premissa.
#
# ---------------------------------------------------------------------
# O EXEMPLO DO CARTÃO NÃO MUDA, e ele é o resumo do nó: `f(x);` com
# `/* copia o valor */`, `f(&x);` com `/* copia o endereco */`, e a
# terceira linha dizendo "a mesma copia, as duas vezes".
#
# NARRAÇÃO: não entra, pelo mesmo motivo dos cinco anteriores.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): as saídas abaixo estão
# transcritas da execução.

topico: kc_06
node: kc06:I4
premissa: "C não tem passagem por referência: passa endereços por valor."
crenca_que_nega: pointer_copy_is_alias

