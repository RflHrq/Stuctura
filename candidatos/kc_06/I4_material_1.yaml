# Declarado porque a outra rota USA. Quem introduz é o B1.
exige_conceitos: [funcao_com_parametro]


# A AMPLIAÇÃO. Primeiro parágrafo: a junção dos cinco nós numa regra só.
# Segundo: o que "passagem por referência" quer dizer, e por que o nome
# não serve para C. Terceiro: a pergunta que substitui o rótulo.
ampliacao: >
  Junte os cinco e sobra uma regra só. O parâmetro é uma caixa nova, a
  chamada copia para dentro dela o valor do argumento, mexer na caixa
  não chega no argumento, um endereço copiado chega na mesma casa, e
  trocar o endereço copiado não sai da caixa. Não há dois mecanismos
  esperando para ver o que você passou: a chamada copia, sempre. O que
  varia é o que estava na caixa.

  E "passagem por referência" quer dizer uma coisa precisa: que o
  parâmetro É a variável de quem chamou, de modo que atribuir ao
  parâmetro muda a dela. Em C isso não acontece em lugar nenhum — nem
  com ponteiro, e foi o cartão anterior que mostrou. Passar &x é copiar
  um endereço por valor, e é a CÓPIA que dá acesso ao original.

  Então a pergunta útil não é "isto é por valor ou por referência". É:
  o que foi copiado, e onde aquilo chega? Um número que diz quanto não
  chega a lugar nenhum fora da caixa. Um número que diz onde chega na
  casa que ele nomeia — e chega por qualquer cópia dele, de dentro de
  qualquer função que a tenha.


# O exemplo que já está no domínio, repetido para quem revisa. NÃO MUDA.
exemplo: |
  f(x);         /* copia o valor  */
  f(&x);        /* copia o endereco */
  /* a mesma copia, as duas vezes */


# O CASO RESOLVIDO: a cópia de um ponteiro sem chamada nenhuma.
caso_resolvido:
  - prosa: "Vamos resolver um junto."
  - codigo: |
      int x = 1, y = 2;
      int *a = &x;
      int *b = a;
      *b = 50;
      printf("depois de *b = 50,  x = %d\n", x);
      b = &y;
      printf("depois de b = &y,   *a = %d,  *b = %d\n", *a, *b);
  - prosa: "Pergunta: b recebeu uma cópia de a. Depois de b = &y, para onde a aponta?"
  - prosa: >
      A tentação é dizer que a foi junto: b era a cópia de a, e cópia e
      original costumam ser pensados como dois nomes da mesma coisa. As
      duas linhas da saída fecham portas diferentes, e é por isso que
      são duas. A primeira mostra que a cópia não é um duplicado morto —
      escrever por b chegou em x. A segunda mostra que ela também não é
      um segundo nome de a.
  - prosa: "A máquina confirma:"
  - saida: |
      depois de *b = 50,  x = 50
      depois de b = &y,   *a = 50,  *b = 2
  - prosa: >
      As duas metades estão aí. Os dois ponteiros chegavam na mesma casa
      — por isso o 50 apareceu em x. E eram duas variáveis — por isso b
      pôde ir para outro lugar e a ficou onde estava. Nenhuma chamada
      aconteceu neste trecho: isso é o que uma atribuição faz, e é
      exatamente o que a chamada faz com o que você passa.


# A OUTRA ROTA: a chamada de volta, duas vezes, e o endereço copiado
# em três caixas diferentes.
reexplicacao:
  - prosa: >
      Outro caminho, agora com chamadas — e com mais de uma, para ver o
      que acontece com o endereço copiado a cada degrau.
  - codigo: |
      void fundo(int *p)
      {
          *p = 90;
      }

      void meio(int *p)
      {
          int *meu = p;
          fundo(meu);
          printf("meio:   *p vale %d\n", *p);
      }
  - codigo: |
      int x = 1;
      meio(&x);
      printf("main:   x vale %d\n", x);
  - prosa: >
      Conte as caixas de ponteiro: o p de meio, o meu de meio, o p de
      fundo. São três, cada uma com o seu nome e o seu lugar, e as três
      guardam o mesmo número — o endereço de x, copiado três vezes.
      Quem escreveu foi fundo, pela caixa dela.
  - prosa: "A máquina confirma:"
  - saida: |
      meio:   *p vale 90
      main:   x vale 90
  - prosa: >
      A escrita feita no fundo aparece em meio, que leu por outra caixa,
      e aparece em main, que não leu por caixa nenhuma — x é a casa. Não
      houve modo especial de passar em degrau nenhum: cada chamada
      copiou um número, e o número diz onde x mora.
