# Material de ensino do I1 do kc_06 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 11/11/2026. É o terceiro do tópico, e o PRIMEIRO de
# inferência: o I1 tem suporte (`B1`, `B2`), e por isso a refutação dele
# percorre uma cadeia de verdade — B1, depois B2, depois I1 — em vez de
# afirmar a premissa numa tela só.
#
# E ISSO MUDA O QUE O CARTÃO TEM DE FAZER. Os dois observáveis afirmam
# fatos; este tem de mostrar que a conclusão DECORRE deles. Se a
# ampliação apresentar "modificar o parâmetro não afeta o argumento"
# como uma regra nova a decorar, o nó vira observável com outro nome, e
# a cadeia de refutação fica sem o que percorrer.
#
# DEPENDE DOS DOIS, e a ordem de aprovação é B1, B2, I1. Quem introduz
# `funcao_com_parametro` é o cartão do B1; este o usa.
#
# ---------------------------------------------------------------------
# A CRENÇA
#
# `function_gets_original` — "a função recebe a variável original, não
# uma cópia". Grade `T`, e a fonte dela é das melhores deste tópico:
#
#   Sorva (2012), p. 363, item 67: "Assigning to an object causes it to
#   become equal to the assigned object" (Ma 2007); e FAQ comp.lang.c
#   4.11, "Does C even have 'pass by reference'?", cuja EXISTÊNCIA é a
#   evidência de quanta gente supõe que tem.
#
# ---------------------------------------------------------------------
# O QUE ESTE CARTÃO SE PROÍBE
#
# Agora PODE modificar o parâmetro — é disto que o nó trata. O que
# continua fora:
#
#   passar &x, e o que a cópia do endereço alcança  -> I2
#   atribuir a p dentro de f                        -> I3
#   "C não tem passagem por referência"             -> I4, a conclusão
#   a casa nova sumir no fim da função              -> kc_01
#
# O item `ciu_kc06_009` contrasta `void f(int n)` com `void g(int *n)`,
# e é trabalho DELE: é item de degrau 3, de comparar casos, e existe
# para medir se a pessoa já separa os dois. O cartão não antecipa o
# `*n = 9` — quem ensina aquilo é o I2.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES
#
#   caso resolvido   DOIS parâmetros, UM modificado, e o de dentro
#                    IMPRESSO. Mostra as duas metades ao mesmo tempo: a
#                    modificação aconteceu de verdade (a = 11 lá
#                    dentro) e o argumento não mudou (x = 1 aqui fora).
#   outra rota       O MESMO NOME dos dois lados, agora com a
#                    modificação — e é de propósito que ela repete a
#                    configuração do cartão do B1.
#
# POR QUE O CASO RESOLVIDO IMPRIME O VALOR DE DENTRO. Sem isso, a
# demonstração mostra só que x não mudou, e "não mudou" tem duas
# leituras: "a atribuição não aconteceu" e "aconteceu na outra caixa".
# A primeira é falsa e é confortável — e um cartão que não a exclui
# deixa a pessoa sair com ela. Os itens `ciu_kc06_008` (`zera`) e
# `ciu_kc06_t08` (`dobra`) olham só o lado de fora, e estão certos em
# olhar: eles MEDEM. O cartão ENSINA, e precisa dos dois lados.
#
# E A OUTRA ROTA REPETE O B1 DE PROPÓSITO. Lá a pessoa aceitou que um
# `n` no main e um `n` em f são duas variáveis, porque os dois
# responderam números diferentes sem ninguém modificar nada. Aqui a
# mesma configuração recebe a modificação. Um nó de inferência que
# estreia um cenário novo esconde justamente o que ele deveria mostrar:
# que a conclusão vem do que já foi aceito.
#
# ---------------------------------------------------------------------
# O EXEMPLO DO CARTÃO NÃO MUDA — `void f(int n) { n = 99; }` com
# `/* x continua 1 */` já é o caso mínimo.
#
# NARRAÇÃO: não entra, pelo mesmo motivo dos outros dois.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): as saídas abaixo estão
# transcritas da execução.

topico: kc_06
node: kc06:I1
premissa: "Modificar o parâmetro não afeta o argumento."
crenca_que_nega: function_gets_original

gerado_por: Claude Opus 5, 11/11/2026
revisado_por: ____
revisado_sha: ____

# Declarado porque este cartão USA. Quem introduz é o B1.
exige_conceitos: [funcao_com_parametro]


# A AMPLIAÇÃO. O primeiro parágrafo é a DERIVAÇÃO, e é o que separa este
# cartão de um observável: ele não anuncia regra nova, ele soma as duas
# que vieram antes.
ampliacao: >
  Isto não é regra nova: é o que sobra das duas anteriores. O parâmetro
  é outra variável, e o que entrou nele foi uma cópia do valor. Some as
  duas e não há como escrever no parâmetro e atingir o argumento —
  escrever em n escreve em n.

  O que confunde é que a modificação ACONTECE. Se f faz n = 99, o n de
  f passa a valer 99 de verdade, e dá para imprimir lá dentro e ver.
  Não é que a atribuição tenha sido ignorada: ela foi feita, na caixa
  em que ela manda.

  E nada volta no fim. Quando f termina, ninguém copia o valor do
  parâmetro de volta para o argumento — a cópia foi de mão única, na
  entrada. Uma função que só atribui ao próprio parâmetro não deixa
  marca nenhuma do lado de fora.


# O exemplo que já está no domínio, repetido para quem revisa. NÃO MUDA.
exemplo: |
  void f(int n) { n = 99; }
  int x = 1;
  f(x);         /* x continua 1 */


# O CASO RESOLVIDO: dois parâmetros, um modificado, e o valor de dentro
# impresso — as duas metades ao mesmo tempo.
caso_resolvido:
  - prosa: "Vamos resolver um junto."
  - codigo: |
      void ajusta(int a, int b)
      {
          a = a + 10;
          printf("dentro:  a=%d  b=%d\n", a, b);
      }
  - codigo: |
      int x = 1, y = 2;
      ajusta(x, y);
      printf("fora:    x=%d  y=%d\n", x, y);
  - prosa: "Pergunta: depois da chamada, quanto vale x?"
  - prosa: >
      A tentação é escolher entre duas respostas, e as duas erram. Uma
      diz 11 — "a função somou dez". A outra diz que a soma não
      aconteceu, já que x não mudou. Olhe as duas linhas da saída: a
      soma aconteceu, e aconteceu em a.
  - prosa: "A máquina confirma:"
  - saida: |
      dentro:  a=11  b=2
      fora:    x=1  y=2
  - prosa: >
      a virou 11 e x continua 1, ao mesmo tempo. Não é que a atribuição
      tenha falhado: ela escreveu na caixa de a, que é a caixa que ela
      nomeia. E b, que ninguém tocou, continua com a cópia que recebeu.


# A OUTRA ROTA: o mesmo nome dos dois lados, agora com a modificação.
# Repete de propósito a configuração do cartão do B1.
reexplicacao:
  - prosa: >
      Outro caminho, e ele começa onde o cartão do parâmetro parou:
      dois nomes iguais.
  - codigo: |
      void f(int n)
      {
          n = 99;
          printf("dentro de f, n vale %d\n", n);
      }
  - codigo: |
      int n = 1;
      f(n);
      printf("no main, n vale %d\n", n);
  - prosa: >
      Já foi aceito que esses dois n são duas variáveis: elas
      responderam números diferentes sem ninguém modificar nada. A
      pergunta agora é outra — modificar um mexe no outro?
  - prosa: "A máquina confirma:"
  - saida: |
      dentro de f, n vale 99
      no main, n vale 1
  - prosa: >
      Não mexe. E repare que o nome igual não ajudou em nada: se
      bastasse ter o mesmo nome para ser a mesma caixa, o segundo printf
      diria 99. Quem decide são as duas declarações, como antes.
