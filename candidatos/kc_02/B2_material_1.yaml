# ---------------------------------------------------------------------------
# AMPLIAÇÃO  (campo `interpretation` — CABE NO ESQUEMA DE HOJE)
#
# É AQUI que `sizeof` é explicado, e não no I2. O inventário o tem como
# `so_avaliado` — mencionado dentro de um malloc do kc_01 cujo texto é
# sobre tempo de vida. Se este arquivo for aprovado, é esta ampliação
# que justifica promovê-lo, e a evidência do inventário deve apontar
# para cá.
# ---------------------------------------------------------------------------

ampliacao: >
  Se p é uma caixa, então p tem as duas coisas que toda caixa tem: um
  lugar e um tamanho. O lugar se pergunta com &p, do mesmo jeito que se
  pergunta &x — e as duas respostas saem diferentes, porque são duas
  caixas.


  O tamanho se pergunta com sizeof. `sizeof(alguma coisa)` devolve
  quantos bytes aquilo ocupa na memória, e é o compilador que responde,
  pelo tipo: `sizeof(x)`, com x inteiro, dá 4 nesta máquina. Pergunte
  `sizeof(p)` e ele dá 8 — p ocupa espaço, e ocupa um espaço seu, que
  não é o de x. O 8 se repete para `int *`, `char *` ou `double *`,
  porque o que p guarda é sempre um endereço, e endereço tem um tamanho
  só.


  É por aqui que o desenho da seta engana. A seta mostra a relação entre
  as duas caixas, e para isso ela serve. Mas seta não tem lugar nem
  tamanho, e p tem os dois. Quem pensa o ponteiro COMO a seta fica sem
  resposta para "onde fica p?" — e &p é uma pergunta que o compilador
  responde sem reclamar.


narracao:
  - linha: "int x = 42;"
    diz: >
      Reserva uma caixa para x e guarda 42 nela. A caixa passa a existir
      num lugar da memória, com um número próprio que você não escolheu.
  - linha: "int *p = &x;"
    diz: >
      Reserva OUTRA caixa, chamada p, e guarda nela o número do lugar de
      x. Agora são duas caixas: a de x, com 42 dentro; a de p, com o
      endereço de x dentro.
  - linha: 'printf("%p\n", (void *)&p);'
    diz: >
      &p é o número do lugar da caixa p — não o que está dentro dela.
      Sai um endereço, e ele não é igual a &x.


caso_resolvido:
  - prosa: >
      Vamos resolver um junto, do começo ao fim.
  - codigo: |
      int x = 42;
      int *p = &x;
  - prosa: >
      Pergunta: depois dessas duas linhas, quantas caixas existem, e o
      que tem dentro de cada uma?
  - prosa: >
      Comece contando as declarações. São duas, x e p. Toda declaração
      reserva uma caixa — então são duas caixas, não uma.
  - prosa: >
      Agora veja o que entra em cada uma. Em x entra 42. Em p entra &x,
      que é o número do lugar de x. Fica assim:
  - saida: |
      caixa x   num lugar, digamos 0x1000   dentro: 42
      caixa p   em outro, digamos 0x2A00    dentro: 0x1000
  - prosa: >
      Repare no que a segunda linha NÃO fez. Ela não mudou x. Ela não
      criou um apelido para x. E ela não deixou p sem lugar: p é uma
      caixa nova, preenchida com um número — e esse número por acaso é o
      endereço de outra caixa.
  - prosa: >
      Se alguém perguntar "onde fica p?", a resposta é 0x2A00. A
      pergunta tem resposta, e é isso que esta premissa afirma.


reexplicacao:
  - prosa: >
      Outro caminho para a mesma ideia, agora sem analogia nenhuma. Peça
      os três números à máquina:
  - codigo: |
      int x = 42;
      int *p = &x;
      printf("%p\n",  (void *)&x);   /* onde x mora    */
      printf("%p\n",  (void *)&p);   /* onde p mora    */
      printf("%zu\n", sizeof(p));    /* quanto p ocupa */
  - prosa: >
      Os dois primeiros saem diferentes, e isso já responde a pergunta:
      se p não ocupasse lugar nenhum, &p não teria o que imprimir. O
      terceiro sai 8 — espaço ocupado, medido pelo compilador.
  - prosa: >
      Uma seta desenhada no quadro não tem endereço nem tamanho. A caixa
      p tem os dois, e a máquina diz quais são.


