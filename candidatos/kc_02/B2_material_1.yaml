#
# Vale a regra do projeto: candidato nunca vira domínio sozinho. Quem move
# para `mvp/dominio/` é você, depois de ler a folha REVISAO-B2_material_1.md.
#
# POR QUE O B2, e não o B1. O B1 é um dos DOIS nós, em 79, que já têm
# ampliação. Montar o B1 e achar bonito provaria pouco — ele já era o nó
# mais rico do projeto. O B2 é típico: uma analogia, um exemplo, um item
# de entrada, zero ampliação. E é onde mora a confusão central do tópico.
#
# O QUE ESTE ARQUIVO AFIRMA, e o que a máquina conferiu (gcc, sem avisos):
#
#     &x e &p saem diferentes                      ..... confirmado
#     sizeof(p) = 8 e sizeof(x) = 4                ..... confirmado
#     sizeof igual para int *, char * e double *   ..... confirmado NESTA máquina
#
# A REGRA DA SETA, do cabeçalho de graph_kc02.yaml, vale em cada linha
# daqui: desenhe a seta, nunca diga que o ponteiro É a seta. É a frase que
# fabrica a crença que este nó refuta.
#
# E NENHUMA DERREFERÊNCIA: `*p` é o B3. Não aparece em lugar nenhum aqui.

topico: kc_02
# `node:`, e não `no:` — em YAML a palavra `no` é o booleano falso, e a
# chave vira `False`. Foi o conferidor que pegou, na primeira carga.
node: kc02:B2
premissa: "Um ponteiro é uma variável: ocupa um lugar e tem endereço próprio."
crenca_que_nega: pointer_has_no_address

gerado_por: Claude Opus 5, 08/11/2026
revisado_por: ____
