# ---------------------------------------------------------------------------
# 1. AMPLIAÇÃO  (campo `interpretation` do nó)
#
# CABE NO ESQUEMA DE HOJE. O nó já aceita `interpretation`; o B1 e o B3 têm
# uma, e os outros 77 do projeto não. Esta pode entrar sem mexer em código.
#
# Segue a regra das duas que já existem: não é premissa nova, é a
# consequência direta do que o nó já afirma. Se p é uma caixa, então p tem
# as duas coisas que toda caixa tem.
# ---------------------------------------------------------------------------

ampliacao: >
  Se p é uma caixa, então p tem as duas coisas que toda caixa tem: um
  lugar e um tamanho. O lugar se pergunta com &p, do mesmo jeito que se
  pergunta &x — e as duas respostas saem diferentes, porque são duas
  caixas. O tamanho se pergunta com sizeof(p): nesta máquina ele dá 8,
  enquanto sizeof(x) dá 4, e dá os mesmos 8 para int *, char * ou
  double *. O que p guarda é sempre um endereço, e endereço tem um
  tamanho só.


  É por aqui que o desenho da seta engana. A seta mostra a relação entre
  as duas caixas, e para isso ela serve. Mas seta não tem lugar nem
  tamanho, e p tem os dois. Quem pensa o ponteiro COMO a seta fica sem
  resposta para "onde fica p?" — e &p é uma pergunta que o compilador
  responde sem reclamar.


# ---------------------------------------------------------------------------
# 2. NARRAÇÃO DO EXEMPLO  (campo NOVO — exige mudança de esquema)
#
# O exemplo do B2 hoje são três linhas de C soltas, com um comentário. A
# pessoa que não sabe lê código e não sabe o que olhar. Isto diz, linha a
# linha, o que acontece e o que muda na memória.
# ---------------------------------------------------------------------------

narracao:
  - linha: "int x = 42;"
    diz: >
      Reserva uma caixa para x e guarda 42 nela. A caixa passa a existir
      num lugar da memória, com um número próprio que você não escolheu.
  - linha: "int *p = &x;"
    diz: >
      Reserva OUTRA caixa, chamada p, e guarda nela o número do lugar de
      x. Agora são duas caixas: a de x, com 42 dentro; a de p, com o
      endereço de x dentro.
  - linha: 'printf("%p\n", (void *)&p);'
    diz: >
      &p é o número do lugar da caixa p — não o que está dentro dela.
      Sai um endereço, e ele não é igual a &x.


# ---------------------------------------------------------------------------
# 3. CASO RESOLVIDO  (campo NOVO — exige mudança de esquema)
#
# Um exemplo trabalhado do começo ao fim, ANTES de pedir qualquer coisa.
# Hoje a pessoa que diz "não sei" recebe um cartão e já cai numa pergunta.
# ---------------------------------------------------------------------------

caso_resolvido: >
  Vamos resolver um junto, do começo ao fim.


      int x = 42;
      int *p = &x;


  Pergunta: depois dessas duas linhas, quantas caixas existem, e o que
  tem dentro de cada uma?


  Comece contando as declarações. São duas, x e p. Toda declaração
  reserva uma caixa — então são duas caixas, não uma.


  Agora veja o que entra em cada uma. Em x entra 42. Em p entra &x, que
  é o número do lugar de x. Fica assim:


      caixa x   num lugar, digamos 0x1000   dentro: 42
      caixa p   em outro, digamos 0x2A00    dentro: 0x1000


  Repare no que a segunda linha NÃO fez. Ela não mudou x. Ela não criou
  um apelido para x. E ela não deixou p sem lugar: p é uma caixa nova,
  que foi preenchida com um número — e esse número por acaso é o
  endereço de outra caixa.


  Se alguém perguntar "onde fica p?", a resposta é 0x2A00. A pergunta
  tem resposta, e é isso que esta premissa afirma.


# ---------------------------------------------------------------------------
# 4. REEXPLICAÇÃO  (campo NOVO — exige mudança de esquema)
#
# O que o botão "Ainda não entendi" mostra na segunda vez. Hoje ele
# remostra o mesmo cartão, e eu registrei isso como dívida quando o
# construí.
#
# NÃO é outra metáfora: trocar de metáfora obriga a pessoa a aprender a
# metáfora junto com o conceito, e o cabeçalho do tópico proíbe. É outra
# ROTA — em vez de analogia, evidência.
# ---------------------------------------------------------------------------

reexplicacao: >
  Outro caminho para a mesma ideia, agora sem analogia nenhuma. Peça os
  três números à máquina:


      printf("%p\n",  (void *)&x);   /* onde x mora    */
      printf("%p\n",  (void *)&p);   /* onde p mora    */
      printf("%zu\n", sizeof(p));    /* quanto p ocupa */


  Os dois primeiros saem diferentes, e isso já responde a pergunta: se p
  não ocupasse lugar nenhum, &p não teria o que imprimir. O terceiro sai
  8 — espaço ocupado, medido pelo compilador.


  Uma seta desenhada no quadro não tem endereço nem tamanho. A caixa p
  tem os dois, e a máquina diz quais são.


