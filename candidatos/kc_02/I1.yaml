activities:
- id: kc02_gi1_n1_1
  node: kc02:I1
  nivel: 1
  formato: reconhecer_conceito
  tipo: teorica
  enunciado: Duas pessoas têm papéis com o mesmo número de casa. Quantas casas esse
    número indica?
  codigo: ''
  alternativas:
    a: 'Uma: os dois levam à mesma casa'
    b: 'Duas: cada papel é uma casa, mesmo com o mesmo número'
    c: 'Nenhuma: o papel traz o que tem dentro, não onde fica'
  gabarito: a
  crencas:
    b: pointer_and_target_are_one
    c: pointer_is_data
  gerado_por: Claude Opus 5, nesta conversa em 2026-10-29
  revisado_por: ''
  por_que_este_distrator: o papel não é a casa, e dois papéis não fazem duas casas
- id: kc02_gi1_n2_2
  node: kc02:I1
  nivel: 2
  formato: prever_saida
  tipo: codigo
  enunciado: O que sai?
  codigo: 'int x = 1;

    int *p = &x;

    int *q = p;

    *q = 9;

    printf("%d

    ", x);'
  alternativas:
    a: '9: p e q levam ao mesmo x'
    b: '1: q é cópia, e mexer nela não muda x'
    c: 9, e p também passou a valer 9
  gabarito: a
  crencas:
    b: pointer_and_target_are_one
    c: pointer_is_data
  gerado_por: Claude Opus 5, nesta conversa em 2026-10-29
  revisado_por: ''
  por_que_este_distrator: copiar o ponteiro não copia a caixa apontada
- id: kc02_gi1_n3_3
  node: kc02:I1
  nivel: 3
  formato: comparar_casos
  tipo: codigo
  enunciado: Que diferença há entre A e B?
  codigo: '/* A */  int *p = &x;  int *q = &x;

    /* B */  int *p = &x;  int *q = p;'
  alternativas:
    a: 'Nenhuma: nos dois p e q levam a x'
    b: Em B, q e p viram a mesma variável
    c: Em A, x fica com dois valores
  gabarito: a
  crencas:
    b: pointer_and_target_are_one
    c: pointer_is_data
  gerado_por: Claude Opus 5, nesta conversa em 2026-10-29
  revisado_por: ''
  por_que_este_distrator: nos dois casos são dois ponteiros e uma caixa
