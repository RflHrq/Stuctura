# Material de ensino do I1 — candidato, NÃO é domínio.
#
# O I1 é INFERÊNCIA, e sai de B2 + B3. Isso muda o material: além de
# afirmar, ele precisa MOSTRAR DE ONDE SAI. Quem já aceitou que p é uma
# caixa (B2) e que dentro dela há um endereço (B3) não tem como recusar
# que são duas caixas — e é esse passo que o material tem de tornar
# visível.
#
# ACHADO DO INVENTÁRIO, e vale para I1, I2 e I3: a abertura ensina TRÊS
# cartões — B1, B2 e B3. Os nós de inferência não têm cartão de ensino;
# eles só são apresentados a quem declara lacuna. Está escrito em
# conceitos.yaml, na entrada `tipo_do_ponteiro`: "é premissa do tópico e
# tem itens, mas não tem cartão de ensino". Decisão sua e do orientador:
# a abertura passa a ter seis cartões, ou as inferências continuam
# aparecendo só sob demanda?
#
# CONFERIDO PELO ORÁCULO (gcc -Wall -Wextra, sem avisos):
#     a=42, b=7; q=&a; q=&b; *q=99   ->  a=42   b=99
#     &a == &b                        ->  0

