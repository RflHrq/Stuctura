# Material de ensino do I1 — candidato, NÃO é domínio.
#
# SEGUNDA VERSÃO. Três correções:
#
# 1. O item do papel apagado SAIU. Ele era "você apaga o papel da casa
#    2A00 e escreve o número de outra; a casa que estava escrita antes
#    continua igual" — e o `ciu_kc02_e4`, que JÁ É o item de entrada
#    deste nó, é "você apaga o papel e escreve nele o número de outra
#    casa; o que acontece com a casa que estava escrita antes? Nada".
#    Eu escrevi o item de entrada que já existia. Por trigramas: 0.31.
#
# 2. O segundo item foi reescrito. Ele perguntava quanto vale x depois
#    de `p = &y`, e o `ciu_kc02_010` já pergunta "quando você escreve
#    p = &y, o que muda? Só p". Mesmo ângulo. Agora ele pergunta o
#    complemento que o banco não cobre: o que acontece com p quando se
#    escreve `*p = 99`.
#
# 3. `caso_resolvido` e `reexplicacao` viraram LISTA DE BLOCOS.
#
# O I1 é INFERÊNCIA, e sai de B2 + B3. Por isso a ampliação mostra a
# derivação em vez de só afirmar.
#
# ACHADO DO INVENTÁRIO, e vale para I1, I2 e I3: a abertura ensina TRÊS
# cartões — B1, B2 e B3. Os nós de inferência não têm cartão de ensino;
# só aparecem para quem declara lacuna. Está em `conceitos.yaml`, na
# entrada `tipo_do_ponteiro`.
#
# CONFERIDO PELO ORÁCULO (gcc -Wall -Wextra, sem avisos):
#     a=42, b=7; q=&a; q=&b; *q=99   ->  a = 42,  b = 99
#     &a == &b                        ->  0

topico: kc_02
node: kc02:I1
premissa: "O ponteiro e o objeto apontado são duas coisas, cada uma no seu lugar."
suporte: [B2, B3]
crenca_que_nega: pointer_and_target_are_one

gerado_por: Claude Opus 5, 08/11/2026 (2a versão)
revisado_por: ____
revisado_sha: ____


ampliacao: >
  Esta não é uma ideia nova: ela cai das duas anteriores. O B2 disse que
  p é uma caixa, com lugar próprio. O B3 disse que o que está dentro de
  p é o endereço de outra caixa. Junte as duas e você tem duas caixas —
  a de p e a apontada — em dois lugares, e &p e p respondem números
  diferentes.


  O que decorre disso é o que separa as duas operações do tópico.
  Escrever `p = &y` mexe no conteúdo de p: troca o endereço guardado, e
  a caixa antes apontada continua exatamente como estava. Escrever
  `*p = 99` não toca em p: usa o endereço que está nele para chegar à
  outra caixa e mudar o que mora lá.


  Mexer no ponteiro e mexer no apontado são coisas diferentes porque são
  caixas diferentes. Quem acha que são a mesma espera que `p = &y`
  também mude o valor antigo — e a máquina mostra que não muda.


narracao:
  - linha: "int x = 42, y = 7;"
    diz: >
      Duas caixas, cada uma no seu lugar, com 42 e 7 dentro.
  - linha: "int *p = &x;"
    diz: >
      Uma terceira caixa, p, com o endereço de x dentro. Três caixas na
      história, não duas.
  - linha: "p = &y;"
    diz: >
      Muda o CONTEÚDO de p: agora é o endereço de y que está guardado
      ali. x não foi tocado e continua 42.
  - linha: "*p = 99;"
    diz: >
      Não toca em p. Usa o endereço que está dentro dele para chegar a y
      e escrever 99 lá. Agora y é 99, e x continua 42.


caso_resolvido:
  - prosa: >
      Vamos resolver um junto, contando as caixas antes de responder.
  - codigo: |
      int a = 42, b = 7;
      int *q = &a;
      q = &b;
      *q = 99;
  - prosa: >
      Pergunta: no fim, quanto valem a e b?
  - prosa: >
      Primeiro, quantas caixas? Três declarações, três caixas: a, b e q.
  - prosa: >
      Agora linha por linha, anotando só o que MUDA:
  - saida: |
      int *q = &a;   q passa a guardar o endereço de a
      q = &b;        q passa a guardar o endereço de b
                     (a não foi tocado: continua 42)
      *q = 99;       vai ao lugar guardado em q, que é o de b,
                     e escreve 99 lá
  - prosa: >
      Então a continua 42 e b vira 99. A máquina confirma: a -> 42 e
      b -> 99.
  - prosa: >
      O erro comum é esperar que a terceira linha, ao "desligar" q de a,
      mexesse em a. Ela não mexe, e o motivo é esta premissa: q e a são
      duas caixas. Apagar o que está escrito num papel não derruba
      parede nenhuma.


reexplicacao:
  - prosa: >
      Outro caminho: conte os endereços em vez de seguir a história.
  - codigo: |
      int a = 42, b = 7;
      int *q = &a;
      printf("%d\n", &a == &b);   /* 0 */
      printf("%d\n", &a == &q);   /* 0 */
  - prosa: >
      Três perguntas, três números de lugar, e nenhum igual ao outro. Se
      o ponteiro e a caixa apontada fossem a mesma coisa, &a == &q daria
      1 — e dá 0.
  - prosa: >
      É a mesma conta do B2 e do B3, agora as duas de uma vez: p tem
      lugar (B2), dentro de p mora um endereço (B3), e um endereço é de
      OUTRO lugar. Duas caixas.


