- id: kc02_gb3_n3_3
  node: kc02:B3
  nivel: 3
  formato: prever_saida
  tipo: codigo
  enunciado: Depois dessas linhas, o que sai?
  codigo: 'int x = 42, y = 7;

    int *p = &x;

    *p = y;

    printf("%d

    ", x);'
  alternativas:
    a: 7, porque *p escreve no lugar de x
    b: 42, porque *p = y muda só o ponteiro
    c: 7, e p agora guarda 7
  gabarito: a
  crencas:
    b: pointer_and_target_are_one
    c: pointer_is_data
  gerado_por: Claude Opus 5, nesta conversa em 2026-10-29
