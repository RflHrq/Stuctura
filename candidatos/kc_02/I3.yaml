  nivel: 1
  formato: reconhecer_conceito
  tipo: teorica
  enunciado: Um vizinho tem o número da sua casa. O que ele consegue fazer que não
    conseguiria sem o número?
  codigo: ''
  alternativas:
    a: Chegar até a sua casa sem você levar nada
    b: Nada que uma cópia da planta não resolva
    c: 'Nada: ter o número já é o mesmo que ter a casa'
