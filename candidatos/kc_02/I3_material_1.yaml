# Material de ensino do I3 — candidato, NÃO é domínio.
#
# SEGUNDA VERSÃO. Duas correções:
#
# 1. O item da planta SAIU. Ele era "você viaja e quer que o vizinho
#    regue a sua planta; você manda uma foto ou o número da sua casa?" —
#    e o `ciu_kc02_e6`, que JÁ É o item de entrada deste nó, é "você
#    quer que um vizinho regue a sua planta enquanto você viaja; o que
#    você manda para ele? O número da sua casa". Eu reescrevi o item que
#    já existia.
#
# 2. `caso_resolvido` virou LISTA DE BLOCOS, porque `_paragrafos`
#    colapsa linha de código que não esteja separada por linha em
#    branco.
#
# ============================================================
# O PROBLEMA DE FUNDO DESTE NÓ, que continua de pé
# ============================================================
#
# `funcao_com_parametro` está `nao_introduzido` no inventário:
#
#     "Funções aparecem, e PARÂMETRO NENHUM: as duas assinaturas dos
#      cartões são `int conta(void)` e `int *faz(void)`. Passagem por
#      valor não é tratada em cartão nenhum."
#
# E o I3 — o nó que FECHA o tópico — tem como exemplo
# `void dobra(int *q)` e dez itens sobre passar endereço para função.
# Não dá para ensiná-lo honestamente sem isso: "de outro ponto do
# programa" É a fronteira de uma função; sem ela bastaria usar o nome.
#
# ESTE MATERIAL INTRODUZ o conceito, no mínimo necessário: uma função
# que recebe, e o contraste entre receber o valor e receber o endereço.
# Se aprovado, o inventário sai de `nao_introduzido` com evidência
# apontando para cá — e isso destrava também o degrau substituto do
# `scanf`, que a entrada do inventário registra como bloqueado pelo
# mesmo motivo.
#
# A DECISÃO É SUA E DO ORIENTADOR: aprovar a introdução aqui, mover o I3
# para depois de um tópico que ensine funções, ou tirar o I3 do kc_02.
#
# CONFERIDO PELO ORÁCULO (gcc -Wall -Wextra, sem avisos):
#     n = 10; dobra(&n);        ->  n = 20
#     m = 10; dobra_valor(m);   ->  m = 10   (não mudou)

topico: kc_02
node: kc02:I3
premissa: "Guardar um endereço permite alcançar a mesma caixa de outro ponto do programa."
suporte: [I1, I2]
crenca_que_nega: pointer_is_pointless
exige_conceitos: [funcao_com_parametro]      # hoje nao_introduzido

gerado_por: Claude Opus 5, 08/11/2026 (2a versão)
revisado_por: Rafael H. S. Simao
revisado_sha: 1ea614f2af71


ampliacao: >
  Até aqui o ponteiro parecia trabalho a mais: se você tem x, escreva x.
  O I3 é onde isso deixa de valer, e o motivo é uma regra de C que vale
  a pena ver de frente: quando você passa uma variável para uma função,
  a função recebe uma CÓPIA do valor. Ela mexe na cópia, a cópia morre
  no fim, e a sua variável continua como estava.


  Então uma função que recebe int v não tem como alterar a variável de
  quem a chamou. Nenhuma. O nome x não existe lá dentro, e o valor que
  chegou é outro objeto, em outro lugar.


  O endereço resolve isso porque ele também é um valor — e um valor que
  pode ser copiado sem perder o que importa. A função recebe uma cópia
  do ENDEREÇO, e uma cópia do endereço ainda aponta para a mesma caixa.
  Com ela, *q = ... chega à caixa original. É o mesmo mecanismo do B3,
  agora atravessando a fronteira de uma função.


  É daí que vem a resposta para "para que serve": não é um jeito
  complicado de fazer o que uma variável comum já faz. É a única forma
  de uma função alcançar a caixa de quem a chamou.


narracao:
  - linha: "void dobra(int *q) { *q = *q * 2; }"
    diz: >
      A função recebe um endereço, não um número. Dentro dela, q é uma
      caixa nova com uma cópia desse endereço — e *q vai até a caixa
      original para ler e escrever.
  - linha: "int n = 10;"
    diz: >
      Uma caixa com 10 dentro, na função que chama.
  - linha: "dobra(&n);"
    diz: >
      Passa o ENDEREÇO de n, não o 10. A cópia que chega lá dentro
      aponta para a mesma caixa, e por isso o que a função escreve
      chega aqui.
  - linha: "/* n agora é 20 */"
    diz: >
      Confirmado pela máquina. Com a assinatura dobra(int v) e a
      chamada dobra(n), n continua 10 — a função teria mexido numa
      cópia.


caso_resolvido:
  - prosa: >
      Vamos resolver um junto, com as duas versões lado a lado.
  - codigo: |
      void dobra_valor(int v)  { v = v * 2; }
      void dobra(int *q)       { *q = *q * 2; }

      int m = 10;   dobra_valor(m);
      int n = 10;   dobra(&n);
  - prosa: >
      Pergunta: quanto valem m e n no fim?
  - prosa: >
      Comece pela primeira. dobra_valor(m) entrega o VALOR 10. Lá
      dentro, v é uma caixa nova com 10. A linha v = v * 2 põe 20
      nessa caixa nova. A função termina, a caixa v some, e m nunca foi
      tocado. m = 10.
  - prosa: >
      Agora a segunda. dobra(&n) entrega o ENDEREÇO de n. Lá dentro, q
      é uma caixa nova com uma cópia desse endereço. A linha
      *q = *q * 2 não escreve em q: usa o endereço que está em q para
      chegar à caixa de n e escrever lá. n = 20.
  - prosa: >
      A máquina confirma: m -> 10 e n -> 20.
  - prosa: >
      Repare no que as duas têm em comum: as duas receberam uma cópia. A
      diferença é do que era a cópia. Cópia de um valor é um valor novo;
      cópia de um endereço aponta para a mesma caixa de antes.


reexplicacao:
  - prosa: >
      Outro caminho: tente fazer sem ponteiro e veja onde trava.
  - prosa: >
      Você quer uma função que troque duas variáveis de lugar. Com
      valores, a função recebe cópias, troca as cópias, e as suas duas
      variáveis continuam exatamente como estavam — não existe jeito de
      consertar isso de dentro da função, porque o nome das suas
      variáveis não existe lá.
  - prosa: >
      Com endereços, a função recebe os dois lugares e vai até eles. Não
      é um estilo diferente de escrever a mesma coisa: é a diferença
      entre conseguir e não conseguir.
  - prosa: >
      O mesmo aparece quando a função precisa devolver dois resultados.
      return devolve um. Com um endereço recebido, ela escreve o
      segundo direto na caixa de quem chamou.


