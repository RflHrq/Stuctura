# Material de ensino do I3 — candidato, NÃO é domínio.
#
# ============================================================
# ATENÇÃO, E ESTE É O ARQUIVO COM O PROBLEMA MAIOR
# ============================================================
#
# O I3 é o nó de CONCLUSÃO do kc_02: "guardar um endereço permite
# alcançar a mesma caixa de outro ponto do programa". O exemplo dele no
# domínio é `void dobra(int *q) { *q = *q * 2; }`, e os dez itens dele
# são todos sobre passar endereço para função.
#
# E o inventário diz, sobre `funcao_com_parametro`:
#
#     status: nao_introduzido
#     texto:  "Funções aparecem, e PARÂMETRO NENHUM: as duas assinaturas
#              dos cartões são `int conta(void)` e `int *faz(void)`.
#              Passagem por valor não é tratada em cartão nenhum."
#
# Ou seja: o nó que fecha o tópico se apoia num construto que o material
# nunca apresentou. Não dá para ensinar o I3 honestamente sem isso — "de
# outro ponto do programa" É a fronteira de uma função; sem ela, o
# benefício do ponteiro não aparece, porque bastaria usar o nome.
#
# ESTE MATERIAL INTRODUZ `funcao_com_parametro`, de propósito e no
# mínimo necessário: uma função que recebe, e o contraste entre receber
# o valor e receber o endereço. Se for aprovado, o inventário sai de
# `nao_introduzido` com evidência apontando para cá — e isso destrava
# também o degrau substituto do `scanf`, que a entrada do inventário
# registra como bloqueado por este mesmo motivo.
#
# A DECISÃO É SUA E DO ORIENTADOR. As alternativas são: aprovar a
# introdução aqui; mover o I3 para depois de um tópico que ensine
# funções; ou tirar o I3 do kc_02. Eu recomendo a primeira, porque o
# contraste valor/endereço é exatamente o que o I3 afirma, mas é
# decisão curricular e não minha.
#
# CONFERIDO PELO ORÁCULO (gcc -Wall -Wextra, sem avisos):
#     n = 10; dobra(&n);        ->  n = 20
#     m = 10; dobra_valor(m);   ->  m = 10   (não mudou)

