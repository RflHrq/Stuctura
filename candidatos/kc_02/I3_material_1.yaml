ampliacao: >
  Até aqui o ponteiro parecia trabalho a mais: se você tem x, escreva x.
  O I3 é onde isso deixa de valer, e o motivo é uma regra de C que vale
  a pena ver de frente: quando você passa uma variável para uma função,
  a função recebe uma CÓPIA do valor. Ela mexe na cópia, a cópia morre
  no fim, e a sua variável continua como estava.


  Então uma função que recebe `int v` não tem como alterar a variável de
  quem a chamou. Nenhuma. O nome x não existe lá dentro, e o valor que
  chegou é outro objeto, em outro lugar.


  O endereço resolve isso porque ele também é um valor — e um valor que
  pode ser copiado sem perder o que importa. A função recebe uma cópia
  do ENDEREÇO, e uma cópia do endereço ainda aponta para a mesma caixa.
  Com ela, `*q = ...` chega à caixa original. É o mesmo mecanismo do B3,
  agora atravessando a fronteira de uma função.


  É daí que vem a resposta para "para que serve": não é um jeito
  complicado de fazer o que uma variável comum já faz. É a única forma
  de uma função alcançar a caixa de quem a chamou.


narracao:
  - linha: "void dobra(int *q) { *q = *q * 2; }"
    diz: >
      A função recebe um endereço, não um número. Dentro dela, q é uma
      caixa nova com uma cópia desse endereço — e `*q` vai até a caixa
      original para ler e escrever.
  - linha: "int n = 10;"
    diz: >
      Uma caixa com 10 dentro, na função que chama.
  - linha: "dobra(&n);"
    diz: >
      Passa o ENDEREÇO de n, não o 10. A cópia que chega lá dentro
      aponta para a mesma caixa, e por isso o que a função escreve chega
      aqui.
  - linha: "/* n agora é 20 */"
    diz: >
      Confirmado pela máquina. Trocando a assinatura para `dobra(int v)`
      e chamando `dobra(n)`, n continua 10 — a função teria mexido numa
      cópia.


caso_resolvido: >
  Vamos resolver um junto, com as duas versões lado a lado.


      void dobra_valor(int v)  { v = v * 2; }
      void dobra(int *q)       { *q = *q * 2; }

      int m = 10;   dobra_valor(m);
      int n = 10;   dobra(&n);


  Pergunta: quanto valem m e n no fim?


  Comece pela primeira. `dobra_valor(m)` entrega o VALOR 10. Lá dentro,
  v é uma caixa nova com 10. A linha `v = v * 2` põe 20 nessa caixa
  nova. A função termina, a caixa v some, e m nunca foi tocado. m = 10.


  Agora a segunda. `dobra(&n)` entrega o ENDEREÇO de n. Lá dentro, q é
  uma caixa nova com uma cópia desse endereço. A linha `*q = *q * 2`
  não escreve em q: usa o endereço que está em q para chegar à caixa de
  n e escrever lá. n = 20.


  A máquina confirma: `m -> 10` e `n -> 20`.


  Repare no que as duas têm em comum: as duas receberam uma cópia. A
  diferença é do que era a cópia. Cópia de um valor é um valor novo;
  cópia de um endereço aponta para a mesma caixa de antes.


reexplicacao: >
  Outro caminho: tente fazer sem ponteiro e veja onde trava.


  Você quer uma função que troque duas variáveis de lugar. Com valores,
  a função recebe cópias, troca as cópias, e as suas duas variáveis
  continuam exatamente como estavam — não existe jeito de consertar
  isso de dentro da função, porque o nome das suas variáveis não existe
  lá.


  Com endereços, a função recebe os dois lugares e vai até eles. Não é
  um estilo diferente de escrever a mesma coisa: é a diferença entre
  conseguir e não conseguir.


  O mesmo aparece quando a função precisa devolver dois resultados.
  `return` devolve um. Com um endereço recebido, ela escreve o segundo
  direto na caixa de quem chamou.


