# Material de ensino do B1 — candidato, NÃO é domínio.
#
# SEGUNDA VERSÃO. Duas correções, as duas vindas de defeito conferido:
#
# 1. O item `ciu_kc02_B1_e2` SAIU. Ele era "duas casas da mesma rua
#    guardam o mesmo móvel; os números das portas são diferentes" — e o
#    `kc02_gb1_n1_1`, que já é domínio, é "duas casas da mesma rua têm
#    sofás idênticos; o que distingue uma da outra? O número de cada
#    porta". Mesmo cenário, mesma resposta. Um item de entrada que
#    repete pergunta que a pessoa já viu não dá segundo item nenhum.
#
#    MEDIDO, e vale como aviso: por trigramas esses dois dão 0.09 de
#    semelhança. Reuso de cenário não se pega com regex.
#
# 2. `caso_resolvido` e `reexplicacao` viraram LISTA DE BLOCOS. A única
#    tubulação de texto de ensino do projeto, `_paragrafos`, preserva
#    linha em branco e colapsa o resto — rodei a primeira versão por ela
#    e as linhas de código saíram grudadas numa só.
#
# O B1 JÁ TEM AMPLIAÇÃO (93 palavras). Este arquivo não escreve outra.
#
# RESTRIÇÃO DURA DESTE NÓ: nenhum ponteiro aparece aqui. Ponteiro é o B2.
#
# CONFERIDO PELO ORÁCULO (gcc -Wall -Wextra, sem avisos):
#     &idade == &outra      -> 0
#     idade                 -> 20
#     a=20, b=20, &a == &b  -> 0   (mesmo valor, lugares diferentes)

topico: kc_02
node: kc02:B1
premissa: "Cada lugar da memória tem um número que o identifica: o endereço."
crenca_que_nega: memory_is_by_name

gerado_por: Claude Opus 5, 08/11/2026 (2a versão)
revisado_por: ____
revisado_sha: ____

ampliacao: ja_existe_no_dominio


narracao:
  - linha: "int idade = 20;"
    diz: >
      Reserva um lugar na memória e guarda 20 nele. O lugar passa a ter
      um número próprio, que você não escolheu e não escreveu.
  - linha: "int outra = 7;"
    diz: >
      Outro lugar, com outro número e outro valor. Duas declarações,
      dois lugares.
  - linha: 'printf("%p\n", (void *)&idade);'
    diz: >
      &idade não é o 20. É o número do lugar onde o 20 está guardado, e
      %p imprime esse número.
  - linha: 'printf("%d\n", idade);'
    diz: >
      Aqui sim sai 20: sem o &, o que se lê é o conteúdo do lugar.
  - linha: 'printf("%d\n", &idade == &outra);'
    diz: >
      Compara os dois números de lugar. Sai 0 — são lugares diferentes.
      Se saísse 1, escrever numa mudaria a outra.


caso_resolvido:
  - prosa: >
      Vamos resolver um junto.
  - codigo: |
      int a = 20;
      int b = 20;
  - prosa: >
      As duas guardam o mesmo valor. Pergunta: &a == &b dá 1 ou 0?
  - prosa: >
      A tentação é responder 1 — os valores são iguais, então "é a mesma
      coisa". Siga a declaração em vez do valor. São duas declarações, e
      cada declaração reserva um lugar. Dois lugares.
  - prosa: >
      O endereço é o número do lugar, não o que está guardado nele. Dois
      lugares diferentes têm números diferentes, mesmo com o mesmo 20
      dentro. Então sai 0.
  - prosa: >
      A máquina confirma:
  - saida: |
      a=20 b=20   &a==&b -> 0
      &a=...FE4C  &b=...FE48
  - prosa: >
      Os dois números terminam diferentes, e a diferença entre eles é 4
      — o tamanho de um int. Duas caixas, lado a lado.


reexplicacao:
  - prosa: >
      Outro caminho, agora sem analogia. Pegue duas variáveis com o
      MESMO valor e pergunte duas coisas à máquina:
  - codigo: |
      int a = 20, b = 20;
      printf("%d\n", a == b);     /* os valores */
      printf("%d\n", &a == &b);   /* os lugares */
  - prosa: >
      A primeira linha sai 1: os valores são iguais. A segunda sai 0: os
      lugares não são.
  - prosa: >
      Se o endereço fosse o valor, as duas sairiam iguais. Se o endereço
      fosse o nome, a pergunta nem faria sentido — não dá para comparar
      dois nomes com ==. Ele é uma terceira coisa: o número do lugar.


