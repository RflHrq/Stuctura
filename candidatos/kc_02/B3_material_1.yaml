narracao:
  - linha: "int x = 42;"
    diz: >
      Uma caixa para x, com 42 dentro, num lugar com número próprio.
  - linha: "int *p = &x;"
    diz: >
      Outra caixa, p, e dentro dela o número do lugar de x. Dentro de p
      não há um 42: há um endereço.
  - linha: 'printf("%p\n", (void *)p);'
    diz: >
      Sem asterisco, o que se lê é o conteúdo de p — e o conteúdo de p é
      o endereço de x. Sai um endereço.
  - linha: 'printf("%d\n", *p);'
    diz: >
      Com asterisco, o programa vai até o lugar cujo número está dentro
      de p e lê o que mora lá. Sai 42.
  - linha: "*p = 7;"
    diz: >
      O mesmo caminho, agora para escrever: vai até aquele lugar e põe 7
      nele. Quem mudou foi x, sem a palavra x aparecer na linha.
  - linha: 'printf("%d\n", x);'
    diz: >
      Sai 7. É a prova de que o caminho chegou à caixa certa.


caso_resolvido: >
  Vamos resolver um junto.


      int x = 42;
      int *p = &x;


  Pergunta: qual a diferença entre imprimir p e imprimir *p?


  Comece pelo que está guardado. Dentro de p está o endereço de x —
  digamos 0x1000. Esse é o conteúdo da caixa p, do mesmo jeito que 42 é
  o conteúdo da caixa x.


  Então:


      p    é o conteúdo de p          -> 0x1000, um endereço
      *p   é o conteúdo do lugar      -> 42, o que mora em 0x1000
           cujo número está em p


  O asterisco é a viagem. Sem ele você fica na caixa p e lê o número
  que está nela; com ele você usa esse número para chegar a outra caixa
  e lê o que está lá.


  É por isso que `*p = 7;` muda x. A linha não nomeia x em lugar nenhum
  — ela diz "vá ao lugar cujo número está em p, e escreva 7 ali". E o
  número que está em p é justamente o lugar de x. A máquina confirma:
  depois dessa linha, x vale 7.


reexplicacao: >
  Outro caminho, agora pela pergunta ao contrário: o que teria de ser
  verdade para `*p` sair o mesmo que `p`?


      printf("%p\n", (void *)p);   /* um endereço */
      printf("%d\n", *p);          /* 42          */


  As duas linhas leem a MESMA caixa p, e saem coisas diferentes. Isso só
  é possível porque a segunda não para em p: ela usa o que está dentro
  de p como um caminho e vai adiante.


  Se o que estivesse dentro de p fosse o próprio 42, não haveria para
  onde ir, e as duas linhas sairiam iguais. Saem diferentes. Então o que
  está dentro é endereço, não dado.


