# Material de ensino do I2 — candidato, NÃO é domínio.
#
# SEGUNDA VERSÃO. A primeira foi reprovada numa revisão independente, com
# cinco bloqueios. O que mudou está no fim deste cabeçalho.
#
# ---------------------------------------------------------------------
# CONSEQUÊNCIAS DE INVENTÁRIO, e agora são QUATRO. A primeira versão
# declarava duas e escondia a mais forte.
#
#   atribuicao_entre_tipos   nao_introduzido   <- a mais forte, e faltava
#   tipo_do_ponteiro         so_avaliado
#   compilacao               so_avaliado
#   sizeof                   so_avaliado       <- ver nota abaixo
#
# `atribuicao_entre_tipos` é a espinha deste material: a recusa do
# compilador é a evidência de que o tipo existe. O inventário diz dele
# "em lugar nenhum de kc_00, kc_01 ou kc_02: nem ensino, nem item", e o
# `aprovacoes.yaml` já REPROVOU uma cadeia por exatamente isto — exigir
# conceito não ensinado e não declarado. A explicação que o libera está
# agora na AMPLIAÇÃO, que é o único campo que entra no esquema de hoje;
# na primeira versão ela estava no caso resolvido, que não entra.
#
# SOBRE O `sizeof`: a primeira versão afirmava "este material usa sizeof
# e o EXPLICA". Era falso — ele aparecia só como rótulo de número já
# medido, que é a definição de `mencionado_sem_explicacao`. Agora o
# sizeof NÃO aparece neste arquivo. Quem o explica é o B2, e é por lá que
# a promoção dele deve ser justificada.
#
# ---------------------------------------------------------------------
# O LIMITE DO kc_11, que a primeira versão furou. Ela dizia "andam 4 e 1
# byte, que é exatamente sizeof(int) e sizeof(char)" e na frase seguinte
# "quanto cada um anda é assunto de outro tópico" — tinha dado o quanto e
# o porquê. Agora a aritmética de ponteiro aparece só como MENÇÃO de que
# o comportamento difere, sem número e sem igualar a sizeof.
#
# A EVIDÊNCIA PRINCIPAL MUDOU por causa disso. Não é mais `p + 1`: é dois
# PONTEIROS, os dois guardando endereço, e o compilador recusando trocar
# um pelo outro. É evidência de tipo sem tocar em aritmética.
#
# ---------------------------------------------------------------------
# SEVERIDADE É AMBIENTE, NÃO É C. A primeira versão afirmava três vezes
# "não é aviso, é erro". Medido nesta máquina:
#
#   gcc -std=c17 -Wall                                  -> error, sem .exe
#   gcc -std=c17 -Wall -Wno-error=int-conversion        -> warning, com .exe
#   gcc ... -Wno-error=incompatible-pointer-types       -> warning, com .exe
#
# É erro porque o gcc >= 14 promoveu esses avisos. Num gcc mais antigo o
# programa compila. Num instrumento de pesquisa isso custa caro: quem
# rodar num laboratório com compilador que só avisa não tem alternativa
# certa para marcar. O material agora diz "reclama", que é o verbo que o
# próprio domínio já usa em `ciu_kc02_014`.
#
# ---------------------------------------------------------------------
# UM ITEM, NÃO DOIS. O degrau 1 do I2 já tem quatro itens, e os dois que
# eu havia escrito eram paráfrases: um do `ciu_kc02_e5` (conta de luz) e
# outro do `ciu_kc02_014` (`int n = &x`, "por que o compilador reclama",
# mesma resposta). O banco deste nó está saturado no degrau 1. Sobra um
# ângulo não coberto: atribuir um ponteiro a outro de tipo diferente.
#
# CONFERIDO PELO ORÁCULO (gcc 16.2.0, -std=c17 -Wall -Wextra):
#   int *p = &x; char *q = &c; p = q;
#     -> "assignment to 'int *' from incompatible pointer type 'char *'"
#   int *p = x;
#     -> "initialization of 'int *' from 'int' makes pointer from
#         integer without a cast"

topico: kc_02
node: kc02:I2
premissa: "Um ponteiro tem tipo, e por isso não é um inteiro qualquer."
suporte: [B1, B3]
crenca_que_nega: pointer_is_integer
exige_conceitos: [atribuicao_entre_tipos, compilacao, tipo_do_ponteiro]

gerado_por: Claude Opus 5, 08/11/2026 (2a versão)
revisado_por: ____
revisado_sha: ____


# ---------------------------------------------------------------------------
# AMPLIAÇÃO  (campo `interpretation` — CABE NO ESQUEMA DE HOJE)
#
# É o único campo que entra hoje, e por isso é ele que precisa carregar a
# explicação de `atribuicao_entre_tipos`. Sem isso, o item de entrada
# avaliaria um construto que o sistema não apresentou — o defeito que a
# auditoria de 05/11 registrou.
# ---------------------------------------------------------------------------

ampliacao: >
  Um endereço é um número, e isso é verdade. Mas a sua declaração disse
  mais do que o número: ela disse o que esperar encontrar quando se
  chegar lá. Foi isso que você escreveu em `int *p` — não "p guarda um
  número", e sim "p guarda o lugar de um int".


  Em C, tipo não é enfeite da declaração: o compilador recusa juntar
  coisas de tipos que ele não considera compatíveis, e é essa recusa que
  deixa o tipo visível. Experimente escrever `int *p = x;`, com x
  inteiro: ele reclama que aquilo faz um ponteiro a partir de um
  inteiro. Agora o caso que fecha a questão: declare `int *p` e
  `char *q`, que guardam os dois um endereço, e tente `p = q`. Ele
  reclama de novo, dizendo que são tipos de ponteiro incompatíveis. Dois
  endereços, dois números — e mesmo assim não dá para trocar um pelo
  outro.


  O quanto ele reclama depende da versão: nos compiladores recentes isso
  é erro e o programa não chega a existir; em versões mais antigas é
  aviso e o programa compila. O que não muda é o que ele está dizendo —
  que os tipos não são o mesmo.


  O tipo também muda o que as operações fazem: somar 1 a um ponteiro de
  int e a um ponteiro de char não leva ao mesmo lugar. Quanto cada um
  anda, e por quê, é assunto de outro tópico; aqui basta que o
  comportamento dependa do tipo e não do número guardado.


  E quem carrega essa informação não é a memória nem o endereço: é o
  compilador, que leu a sua declaração antes de o programa existir.


# ---------------------------------------------------------------------------
# NARRAÇÃO DO EXEMPLO  (campo novo)
#
# Esta parte não mudou: foi a única da primeira versão que segurou o
# limite do kc_11, mencionando que o "quanto" é de outro tópico sem dar
# o número.
# ---------------------------------------------------------------------------

narracao:
  - linha: "int x = 42;"
    diz: >
      Uma caixa com 42 dentro, como sempre.
  - linha: "int *p = &x;"
    diz: >
      p guarda o endereço de x. E a declaração registra, no compilador,
      que o que mora nesse endereço é um int.
  - linha: 'printf("%p\n", (void *)(p + 1));'
    diz: >
      Sai um endereço maior que o de x. O quanto maior depende do tipo
      declarado, não do número guardado — e esse "quanto" é assunto de
      outro tópico. Aqui basta: o tipo entra na conta.


# ---------------------------------------------------------------------------
# CASO RESOLVIDO  (campo novo)
#
# ESTRUTURADO EM BLOCOS, e não mais num texto corrido. Motivo medido: a
# única tubulação de texto de ensino do projeto é `_paragrafos`
# (mvp/dominio.py), que preserva linha em branco e colapsa o resto —
# rodei o texto da primeira versão por ela e os dois `printf` saíram na
# mesma linha. Prosa e código precisam ser blocos separados para a tela
# poder desenhar cada um do seu jeito.
# ---------------------------------------------------------------------------

caso_resolvido:
  - prosa: >
      Vamos resolver um junto, e este é o caso que mais convence.
  - codigo: |
      int x = 42;
      int *p = x;
    recusa: true
  - prosa: >
      Pergunta: o compilador aceita isso?
  - prosa: >
      A tentação é dizer que sim. Se um endereço é um número, e 42 é um
      número, por que não? Pergunte a ele:
  - saida: |
      initialization of 'int *' from 'int' makes pointer
      from integer without a cast [-Wint-conversion]
  - prosa: >
      Ele reclama. Repare no que a frase dele diz: não que o número
      esteja errado, e sim que ponteiro e inteiro são tipos diferentes e
      que ele não vai fingir que não são. Dependendo da versão do
      compilador isso vem como erro, e aí nem executável existe, ou como
      aviso, e aí o programa compila mesmo assim. A reclamação é a mesma.
  - prosa: >
      Agora troque por `int *p = &x;` e ele fica quieto. A diferença não
      está no número — o endereço de x também é um número. Está em o
      compilador saber, pela declaração, o que cada coisa é.


# ---------------------------------------------------------------------------
# REEXPLICAÇÃO  (campo novo — o que o "Ainda não entendi" mostra)
#
# TROCADA POR INTEIRO. A primeira versão estreava, na tela de quem já
# disse que não entendeu: array, decaimento de array para ponteiro, dois
# casts para char *, subtração de ponteiros e %td — nenhum deles no
# inventário como disponível. Esta usa só o que o tópico já tem.
# ---------------------------------------------------------------------------

reexplicacao:
  - prosa: >
      Outro caminho, e este não precisa de conta nenhuma. Pegue dois
      ponteiros que guardam, os dois, um endereço:
  - codigo: |
      int  x = 42;   int  *p = &x;
      char c = 'a';  char *q = &c;
      p = q;
    recusa: true
  - prosa: >
      Se ponteiro fosse só um número, a última linha seria copiar um
      número para outro lugar — a coisa mais simples do mundo. O
      compilador reclama:
  - saida: |
      assignment to 'int *' from incompatible pointer type 'char *'
  - prosa: >
      Os dois guardam endereço. Os dois são números. E ainda assim ele
      recusa trocar um pelo outro, porque para ele não são a mesma
      espécie de coisa. Isso é o tipo, e ele não está no número: está na
      declaração que você escreveu.


