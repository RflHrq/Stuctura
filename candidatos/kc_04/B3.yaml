- id: kc04_gb3_n3_3
  node: kc04:B3
  nivel: 3
  formato: prever_saida
  tipo: codigo
  enunciado: O que sai?
  codigo: 'int x = 1, y = 2;

    int *p = &x;

    int *q = &y;

    printf("%d\n", *p + *q);'
  alternativas:
    a: '3: *p é 1 e *q é 2'
    b: a soma dos dois endereços
    c: 3, e p e q são x e y
  gabarito: a
  crencas:
    b: pointer_is_data
    c: pointer_is_just_a_name
  gerado_por: Claude Opus 5, por importacao em 2026-11-01
  revisado_por: ''
  por_que_este_distrator: 'b é a crença do nó com o sinal trocado: quem acha que
    o ponteiro é o dado não separa somar conteúdo de somar endereço. c traz o I1.'
