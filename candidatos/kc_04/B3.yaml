- id: kc04_gb3_n2_2
  node: kc04:B3
  nivel: 2
  formato: achar_o_erro
  tipo: codigo
  enunciado: Por que o compilador avisa nesta linha?
  codigo: 'int x = 5;

    int *p = &x;

    printf("%d\n", p);'
  alternativas:
    a: p é endereço, e %d espera um int
    b: 'Não avisa: dentro de p está o 5'
    c: 'Falta o &: seria &p'
  gabarito: a
  crencas:
    b: pointer_is_data
    c: ampersand_takes_value
