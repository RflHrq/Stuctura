- id: kc04_gi1_n3_3
  node: kc04:I1
  nivel: 3
  formato: comparar_casos
  tipo: codigo
  enunciado: Qual dos dois virou 9, e por quê?
  codigo: 'int a = 1, b = 1;

    int *p = &a;

    *p = 9;

    /* A */  a

    /* B */  b'
  alternativas:
    a: 'A: p tinha o endereço de a'
    b: 'Os dois: *p é o nome dos dois'
    c: 'B: *p andou para a casa seguinte'
  gabarito: a
  crencas:
    b: pointer_is_just_a_name
    c: star_binds_to_the_pointer
  gerado_por: Claude Opus 5, por importacao em 2026-11-01
  revisado_por: ''
  por_que_este_distrator: b é a crença do nó; c traz o vizinho I2, de quem confunde
    agir através de p com andar com p.
