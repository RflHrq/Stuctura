# A AMPLIAÇÃO. O que a chamada carrega, onde o tamanho está, e o que a
# ideia contrária custa.
ampliacao: >
  A chamada de devolução leva um endereço, e nada mais. Você escreve
  free e o número do lote; não há segundo argumento, não há tamanho, não
  há contagem de elementos. A forma da chamada é a mesma para um lote de
  um byte e para um de mil.

  O tamanho existe, e quem o guarda é o alocador. Quando ele atendeu o
  seu pedido, anotou nas contas dele quanto havia entregado naquele
  endereço — e é dessas contas que ele lê na hora de receber o lote de
  volta. Essas anotações não são suas, não estão no seu ponteiro, e não
  há como consultá-las pelo programa.

  Por isso a conta do tamanho continua sendo sua. Se o seu programa
  precisa saber quantos elementos há num bloco, essa informação tem de
  ser guardada por você, numa variável ao lado. O ponteiro traz o
  endereço e o tipo de um elemento; quantos elementos cabem lá é coisa
  que ele nunca carregou, e quem conta com isso descobre tarde.


# O exemplo que já está no domínio, repetido para quem revisa. NÃO MUDA.
exemplo: |
  int *p = malloc(100);
  free(p);        /* nao se diz o tamanho de novo */


# O CASO RESOLVIDO: dois tamanhos, uma forma de chamada.
caso_resolvido:
  - prosa: "Vamos resolver um junto."
  - codigo: |
      char *pequeno = malloc(1);
      char *grande = malloc(1000);
      char *depois = NULL;

      if (pequeno == NULL || grande == NULL) {
          return 1;
      }
      *pequeno = 'a';
      grande[999] = 'z';
      free(pequeno);
      free(grande);
      depois = malloc(1);
      if (depois == NULL) {
          return 1;
      }
      *depois = 'd';
      printf("as duas devolucoes disseram so o endereco, e o alocador seguiu bem? %d\n",
             depois != NULL);
      printf("e o lote novo funciona: %c\n", *depois);
      free(depois);
  - prosa: "Pergunta: um lote tem mil vezes o tamanho do outro. Como as duas devoluções podem ser escritas igual?"
  - prosa: >
      Porque o que elas dizem é o endereço, e endereço não tem tamanho.
      Cada uma aponta o lote que está voltando, e quem sabe o tamanho
      daquele lote é quem o entregou. Se faltasse informação na chamada,
      faltaria no lote grande — e o pedido seguinte foi atendido sem
      tropeço.
  - prosa: "A máquina confirma:"
  - saida: |
      as duas devolucoes disseram so o endereco, e o alocador seguiu bem? 1
      e o lote novo funciona: d
  - prosa: >
      O alocador continuou de pé e entregou mais um lote, utilizável. É
      o que se pode observar de fora: as duas devoluções bastaram. Como
      ele descobre o tamanho por dentro é assunto dele, e não é o que a
      premissa afirma.


# A OUTRA ROTA: devolver pela cópia.
reexplicacao:
  - prosa: >
      Outro caminho. Guarde o endereço numa segunda variável e devolva o
      lote por ela.
  - codigo: |
      int *p = malloc(sizeof(int));
      int *copia = NULL;
      int *novo = NULL;

      if (p == NULL) {
          return 1;
      }
      *p = 7;
      copia = p;
      free(copia);
      novo = malloc(sizeof(int));
      if (novo == NULL) {
          return 1;
      }
      *novo = 1;
      printf("devolvi pela copia, e o alocador aceitou: o lote seguinte veio? %d\n",
             novo != NULL);
      printf("e ele e utilizavel: %d\n", *novo);
      free(novo);
  - prosa: >
      A devolução foi feita pela segunda variável, e foi uma só. O lote
      saiu do seu nome do mesmo jeito, porque o que a chamada levou foi o
      endereço — e o endereço estava nas duas.
  - prosa: "A máquina confirma:"
  - saida: |
      devolvi pela copia, e o alocador aceitou: o lote seguinte veio? 1
      e ele e utilizavel: 1
  - prosa: >
      Deu no mesmo. Se a devolução precisasse de algo que só o primeiro
      ponteiro tivesse, essa linha não funcionaria — e funcionou, porque
      não há nada no primeiro que o segundo não tenha. O que atravessa é
      o endereço, e é só isso que o free pede.
