# Material de ensino do B1 do kc_09 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 12/11/2026. O kc_09 tem ampliação VAZIA nos oito nós,
# e é o QUARTO e último tópico-piloto: `pilot: true`, último da sequência
# de coleta (kc_02, kc_07, kc_11, kc_09). Com ele, os quatro tópicos que
# a coleta usa ficam com material completo.
#
# UMA PENDÊNCIA DO CABEÇALHO DESTE GRAFO JÁ CAIU: ele diz que "o kc_08
# (alocação dinâmica) ainda NÃO existe". Existe desde 12/11/2026, com os
# seis cartões assinados. O comentário está velho e é consertado no mesmo
# commit que este material.
#
# ---------------------------------------------------------------------
# A CRENÇA
#
# `pointer_knows_block_size` — "o ponteiro carrega o tamanho do bloco
# que ele aponta". Grade `L`, FAQ comp.lang.c 7.26, que pergunta como o
# free sabe quantos bytes devolver, e responde que a implementação de
# malloc guarda o tamanho de cada bloco ao alocá-lo, e por isso não é
# preciso lembrá-la do tamanho ao liberar.
#
# A PERGUNTA EXISTIR É A EVIDÊNCIA: quem a faz supõe que o tamanho viaja
# com o ponteiro. A resposta diz onde ele viaja de verdade — nas contas
# do alocador, que são dele e não suas.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES
#
#   caso resolvido   Dois lotes de tamanhos muito diferentes, devolvidos
#                    por chamadas de forma IDÊNTICA, e o alocador segue
#                    inteiro depois.
#   outra rota       A devolução feita pela CÓPIA do ponteiro: o que o
#                    free precisava era o endereço, e a cópia o tem.
#
# O CASO RESOLVIDO MOSTRA A SUFICIÊNCIA DO ENDEREÇO. Um lote de um byte
# e um de mil, e as duas linhas de devolução são da mesma forma — nenhuma
# diz tamanho. Se faltasse informação, faltaria justamente no lote grande,
# e o que se vê é o alocador atendendo um pedido novo depois dos dois.
#
# E ELE NÃO AFIRMA COMO O free DESCOBRE O TAMANHO. Isso é implementação,
# e a premissa não fala disso: ela fala do que a CHAMADA carrega. Afirmar
# o mecanismo interno seria dizer sobre esta biblioteca o que o padrão
# não garante.
#
# A OUTRA ROTA É A PROVA PELA CÓPIA, e ela prepara o `B2`: se o que basta
# é o endereço, qualquer ponteiro que o guarde serve para devolver. É
# legítimo e é uma só devolução — o lote é devolvido uma vez, pela cópia,
# e o original não é devolvido depois.
#
# NENHUMA DAS DUAS LÊ PONTEIRO DEPOIS DO free. Neste tópico essa é a
# regra que manda: depois do free, o valor de p é indeterminado, e lê-lo
# é o comportamento indefinido que o tópico ensina a não cometer. Todo
# material do kc_09 obedece, e os nós em que isso é mais apertado —
# `B4`, `I2` e `I4` — dizem no cabeçalho como contornaram.
#
# O QUE FICA FORA
#
#   o que free(p) recebe                  -> `ciu_kc09_001`
#   como free sabe quantos bytes devolver -> `ciu_kc09_t01`
#   `sizeof p` e os dez ints pedidos      -> `ciu_kc09_002`
#   `sizeof p / sizeof p[0]` numa função  -> `ciu_kc09_t02`
#   `sizeof v` contra `sizeof p`          -> `ciu_kc09_003`, degrau 3
#   o que free soube e você não disse     -> `ciu_kc09_t03`
#
# QUATRO DOS SEIS GIRAM EM TORNO DE `sizeof`, e nenhuma das duas
# demonstrações o usa: elas comparam TAMANHOS DE PEDIDO entre si — um
# byte contra mil — e observam o alocador continuar funcionando. É a
# mesma matéria por um caminho que os itens não usam.
#
# NARRAÇÃO: não entra.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): compilam sem um aviso, e
# as saídas abaixo estão transcritas da execução.

topico: kc_09
node: kc09:B1
premissa: "free recebe o endereço do bloco, e só isso."
crenca_que_nega: pointer_knows_block_size

gerado_por: Claude Opus 5, 12/11/2026
revisado_por: Rafael H. S. Simao
