# Material de ensino do I1 do kc_05 — candidato, NÃO é domínio.
#
# PRIMEIRA VERSÃO, 12/11/2026. Primeiro nó de inferência: suporte em
# `B1`, e a refutação percorre B1 -> I1.
#
# E A DERIVAÇÃO VEM DO B1 EM UMA LINHA: se o nulo é um valor guardado
# dentro de p, então compará-lo é ler a caixa de p. Ler uma caixa é
# ler uma caixa — nenhuma viagem acontece.
#
# ---------------------------------------------------------------------
# A CRENÇA
#
# `pointer_is_just_a_name` — "p é só outro nome da variável apontada:
# olhar p é olhar o que está lá". Grade `T`, Sorva (2012), p. 362,
# item 64 (Sorva 2008; Ma 2007). A mesma crença nega nós no kc_04 e no
# kc_10.
#
# E AQUI ELA TEM CONSEQUÊNCIA PRÁTICA GRAVE: quem acha que olhar p é
# olhar o apontado não vê diferença entre `p == NULL` e `*p == 0` — e a
# segunda, com p nulo, é o erro que o tópico inteiro existe para
# evitar.
#
# ---------------------------------------------------------------------
# AS DUAS DEMONSTRAÇÕES
#
#   caso resolvido   O MESMO teste respondendo coisas diferentes
#                    conforme o que está em p, com p nulo na primeira
#                    vez — e o programa seguindo.
#   outra rota       Dois ponteiros comparados ENTRE SI: a comparação
#                    lê as duas caixas, e nenhum dos apontados é
#                    visitado.
#
# O CASO RESOLVIDO COMEÇA COM p NULO de propósito, e essa é a parte que
# prova. Se a comparação fosse até o apontado, ela não poderia nem
# acontecer ali — não há apontado. Ela acontece, responde, e o programa
# continua.
#
# A OUTRA ROTA TIRA O NULO DE CENA para mostrar que a regra é sobre
# COMPARAR, e não sobre o nulo: dois ponteiros legítimos comparados
# entre si também não visitam nada.
#
# O QUE FICA FORA
#
#   `if (*p == 0)` com p nulo       -> `ciu_kc05_011`
#   `p == NULL` contra `*p == 0`    -> `ciu_kc05_012`, degrau 3
#   `printf("%d", p == NULL)`       -> `ciu_kc05_t11`
#   a ordem do `&&`                 -> `ciu_kc05_t12`
#
# NENHUMA DAS DUAS ESCREVE `*p` COM p NULO. Dois itens deste nó o
# fazem, e eles podem: item mostra código e pergunta, e não executa. Um
# cartão que o exibisse como demonstração estaria ensinando pela forma
# o contrário do que diz.
#
# NARRAÇÃO: não entra.
#
# CONFERIDO PELO ORÁCULO (gcc -std=c17 -Wall): as saídas abaixo estão
# transcritas da execução.

topico: kc_05
node: kc05:I1
premissa: "p == NULL olha o que está dentro de p, e não vai a lugar nenhum."
crenca_que_nega: pointer_is_just_a_name

gerado_por: Claude Opus 5, 12/11/2026
revisado_por: Rafael H. S. Simao
revisado_sha: 85254390a06f


# A AMPLIAÇÃO. O primeiro parágrafo é a DERIVAÇÃO do B1.
ampliacao: >
  Isto não é regra nova: é o B1 usado. Se o nulo é um valor guardado
  dentro de p, então perguntar se p é nulo é ler o que está dentro de
  p. A pergunta se resolve na caixa do ponteiro, e termina ali.

  Por isso ela é segura com p nulo. Não há viagem nenhuma: o programa
  compara dois valores — o que está em p e o nulo — e responde sim ou
  não. É a mesma coisa que comparar dois números, e comparar números
  não visita lugar nenhum.

  E é isso que separa duas linhas parecidas. p == NULL lê a caixa do
  ponteiro; *p == 0 manda viajar até o apontado e ler o que há lá. Com
  p nulo, a primeira responde e a segunda não tem para onde ir — e a
  diferença entre elas é uma estrela.


# O exemplo que já está no domínio, repetido para quem revisa. NÃO MUDA.
exemplo: |
  int *p = NULL;
  if (p == NULL)   /* le p, e nao vai a lugar nenhum */
      ;


# O CASO RESOLVIDO: o mesmo teste, duas respostas.
caso_resolvido:
  - prosa: "Vamos resolver um junto."
  - codigo: |
      int x = 7;
      int *p = NULL;

      printf("com p nulo, o teste responde %d\n", p == NULL);
      p = &x;
      printf("com p apontando, responde %d\n", p == NULL);
      printf("o que mudou foi p; x segue valendo %d\n", x);
  - prosa: "Pergunta: a primeira comparação aconteceu com p nulo. Para onde ela foi?"
  - prosa: >
      Para lugar nenhum — e é por isso que ela pôde acontecer. Repare
      no que mudou entre as duas respostas: o conteúdo de p, e só. A
      resposta depende do que está dentro da caixa do ponteiro, e a
      caixa do apontado não entra na conta.
  - prosa: "A máquina confirma:"
  - saida: |
      com p nulo, o teste responde 1
      com p apontando, responde 0
      o que mudou foi p; x segue valendo 7
  - prosa: >
      Se olhar p fosse olhar o apontado, a primeira linha não teria o
      que olhar: com p nulo não existe apontado. Ela respondeu, e o
      programa seguiu até o fim.


# A OUTRA ROTA: dois ponteiros comparados entre si.
reexplicacao:
  - prosa: >
      Outro caminho, sem nulo nenhum: compare dois ponteiros um com o
      outro.
  - codigo: |
      int x = 1, y = 2;
      int *p = &x;
      int *q = &x;

      printf("os dois com o mesmo endereco: %d\n", p == q);
      q = &y;
      printf("depois de q = &y: %d\n", p == q);
  - prosa: >
      Os dois apontam para o mesmo lugar e a comparação diz que sim.
      Depois um deles recebe outro endereço, e ela passa a dizer que
      não — sem que o conteúdo de x ou de y tenha sido consultado uma
      vez sequer.
  - prosa: "A máquina confirma:"
  - saida: |
      os dois com o mesmo endereco: 1
      depois de q = &y: 0
  - prosa: >
      A resposta mudou porque o conteúdo de uma das caixas de ponteiro
      mudou. Comparar ponteiros é comparar os números que eles guardam;
      o que há no fim do caminho não participa.
