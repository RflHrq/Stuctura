  formato: prever_saida
  tipo: codigo
  enunciado: Qual das duas saídas é previsível?
  codigo: 'static int g;

    void f(void) { int n; printf("%d %d\n", g, n); }'
  alternativas:
    a: 'A primeira: g é estática'
    b: 'As duas: C zera o que declara'
    c: 'A segunda: n vem em branco'
  gabarito: a
  crencas:
    b: declaration_zeroes
    c: uninitialized_is_null
  gerado_por: Claude Opus 5, por importacao em 2026-11-01
  revisado_por: ''
