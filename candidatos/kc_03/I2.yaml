- id: kc03_gi2_n2_2
  node: kc03:I2
  nivel: 2
  formato: prever_saida
  tipo: codigo
  enunciado: Qual das duas comparações dá uma resposta em que se pode confiar?
  codigo: 'int *p;

    int *q = NULL;

    printf("%d %d\n", p == NULL, q == NULL);'
  alternativas:
    a: 'A segunda: você escreveu o NULL'
    b: 'As duas: p também começa em NULL'
    c: 'As duas: C zera tudo que declara'
  gabarito: a
  crencas:
    b: uninitialized_is_null
    c: declaration_zeroes
  gerado_por: Claude Opus 5, por importacao em 2026-11-01
  revisado_por: ''
  por_que_este_distrator: O par p/q separa o NULL escrito do NULL suposto. b é a
    crença do nó; c traz o vizinho B3.
- id: kc03_gi2_n3_3
  node: kc03:I2
  nivel: 3
  formato: achar_o_erro
  tipo: codigo
  enunciado: Por que o = NULL da segunda linha não é enfeite?
  codigo: "int *acha(int v) {\n    int *r = NULL;\n    if (v > 0) r = malloc(sizeof(int));\n\
    \    return r;\n}"
  alternativas:
    a: Sem ele, r voltaria com lixo
    b: 'É enfeite: r já nasce NULL'
    c: 'É enfeite: r já nasce em zero'
  gabarito: a
  crencas:
    b: uninitialized_is_null
    c: declaration_zeroes
  gerado_por: Claude Opus 5, por importacao em 2026-11-01
  revisado_por: ''
  por_que_este_distrator: b é a crença do nó; c traz o vizinho B3. O item mede a
    premissa pela utilidade de uma linha que só faz sentido se a crença for falsa.
