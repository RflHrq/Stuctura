  formato: comparar_casos
  tipo: teorica
  enunciado: 'Dois papéis dentro da casa nova: um em branco, outro com o rabisco
    do morador anterior. Qual é o seu?'
  codigo: ''
  alternativas:
    a: O do rabisco
    b: O em branco
    c: Os dois, dependendo do dia
  gabarito: a
  crencas:
    b: uninitialized_is_null
    c: declaration_zeroes
  gerado_por: Claude Opus 5, por importacao em 2026-11-01
  revisado_por: ''
