  tipo: codigo
  enunciado: Qual é a primeira linha inválida, e por quê?
  codigo: 'int *p;

    int x = 5;

    if (*p == 0) p = &x;'
  alternativas:
    a: 'A terceira: *p sem p ter endereço'
    b: 'Nenhuma: o if só lê, não escreve'
    c: 'A terceira: faltou zerar p antes'
