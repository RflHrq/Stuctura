# Configuração do ESTUDO, não do domínio.
#
# O que está aqui não descreve ponteiros em C: descreve como o piloto de
# outubro usa o domínio. Fica fora de domain/c_pointers/ de propósito —
# aqueles quatro arquivos são gerados e versionados como conteúdo, e
# congelados no início da coleta (§15). Este muda com o desenho do estudo.

# Recorte do piloto (§4.1 do dossiê): os de melhor ancoragem, cobrindo os
# dois regimes (KC 7 exige diagrama; 11 e 9 são socrático puro), em 30-40 min.
pilot_sequence: [kc_07, kc_11, kc_09]

# RF10, nomeação tardia. Termos que só podem aparecer no nó de conclusão
# do seu KC — nunca num nó intermediário, numa pergunta socrática ou num
# enunciado de CIU. O validador confere.
#
# A lista vive aqui, e não no domínio, porque é uma regra de apresentação
# do experimento: o mesmo grafo poderia ser usado sem nomeação tardia.
late_named_terms:
  - dangling

# Como apresentar um nó cujo texto JÁ contém o termo, antes da conclusão.
#
# Dois nós do domínio carregam "dangling" no próprio enunciado — kc_09:I4
# e kc_12:I3 — e o traversal os apresenta como pergunta socrática. Sem
# substituição, o aluno leria o nome técnico antes de construir a
# conclusão, que é exatamente o que RF10 proíbe.
#
# A substituição é aplicada da frase mais longa para a mais curta. O texto
# original permanece intocado no YAML do domínio: isto é apresentação.
#
# ALTERNATIVA A CONSIDERAR: reescrever os dois enunciados no domínio para
# não conterem o termo, e deixar o nome só em `reveal_names`. Seria mais
# limpo — a substituição existe porque o domínio hoje precisa dela.
late_name_substitutions:
  "dangling pointer": "um ponteiro invalido"
  "dangling": "um ponteiro invalido"

# O termo revelado na CONCLUSÃO de cada KC (RF10). Vive aqui, e não no
# domínio, porque é regra de apresentação do experimento: o mesmo grafo
# poderia ser usado sem nomeação tardia.
reveal_names:
  kc_09: "dangling pointer"
  kc_12: "dangling pointer por escopo"

# Limite de tentativas por nó antes de encerrar o KC como "em progresso"
# (§6, §7.4). Sem essa guarda, um aluno travado entra em laço.
max_attempts_per_node: 3

# Política da fase de diagnóstico (§6).
#
#   all                  apresenta TODAS as diagnósticas do KC, até o teto,
#                        mesmo depois de detectar uma crença
#   until_misconception  para na primeira crença detectada
#
# O padrão é `all` porque o desfecho PRIMÁRIO do estudo é a validação da
# Q-matrix, e ela precisa da resposta a cada item. Parar cedo economizaria
# minutos e custaria dados de distrator — exatamente o que o piloto existe
# para coletar. Os dois braços usam a mesma política, então a escolha não
# ameaça a comparação A/B; ela decide quanto dado por participante.
diagnostic_policy: all
max_diagnostics_per_kc: 3

# Experiência prévia declarada (§4.3).
#
# É a variável de ESTRATIFICAÇÃO da alocação aleatória. Sem coletá-la, a
# estratificação não pode ser conferida na análise: fica-se com dois
# grupos que se supõe equilibrados, sem dado para mostrar que estão.
#
# As opções são instrumento; ajuste à realidade da UFV–CRP.
prior_c_options:
  - "nunca programei em C"
  - "cursei uma disciplina com C"
  - "estou cursando agora"
  - "uso C fora da disciplina"

# Texto do consentimento apresentado antes de qualquer coleta.
#
# O banco tem `consent_at NOT NULL` desde o §5.1, mas até aqui o carimbo
# era gravado quando o participante apenas digitava um código. Um banco
# que afirma consentimento sem que ele tenha sido dado é pior do que um
# que não o registra.
consent_text: >-
  Concordo em participar. Entendo que minhas respostas serão registradas
  de forma anônima, identificadas apenas pelo código acima, e usadas na
  pesquisa. Posso interromper a qualquer momento, sem justificativa.

# Ordem das alternativas.
#
# No catálogo, a alternativa correta é a PRIMEIRA nas 40 CIUs de escolha.
# Sem embaralhar, um participante que perceba isso acerta tudo sem ler — e
# a validação da Q-matrix, que é o desfecho primário, mede outra coisa.
#
# O embaralhamento é DETERMINÍSTICO por (sessão, atividade), não sorteado a
# cada apresentação:
#
#   - participantes diferentes veem ordens diferentes, então some o viés
#     de posição;
#   - o MESMO participante, ao retomar depois de fechar a aba, vê a MESMA
#     ordem — se fosse sorteado de novo, o `option_idx` já gravado passaria
#     a apontar para outra alternativa e o dado se corromperia em silêncio;
#   - o motor continua determinístico (RNF02): a ordem é função das
#     entradas, não de um gerador com estado.
shuffle_options: true

# Escala de confiança declarada (RF02, RF04). Só o primeiro valor tem
# efeito no §7.3: errar com ele marca a premissa ausente, não errada.
confidence_scale: [chutei, "acho que sei", "tenho certeza"]
