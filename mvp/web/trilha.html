<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structura — trilha</title>
<link rel="icon" type="image/svg+xml" href="/web/marca.svg?v=20261116">
<!-- Assets versionados, sempre: a porta 8010 já serviu outras páginas, e
     o navegador guarda as antigas. mvp/test_trilha_telas.py confere.
     O script do tema vem antes das folhas e sem defer: escolhe o tema
     antes de a página ser desenhada, e ela não pisca ao abrir. A folha
     do tema vem por último, porque só redefine o que as outras usam. -->
<script src="/web/tema.js?v=20261116"></script>
<link rel="stylesheet" href="/web/style.css?v=20261116">
<link rel="stylesheet" href="/web/trilha.css?v=20261116">
<link rel="stylesheet" href="/web/tema.css?v=20261116">
</head>
<body>

<header class="topo t-topo">
  <!-- O logo B (o S que é um ponteiro) leva de volta aos tópicos. As
       cores de verdade vêm do tema (tema.css); as daqui são a reserva. -->
  <a class="t-marca" id="lnk-topicos" href="/"
     aria-label="Structura — voltar aos tópicos">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
      <rect class="m-fundo" width="32" height="32" rx="8" fill="#1f5668"/>
      <path class="m-traco" d="M22 9 C 19 6, 10 6, 10 12 C 10 17, 22 15, 22 21 C 22 25, 16 26, 13 25"
            fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <rect class="m-caixa" x="5" y="23" width="7" height="6" rx="1.5" fill="#f2a541"/>
    </svg>
  </a>
  <!-- O nome do tópico chega de /saude, uma vez, ao abrir. -->
  <span class="t-topico" id="topico-nome"></span>
  <!-- Uma parada por ideia do tópico. O servidor manda o estado de cada
       uma a cada resposta. -->
  <ol class="t-progresso" id="progresso" aria-label="Ideias deste tópico"></ol>
  <!-- tema.js liga este botão quando a página termina de chegar. -->
  <button class="btn-topo" id="btn-tema" type="button" aria-pressed="false"><span
    class="t-btn-icone" aria-hidden="true">◐</span><span
    class="t-btn-texto">Tema escuro</span></button>
  <!-- Em tela estreita os dois botões ficam só com o desenho: o kc_09 tem
       8 ideias, e com o texto o topo não caberia em 360 px. -->
  <button class="btn-topo" id="btn-ajustes" type="button"
          aria-expanded="false" aria-controls="ajustes" hidden><span
    class="t-btn-icone" aria-hidden="true">&#9881;&#xFE0E;</span><span
    class="t-btn-texto">Ajustes</span></button>
</header>

<!-- O ritmo, que a pessoa troca quando quiser. A troca vale a partir da
     ideia seguinte. A escolha de começar pelos passos saiu daqui e da
     entrada: toda ideia abre com a pergunta de diagnóstico. -->
<section class="t-ajustes oculto" id="ajustes" aria-label="Ajustes da sessão">
  <div class="t-ajuste">
    <span class="etiqueta">Ritmo</span>
    <div class="confianca" id="ajuste-ritmo"></div>
  </div>
  <p class="aviso">A troca vale a partir da próxima ideia.</p>
</section>

<main class="palco" id="palco"></main>

<!-- A sessão que o servidor não conhece mais: ele reiniciou com a página
     aberta. Uma mensagem e um botão, e não uma tela em branco. -->
<section class="palco oculto" id="perdida">
  <div class="cartao">
    <h2>Esta sessão não existe mais</h2>
    <p id="perdida-texto">O servidor foi reiniciado, e a sessão que estava
    aberta aqui se perdeu. Dá para começar de novo.</p>
    <button class="btn" id="btn-recomecar" type="button">Recomeçar</button>
  </div>
</section>

<!-- A explicação, por cima do que estiver na tela. -->
<div class="t-fundo oculto" id="painel" role="dialog" aria-modal="true"
     aria-labelledby="painel-titulo">
  <section class="t-painel cartao">
    <p class="etiqueta" id="painel-titulo">A explicação desta ideia</p>
    <div id="painel-corpo"></div>
    <button class="btn" id="btn-fechar-painel" type="button">Voltar</button>
  </section>
</div>

<div class="t-aviso oculto" id="aviso" role="status" aria-live="polite"></div>

<script src="/web/figuras.js?v=20261116"></script>
<script src="/web/realce.js?v=20261116"></script>
<script src="/web/progresso.js?v=20261116"></script>
<script src="/web/cena.js?v=20261116"></script>
<script src="/web/trilha.js?v=20261116"></script>
</body>
</html>
