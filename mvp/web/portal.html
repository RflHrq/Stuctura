<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structura — os tópicos</title>
<link rel="stylesheet" href="/web/style.css?v=20261112">
<style>
  .portal { max-width: 760px; margin: 0 auto; padding: 28px 20px 56px; }
  .portal h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .portal .sub { color: var(--tinta2); margin: 0 0 22px; line-height: 1.5; }
  .codigo-linha { display: flex; gap: 10px; align-items: center;
                  flex-wrap: wrap; margin: 0 0 8px; }
  .codigo-linha label { font-weight: 600; }
  .codigo-linha input { font: inherit; padding: 8px 10px; width: 9.5em;
                        border: 1px solid var(--linha2); border-radius: 8px;
                        background: var(--cartao); color: var(--tinta); }
  .codigo-nota { color: var(--tinta2); font-size: .9rem; margin: 0 0 24px;
                 min-height: 1.3em; }
  .codigo-nota.erro { color: var(--erro); }
  #lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  #lista a { display: grid; grid-template-columns: 3.2em 1fr auto;
             gap: 12px; align-items: center; padding: 14px 16px;
             background: var(--cartao); border: 1px solid var(--linha);
             border-radius: 12px; color: var(--tinta); text-decoration: none; }
  #lista a:hover, #lista a:focus-visible { border-color: var(--acento);
             outline: none; }
  .num { font-variant-numeric: tabular-nums; color: var(--tinta2);
         font-weight: 600; }
  .titulo { font-weight: 600; }
  .meta { display: block; color: var(--tinta2); font-size: .88rem;
          font-weight: 400; margin-top: 2px; }
  .marcas { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .marca { font-size: .78rem; padding: 3px 8px; border-radius: 999px;
           white-space: nowrap; }
  .marca.piloto { background: var(--acento-fundo); color: var(--acento); }
  .marca.aberto { background: var(--ok-fundo); color: var(--ok); }
  .falha { color: var(--erro); }
</style>
</head>
<body>
<main class="portal">
  <h1>Structura</h1>
  <p class="sub">Treze tópicos sobre ponteiros em C. Escolha um para entrar;
    ao terminar, volte aqui e entre no próximo.</p>

  <div class="codigo-linha">
    <label for="codigo">Código do participante</label>
    <input id="codigo" autocomplete="off" spellcheck="false"
           placeholder="opcional" maxlength="16">
  </div>
  <p class="codigo-nota" id="nota">Sem código, a sessão sai anônima. Com
    código, o mesmo código vale uma vez em cada tópico.</p>

  <ol id="lista" aria-label="Tópicos"></ol>
</main>

<script>
(function () {
  "use strict";
  var FORMATO = /^[A-Za-z][A-Za-z0-9_-]{0,15}$/;
  var campo = document.getElementById("codigo");
  var nota = document.getElementById("nota");
  var lista = document.getElementById("lista");
  var NOTA_PADRAO = nota.textContent;

  function guardado(chave) {
    try { return window.localStorage.getItem(chave) || ""; }
    catch (e) { return ""; }
  }
  function guarda(chave, valor) {
    try { window.localStorage.setItem(chave, valor); } catch (e) { /* sem armazenamento, segue */ }
  }

  campo.value = guardado("structura-codigo");

  function codigoValido() {
    var c = campo.value.trim();
    if (!c) { nota.textContent = NOTA_PADRAO; nota.className = "codigo-nota"; return ""; }
    if (!FORMATO.test(c)) {
      nota.textContent = "Código fora do formato: uma letra, depois letras, números, hífen ou _, até 16.";
      nota.className = "codigo-nota erro";
      return null;
    }
    nota.textContent = NOTA_PADRAO; nota.className = "codigo-nota";
    return c;
  }
  campo.addEventListener("input", function () {
    codigoValido();
    guarda("structura-codigo", campo.value.trim());
  });

  function abertos() {
    try { return JSON.parse(guardado("structura-abertos") || "{}"); }
    catch (e) { return {}; }
  }

  function desenha(topicos) {
    var ja = abertos();
    lista.textContent = "";
    topicos.forEach(function (t, i) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = t.caminho;

      var num = document.createElement("span");
      num.className = "num";
      num.textContent = (i < 10 ? "0" : "") + i;

      var meio = document.createElement("span");
      meio.className = "titulo";
      meio.textContent = t.titulo;
      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = t.nos + " ideias · " + t.atividades + " atividades";
      meio.appendChild(meta);

      var marcas = document.createElement("span");
      marcas.className = "marcas";
      if (t.piloto) {
        var p = document.createElement("span");
        p.className = "marca piloto"; p.textContent = "piloto";
        marcas.appendChild(p);
      }
      if (ja[t.id]) {
        var v = document.createElement("span");
        v.className = "marca aberto"; v.textContent = "já aberto";
        marcas.appendChild(v);
      }

      a.appendChild(num); a.appendChild(meio); a.appendChild(marcas);
      a.addEventListener("click", function (ev) {
        var c = codigoValido();
        if (c === null) { ev.preventDefault(); campo.focus(); return; }
        var marcados = abertos(); marcados[t.id] = true;
        guarda("structura-abertos", JSON.stringify(marcados));
        if (c) { ev.preventDefault(); window.location.href = t.caminho + "?codigo=" + encodeURIComponent(c); }
      });
      li.appendChild(a);
      lista.appendChild(li);
    });
  }

  fetch("/topicos").then(function (r) { return r.json(); }).then(function (j) {
    desenha(j.topicos || []);
  }).catch(function (e) {
    var li = document.createElement("li");
    li.className = "falha";
    li.textContent = "Não consegui carregar a lista de tópicos: " + e.message;
    lista.appendChild(li);
  });
})();
</script>
</body>
</html>
