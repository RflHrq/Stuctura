# Banco de atividades — kc_11, "aritmética de ponteiros" · PILOTO
#
# Seis nós, sete itens cada: 42. Um de entrada (o degrau mais baixo, na
# analogia), três de diagnóstico (um por degrau, com o par teórica +
# código) e três de treino.
#
# REGRA DE DISTRATOR (motor.razoes_de): as razões da camada 2 saem das
# ALTERNATIVAS DO PRÓPRIO ITEM. Em todo item, um distrator aponta a crença
# do próprio nó — senão o nó nunca recebe atribuição — e outro a de um
# vizinho. A crença do próprio nó abre a cédula (vem na alternativa `b`).
#
# DUAS REGRAS A MAIS NESTE TÓPICO, as duas de piloto:
#
#   1. Nenhum item pede um número de bytes. "p + 1 anda 4 bytes" é
#      verdade nesta máquina e não no padrão, e quem acertasse por saber
#      o sizeof da máquina dele acertaria POR FORA da premissa. As
#      respostas falam em "uma caixa", "um elemento do tipo de p".
#      É a mesma regra do kc_07, e pela mesma razão.
#   2. Um item de diagnóstico — o ciu_kc11_017 — é o código LITERAL da
#      pergunta 4.4 do FAQ, que é a fonte da crença da conclusão. Fica
#      assim de propósito: é o enunciado em que a crença foi registrada
#      pela primeira vez, escrito por quem a tinha.

analogy: >
  Andar de casa em casa, não de passo em passo. Continua o quarteirão do
  kc_07, onde as casas são todas do mesmo tamanho. p + 1 não é "andar um
  metro": é "andar uma casa". Quem sabe o tamanho da casa é a planta — o
  tipo —, e a prefeitura já faz a conversão: você diz "avance uma casa" e
  ela converte em metros sozinha. Se você converter também, anda o dobro.
  ONDE QUEBRA: "andar" sugere caminho e distância percorrida, e não há —
  p + 1 não passa pelas casas do meio e não custa mais por andar mais
  longe. É cálculo, não caminhada. E a metáfora não diz nada sobre o que
  acontece se você passar do fim do quarteirão: aqui o ponto é a ESCALA da
  conta, não o limite dela.

resgates:

  B1: >
    Todo papel de ponteiro vem com a planta anexada: ele diz o tipo do que
    está no destino. Não existe ponteiro que seja só um número solto —
    e é dessa planta que sai o tamanho da casa.

  B2: >
    O tamanho de cada tipo é fixo, e está escrito na declaração. O
    compilador lê isso antes de o programa rodar: ninguém precisa descobrir
    o tamanho em execução, e o ponteiro não carrega essa informação.

  B3: >
    As casas do quarteirão ficam grudadas, uma logo depois da outra, sem
    buraco entre elas. É isso que faz a conta de andar funcionar: a
    próxima casa está exatamente a um tamanho de distância.

  I1: >
    Então a[i] e *(a + i) são a mesma coisa escrita de dois jeitos: ande i
    casas a partir do começo, e olhe o que tem lá. O índice não é uma
    operação especial do array — é a soma, com outra sintaxe.

  I2: >
    E se o papel não traz planta nenhuma, como no void *, não há tamanho
    de casa. Sem tamanho não há quanto andar, e a conta não existe: não é
    que ela dê errado, é que ela não está definida.

  I3: >
    Juntando: você diz "avance uma casa" e o compilador converte sozinho,
    porque ele conhece a planta. Multiplicar por sizeof na mão é fazer a
    conversão duas vezes — e o ponteiro pula longe demais.

exemplos:

  B1: |
    int  *p;     /* a planta diz: int  */
    char *c;     /* a planta diz: char */

  B2: |
    sizeof(int)     /* fixo, e sabido na compilacao */
    sizeof *p       /* funciona sem p ter valor */

  B3: |
    int v[3];
    &v[1] - &v[0]   /* 1: sao vizinhas */

  I1: |
    v[2]            /* e */
    *(v + 2)        /* sao a mesma coisa */

  I2: |
    void *q;
    q + 1           /* nao: sem tipo, sem escala */

  I3: |
    int *p = v;
    p + 1           /* anda uma caixa de int */
    p + 1 * sizeof(int)   /* anda longe demais */

