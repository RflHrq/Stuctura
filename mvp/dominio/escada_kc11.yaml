B3:
  revisao:
    frases:
      - "Os elementos de um array ficam grudados: notas[1] fica logo depois de notas[0], sem buraco."
      - "Por isso &notas[1] - &notas[0] é 1: uma caixa de distância."
    codigo: |
      int notas[3] = {7, 8, 9};

      printf("%d\n", &notas[1] - &notas[0] == 1);
    saida: "1"
  cena:
    atores:
      - {nome: notas, tipo: fileira, de: int, tamanho: 3}
    passos:
      - {linha: 1, faz: [{cria: notas}, {guarda: {em: notas, valor: [7, 8, 9]}}]}
      - {linha: 3, faz: [{diz: '&notas[1] - &notas[0] conta caixas, e não bytes: dá 1'}, {mostra: '1'}]}
  provas:
    - crenca: string_literal_is_array
      programa: |
        char s[] = "pai";
        char *t = "pai";

        s[0] = s[1];
        t[0] = t[1];
      previsao:
        pergunta: >
          s e t recebem o mesmo texto. As duas últimas linhas trocam a
          primeira letra de cada um. De qual delas o compilador reclama?
        opcoes:
          - "De nenhuma: s e t guardam o texto do mesmo jeito"
          - "Da última: as letras para onde t aponta não são de t"
        real: 1
        crenca: 0
      reclama: "write to string literal"
      avisos: "-fanalyzer"
      ambiente: >
        Mensagem do gcc 16.2 com o analisador de fluxo ligado
        (-fanalyzer). O programa não é executado: mudar uma letra do
        texto entre aspas é o que este degrau ensina a não fazer.
      afirma: >
        O compilador reclama só da última linha ("write to string
        literal"). s são quatro caixas de char, cópia do texto, e são de
        s. t é uma caixa só, um ponteiro para letras que não são dela: o
        mesmo texto, guardado de outro jeito.
