I1:
  revisao:
    frases:
      - "notas[2] é só outro jeito de escrever *(notas + 2): ande duas caixas a partir do começo e olhe lá."
      - "Como a soma vale nos dois sentidos, 2[notas] é a mesma caixa."
    codigo: |
      int notas[3] = {4, 5, 6};

      printf("%d\n", *(notas + 2));
    saida: "6"
  cena:
    atores:
      - {nome: notas, tipo: fileira, de: int, tamanho: 3}
    passos:
      - {linha: 1, faz: [{cria: notas}, {guarda: {em: notas, valor: [4, 5, 6]}}]}
      - {linha: 3, faz: [{diz: 'notas + 2 é o endereço da caixa [2]'}, {le: 'notas[2]'}, {mostra: '6'}]}
  # %c.
  fora_da_trilha: [ciu_kc11_t11]
  provas:
    - crenca: indice_nao_e_soma
      programa: |
        int notas[3] = {7, 8, 9};

        printf("%d\n", 2[notas]);
      previsao:
        pergunta: >
          O trecho escreve 2[notas], com o número fora dos colchetes. O que
          acontece?
        opcoes:
          - "O compilador reclama: o índice é uma operação do array, e 2 não é array"
          - "9"
        real: 1
        crenca: 0
      espera: "9"
      afirma: >
        Saiu 9. notas[2] é *(notas + 2), e a soma vale nos dois sentidos:
        2[notas] é *(2 + notas), a mesma caixa. O índice não é uma
        operação própria do array: é a soma escrita curta.
  degraus:
    - id: esc_kc11_I1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "notas[i] é, por definição, *(notas + i): ande i caixas a partir do começo e olhe o que tem lá."
        - "O colchete é a soma escrita curta."
      versoes:
        - pede: "O que notas[2] quer dizer?"
          antes: "int notas[3] = {7, 8, 9};"
          pecas:
            - "*(notas + 2): a caixa duas adiante do começo"
            - "Uma operação própria do array, e não a soma notas + 2"
            - "O endereço notas + 2"
          certa: [[0]]
          certa_texto: "*(notas + 2): a caixa duas adiante do começo"
          erros:
            - exata: [1]
              crenca: indice_nao_e_soma
              retorno: "O colchete não é uma operação à parte: notas[2] é, por definição, *(notas + 2). Ande duas caixas e olhe lá."
            - exata: [2]
              retorno: "notas + 2 é o endereço da caixa. notas[2] é o que está nela: *(notas + 2), com o * na frente."
          retorno_geral: "notas[2] é *(notas + 2): ande duas caixas a partir do começo e olhe lá."
        - pede: "O que pontos[1] quer dizer?"
          antes: "int pontos[3] = {3, 6, 9};"
          pecas:
            - "O endereço pontos + 1"
            - "Uma operação própria do array, e não a soma pontos + 1"
            - "*(pontos + 1): a caixa uma adiante do começo"
          certa: [[2]]
          certa_texto: "*(pontos + 1): a caixa uma adiante do começo"
          erros:
            - exata: [1]
              crenca: indice_nao_e_soma
              retorno: "O colchete não é uma operação à parte: pontos[1] é, por definição, *(pontos + 1). Ande uma caixa e olhe lá."
            - exata: [0]
              retorno: "pontos + 1 é o endereço da caixa. pontos[1] é o que está nela: *(pontos + 1), com o * na frente."
          retorno_geral: "pontos[1] é *(pontos + 1): ande uma caixa a partir do começo e olhe lá."

    - id: esc_kc11_I1_2
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Com um ponteiro vale o mesmo: p[1] é *(p + 1). A soma vem antes do *."
        - "E dá para andar para trás: *(p - 1) é a caixa de trás, que também se escreve p[-1]."
      versoes:
        - pede: "Complete para mostrar notas[1], escrito como soma."
          antes: |-
            int notas[3] = {7, 9, 4};
            int *p = notas;
          mostra: 'printf("%d\n", ___);'
          pecas: ["*(p + 1)", "*p + 1", "*(p + 2)"]
          certa: [[0]]
          certa_texto: 'printf("%d\n", *(p + 1));'
          erros:
            - exata: [1]
              retorno: "*p + 1 lê notas[0] e soma 1 ao valor: dá 8. Para chegar em notas[1], a soma vem antes do *: *(p + 1)."
            - exata: [2]
              retorno: "*(p + 2) anda duas caixas e chega em notas[2]. notas[1] fica uma caixa adiante: *(p + 1)."
          retorno_geral: "notas[1] escrito como soma é *(p + 1): a soma antes do *."
        - pede: "q aponta para pontos[2]. Complete para mostrar pontos[1], a caixa de trás."
          antes: |-
            int pontos[3] = {3, 5, 2};
            int *q = pontos + 2;
          mostra: 'printf("%d\n", ___);'
          pecas: ["*(q + 1)", "*(q - 1)", "*q - 1"]
          certa: [[1]]
          certa_texto: 'printf("%d\n", *(q - 1));'
          erros:
            - exata: [2]
              retorno: "*q - 1 lê pontos[2] e tira 1 do valor: dá 1. Para chegar na caixa de trás, a conta vem antes do *: *(q - 1)."
            - exata: [0]
              retorno: "*(q + 1) anda para a frente, e depois de pontos[2] o array acabou. A caixa de trás é *(q - 1)."
          retorno_geral: "A caixa de trás de pontos[2] é *(q - 1), que também se escreve q[-1]."

    - id: esc_kc11_I1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "A soma vale nos dois sentidos: pontos + 1 é 1 + pontos. Por isso 1[pontos] é a mesma caixa que pontos[1]."
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            int pontos[3] = {3, 6, 9};

            printf("%d\n", 1[pontos]);
          aceitas: ["6"]
          certa_texto: "6"
          erros:
            - texto: "3"
              retorno: "1[pontos] é *(1 + pontos): a caixa uma adiante do começo, pontos[1]. Sai 6."
            - texto: "1"
              retorno: "O 1 não é o valor: é quantas caixas andar. 1[pontos] é pontos[1]: 6."
          retorno_geral: "1[pontos] é *(1 + pontos), a mesma caixa que pontos[1]: 6."
        - pede: "Que número aparece?"
          mostra: |-
            int dias[4] = {10, 20, 30, 40};

            printf("%d\n", 3[dias]);
          aceitas: ["40"]
          certa_texto: "40"
          erros:
            - texto: "30"
              retorno: "3[dias] é *(3 + dias): três caixas adiante do começo, dias[3]. Sai 40."
            - texto: "3"
              retorno: "O 3 não é o valor: é quantas caixas andar. 3[dias] é dias[3]: 40."
          retorno_geral: "3[dias] é *(3 + dias), a mesma caixa que dias[3]: 40."

    - id: esc_kc11_I1_4
      nome: "O colchete é a soma escrita curta"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
