# A escada do kc_11 — aritmética de ponteiros.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI usa ponteiro, `&` e `*` desde o kc_04, já viu que o nome
# do array vira o endereço do primeiro elemento (kc_07), que um byte é o
# espaço de uma caixa de char e que `sizeof` mede um tipo (kc_08), e já
# conhece o `void *` e a conversão `*(int *)v` (kc_10). Falta a conta.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   p + 1, *(p + 1)          a caixa seguinte, pelo tipo         B1, degrau 3
#   sizeof *c                o tamanho do destino, sem rodar     B2, degrau 2
#   &notas[2] - &notas[0]    a distância entre duas caixas       B3, degrau 1
#   char *t = "pai"          o ponteiro para um texto alheio     B3, degrau 2
#   *(notas + 2), 2[notas]   o colchete é a soma                 I1, degraus 1 e 3
#   (char *)v + 1            dar um tipo antes de andar          I2, degrau 2
#   p + 2 * sizeof(int)      a escala feita duas vezes           I3, degrau 2
#
# AS PROVAS, e o que cada uma usa. Três são o que o compilador diz, e
# três são saídas:
#
#   B1  ponteiro é só um número  aceita p = &idade; e reclama de
#                                p = 1000;
#   B2  o tamanho vem com o      sizeof *c, com c num bloco de 10: 1
#       ponteiro
#   B3  char *t = "pai" e        o analisador reclama de mudar uma
#       char s[] = "pai" são     letra por t, e não por s
#       o mesmo
#   I1  o índice não é a soma    2[notas]: 9
#   I2  void * anda como os      aceita c + 1 e reclama de v + 1 (com
#       outros                   -Wpointer-arith; o gcc, sem ele, aceita
#                                por extensão própria)
#   I3  a conta é em bytes       *(p + 3), sem sizeof: 35
#
# Nenhuma prova nem passo de digitar depende do tamanho de um int: os
# números são de caixas, e o tamanho de um char é 1 em qualquer máquina.
#
# A CRENÇA DO B3. O catálogo liga ao B3 (os elementos ficam grudados) a
# crença string_literal_is_array: "char *s = "abc" e char s[] = "abc"
# guardam do mesmo jeito". A escada diz a diferença com as caixas do
# próprio B3: s são quatro caixas de char grudadas, que são de s; t é uma
# caixa só, um ponteiro para letras grudadas que não são de t.
#
# AS QUESTÕES DE MARCAR. Cinco das 36 questões de diagnóstico e de treino
# usam o que as escadas não ensinam — `struct`, `%c`, `for`, `double` e
# uma função de várias linhas — e estão em `fora_da_trilha`. A t15, a da
# função, dizia ainda que o compilador "recusa" void * + n, o que o gcc
# não faz; em 18/11/2026 ela foi reescrita para dizer o que o padrão não
# define, e segue fora pela função. O I3 perde a de código
# de degrau 2 (a 017, com `for`) e abre com a de degrau 3; todas as
# premissas abrem com questão de código.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Opus 5.5, em 18/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "Um ponteiro guarda um endereço, e a declaração diz o tipo do que está lá: int *p aponta para um int."
      - "Por isso o * lê um int inteiro, e p não aceita um número qualquer."
    codigo: |
      int idade = 15;
      int *p = &idade;

      printf("%d\n", *p + 1);
    saida: "16"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 1, faz: [{cria: idade}, {guarda: {em: idade, valor: 15}}]}
      - {linha: 2, faz: [{cria: p}, {aponta: {de: p, para: idade}}]}
      - {linha: 4, faz: [{segue: p}, {le: idade}, {diz: '*p + 1: primeiro segue o bilhete (15), depois soma 1'}, {mostra: '16'}]}
  provas:
    - crenca: pointer_is_integer
      programa: |
        int idade = 15;
        int *p;

        p = &idade;
        p = 1000;
      previsao:
        pergunta: >
          p é um int *. As duas últimas linhas guardam alguma coisa em p.
          De qual delas o compilador reclama?
        opcoes:
          - "De nenhuma: ponteiro é só um número, e 1000 é um número"
          - "Da última: 1000 é um int, e p quer um endereço de int"
        real: 1
        crenca: 0
      reclama: "makes pointer from integer without a cast"
      ambiente: >
        Mensagem do gcc 16.2. Nele a reclamação é um erro; em versões
        mais antigas, um aviso. Nos dois casos ele reclama da última
        linha, e só dela.
      afirma: >
        O compilador aceita p = &idade; e reclama de p = 1000;. Ponteiro
        não é um número qualquer: guarda um endereço e sabe o tipo do que
        está lá. 1000 é um int, e não o endereço de um int.
  degraus:
    - id: esc_kc11_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Um ponteiro guarda um endereço, e a declaração diz o tipo do que mora lá: é o que vem antes do *."
        - "Ponteiro não é um número solto."
      versoes:
        - pede: "O que a declaração int *p; diz sobre p?"
          antes: "int *p;"
          pecas:
            - "Que p guarda o endereço de um int"
            - "Nada além de um número: ponteiro é só um número inteiro, e dá para trocar um pelo outro"
            - "Que p guarda um int"
          certa: [[0]]
          certa_texto: "Que p guarda o endereço de um int"
          erros:
            - exata: [1]
              crenca: pointer_is_integer
              retorno: "Ponteiro não é um número solto: a declaração diz que p guarda o endereço de um int. É assim que o * sabe o que ler lá."
            - exata: [2]
              retorno: "Quem guarda um int é int x;. A estrela de int *p diz outra coisa: p guarda o ENDEREÇO de um int."
          retorno_geral: "int *p; diz que p guarda o endereço de um int: endereço, e com o tipo do destino."
        - pede: "O que a declaração char *c; diz sobre c?"
          antes: "char *c;"
          pecas:
            - "Que c guarda um char"
            - "Que c guarda o endereço de um char"
            - "Nada além de um número: ponteiro é só um número inteiro, e dá para trocar um pelo outro"
          certa: [[1]]
          certa_texto: "Que c guarda o endereço de um char"
          erros:
            - exata: [2]
              crenca: pointer_is_integer
              retorno: "Ponteiro não é um número solto: a declaração diz que c guarda o endereço de um char. É assim que o * sabe o que ler lá."
            - exata: [0]
              retorno: "Quem guarda um char é char x;. A estrela de char *c diz outra coisa: c guarda o ENDEREÇO de um char."
          retorno_geral: "char *c; diz que c guarda o endereço de um char: endereço, e com o tipo do destino."

    - id: esc_kc11_B1_2
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Por isso o compilador reclama de p = 1000;: 1000 é um int, e p quer o endereço de um int."
      versoes:
        - pede: "Complete com o que cabe em p."
          antes: |-
            int idade = 15;
            int *p;
          mostra: "p = ___;"
          pecas: ["&idade", "idade", "1000"]
          certa: [[0]]
          certa_texto: "p = &idade;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "idade guarda um número, e p quer um endereço: o compilador reclama. O endereço de idade é &idade."
            - exata: [2]
              invalida: true
              retorno: "1000 é um int, e não o endereço de um int: o compilador reclama. O que cabe em p é &idade."
          retorno_geral: "Em p cabe o endereço de um int: p = &idade;"
        - pede: "Complete com o que cabe em q."
          antes: |-
            int nota = 7;
            int *q;
          mostra: "q = ___;"
          pecas: ["500", "&nota", "nota"]
          certa: [[1]]
          certa_texto: "q = &nota;"
          erros:
            - exata: [2]
              invalida: true
              retorno: "nota guarda um número, e q quer um endereço: o compilador reclama. O endereço de nota é &nota."
            - exata: [0]
              invalida: true
              retorno: "500 é um int, e não o endereço de um int: o compilador reclama. O que cabe em q é &nota."
          retorno_geral: "Em q cabe o endereço de um int: q = &nota;"

    - id: esc_kc11_B1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "p + 1 é o endereço da caixa seguinte. Quanto andar, p sabe pelo tipo: uma caixa de int inteira."
      versoes:
        - pede: "p aponta para notas[0]. Que número aparece?"
          mostra: |-
            int notas[3] = {7, 8, 9};
            int *p = notas;

            printf("%d\n", *(p + 1));
          aceitas: ["8"]
          certa_texto: "8"
          erros:
            - texto: "7"
              retorno: "7 está em notas[0], onde p aponta. p + 1 é a caixa seguinte, e o * lê o que está nela: 8."
            - texto: "9"
              retorno: "9 está duas caixas adiante, em notas[2]. p + 1 anda uma caixa só: 8."
          retorno_geral: "p + 1 é a caixa seguinte a notas[0]: notas[1], que guarda 8."
        - pede: "q aponta para pontos[0]. Que número aparece?"
          mostra: |-
            int pontos[3] = {3, 6, 9};
            int *q = pontos;

            printf("%d\n", *(q + 1));
          aceitas: ["6"]
          certa_texto: "6"
          erros:
            - texto: "3"
              retorno: "3 está em pontos[0], onde q aponta. q + 1 é a caixa seguinte, e o * lê o que está nela: 6."
            - texto: "9"
              retorno: "9 está duas caixas adiante, em pontos[2]. q + 1 anda uma caixa só: 6."
          retorno_geral: "q + 1 é a caixa seguinte a pontos[0]: pontos[1], que guarda 6."

    - id: esc_kc11_B1_4
      nome: "Ponteiro guarda endereço, e não um número qualquer"
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int nota = 7;
            int *q;
          pecas: ["q = 7;", "q = &nota;", "q = nota;"]
          certa: [[1]]
          certa_texto: "q = &nota;"
          invalidas: [0, 2]
          erros:
            - exata: [0]
              retorno: "7 é um int, e q quer o endereço de um int: o compilador reclama. O que serve é &nota."
            - exata: [2]
              retorno: "nota guarda um número, e q guarda endereço: o compilador reclama. O endereço de nota é &nota."
          retorno_geral: "q guarda o endereço de um int: q = &nota;"
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int idade = 15;
            int *p;
          pecas: ["p = idade;", "p = 15;", "p = &idade;"]
          certa: [[2]]
          certa_texto: "p = &idade;"
          invalidas: [0, 1]
          erros:
            - exata: [1]
              retorno: "15 é um int, e p quer o endereço de um int: o compilador reclama. O que serve é &idade."
            - exata: [0]
              retorno: "idade guarda um número, e p guarda endereço: o compilador reclama. O endereço de idade é &idade."
          retorno_geral: "p guarda o endereço de um int: p = &idade;"

    - id: esc_kc11_B1_5
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            int dias[3] = {28, 30, 31};
            int *q = dias;

            printf("%d\n", *(q + 2));
          aceitas: ["31"]
          certa_texto: "31"
          erros:
            - texto: "28"
              retorno: "28 está em dias[0], onde q aponta. q + 2 anda duas caixas de int: dias[2], que guarda 31."
            - texto: "30"
              retorno: "30 está em dias[1], uma caixa adiante. q + 2 anda duas: 31."
          retorno_geral: "q + 2 fica duas caixas adiante de dias[0]: dias[2], que guarda 31."
        - pede: "Que número aparece?"
          mostra: |-
            int notas[3] = {5, 10, 15};
            int *p = notas;

            printf("%d\n", *(p + 1));
          aceitas: ["10"]
          certa_texto: "10"
          erros:
            - texto: "5"
              retorno: "5 está em notas[0], onde p aponta. p + 1 anda uma caixa de int: notas[1], que guarda 10."
            - texto: "15"
              retorno: "15 está duas caixas adiante, em notas[2]. p + 1 anda uma caixa só: 10."
          retorno_geral: "p + 1 é a caixa seguinte a notas[0]: notas[1], que guarda 10."

B2:
  revisao:
    frases:
      - "Cada tipo tem um tamanho fixo, e o compilador o conhece pela declaração, antes de o programa rodar."
      - "sizeof *c mede o tipo do destino de c: não precisa do bloco, nem de valor em c."
    codigo: |
      char letras[5] = "casa";
      char *c = letras;

      printf("%zu\n", sizeof *c);
    saida: "1"
  cena:
    atores:
      - {nome: letras, tipo: fileira, de: char, tamanho: 5}
      - {nome: c, tipo: ponteiro, de: char *}
    passos:
      - {linha: 1, faz: [{cria: letras}, {guarda: {em: letras, texto: casa}}]}
      - {linha: 2, faz: [{cria: c}, {aponta: {de: c, para: 'letras[0]'}}]}
      - {linha: 4, faz: [{diz: 'sizeof *c mede uma caixa de char: 1 byte'}, {mostra: '1'}]}
  # struct.
  fora_da_trilha: [ciu_kc11_t06]
  provas:
    - crenca: pointer_knows_block_size
      programa: |
        char *c = malloc(10);

        printf("%zu\n", sizeof *c);
        free(c);
      previsao:
        pergunta: >
          c recebe um bloco de dez chars. O trecho mostra sizeof *c. O que
          aparece?
        opcoes:
          - "1"
          - "10: o ponteiro traz o tamanho do bloco que recebeu"
        real: 0
        crenca: 1
      espera: "1"
      afirma: >
        Saiu 1. sizeof *c mede um char, o tipo que a declaração de c diz.
        O tamanho do bloco, c não carrega: o compilador respondeu pela
        declaração, sem olhar para o bloco.
  degraus:
    - id: esc_kc11_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O tamanho de um tipo é fixo: todo char ocupa 1 byte, e todo int ocupa o mesmo tanto, numa mesma máquina."
        - "E o tipo do que mora no endereço vem escrito na declaração do ponteiro."
      versoes:
        - pede: "Quando o compilador fica sabendo quanto ocupa a caixa para onde c aponta?"
          antes: "char *c;"
          pecas:
            - "Na declaração, antes de rodar: char *c diz que lá é um char"
            - "Em execução: o tamanho vem com o ponteiro, e não da declaração"
            - "Só depois que c recebe um bloco"
          certa: [[0]]
          certa_texto: "Na declaração, antes de rodar: char *c diz que lá é um char"
          erros:
            - exata: [1]
              crenca: pointer_knows_block_size
              retorno: "O ponteiro não traz tamanho nenhum: guarda um endereço. O tamanho do destino vem da declaração, char *c, e o compilador já o conhece antes de rodar."
            - exata: [2]
              retorno: "O bloco não muda o tipo: com bloco ou sem, char *c aponta para um char. O compilador sabe isso pela declaração."
          retorno_geral: "O tamanho do destino vem da declaração: char *c diz que lá é um char, antes de rodar."
        - pede: "Quando o compilador fica sabendo quanto ocupa a caixa para onde p aponta?"
          antes: "int *p;"
          pecas:
            - "Só depois que p recebe um bloco"
            - "Em execução: o tamanho vem com o ponteiro, e não da declaração"
            - "Na declaração, antes de rodar: int *p diz que lá é um int"
          certa: [[2]]
          certa_texto: "Na declaração, antes de rodar: int *p diz que lá é um int"
          erros:
            - exata: [1]
              crenca: pointer_knows_block_size
              retorno: "O ponteiro não traz tamanho nenhum: guarda um endereço. O tamanho do destino vem da declaração, int *p, e o compilador já o conhece antes de rodar."
            - exata: [0]
              retorno: "O bloco não muda o tipo: com bloco ou sem, int *p aponta para um int. O compilador sabe isso pela declaração."
          retorno_geral: "O tamanho do destino vem da declaração: int *p diz que lá é um int, antes de rodar."

    - id: esc_kc11_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "sizeof *c mede a caixa do destino de c. O compilador responde só pelo tipo, sem olhar o que há em c."
      versoes:
        - pede: "c ainda não recebeu valor. Que número aparece?"
          mostra: |-
            char *c;

            printf("%zu\n", sizeof *c);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "0"
              retorno: "c não recebeu valor, mas sizeof não precisa dele: mede o tipo do destino, um char. Sai 1."
          retorno_geral: "sizeof *c mede um char, pelo tipo da declaração: 1."
        - pede: "c aponta para letras, que tem vinte caixas. Que número aparece?"
          mostra: |-
            char letras[20];
            char *c = letras;

            printf("%zu\n", sizeof *c);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "20"
              retorno: "letras tem vinte caixas, mas c não guarda esse tamanho. sizeof *c mede o tipo do destino, um char: 1."
          retorno_geral: "sizeof *c mede um char, pelo tipo da declaração: 1."

    - id: esc_kc11_B2_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Dois ponteiros do mesmo tipo têm o mesmo tamanho de destino, para onde quer que apontem: quem decide é o tipo, e não o bloco."
      versoes:
        - pede: "c aponta para um bloco de 10 chars, e d para um de 500. O que dão sizeof *c e sizeof *d?"
          antes: |-
            char *c = malloc(10);
            char *d = malloc(500);
          pecas:
            - "O mesmo: o tamanho de um char, nos dois"
            - "10 e 500: o tamanho vem com o ponteiro, e não da declaração"
            - "Nada: sizeof não mede o destino de um ponteiro"
          certa: [[0]]
          certa_texto: "O mesmo: o tamanho de um char, nos dois"
          erros:
            - exata: [1]
              crenca: pointer_knows_block_size
              retorno: "Os blocos são de 10 e de 500, mas c e d não carregam esses números: guardam um endereço cada. sizeof *c e sizeof *d medem um char, nos dois."
            - exata: [2]
              retorno: "sizeof *c mede o destino de c pelo tipo da declaração: um char. Funciona com qualquer ponteiro."
          retorno_geral: "Os dois medem um char: o tipo decide o tamanho do destino, e não o bloco."
        - pede: "p aponta para um bloco de 3 ints, e q para um de 100 ints. O que dão sizeof *p e sizeof *q?"
          antes: |-
            int *p = malloc(3 * sizeof(int));
            int *q = malloc(100 * sizeof(int));
          pecas:
            - "Nada: sizeof não mede o destino de um ponteiro"
            - "O mesmo: o tamanho de um int, nos dois"
            - "3 e 100 ints: o tamanho vem com o ponteiro, e não da declaração"
          certa: [[1]]
          certa_texto: "O mesmo: o tamanho de um int, nos dois"
          erros:
            - exata: [2]
              crenca: pointer_knows_block_size
              retorno: "Os blocos são de 3 e de 100 ints, mas p e q não carregam esses números: guardam um endereço cada. sizeof *p e sizeof *q medem um int, nos dois."
            - exata: [0]
              retorno: "sizeof *p mede o destino de p pelo tipo da declaração: um int. Funciona com qualquer ponteiro."
          retorno_geral: "Os dois medem um int: o tipo decide o tamanho do destino, e não o bloco."

    - id: esc_kc11_B2_4
      nome: "O tamanho vem do tipo, e não do bloco"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            char nome[30] = "ana";
            char *c = nome;

            printf("%zu\n", sizeof *c);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "30"
              retorno: "nome tem 30 caixas, mas c não carrega esse tamanho. sizeof *c mede o tipo do destino, um char: 1."
            - texto: "4"
              retorno: "O texto usa quatro caixas, contando a marca de fim, mas sizeof *c não olha o texto: mede um char, 1."
          retorno_geral: "sizeof *c mede um char, pelo tipo da declaração de c: 1."
        - pede: "Que número aparece?"
          mostra: |-
            char letras[8];
            char *c = letras + 3;

            printf("%zu\n", sizeof *c);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "5"
              retorno: "De c até o fim de letras restam cinco caixas, mas c não carrega isso. sizeof *c mede o tipo do destino, um char: 1."
            - texto: "8"
              retorno: "letras tem oito caixas, mas c não carrega esse tamanho. sizeof *c mede um char: 1."
          retorno_geral: "sizeof *c mede um char, pelo tipo da declaração de c: 1."

    - id: esc_kc11_B2_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Para responder sizeof *p, o compilador precisa rodar o programa?"
          antes: "int *p;"
          pecas:
            - "Não: o tipo está na declaração"
            - "Precisa: o tamanho vem do bloco para onde p aponta"
