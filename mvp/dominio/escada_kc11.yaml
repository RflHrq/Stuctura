I3:
  revisao:
    frases:
      - "O compilador sabe o tamanho da caixa e faz a conta sozinho: p + 1 anda uma caixa de int inteira."
      - "Multiplicar por sizeof na mão escala duas vezes, e o ponteiro pula longe demais."
    codigo: |
      int pontos[3] = {10, 20, 30};
      int *p = pontos;

      printf("%d\n", *(p + 1));
    saida: "20"
  cena:
    atores:
      - {nome: pontos, tipo: fileira, de: int, tamanho: 3}
      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 1, faz: [{cria: pontos}, {guarda: {em: pontos, valor: [10, 20, 30]}}]}
      - {linha: 2, faz: [{cria: p}, {aponta: {de: p, para: 'pontos[0]'}}]}
      - {linha: 4, faz: [{diz: 'p + 1 é o endereço da caixa seguinte, e o * a lê'}, {le: 'pontos[1]'}, {mostra: '20'}]}
  # for; double.
  fora_da_trilha: [ciu_kc11_017, ciu_kc11_t18]
  provas:
    - crenca: ptr_arith_is_bytes
      programa: |
        int notas[4] = {5, 15, 25, 35};
        int *p = notas;

        printf("%d\n", *(p + 3));
      previsao:
        pergunta: >
          p aponta para notas[0]. O trecho soma 3 a p, sem multiplicar por
          sizeof. O que aparece?
        opcoes:
          - "35"
          - "Lixo: p + 3 anda três bytes, e faltou multiplicar por sizeof"
        real: 0
        crenca: 1
      espera: "35"
      afirma: >
        Saiu 35, que está em notas[3]. p + 3 andou três caixas de int
        inteiras: o compilador sabe o tamanho do int e faz a conta
        sozinho. Multiplicar por sizeof na mão andaria longe demais.
  degraus:
    - id: esc_kc11_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "p + 1 anda um elemento do tipo de p, e não um byte: com int *p, uma caixa de int inteira."
        - "Quem faz a conta do tamanho é o compilador."
      versoes:
        - pede: "p aponta para notas[0]. Para onde aponta p + 1?"
          antes: |-
            int notas[3];
            int *p = notas;
          pecas:
            - "Para notas[1], a caixa seguinte"
            - "Para o byte seguinte: a aritmética de ponteiro conta bytes, e é preciso multiplicar por sizeof na mão"
            - "Para notas[0] de novo"
          certa: [[0]]
          certa_texto: "Para notas[1], a caixa seguinte"
          erros:
            - exata: [1]
              crenca: ptr_arith_is_bytes
              retorno: "A soma não conta bytes: p + 1 anda um int inteiro, e o compilador faz a conta do tamanho sozinho. Chega em notas[1]."
            - exata: [2]
              retorno: "p + 1 não fica onde p está: anda uma caixa. Chega em notas[1]."
          retorno_geral: "p + 1 anda uma caixa de int inteira: notas[1]."
        - pede: "q aponta para pontos[1]. Para onde aponta q + 2?"
          antes: |-
            int pontos[4];
            int *q = pontos + 1;
          pecas:
            - "Para pontos[1] de novo"
            - "Para dois bytes adiante: a aritmética de ponteiro conta bytes, e é preciso multiplicar por sizeof na mão"
            - "Para pontos[3], duas caixas adiante"
          certa: [[2]]
          certa_texto: "Para pontos[3], duas caixas adiante"
          erros:
            - exata: [1]
              crenca: ptr_arith_is_bytes
              retorno: "A soma não conta bytes: q + 2 anda dois ints inteiros, e o compilador faz a conta do tamanho sozinho. Chega em pontos[3]."
            - exata: [0]
              retorno: "q + 2 não fica onde q está: anda duas caixas. Chega em pontos[3]."
          retorno_geral: "q + 2 anda duas caixas de int a partir de pontos[1]: pontos[3]."

    - id: esc_kc11_I3_2
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Multiplicar por sizeof na mão escala duas vezes: p + 3 * sizeof(int) não é notas[3], é muito mais longe."
      versoes:
        - pede: "Complete para q apontar para notas[3]."
          antes: |-
            int notas[8];
            int *p = notas;
          mostra: "int *q = p + ___;"
          pecas: ["3", "3 * sizeof(int)", "sizeof(int)"]
          certa: [[0]]
          certa_texto: "int *q = p + 3;"
          erros:
            - exata: [1]
              crenca: ptr_arith_is_bytes
              retorno: "O compilador já multiplica pelo tamanho do int. Multiplicar de novo escala duas vezes, e q passa longe de notas[3]. O certo é p + 3."
            - exata: [2]
              retorno: "p + sizeof(int) anda tantas caixas quanto o tamanho de um int, e não três. Para notas[3], p + 3."
          retorno_geral: "A escala já está feita: q = p + 3 chega em notas[3]."
        - pede: "Complete para q apontar para pontos[2]."
          antes: |-
            int pontos[8];
            int *p = pontos;
          mostra: "int *q = p + ___;"
          pecas: ["sizeof(int)", "2", "2 * sizeof(int)"]
          certa: [[1]]
          certa_texto: "int *q = p + 2;"
          erros:
            - exata: [2]
              crenca: ptr_arith_is_bytes
              retorno: "O compilador já multiplica pelo tamanho do int. Multiplicar de novo escala duas vezes, e q passa longe de pontos[2]. O certo é p + 2."
            - exata: [0]
              retorno: "p + sizeof(int) anda tantas caixas quanto o tamanho de um int, e não duas. Para pontos[2], p + 2."
          retorno_geral: "A escala já está feita: q = p + 2 chega em pontos[2]."

    - id: esc_kc11_I3_3
