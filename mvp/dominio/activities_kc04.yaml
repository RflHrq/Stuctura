# Banco de atividades — kc_04, "dereferência: & e *"
#
# Sete por nó: um de entrada (o degrau mais baixo, na analogia), três de
# diagnóstico (um por degrau) e três de treino. É a forma com que o kc_02
# nasceu.
#
# REGRA DE DISTRATOR (motor.razoes_de): as razões da camada 2 saem das
# ALTERNATIVAS DO PRÓPRIO ITEM. Em todo item, um distrator aponta a crença
# do próprio nó — senão o nó nunca recebe atribuição — e outro a de um
# vizinho.
#
# UMA REGRA A MAIS NESTE TÓPICO: nenhum distrator dá o número certo com a
# explicação errada. Aqui seria fácil escrever "7, e *p é só o nome de x":
# quem marcasse isso erraria a camada 1 por um erro que é de RAZÃO, e a
# camada 1 tem que medir a resposta. Quando a explicação é o que está
# errado, o item vira `comparar_casos` ou `achar_o_erro`, onde a resposta
# pedida É a explicação.

analogy: >
  A pergunta e a viagem. Continua a rua: &x é PERGUNTAR o número da
  casa de x — você recebe o número, e não a casa nem o que está dentro
  dela. *p é a VIAGEM: ir até o número escrito no papel de p e mexer no
  que tem naquela casa. Uma desfaz a outra: pergunte o número de x, vá
  até ele, e você chega em x.
  ONDE QUEBRA: "perguntar o número" sugere que há alguém para responder.
  Não há — o número é propriedade do lugar, e por isso não existe número
  para o 5 escrito no código. E "a viagem" sugere tempo e distância: não
  há, *p não custa mais por apontar longe. A metáfora diz ONDE a ação
  acontece, nunca quanto ela custa.

resgates:

  B1: >
    Só tem número de casa quem ocupa uma casa. O 5 que você escreve no
    código não ocupa nenhuma: ele não mora na rua, aparece na conta e vai
    embora. Não há número para pedir. Para ter número, primeiro alguém
    precisa de uma casa — e é isso que uma variável é.

  B2: >
    Perguntar o número da casa de x devolve o número, e mais nada. A casa
    continua lá com tudo dentro, intacta. Você saiu da conversa com um
    número na mão, não com uma mudança na casa nem com uma cópia dela.

  B3: >
    O papel que está dentro da casa de p tem um número de casa escrito. É
    isso que p guarda: um número que leva a outro lugar, e não o que
    aquele outro lugar contém.

  I1: >
    *p é a viagem. Lê o número no papel de p, vai até aquela casa, e age
    no que está guardado nela. Duas casas envolvidas: a de p, de onde o
    número saiu, e a do número, onde a ação acontece.

  I2: >
    Quando você troca o que tem dentro da casa visitada, o papel de p
    continua com o mesmo número. Trocar o conteúdo da casa não reescreve
    o papel que levou você até ela.

  I3: >
    & pergunta onde está; * vai até lá. Um desfaz o outro: pergunte o
    número da casa de x, vá até esse número, e você está em x. Por isso
    *(&x) é a própria x — e por isso p e *p nunca são a mesma coisa.

exemplos:

  B1: |
    int x;
    &x            /* existe: x ocupa um lugar */
    /* &5 nao existe: 5 nao ocupa lugar nenhum */

  B2: |
    int x = 10;
    int *p = &x;   /* p recebeu o NUMERO do lugar de x */
    /* x continua com 10, e nada foi copiado */

  B3: |
    int x = 42;
    int *p = &x;
    /* dentro de p: o endereco de x. Nao o 42. */

  I1: |
    int x = 42;
    int *p = &x;
    *p            /* vai ate o endereco em p: da 42 */

  I2: |
    int x = 1;
    int *p = &x;
    *p = 5;       /* x virou 5; p continua com &x */

  I3: |
    int x = 7;
    *(&x)         /* e a propria x */
    /* p = &x  muda p;  *p = 9  muda x */

