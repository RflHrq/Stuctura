    nivel: 1
    formato: reconhecer_conceito
    tipo: teorica
    enunciado: "Depois de escrever int x; e nada mais, o que existe?"
    alternativas:
      a: "O espaço de x, já reservado"
      b: "Nada ainda: falta dar um valor"
      c: "O espaço de x, com zero dentro"
    gabarito: a
    crencas:
      b: no_value_no_memory
      c: declaration_zeroes

