    node: kc03:B1
    nivel: 1
    uso: entrada
    formato: reconhecer_conceito
    tipo: teorica
    enunciado: >
      Você ganha uma casa na rua, ainda sem mobília. A casa já existe?
    alternativas:
      a: "Já: tem número na porta"
      b: "Só quando alguém se mudar para ela"
      c: "Já, e vem limpa e arrumada"
    gabarito: a
    crencas:
      b: no_value_no_memory
      c: declaration_zeroes

