topic: kc_05

# A METÁFORA DESTE TÓPICO: o número reservado que não é casa.
#
# Continua a rua. A prefeitura reservou um número para significar "nenhuma
# casa", e garantiu que nenhuma casa recebe aquele número. Escrever esse
# número no papel de p é dizer "não aponto para ninguém" — e NÃO é o papel
# estar em branco: tem número escrito, e o número é esse. Olhar o papel
# para ver se é aquele número é só ler o papel. Seguir o número é ir a um
# lugar onde não há casa.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Número reservado" sugere que o número é zero, ou que é o mesmo em
#      toda rua. O que a máquina guarda ali não precisa ser zero, e você
#      não precisa saber qual é: no código se escreve `NULL` ou `0`, e a
#      conversão é do compilador. Quando a metáfora empurrar para "o número
#      reservado é o zero", ela cala.
#   2. "Ir até lá" sugere chegar a um lugar e ver que está vazio. Não é
#      isso: não há casa, e o que acontece não é definido — pode travar,
#      pode não travar, pode escrever em cima de outra coisa. A metáfora
#      diz que é inválido, nunca o que acontece.
#
# SEIS NÓS, E A CURADORIA TEM OITO — o mesmo caso do kc_04, e a mesma
# razão. `docs/curadoria-grafos.md` lista B1..B4 e I1..I4 com DUAS crenças,
# em I3 e I4, e a decisão 19 manda uma por nó. A literatura desta área é
# farta (a seção 5 do FAQ do comp.lang.c tem vinte entradas, e a 5.14
# pergunta por que há tanta confusão aqui), mas ela documenta seis ideias,
# não oito. Então:
#
#   curado B4 ("a representação interna não precisa ser zero") dobrou em
#     I2 deste grafo ("NULL igual a 0 vale na linguagem, não nos bits"),
#     porque são premissa e aplicação da mesma ideia;
#   curado I2 ("p == NULL é teste, não desreferência") virou I1 deste
#     grafo, e a curadoria registra que ele tinha ZERO caminhos — nenhum
#     percurso passava por ele. Como ele é o que separa testar de
#     desreferenciar, e a conclusão depende dessa separação, ele FICOU, e
#     ganhou crença: `pointer_is_just_a_name`, do kc_04, que é
#     pré-requisito deste tópico;
#   curado B1 e I1 ("um ponteiro precisa poder indicar ausência" e "NULL é
#     um valor, não um não-valor") dobraram em B1, pela mesma razão do
#     kc_04: premissa e aplicação.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "NULL é um valor de ponteiro que diz: não aponto para lugar nenhum."
    plain_text: >
      NULL é um valor de verdade, escrito dentro do ponteiro. Não é a
      caixa de p estar vazia.
    negated_by:
      - null_is_absence

    # A EVIDENCIA DO kc_05, 12/11/2026. O `afirma` e TEXTO DE TELA.
    evidencia:
      - afirma: >
          NULL é um valor de ponteiro que diz não apontar para lugar
          nenhum: p começa valendo NULL, e depois de receber um endereço
          deixa de valer.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p = NULL;

              puts(p == NULL ? "p comecou dizendo: nao aponto para lugar nenhum"
                             : "FALHOU");
              p = &x;
              puts(p != NULL ? "e depois de receber um endereco, deixou de dizer isso"
                             : "FALHOU");
              return 0;
          }
        espera: |-
          p comecou dizendo: nao aponto para lugar nenhum
          e depois de receber um endereco, deixou de dizer isso
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      NULL é um valor, e não a falta de um. O ponteiro que o recebeu tem
      alguma coisa escrita dentro — tanto quanto o que recebeu um endereço
      —, e o que está escrito significa uma informação precisa: este
      ponteiro não aponta para objeto nenhum.


      Por isso ele se comporta como valor. Dá para copiá-lo de um ponteiro
      para outro, compará-lo, passá-lo para uma função e recebê-lo de
      volta. Nada disso faria sentido com uma caixa vazia, e caixa de
      ponteiro vazia não existe: espaço de memória sempre tem alguma
      coisa.


      E é essa informação que o torna útil. Uma função que procura pode
      devolver NULL para dizer "não achei", e quem chamou sabe a diferença
      entre isso e um endereço de verdade. O nulo não é o silêncio do
      ponteiro: é uma resposta.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "Só a constante 0 escrita no código vira o ponteiro nulo."
    plain_text: >
      Escrever 0 onde se espera ponteiro dá o ponteiro nulo. Um zero que
      chega em tempo de execução não tem essa garantia.
    negated_by:
      - any_zero_is_null

    # A SEGUNDA E POR RECUSA, e e o caso que o projeto ja conhece do I2 do
    # kc_02: `p = zero;` e violacao de restricao, `error:` no gcc 16 e
    # AVISO antes do 14. Por isso `ambiente` nomeia o compilador em vez de
    # a prosa afirmar severidade.
    evidencia:
      - afirma: >
          O 0 escrito no código vira o ponteiro nulo: atribuir 0 a um
          ponteiro dá o mesmo que atribuir NULL.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p = 0;
              int *q = NULL;

              puts(p == NULL ? "o 0 escrito no codigo virou o ponteiro nulo" : "FALHOU");
              puts(p == q ? "e deu no mesmo que escrever NULL" : "FALHOU");
              return 0;
          }
        espera: |-
          o 0 escrito no codigo virou o ponteiro nulo
          e deu no mesmo que escrever NULL
      - afirma: >
          E é só a constante escrita no código: um 0 que chega dentro de
          uma variável inteira não serve, e o compilador reclama da
          atribuição.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int zero = 0;
              int *p;

              p = zero;
              puts(p == NULL ? "ok" : "FALHOU");
              return 0;
          }
        nao_compila: true
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall. O que o padrão
          exige de todo compilador conforme é o diagnóstico; o que se
          observa aqui é a recusa deste.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Quem transforma o zero em ponteiro nulo é o compilador, e ele faz
      isso enquanto traduz. Ao ver um 0 onde se espera um ponteiro, ele
      troca aquilo pelo valor nulo daquele tipo — que não precisa ser
      feito de bits zerados, e isso é assunto de outro nó deste tópico.


      Por isso a conversão depende de o zero estar visível na tradução.
      Escrever 0, escrever NULL, ou escrever uma conta entre constantes
      que dê zero: nos três casos o compilador resolve a expressão antes
      de o programa rodar, e faz a troca.


      Um zero que só aparece com o programa rodando é outra coisa. Ele é
      um inteiro, e convertê-lo para ponteiro é uma conversão de número
      para endereço — o padrão não promete que o resultado seja o nulo.
      Pode ser nesta máquina e não ser na próxima, e um teste construído
      sobre isso não está testando o que pensa.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "Nenhum objeto tem o endereço do ponteiro nulo."
    plain_text: >
      Nenhuma caixa mora nesse endereço. Ele é reservado justamente para
      significar "nenhum lugar".
    negated_by:
      - null_points_to_zero

    # POR QUE O ENDERECO PASSA POR UMA DECISAO DE TEMPO DE EXECUCAO. A primeira versao comparava `&x != NULL` direto, e o gcc respondeu: warning: the comparison will always evaluate as true for the address of 'x' will never be NULL [-Waddress]. O aviso esta certo, e e curioso -- o compilador dobra a comparacao PORQUE a premissa vale. So que entao o programa nao media nada: era verdadeiro por sintaxe, o mesmo defeito do `&x == &x` que reprovou a primeira evidencia do B1 do kc_02. Com o endereco entrando por uma decisao tomada rodando, a comparacao passa a ser de dois valores, em execucao.
    evidencia:
      - afirma: >
          Nenhum objeto tem o endereço do ponteiro nulo: o endereço de
          uma variável é sempre diferente de NULL.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              char c = 'k';
              int *p = NULL;
              char *q = NULL;
              int passos = 0;

              while (passos < 3) {
                  passos = passos + 1;
              }
              if (passos == 3) {
                  p = &x;
                  q = &c;
              }
              puts(p != NULL ? "o endereco de x nao e o ponteiro nulo" : "FALHOU");
              puts(q != NULL ? "nem o de c: objeto nenhum mora ali" : "FALHOU");
              return 0;
          }
        espera: |-
          o endereco de x nao e o ponteiro nulo
          nem o de c: objeto nenhum mora ali
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      A linguagem reserva o valor nulo para significar "nenhum objeto", e
      junto com a reserva vem a garantia: nenhum objeto do seu programa
      vai ter esse valor como endereço. Não é coincidência nem sorte da
      máquina — é regra, e vale para variáveis, para casas de um conjunto
      e para blocos que você pediu.


      Por isso o teste significa alguma coisa. Se algum objeto pudesse
      calhar de ter o endereço nulo, comparar um ponteiro com NULL não
      separaria "não aponta" de "aponta para aquele objeto", e a resposta
      seria ambígua justamente quando mais importa.


      E a garantia é sobre o VALOR, não sobre um lugar da memória. "O
      endereço zero" não é um lugar onde o seu programa possa espiar: o
      número que o nulo guarda pode nem ser zero por dentro, e o que o
      padrão promete é só isto — que ele não vai bater com o endereço de
      nada seu.
  I1:
    type: inferencia
    role: espinha
    support: [B1]
    text: "p == NULL olha o que está dentro de p, e não vai a lugar nenhum."
    plain_text: >
      Comparar p com NULL só lê o valor de p. Não é uma ida à memória
      apontada.
    negated_by:
      - pointer_is_just_a_name

    evidencia:
      - afirma: >
          p == NULL olha o que está dentro de p e não vai a lugar
          nenhum: a comparação responde com p valendo NULL, e o programa
          segue.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p = NULL;
              int respostas = 0;

              if (p == NULL) {
                  respostas = respostas + 1;
              }
              p = &x;
              if (p == NULL) {
                  respostas = respostas + 10;
              }
              puts(respostas == 1 ? "a comparacao respondeu nas duas vezes, e sem parar"
                                  : "FALHOU");
              puts(x == 1 ? "e nao foi a lugar nenhum: nada em x mudou" : "FALHOU");
              return 0;
          }
        espera: |-
          a comparacao respondeu nas duas vezes, e sem parar
          e nao foi a lugar nenhum: nada em x mudou
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B1 usado. Se o nulo é um valor guardado
      dentro de p, então perguntar se p é nulo é ler o que está dentro de
      p. A pergunta se resolve na caixa do ponteiro, e termina ali.


      Por isso ela é segura com p nulo. Não há viagem nenhuma: o programa
      compara dois valores — o que está em p e o nulo — e responde sim ou
      não. É a mesma coisa que comparar dois números, e comparar números
      não visita lugar nenhum.


      E é isso que separa duas linhas parecidas. p == NULL lê a caixa do
      ponteiro; *p == 0 manda viajar até o apontado e ler o que há lá. Com
      p nulo, a primeira responde e a segunda não tem para onde ir — e a
      diferença entre elas é uma estrela.
  I2:
    type: inferencia
    role: espinha
    support: [B2, B3]
    text: "NULL igual a 0 vale na linguagem que você escreve, não no padrão de bits."
    plain_text: >
      p == 0 funciona no código. Isso não quer dizer que os bits guardados
      em p sejam zeros.
    negated_by:
      - null_is_zero_always

    # O QUE ESTE PROGRAMA NAO FAZ: converter o ponteiro nulo para inteiro
    # para mostrar que "da zero". Nao da garantia nenhuma, e a premissa
    # diz exatamente isso. O que se demonstra e a metade que E da
    # linguagem: no codigo, 0 e NULL dizem o mesmo para um ponteiro.
    evidencia:
      - afirma: >
          NULL igual a 0 vale na linguagem que você escreve: no código,
          0 e NULL dizem a mesma coisa para um ponteiro — e isso é uma
          regra de escrita, não uma afirmação sobre os bits.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p = NULL;
              int inteiro = 0;

              puts(p == 0 ? "comparar com 0 escrito no codigo responde igual a NULL"
                          : "FALHOU");
              inteiro = inteiro + 1;
              puts(inteiro == 1 ? "e o 0 de um inteiro e so um numero: somou e virou 1"
                                : "FALHOU");
              return 0;
          }
        espera: |-
          comparar com 0 escrito no codigo responde igual a NULL
          e o 0 de um inteiro e so um numero: somou e virou 1
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      No código que você escreve, 0 e NULL dizem a mesma coisa para um
      ponteiro. Pode comparar com 0, atribuir 0, escrever NULL — o
      compilador entende os três como o valor nulo daquele tipo. Essa
      parte é acordo da linguagem, e é garantida.


      O acordo é sobre tradução, e não sobre conteúdo. Quando você escreve
      0 num lugar onde vai um ponteiro, o compilador troca aquilo pelo
      valor nulo — que pode ser feito de bits zerados, ou não. O padrão
      não promete nada sobre a aparência interna, e máquinas existiram
      onde ela era outra.


      Por isso a igualdade não se transporta para a memória. Zerar os
      bytes de um ponteiro à mão não é a mesma coisa que lhe atribuir
      NULL, e comparar os bytes dele com zeros não é a mesma coisa que
      compará-lo com NULL. O caminho garantido é sempre o mesmo: escrever
      a comparação, e deixar o compilador fazer a conversão que ele
      promete.
  I3:
    type: inferencia
    role: conclusao
    support: [B3, I1, I2]
    text: "*p com p nulo não acessa objeto algum: é comportamento indefinido."
    plain_text: >
      Então *p com p em NULL manda o programa a um endereço onde não
      existe caixa nenhuma. O que acontece daí não é definido.
    negated_by:
      - null_is_safe_to_deref
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      A estrela manda ir até o lugar que o ponteiro indica. Com p nulo,
      não há lugar nenhum indicado — o B3 garantiu que aquele valor não é
      o endereço de objeto algum —, e a ordem fica sem destino. Não é que
      ela chegue num lugar vazio: é que não há lugar.


      Por isso o padrão não diz o que acontece. Comportamento indefinido
      não quer dizer "dá erro": quer dizer que a linguagem não promete
      nada — nem que pare, nem que continue, nem que o valor lido seja
      zero. Qualquer coisa que aconteça está dentro do que foi permitido
      não prometer.


      E é isso que torna o teste obrigatório. Se o programa for seguir um
      ponteiro que pode ser nulo, perguntar antes é o que separa um
      caminho definido de um sem definição — e perguntar, como o nó
      anterior mostrou, não custa viagem nenhuma.
