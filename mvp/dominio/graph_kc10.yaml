topic: kc_10

# A METÁFORA DESTE TÓPICO: o papel que aponta para outra gaveta.
#
# Continua a rua. p é uma gaveta com um papel dentro, e no papel está um
# número de casa. pp é OUTRA gaveta, e o papel dela traz o número da
# GAVETA DE P. Cada `*` é abrir uma gaveta: abra a de pp e você acha o
# papel de p; abra a de p e você chega na casa.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Abrir gaveta" sugere que dá para continuar abrindo quantas vezes
#      você quiser. Não dá: quantos níveis existem está escrito no TIPO, e
#      pôr uma estrela a mais não cria um nível. Quando a metáfora
#      empurrar para "mais uma estrela resolve", ela cala — é o
#      `double_deref_is_data`, que a conclusão refuta.
#   2. A metáfora não diz nada sobre `int a[3][4]`: aquilo não é gaveta
#      dentro de gaveta, é um quarteirão de doze casas grudadas. Quando ela
#      empurrar para "matriz é gaveta de gavetas", ela cala — e esse é o
#      nó I2.
#
# OITO NÓS CURADOS, SEIS AQUI. A curadoria tem TRÊS crenças (I2, I3, I4),
# a terceira melhor cobertura do projeto. Duas dobras de
# premissa-e-aplicação:
#
#   curado B1 ("um ponteiro é variável e tem endereço") + B2 ("&p produz o
#     endereço de p") -> B1 deste grafo. São as duas metades de uma coisa
#     só, e é por isso que `&p` existe. A curadoria registra que os dois
#     são importados — de kc_02:B2 e de kc_04:B2;
#   curado I1 ("pp e p são variáveis distintas, em níveis distintos") +
#     I2 ("*pp é o ponteiro p; **pp é o int") -> I3 deste grafo, a
#     conclusão. O segundo é o primeiro dito em código.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "Um ponteiro é variável: tem endereço próprio, e &p o produz."
    plain_text: >
      Um ponteiro é uma caixa, e toda caixa tem endereço próprio. &p dá o
      endereço da caixa p — e guardar esse endereço exige uma caixa de
      mais um nível.
    negated_by:
      - ampersand_copies

    # ESTE COMENTARIO FICOU VELHO DUAS VEZES NO MESMO DIA, 12/11/2026.
    # Primeiro quando `ponteiro_de_ponteiro` ganhou cartao, o
    # `kc_10:B1`, com os seis materiais do topico assinados. Depois
    # quando o portao de exibicao passou a aceitar cartao de topico
    # ANTERIOR: `array` (kc_07) e `funcao_com_parametro` (kc_06) sao
    # pre-requisitos declarados daqui. Hoje NENHUMA evidencia do
    # kc_10 esta barrada. O texto abaixo fica como historia.
    #
    # A EVIDENCIA DO kc_10, 12/11/2026. QUASE TUDO AQUI FICA BARRADO, e
    # pelo construto que da nome ao topico: `ponteiro_de_ponteiro` esta
    # `so_avaliado` no inventario e nao tem cartao em lugar nenhum. A
    # evidencia continua valendo; ela so nao chega a tela enquanto nao
    # houver cartao que ensine o construto.
    #
    # A PRIMEIRA DEMONSTRACAO DESTE NO FOI ESCRITA PARA PASSAR: ela mostra
    # que p tem lugar proprio sem escrever `int **` nenhum, comparando os
    # dois lugares por `void *`. O endereco entra por uma decisao tomada
    # rodando porque, com `&p` e `&x` a vista, o gcc dobra a comparacao
    # (-Waddress) e o programa deixa de medir.
    evidencia:
      - afirma: >
          Um ponteiro é uma variável e tem endereço próprio: o lugar
          onde p mora não é o lugar de x, e os dois existem ao mesmo
          tempo.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p = NULL;
              void *lugar_de_p = NULL;
              void *lugar_de_x = NULL;
              int passos = 0;

              while (passos < 3) {
                  passos = passos + 1;
              }
              if (passos == 3) {
                  p = &x;
                  lugar_de_p = &p;
                  lugar_de_x = &x;
              }
              puts(lugar_de_p != lugar_de_x
                   ? "o lugar onde p mora nao e o lugar de x" : "FALHOU");
              puts(*p == 1 ? "e p continua levando a x: sao duas caixas" : "FALHOU");
              return 0;
          }
        espera: |-
          o lugar onde p mora nao e o lugar de x
          e p continua levando a x: sao duas caixas
      - afirma: >
          E &p produz esse endereço: guardado num ponteiro de ponteiro,
          ele leva de volta a p.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p = &x;
              int **pp = &p;

              puts(*pp == p ? "o endereco de p levou de volta a p" : "FALHOU");
              puts(**pp == 1 ? "e de p ate x, um nivel por vez" : "FALHOU");
              return 0;
          }
        espera: |-
          o endereco de p levou de volta a p
          e de p ate x, um nivel por vez
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      p é uma caixa como qualquer outra. O que está dentro dela é um
      endereço, e isso muda o que ela GUARDA — não muda o que ela É. Como
      toda caixa, ela ocupa um lugar na memória, e esse lugar tem número.


      &p devolve o número DESSE lugar. Não é o mesmo que &x: são duas
      caixas diferentes, em lugares diferentes, e cada uma tem o seu. É
      por isso que &p faz sentido mesmo p já sendo um ponteiro — a
      pergunta "onde você mora" não depende do que você guarda.


      E guardar o que &p devolve pede uma caixa de mais um nível. int *p
      diz "guardo o endereço de um int"; int **pp diz "guardo o endereço
      de uma caixa que guarda o endereço de um int". A segunda estrela não
      é enfeite: ela está contando quantas caixas existem entre pp e o
      número.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "Cada aplicação de * desfaz exatamente um nível."
    plain_text: >
      Cada * dá um passo: vai de uma caixa até a caixa cujo endereço ela
      guarda. Um passo por estrela, nem mais nem menos.
    negated_by:
      - pointer_is_just_a_name

    evidencia:
      - afirma: >
          Cada aplicação de * desfaz exatamente um nível: de pp se chega
          a p, e de p ao int — nunca dois de uma vez.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 5;
              int *p = &x;
              int **pp = &p;

              puts(*pp == p ? "um asterisco em pp entrega p" : "FALHOU");
              puts(**pp == x ? "dois asteriscos entregam o int" : "FALHOU");
              **pp = 9;
              puts(x == 9 ? "e escrever com dois chega no int: um nivel por asterisco"
                          : "FALHOU");
              return 0;
          }
        espera: |-
          um asterisco em pp entrega p
          dois asteriscos entregam o int
          e escrever com dois chega no int: um nivel por asterisco
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Uma estrela é um passo, e um passo vai de uma caixa até a caixa cujo
      endereço ela guarda. Em *pp, o passo sai de pp e para na caixa de p.
      É isso e só isso: ler o endereço que está em pp e ir até lá.


      E o que se acha ao parar ali é um PONTEIRO, não um número. *pp é p —
      cabe num int *, e dá para seguir de novo. O número só aparece no
      passo seguinte, quando a segunda estrela sai de p e chega em x.


      Por isso o número de estrelas não é uma escolha de estilo. Cada uma
      gasta um nível dos que existem, e existem tantos quantos o tipo
      declarou. Duas estrelas num int ** chegam ao int; uma para antes;
      três pediriam um nível que ninguém criou.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "O tipo diz quantos níveis existem; não é opcional."
    plain_text: >
      O tipo é que diz quantos passos existem até o valor. Não dá para
      chutar nem descobrir depois, e não há um ponteiro-para-ponteiro
      genérico.
    negated_by:
      - voidptr_is_universal

    # A RECUSA NAO TEM `**` NO CODIGO, entao ela passa o portao -- e e a
    # unica coisa que este topico consegue mostrar hoje junto com a
    # primeira do B1.
    evidencia:
      - afirma: >
          O tipo diz quantos níveis existem, e não é opcional: guardar o
          endereço de um ponteiro numa variável de um nível só é
          recusado pelo compilador.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p = &x;
              int *errado = &p;

              puts(errado != NULL ? "ok" : "FALHOU");
              return 0;
          }
        nao_compila: true
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall. O que o padrão
          exige de todo compilador conforme é o diagnóstico; o que se
          observa aqui é a recusa deste.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Quantos passos existem entre uma caixa e o número está escrito no
      tipo dela, antes de o programa rodar. int *p diz um; int **pp diz
      dois. Não é informação que se descubra abrindo caixas: é o
      compilador que lê a declaração e sabe, de antemão, quantas vezes
      pode seguir.


      void * é o endereço sem essa informação. Ele aceita o endereço de
      qualquer coisa — e aceita justamente porque não promete nada sobre o
      que há do outro lado. Guardar ali não é perder o endereço; é ficar
      sem o número de passos, e sem ele não há como seguir.


      Por isso não existe um ponteiro genérico de dois níveis. void **
      parece ser isso e não é: ele é um tipo concreto, o de "endereço de
      uma caixa que guarda void *" — e uma caixa que guarda int * não é
      uma caixa que guarda void *. O genérico vale para um nível, e só.
  I1:
    type: inferencia
    role: espinha
    support: [B1]
    text: "Para uma função alterar o p do chamador, ela precisa receber &p."
    plain_text: >
      Para uma função mudar o p de quem chamou, ela precisa receber o
      endereço de p — não o p.
    negated_by:
      - modify_pp_changes_p

    evidencia:
      - afirma: >
          Para uma função alterar o p de quem chamou, ela precisa
          receber &p: recebendo p ela troca a cópia, recebendo &p ela
          chega à caixa de p.
        programa: |
          #include <stdio.h>

          static void recebe_o_ponteiro(int *q)
          {
              q = NULL;
              puts(q == NULL ? "quem recebeu p trocou a copia dele" : "FALHOU");
          }

          static void recebe_o_endereco(int **qq)
          {
              *qq = NULL;
          }

          int main(void)
          {
              int x = 1;
              int *p = &x;

              recebe_o_ponteiro(p);
              puts(p != NULL ? "e o p de fora continuou" : "FALHOU");
              recebe_o_endereco(&p);
              puts(p == NULL ? "com &p, a funcao chegou na caixa de p e trocou"
                             : "FALHOU");
              return 0;
          }
        espera: |-
          quem recebeu p trocou a copia dele
          e o p de fora continuou
          com &p, a funcao chegou na caixa de p e trocou
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B1 aplicado a quem chama. Se p é uma
      caixa com endereço próprio, então mexer no que está dentro dela é um
      trabalho que precisa do endereço dela — do mesmo jeito que mexer em
      x precisou do endereço de x.


      Então o que a função tem de receber é &p, e não p. Receber p é
      receber o conteúdo da sua caixa: uma cópia do endereço de x, com a
      qual dá para chegar em x e mexer no 1 que está lá. O que não dá é
      voltar até a sua caixa, porque o endereço dela não veio junto.


      E com &p ela chega. O parâmetro passa a guardar o endereço da sua
      caixa, e uma estrela em cima dele vai até lá — para ler o que você
      guardou ou para escrever outra coisa no lugar. É o mesmo passo de
      sempre, dado um nível acima.
  I2:
    type: inferencia
    role: espinha
    support: [B2, B3]
    text: "int a[N][M] é bloco contíguo, e não vetor de ponteiros."
    plain_text: >
      int a[3][4] é um bloco de doze caixas grudadas. Não são três caixas
      apontando para fileiras separadas.
    negated_by:
      - array2d_is_double_pointer

    evidencia:
      - afirma: >
          int a[N][M] é um bloco contíguo, e não um vetor de ponteiros:
          a segunda linha começa logo depois da primeira, na mesma fila
          de inteiros.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[2][3];
              int i = 0, j = 0;
              int seguidos = 0;

              while (i < 2) {
                  j = 0;
                  while (j < 3) {
                      a[i][j] = i * 3 + j;
                      j = j + 1;
                  }
                  i = i + 1;
              }
              puts(&a[1][0] - &a[0][0] == 3
                   ? "a segunda linha comeca tres inteiros depois da primeira"
                   : "FALHOU");
              i = 0;
              while (i < 6) {
                  if (*(&a[0][0] + i) == i) {
                      seguidos = seguidos + 1;
                  }
                  i = i + 1;
              }
              puts(seguidos == 6
                   ? "e os seis estao numa fila so: e bloco, nao vetor de ponteiros"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          a segunda linha comeca tres inteiros depois da primeira
          e os seis estao numa fila so: e bloco, nao vetor de ponteiros
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      int a[3][4] são doze caixas grudadas, numa fila só. A escrita com
      dois colchetes organiza a leitura — três fileiras de quatro —, e não
      muda o que está na memória: as quatro da primeira fileira, depois as
      quatro da segunda, depois as quatro da terceira, sem nada no meio.


      Um vetor de ponteiros é outra coisa, e se escreve assim: int
      *linhas[3]. Ali existem três caixas de endereço, cada uma apontando
      para uma fileira que pode estar em qualquer lugar. São quinze caixas
      no total, e para chegar num número você segue um endereço. Em
      a[3][4] não há endereço nenhum guardado: só os doze números.


      Por isso a regra do nome que vira endereço não se aplica duas vezes.
      O nome a vira o endereço da primeira FILEIRA, e ali ela para — o
      resultado já é um ponteiro, e ponteiro não vira ponteiro de novo. É
      o que separa um bloco de doze de uma caixa de caixas.
  I3:
    type: inferencia
    role: conclusao
    support: [B1, B2, I1, I2]
    text: >
      *pp é o ponteiro p e **pp é o int: pp e p são caixas distintas, em
      níveis distintos.
    plain_text: >
      pp e p são duas caixas diferentes, uma guardando o endereço da
      outra. *pp chega em p; **pp dá mais um passo e chega no número.
    negated_by:
      - double_deref_is_data
    evidencia:
      - afirma: >
          *pp é o ponteiro p e **pp é o int: pp e p são caixas
          distintas, e trocar o que está em pp não encosta no que está
          em p.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1, y = 2;
              int *p = &x;
              int *outro = &y;
              int **pp = &p;

              puts(*pp == p && **pp == 1 ? "*pp e o ponteiro p, **pp e o int" : "FALHOU");
              pp = &outro;
              puts(**pp == 2 ? "pp passou a levar ao outro ponteiro" : "FALHOU");
              puts(*p == 1 ? "e p ficou onde estava: sao caixas distintas" : "FALHOU");
              return 0;
          }
        espera: |-
          *pp e o ponteiro p, **pp e o int
          pp passou a levar ao outro ponteiro
          e p ficou onde estava: sao caixas distintas
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Junte os quatro e sobra uma coisa só. p é uma caixa com endereço
      próprio, cada estrela é um passo, o tipo diz quantos passos existem,
      e um bloco de números não é uma caixa de caixas. Daí: pp e p são
      duas caixas, em dois níveis, e o caminho entre elas tem um passo de
      comprimento.


      Então *pp e **pp não são a mesma coisa nem parecidas. *pp para na
      caixa de p, e o que ele entrega é um ponteiro — um endereço, que se
      pode seguir. **pp dá o passo seguinte e entrega o int, que é um
      número e não leva a lugar nenhum.


      E a estrela a mais não inventa nível. Quantos existem foi escrito na
      declaração, e escrever uma estrela a mais não cria uma caixa que
      ninguém criou — pede ao compilador um passo que o tipo não tem. Para
      haver três passos é preciso declarar três níveis, antes, no tipo.
