topic: kc_11

# TÓPICO-PILOTO, e o QUARTO — com ele, os quatro que a coleta usa
# (kc_02, kc_07, kc_11, kc_09) estão construídos.
#
# A METÁFORA DESTE TÓPICO: andar de casa em casa, não de passo em passo.
#
# Continua o quarteirão do kc_07, onde as casas são todas do mesmo
# tamanho. `p + 1` não é "andar um metro": é "andar uma casa". Quem sabe
# o tamanho da casa é a planta — o tipo —, e a prefeitura já faz a
# conversão: você diz "avance uma casa" e ela converte em metros sozinha.
# Se você converter também, anda o dobro.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Andar" sugere caminho e distância percorrida. Não há: `p + 1` não
#      passa pelas casas do meio e não custa mais por andar mais longe. É
#      cálculo, não caminhada. Quando a metáfora empurrar para "andar
#      muito é mais devagar", ela cala.
#   2. A metáfora não diz nada sobre o que acontece se você andar além do
#      quarteirão. É outro assunto, e aqui não interessa: o ponto deste
#      tópico é a ESCALA da conta, não o limite dela.
#
# NOVE NÓS CURADOS, SEIS AQUI. A curadoria tem duas crenças (em I2 e I5),
# e a decisão 19 manda uma por nó. Três dobras, todas de
# premissa-e-aplicação, e todas com a mesma entrada do FAQ sustentando as
# duas pontas:
#
#   curado B2 ("objetos de um tipo têm tamanho fixo") + B4 ("o compilador
#     conhece o tipo em tempo de compilação") -> B2 deste grafo. São a
#     mesma afirmação vista de dois lados: o tamanho é fixo E é sabido
#     antes de rodar;
#   curado I1 ("p + 1 precisa chegar ao próximo objeto") + I2 ("logo o
#     compilador multiplica por sizeof sozinho") + I3 ("multiplicar por
#     sizeof na mão escala duas vezes") -> I3 deste grafo, a conclusão. A
#     FAQ 4.4 é uma pergunta só, e ela contém as três: o código do
#     questionador tem o sizeof na mão, e a resposta é "Pointer arithmetic
#     in C is always automatically scaled by the size of the objects
#     pointed to";
#   curado I4 ("a[i] é exatamente *(a + i)") ficou, e é o I1 daqui. A
#     curadoria registra ZERO caminhos nele, mas ele é a identidade que
#     liga índice e aritmética — e ganhou crença própria, nova, da FAQ
#     6.11 (o `5["abcdef"]`).
#
# TODAS AS SEIS CRENÇAS SÃO GRADE L. É o primeiro tópico com procedência
# uniforme, e faz sentido: aritmética de ponteiro é assunto de FAQ de C,
# não de estudo empírico em outra linguagem.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "p aponta para um objeto de um tipo definido."
    plain_text: >
      Todo ponteiro sabe o tipo do que está no destino. Não existe
      ponteiro sem essa informação.
    negated_by:
      - pointer_is_integer

    # A EVIDENCIA DO kc_11, 12/11/2026. O `afirma` e TEXTO DE TELA.
    #
    # O QUE ESTE TOPICO NAO AFIRMA EM LUGAR NENHUM: que int tem 4 bytes.
    # Todas as distancias sao MEDIDAS em execucao e comparadas entre si --
    # passo contra passo, elemento contra elemento. Tamanho de tipo e fato
    # sobre a maquina, e o projeto ja tem regra para isso.
    evidencia:
      - afirma: >
          p aponta para um objeto de um tipo definido, e é o tipo que
          decide o que se lê e se escreve ali: pelo ponteiro de int cabe
          um número grande, pelo de char não.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int grande = 0;
              char pequeno = 0;
              int *pi = &grande;
              char *pc = &pequeno;

              *pi = 300;
              *pc = (char) 300;
              puts(*pi == 300 ? "pelo ponteiro de int, o 300 coube inteiro" : "FALHOU");
              puts(*pc != 300 ? "pelo de char, nao coube: o tipo decide o que cabe"
                              : "FALHOU");
              return 0;
          }
        espera: |-
          pelo ponteiro de int, o 300 coube inteiro
          pelo de char, nao coube: o tipo decide o que cabe
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Um ponteiro carrega duas coisas, e só uma delas é o endereço. A
      outra é o tipo do que está naquele endereço, e ela não fica guardada
      na memória: está na declaração. Quando você escreve int *p, o p que
      nasce ali é um ponteiro para int, e vai ser isso pelo resto do
      programa.


      A ideia de que ponteiro é só um número tem de onde vir. Endereço é
      número, isso é verdade, e a máquina de fato trabalha com números.
      Mas o programa não é a máquina: na linguagem, o papel traz a planta
      do destino, e é dela que sai tudo o que se pode fazer com o
      ponteiro.


      Por isso trocar um pelo outro não funciona. Sem o tipo não há quanto
      ler no destino, e não há de quanto é um passo — e é aí que a conta
      mais usada deste tópico se apoia. Dois ponteiros com o mesmo
      endereço e tipos diferentes não são o mesmo ponteiro, e o programa
      trata os dois de maneiras diferentes.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "O tamanho de um tipo é fixo, e o compilador o conhece antes de rodar."
    plain_text: >
      Cada tipo tem um tamanho fixo, e esse tamanho está na declaração —
      o compilador já sabe qual é antes de o programa rodar.
    negated_by:
      - pointer_knows_block_size

    evidencia:
      - afirma: >
          O tamanho de um tipo é fixo, e o passo de um ponteiro é sempre
          o mesmo: dois ponteiros de int andam a mesma distância quando
          andam um.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1, y = 2;
              int *px = &x;
              int *py = &y;
              long passo_x = (char *) (px + 1) - (char *) px;
              long passo_y = (char *) (py + 1) - (char *) py;

              puts(passo_x == passo_y
                   ? "dois ponteiros de int andam a mesma distancia" : "FALHOU");
              puts(passo_x > 0 ? "e o passo tem tamanho fixo, decidido pelo tipo"
                               : "FALHOU");
              return 0;
          }
        espera: |-
          dois ponteiros de int andam a mesma distancia
          e o passo tem tamanho fixo, decidido pelo tipo
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O tamanho de um tipo não muda durante o programa. Todo int ocupa o
      mesmo tanto, todo char ocupa o mesmo tanto, e esse tanto está
      decidido antes de a primeira linha rodar — ele vem do tipo, que está
      escrito na declaração. Não é informação que alguém descobre em
      execução.


      Quem pergunta esse tamanho é sizeof. Escreva sizeof(int) e você
      recebe quantos bytes um int ocupa; escreva sizeof *p e você recebe
      quantos bytes ocupa aquilo que p aponta. Ele aceita um tipo entre
      parênteses ou uma expressão, e no segundo caso olha apenas o TIPO da
      expressão: quem responde é o compilador, durante a compilação, e por
      isso a expressão nem chega a ser executada. É o que faz sizeof *p
      funcionar mesmo quando p ainda não recebeu endereço nenhum.


      A ideia contrária é razoável, e vem de uma observação verdadeira:
      alguém sabe o tamanho do bloco, porque o free devolve a quantidade
      certa. Só que esse alguém é o alocador, nas contas dele — não o
      ponteiro. O ponteiro traz o tipo do destino, e com isso o tamanho de
      UM elemento; quantos elementos há lá é informação que ele nunca
      carregou, e quem a perde não tem como recuperá-la depois.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "Os elementos de um array são contíguos."
    plain_text: >
      Os elementos de um array ficam grudados, um logo depois do outro,
      sem buraco entre eles.
    negated_by:
      - string_literal_is_array

    # BARRADA por `array`, que so tem cartao no kc_07. A premissa e sobre
    # array, entao nao ha versao sem ele; a evidencia vale, e nao vai a
    # tela enquanto este topico nao tiver cartao que ensine o construto.
    evidencia:
      - afirma: >
          Os elementos de um array são contíguos: do primeiro ao segundo
          anda-se um elemento, e do primeiro ao último anda-se
          exatamente a conta.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[4];
              int i = 0;

              while (i < 4) {
                  a[i] = i;
                  i = i + 1;
              }
              puts(&a[1] - &a[0] == 1 ? "do primeiro ao segundo, um elemento" : "FALHOU");
              puts(&a[3] - &a[0] == 3 ? "e do primeiro ao ultimo, tres" : "FALHOU");
              return 0;
          }
        espera: |-
          do primeiro ao segundo, um elemento
          e do primeiro ao ultimo, tres
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Os elementos de um array ficam um logo depois do outro, sem buraco
      entre eles. Não é coincidência de como a máquina arrumou: é o que a
      linguagem garante, e é a garantia em que toda a aritmética deste
      tópico se apoia.


      E um array é isto: uma declaração que reserva várias caixas do mesmo
      tipo, de uma vez, lado a lado. Quando você escreve int v[4], nascem
      quatro caixas de int, numeradas de zero a três, e v[2] é a terceira
      delas. O nome do array usado numa expressão entrega o endereço da
      primeira caixa — é por isso que dá para somar a ele, e é por isso
      que a soma anda de caixa em caixa.


      A ideia contrária tem de onde vir, e é a semelhança entre duas
      escritas. A forma com colchetes declara as caixas e elas são suas:
      dá para escrever em cada uma. A forma com ponteiro declara uma caixa
      só, a do ponteiro, e a aponta para um texto que você não declarou —
      e o que se pode fazer com esse texto a linguagem não garante. São
      duas coisas diferentes com cara parecida, e quem as confunde perde o
      modelo das caixas grudadas.
  I1:
    type: inferencia
    role: espinha
    support: [B3]
    text: "a[i] é exatamente *(a + i)."
    plain_text: >
      a[i] é só outro jeito de escrever *(a + i): ande i caixas a partir
      do começo e olhe o que tem lá.
    negated_by:
      - indice_nao_e_soma

    evidencia:
      - afirma: >
          a[i] é exatamente *(a + i): as duas formas leem o mesmo
          elemento, e escrever por uma aparece na outra.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[4];
              int i = 0;
              int iguais = 0;

              while (i < 4) {
                  a[i] = i * 7;
                  i = i + 1;
              }
              i = 0;
              while (i < 4) {
                  if (a[i] == *(a + i)) {
                      iguais = iguais + 1;
                  }
                  i = i + 1;
              }
              puts(iguais == 4 ? "nas quatro posicoes, a[i] e *(a + i) leem o mesmo"
                               : "FALHOU");
              *(a + 2) = 99;
              puts(a[2] == 99 ? "e escrever por uma forma aparece na outra" : "FALHOU");
              return 0;
          }
        espera: |-
          nas quatro posicoes, a[i] e *(a + i) leem o mesmo
          e escrever por uma forma aparece na outra
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B3 levado adiante. As caixas estão
      grudadas e o nome do array entrega o endereço da primeira. Então
      pedir a caixa de índice i e andar i caixas a partir do começo chegam
      ao mesmo lugar — e a linguagem não só concorda com isso: ela DEFINE
      o índice como essa soma seguida da estrela.


      A ideia contrária vem da aparência. O colchete parece sintaxe
      especial de array, uma operação à parte, com regra própria. Não é: o
      colchete é escrita abreviada, e o que está por baixo dele é a soma
      de um ponteiro com um número, exatamente a conta que este tópico
      estuda.


      Por isso o colchete não pertence ao nome do array. Ele se aplica a
      qualquer expressão que seja um ponteiro para elemento, venha de onde
      vier — de um array, de um ponteiro que você declarou, de uma soma
      que você acabou de escrever. E vale nas duas direções: o que a
      identidade diz dos valores, ela diz também dos endereços.
  I2:
    type: inferencia
    role: espinha
    support: [B1, B2]
    text: "void * não tem aritmética: sem tipo, não há escala."
    plain_text: >
      Um void * não sabe o tamanho do destino. Sem isso não há quanto
      andar, e a conta simplesmente não existe.
    negated_by:
      - voidptr_arith_ok

    evidencia:
      - afirma: >
          void * não tem escala: para andar pelo bloco foi preciso
          primeiro dar um tipo ao ponteiro, e é o tipo que diz de quanto
          é o passo.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              void *sem_tipo = malloc(4);
              char *com_tipo = NULL;

              if (sem_tipo == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              com_tipo = sem_tipo;
              *com_tipo = 'a';
              *(com_tipo + 1) = 'b';
              puts(*com_tipo == 'a' && *(com_tipo + 1) == 'b'
                   ? "com tipo, o ponteiro anda e escreve posicao a posicao"
                   : "FALHOU");
              puts(sem_tipo == (void *) com_tipo
                   ? "e o sem tipo guarda o mesmo endereco: o que falta nele e a escala"
                   : "FALHOU");
              free(sem_tipo);
              return 0;
          }
        espera: |-
          com tipo, o ponteiro anda e escreve posicao a posicao
          e o sem tipo guarda o mesmo endereco: o que falta nele e a escala
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B1 e o B2 com uma peça retirada. O
      ponteiro traz o tipo do destino, e do tipo vem o tamanho de um
      elemento — é esse tamanho que a soma usa. Um void * não diz qual é o
      tipo do destino, então não há tamanho de elemento, e sem ele a
      pergunta de quanto andar não tem resposta. Não é conta proibida: é
      conta que não existe.


      E o void * serve justamente por não dizer. Ele guarda o endereço de
      qualquer objeto, de qualquer tipo, e é por isso que é com ele que o
      alocador responde: quem pede memória sabe o que vai pôr lá, e o
      alocador não precisa saber. Guardar endereço ele faz sem perder nada
      — inclusive endereço que uma soma acabou de produzir.


      Por isso andar exige dar um tipo antes. Você escolhe o tipo, e com
      essa escolha escolhe a escala: o mesmo endereço, lido como ponteiro
      para char ou como ponteiro para int, anda distâncias diferentes a
      cada passo. A escala nunca esteve no endereço — ela vem do tipo que
      você deu.
  I3:
    type: inferencia
    role: conclusao
    support: [B1, B2, I1, I2]
    text: >
      p + n avança n elementos do tipo apontado, não n bytes: a escala vem
      do tipo e o compilador a aplica sozinho — multiplicar por sizeof na
      mão escala duas vezes.
    plain_text: >
      Como o compilador sabe o tamanho da caixa, ele mesmo faz a conta.
      Você escreve p + 1; ele anda uma caixa inteira. Se você multiplicar
      por sizeof também, o ponteiro pula longe demais.
    negated_by:
      - ptr_arith_is_bytes
    # O `a[64]` E GRANDE DE PROPOSITO. A demonstracao precisa calcular
    # `a + 2 * sizeof(int)` para mostrar o erro da escala dobrada, e esse
    # endereco tem de continuar DENTRO do array -- passar de um alem do
    # fim e comportamento indefinido, e a evidencia estaria provando uma
    # coisa cometendo outra.
    evidencia:
      - afirma: >
          p + n avança n elementos, e não n bytes: a escala vem do tipo
          e o compilador a aplica sozinho — multiplicar por sizeof na
          mão anda muito mais do que se queria.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[64];
              long um_elemento = (char *) (a + 1) - (char *) a;
              long na_mao = (a + 2 * (long) sizeof(int)) - a;

              puts((a + 2) - a == 2
                   ? "p + 2 andou dois elementos, como a conta pedia" : "FALHOU");
              puts((char *) (a + 2) - (char *) a == 2 * um_elemento
                   ? "e em bytes isso deu dois tamanhos do tipo: a escala foi aplicada"
                   : "FALHOU");
              puts(na_mao > 2
                   ? "multiplicando por sizeof na mao, andou muito mais que dois"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          p + 2 andou dois elementos, como a conta pedia
          e em bytes isso deu dois tamanhos do tipo: a escala foi aplicada
          multiplicando por sizeof na mao, andou muito mais que dois
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o fecho dos quatro nós anteriores. O
      ponteiro traz o tipo do destino, do tipo vem um tamanho fixo que o
      compilador já conhece, o índice é essa mesma soma, e sem tipo não
      haveria escala nenhuma. Junte as quatro coisas e sobra uma só:
      quando você escreve p + n, quem multiplica pelo tamanho do elemento
      é o compilador, porque é ele que sabe o tamanho.


      A ideia contrária é quase razoável, e vem de um fato verdadeiro:
      endereço é contado em bytes, e andar de um lugar a outro na memória
      é andar um número de bytes. Daí vem a conclusão de que a conversão é
      trabalho de quem escreve o programa. Só que a conversão já
      aconteceu: ela está embutida na soma, desde que o ponteiro tem tipo.


      Por isso fazer a conta na mão anda duas vezes. Você multiplica por
      sizeof, e o compilador multiplica de novo pelo tamanho do elemento —
      o ponteiro vai parar muito depois de onde você queria. E o erro não
      reclama na linha que o causou: o programa segue, lê um lugar que não
      é o que você pensava, e o resultado estranho aparece longe dali.
