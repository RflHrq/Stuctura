topic: kc_04

# A METÁFORA DESTE TÓPICO: a pergunta e a viagem.
#
# Continua a rua. `&x` é PERGUNTAR o número da casa de x: você recebe o
# número, e não a casa nem o que está dentro dela. `*p` é a VIAGEM: ir até
# o número que está escrito no papel dentro de p e mexer no que tem lá.
# Uma desfaz a outra — pergunte o número de x e vá até ele, e você chega
# em x.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Perguntar o número" sugere que existe alguém para responder. Não
#      existe: o número é propriedade do LUGAR. Por isso não há número
#      para um valor que não ocupa lugar — o 5 escrito no código. Quando a
#      metáfora empurrar para "pergunte o número do 5", ela cala.
#   2. "A viagem" sugere tempo e distância. Não há: `*p` não custa mais
#      por apontar para longe. A metáfora serve para dizer ONDE a ação
#      acontece, nunca quanto ela custa.
#
# SEIS NÓS, E A CURADORIA TEM OITO. A curadoria de `docs/curadoria-grafos.md`
# lista B1..B4 e I1..I4 para este tópico, e duas crenças só — uma em B4 e
# uma em I1. A decisão 19 do processo manda uma crença por nó, sem exceção,
# porque a atribuição vem da camada 2: nó sem crença própria nunca recebe
# atribuição. Para oito nós faltariam seis crenças, e a literatura desta
# área sustenta seis no total, não oito.
#
# Então dois pares foram dobrados, e os dois pares eram premissa-e-aplicação
# da MESMA ideia:
#
#   curado B1 ("só o que ocupa memória tem endereço") + I1 ("&5 é inválido")
#     -> B1 deste grafo, com a crença curada `ampersand_takes_value`
#   curado B4 ("o * muda de papel") + I3 ("* e & são inversos")
#     -> I3 deste grafo, com a crença curada `star_assigns_pointer`
#
# A alternativa era inventar quatro crenças `E` (estimadas, sem fonte) para
# encher oito nós. É decisão de dono, e está registrada: voltar para oito
# custa escrever quatro crenças e 14 atividades.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "Só o que ocupa um lugar na memória tem endereço."
    plain_text: >
      Só tem número de casa o que ocupa uma casa. Um valor escrito no
      código não ocupa nenhuma.
    negated_by:
      - ampersand_takes_value

    # A EVIDENCIA DO kc_04, 12/11/2026. Duas demonstracoes neste no, e a
    # segunda e por RECUSA: a premissa diz "so o que ocupa um lugar", e
    # a metade do SO se mostra pedindo o endereco de algo que nao e lugar.
    # A recusa traz `ambiente` porque recusa e fato sobre um compilador.
    evidencia:
      - afirma: >
          O que ocupa um lugar tem endereço, e o endereço leva de volta
          ao mesmo lugar: escrever por ele muda a variável.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *onde = &x;

              *onde = 9;
              puts(x == 9 ? "o endereco de x levou de volta a x: x virou 9" : "FALHOU");
              return 0;
          }
        espera: |-
          o endereco de x levou de volta a x: x virou 9
      - afirma: >
          E o que não ocupa lugar não tem endereço: o compilador não
          aceita pedir o endereço de uma conta, que é um valor e não um
          lugar.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *onde = &(x + 1);

              puts(onde != NULL ? "ok" : "FALHOU");
              return 0;
          }
        nao_compila: true
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall. O que o padrão
          exige de todo compilador conforme é o diagnóstico; o que se
          observa aqui é a recusa deste.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O endereço é propriedade do LUGAR, e não do valor. Toda variável
      ocupa um lugar na memória enquanto existe, e é esse lugar que tem
      número. Duas variáveis com o mesmo conteúdo ocupam lugares
      diferentes, e por isso têm endereços diferentes.


      Um número escrito no código não ocupa lugar nenhum. O 5 que você
      digita numa conta não é guardado em canto algum para ser consultado
      depois: ele é parte da instrução, e some quando ela é traduzida. Não
      há lugar, então não há número de lugar.


      Por isso o pedido nem chega a ser feito. Escrever &5 não é pedir
      algo difícil nem incomum: é pedir o endereço de uma coisa que não
      tem lugar, e o compilador para ali. O mesmo vale para o resultado de
      uma conta, que existe só durante o cálculo.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "&x devolve o endereço de x, e não copia x."
    plain_text: >
      &x responde o número da casa de x. Nada é copiado: você recebe o
      número, não o que está guardado.
    negated_by:
      - ampersand_copies

    evidencia:
      - afirma: >
          &x devolve o endereço de x e não copia x: escrever pelo que
          ele devolveu muda o próprio x, o que uma cópia não faria.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int copia = x;
              int *endereco = &x;

              *endereco = 50;
              copia = 99;
              puts(x == 50 ? "pelo endereco, a escrita chegou em x" : "FALHOU");
              puts(copia == 99 && x == 50
                   ? "e a escrita na copia ficou na copia: &x nao copiou x"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          pelo endereco, a escrita chegou em x
          e a escrita na copia ficou na copia: &x nao copiou x
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      &x devolve um número: o do lugar onde x está. Nada é copiado e nada
      é movido — a caixa de x continua onde estava, com o que estava
      dentro. A operação é uma pergunta, e o que volta é a resposta.


      Copiar é outra coisa, e se escreve de outro jeito. Em int c = x; o
      conteúdo de x é duplicado numa caixa nova, e a partir daí são dois
      conteúdos independentes: mexer num não mexe no outro. Em int *p =
      &x; nada foi duplicado — p guarda o caminho até a única caixa que
      existe.


      E a diferença aparece no tempo. A cópia é um retrato do instante em
      que foi tirada, e envelhece: o que ela guarda é o que x valia
      naquele momento. O endereço não envelhece, porque ele nunca falou
      sobre o conteúdo — seguir o endereço mostra sempre o que há lá
      AGORA.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "O valor guardado num ponteiro é um endereço."
    plain_text: >
      O que está escrito no papel dentro de p é um número de casa.
    negated_by:
      - pointer_is_data

    evidencia:
      - afirma: >
          O que está guardado num ponteiro é um endereço: copiado para
          outro ponteiro, ele leva ao mesmo lugar — é um valor que diz
          onde, e não o conteúdo.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p = &x;
              int *q = p;

              *q = 7;
              puts(x == 7 ? "o valor copiado de p levou q ao mesmo lugar" : "FALHOU");
              puts(*p == 7 ? "e os dois leem o mesmo: o que esta neles e um endereco"
                           : "FALHOU");
              return 0;
          }
        espera: |-
          o valor copiado de p levou q ao mesmo lugar
          e os dois leem o mesmo: o que esta neles e um endereco
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Dentro de um ponteiro há um número, e esse número é um endereço. Não
      é o conteúdo da caixa apontada, nem uma ligação mágica com ela: é a
      informação de onde ela está, guardada como qualquer outro valor é
      guardado.


      Por isso o ponteiro se comporta como valor. Dá para copiá-lo para
      outra caixa de ponteiro, compará-lo com outro, passá-lo adiante. O
      que viaja nessas operações é o endereço — e quem o recebe passa a
      saber chegar no mesmo lugar.


      E é isso que separa p de *p. p é o conteúdo da caixa do ponteiro: o
      número do lugar. *p é o conteúdo do lugar: o int que mora lá. Os
      dois existem ao mesmo tempo, em caixas diferentes, e confundi-los é
      o que faz alguém escrever p onde queria *p.
  I1:
    type: inferencia
    role: espinha
    support: [B2, B3]
    text: "*p vai até o endereço guardado em p e age no que está lá."
    plain_text: >
      Então *p é a viagem: vai até o número do papel e mexe no que tem
      naquela casa.
    negated_by:
      - pointer_is_just_a_name

    evidencia:
      - afirma: >
          *p vai até o endereço que está em p e age no que está lá:
          troque o endereço em p e a mesma escrita cai em outra
          variável.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1, y = 2;
              int *p = &x;

              *p = 10;
              p = &y;
              *p = 20;
              puts(x == 10 ? "a primeira escrita caiu em x" : "FALHOU");
              puts(y == 20 ? "e a segunda, igualzinha, caiu em y" : "FALHOU");
              return 0;
          }
        espera: |-
          a primeira escrita caiu em x
          e a segunda, igualzinha, caiu em y
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o que o B3 já disse, usado. Se dentro de p
      há um endereço, então escrever *p é mandar o programa ler aquele
      número, ir até aquele lugar e trabalhar no que estiver lá. É uma
      viagem, e ela acontece toda vez.


      Por isso *p não é um apelido. Um apelido é fixo — aponta para a
      mesma coisa desde que foi criado. O *p depende do que está em p
      NAQUELE momento: troque o conteúdo de p e o mesmo *p, escrito igual,
      passa a chegar em outro lugar.


      E a viagem serve nos dois sentidos. Do lado direito de uma
      atribuição, *p traz o que encontrou; do lado esquerdo, deixa o que
      você mandou. O que muda é a direção, e o caminho percorrido é o
      mesmo.
  I2:
    type: inferencia
    role: espinha
    support: [I1]
    text: "*p = v escreve no objeto apontado; p continua com o mesmo endereço."
    plain_text: >
      *p = 7 troca o que tem dentro da casa visitada. O papel de p não
      muda.
    negated_by:
      - star_binds_to_the_pointer

    # O `p != &y` NAO E DECORACAO: sem ele, "x mudou duas vezes" nao
    # distingue "p ficou parado" de "p andou e voltou". Com y declarado
    # e nunca escrito, a comparacao diz que p continua no lugar de x.
    evidencia:
      - afirma: >
          *p = v escreve no objeto apontado e não mexe em p: depois de
          duas escritas, p continua levando ao mesmo lugar de antes.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1, y = 2;
              int *p = &x;

              *p = 10;
              *p = 11;
              puts(x == 11 ? "as duas escritas cairam em x" : "FALHOU");
              puts(p != &y ? "e p nao mudou de lugar: continua no de x" : "FALHOU");
              *p = 12;
              puts(x == 12 ? "tanto que a terceira escrita cai em x de novo" : "FALHOU");
              return 0;
          }
        espera: |-
          as duas escritas cairam em x
          e p nao mudou de lugar: continua no de x
          tanto que a terceira escrita cai em x de novo
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Em *p = 7, a escrita acontece no fim da viagem. O programa lê o
      endereço que está em p, vai até aquela caixa, e põe o 7 lá. O
      endereço foi LIDO para a viagem acontecer — e ler não muda nada.


      Por isso p continua igual depois. São duas caixas: a do ponteiro,
      com o número do lugar, e a do lugar, com o int. A escrita por * mexe
      na segunda, e não tem como alcançar a primeira: ela nem é o destino
      da viagem, é o ponto de partida.


      E quando a intenção é mexer no ponteiro, a escrita é outra: p = &y
      troca o número que está em p, e aí a caixa apontada é que fica
      intacta. Uma linha muda o conteúdo da casa; a outra muda o endereço
      no papel. Saber qual é qual é saber em qual das duas caixas você
      está mexendo.
  I3:
    type: inferencia
    role: conclusao
    support: [B1, B2, I1]
    text: "* e & são inversos, e cada um age num lugar: *(&x) é o próprio x."
    plain_text: >
      & pergunta onde está, * vai até lá. Um desfaz o outro, e *(&x) é a
      própria x.
    negated_by:
      - star_assigns_pointer
    evidencia:
      - afirma: >
          * e & são inversos: *(&x) é o próprio x — lê o mesmo valor, e
          escrever ali escreve em x.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 4;
              int lido = *(&x);

              puts(lido == 4 ? "*(&x) leu o que estava em x" : "FALHOU");
              *(&x) = 8;
              puts(x == 8 ? "e escrever em *(&x) escreveu em x" : "FALHOU");
              return 0;
          }
        espera: |-
          *(&x) leu o que estava em x
          e escrever em *(&x) escreveu em x
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      São dois movimentos em sentidos opostos. & sobe um nível: parte de
      uma caixa e entrega o endereço dela. * desce um nível: parte de um
      endereço e entrega a caixa que ele nomeia. Cada um age num lugar
      diferente, e nenhum dos dois muda nada por si.


      Postos em sequência, eles se cancelam. *(&x) sobe de x para o
      endereço de x e desce de volta: o que sobra é x, com o mesmo
      significado que escrever x teria. E na outra ordem vale igual: &(*p)
      desce até a caixa apontada e sobe de novo, devolvendo o próprio p.


      E é isso que diz qual nome recebe um endereço. Se *p desce um nível,
      então *p é o int — e int não guarda endereço. Quem está no nível do
      endereço é p, e é a p que se atribui. Escrever *p = (um endereço)
      manda o endereço para o lugar errado por um nível exato.
