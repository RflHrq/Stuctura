B3:
  revisao:
    frases:
      - "O tipo diz quantos passos há até o valor: int * é um nível, int ** são dois."
      - "void * guarda qualquer endereço. void ** não é um genérico de dois níveis: é o endereço de um void *."
    codigo: |
      int idade = 15;
      int *p = &idade;
      void *v;

      v = p;
      printf("%d\n", *(int *)v);
    saida: "15"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: v, tipo: ponteiro, de: void *}
    passos:
      - {linha: 1, faz: [{cria: idade}, {guarda: {em: idade, valor: 15}}]}
      - {linha: 2, faz: [{cria: p}, {aponta: {de: p, para: idade}}]}
      - {linha: 3, faz: [{cria: v}]}
      - {linha: 5, faz: [{le: p}, {aponta: {de: v, para: idade}}, {diz: 'v guarda o mesmo endereço, sem dizer o tipo da caixa'}]}
      - {linha: 6, faz: [{diz: '(int *)v diz que lá mora um int, e o * segue o bilhete'}, {segue: v}, {le: idade}, {mostra: '15'}]}
  # Protótipo de função, double e a conversão para (void **).
  fora_da_trilha: [ciu_kc10_008]
  provas:
    - crenca: voidptr_is_universal
      programa: |
        int idade;
        int *p;
        void *v;
        void **vv;

        p = &idade;
        v = &p;
        vv = &p;
      previsao:
        pergunta: >
          v é um void *, e vv é um void **. As duas últimas linhas
          guardam &p em cada um. De qual delas o compilador reclama?
        opcoes:
          - "De nenhuma: void ** serve a qualquer nível"
          - "Da última: &p não é o endereço de um void *"
        real: 1
        crenca: 0
      reclama: "incompatible pointer type"
      ambiente: >
        Mensagem do gcc 16.2. Nele a reclamação é um erro; em versões
        mais antigas, um aviso. Nos dois casos ele reclama da última
        linha, e só dela.
      afirma: >
        O compilador aceita v = &p; e reclama de vv = &p;. O void *
        guarda qualquer endereço, até o de um ponteiro. O void ** não é
        um genérico de dois níveis: é o endereço de um void *, e &p é o
        endereço de um int *.
  degraus:
    - id: esc_kc10_B3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O tipo diz quantos passos há até o valor: cada estrela da declaração é um nível, um passo."
        - "Não dá para dar um passo que o tipo não tem."
      versoes:
        - pede: "Quantos passos há de pp até o int?"
          antes: "int **pp;"
          pecas:
            - "Dois: o tipo tem duas estrelas"
            - "Um: todo ponteiro chega direto no valor"
            - "Depende de quantas estrelas você usar depois"
          certa: [[0]]
          certa_texto: "Dois: o tipo tem duas estrelas"
          erros:
            - exata: [1]
              retorno: "Cada estrela do tipo é um nível, e cada nível é um passo. int ** tem duas: de pp a um ponteiro, e dele ao int."
            - exata: [2]
              retorno: "Quem decide é a declaração, e não o uso: int ** tem dois níveis, e é só isso que se pode percorrer."
          retorno_geral: "int ** tem dois níveis: são dois passos até o int."
        - pede: "Quantos passos há de q até o int?"
          antes: "int *q;"
          pecas:
            - "Depende de quantas estrelas você usar depois"
            - "Dois: todo ponteiro passa por outro ponteiro"
            - "Um: o tipo tem uma estrela"
          certa: [[2]]
          certa_texto: "Um: o tipo tem uma estrela"
          erros:
            - exata: [1]
              retorno: "Cada estrela do tipo é um nível, e cada nível é um passo. int * tem uma só: de q direto ao int."
            - exata: [0]
              retorno: "Quem decide é a declaração, e não o uso: int * tem um nível, e é só isso que se pode percorrer."
          retorno_geral: "int * tem um nível: é um passo até o int."

    - id: esc_kc10_B3_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "void * é um ponteiro que guarda qualquer endereço, sem saber o tipo do que há lá."
        - "Para usar o que ele aponta, converte-se de volta: *(int *)v."
      versoes:
        - pede: "v recebe o endereço que está em p, e é convertido de volta para int *. Que número aparece?"
          mostra: |-
            int idade = 15;
            int *p = &idade;
            void *v;

            v = p;
            printf("%d\n", *(int *)v);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "v guarda o mesmo endereço que está em p, o de idade. Convertido de volta para int *, o * chega em idade: 15."
          retorno_geral: "v guarda o endereço de idade. Convertido para int *, chega no 15."
        - pede: "v recebe o endereço que está em q, e é convertido de volta para int *. Que número aparece?"
          mostra: |-
            int nota = 7;
            int *q = &nota;
            void *v;

            v = q;
            printf("%d\n", *(int *)v);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "0"
              retorno: "v guarda o mesmo endereço que está em q, o de nota. Convertido de volta para int *, o * chega em nota: 7."
          retorno_geral: "v guarda o endereço de nota. Convertido para int *, chega no 7."

    - id: esc_kc10_B3_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O void * guarda qualquer endereço, de qualquer nível."
        - "O void ** não é um genérico de dois níveis: é o endereço de um void *, e só disso."
      versoes:
        - pede: "v é um void *, e vv é um void **. Qual dos dois pode guardar &p, o endereço de um int *?"
          antes: |-
            int idade;
            int *p;
            void *v;
            void **vv;
          pecas:
            - "Só v: void * guarda qualquer endereço"
            - "Os dois: void * aceita qualquer coisa, e void ** serve a qualquer nível"
            - "Só vv: &p tem dois níveis, e vv também"
          certa: [[0]]
