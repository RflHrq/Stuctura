# A escada do kc_10 — ponteiro para ponteiro.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI usa ponteiro, `&` e `*` desde o kc_04, e já viu função
# receber endereço (kc_06). Em dois tópicos anteriores a escada parou na
# porta deste: "para trocar o ponteiro de quem chamou, a função
# precisaria do endereço dele" (kc_06, kc_09). É aqui que se entra.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   int **pp;  pp = &p;       a caixa de mais um nível         B1, degrau 2
#   *pp e **pp                um passo por estrela             B2, degrau 2
#   "nível"                   quantos passos até o valor       B3, degrau 1
#   void *, e *(int *)v       o ponteiro sem tipo              B3, degrau 2
#   void **                   que não é genérico               B3, degrau 3
#   função com int **pp                                        I1, degrau 2
#   int a[2][3], a[1][0]      a matriz                         I2, degrau 1
#
# O MESMO TRIO EM TODO O TÓPICO: idade, p e pp — idade guarda um número,
# p guarda o endereço de idade, pp guarda o endereço de p. A segunda
# variável, nota, entra quando alguma caixa precisa trocar de endereço.
#
# AS PROVAS, e o que cada uma usa. Quatro são saídas, e nas quatro a
# pessoa vê uma caixa trocar de endereço e o resultado acompanhar:
#
#   B1  &p entrega uma cópia     escreve por *pp, e p muda: 7
#   B2  p é outro nome de idade  p troca de variável, e idade fica: 15
#   B3  void ** é genérico       o compilador aceita v = &p; e reclama
#                                de vv = &p;
#   I1  trocar o parâmetro       a função troca a cópia, e q fica: 15
#       troca o de fora
#   I2  a matriz é int **        sizeof m e sizeof m[0]: 12 e 4
#   I3  **pp vai direto ao dado  p troca de variável, e **pp acompanha: 7
#
# A matriz das provas e dos passos de `sizeof` é de char, para o número
# ser o de caixas em qualquer máquina.
#
# AS QUESTÕES DE MARCAR. Cinco das 36 questões de diagnóstico e de treino
# usam o que as escadas não ensinam — protótipo de função, `double`,
# `static`, vetor de ponteiros e ponteiro para fileira (`int (*pp)[4]`) —
# e estão em `fora_da_trilha`. Uma sexta, a ciu_kc10_014 (I2), foi
# reescrita em 18/11/2026, com o Rafael de acordo, como as do kc_06: sem
# o protótipo, e com a alternativa certa no vocabulário do I2. Com ela o
# I2 fica com quatro questões e abre com código, como todas as premissas.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 14/11/2026; terminado por Claude Opus
#   5.5, em 18/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "p é uma caixa, e toda caixa tem endereço: &p é o endereço da caixa p."
      - "Para guardar esse endereço, a caixa tem uma estrela a mais: int **pp = &p;"
    codigo: |
      int idade = 15;
      int *p = &idade;
      int **pp = &p;

      printf("%d\n", *pp == p);
    saida: "1"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: pp, tipo: ponteiro, de: int **}
    passos:
      - {linha: 1, faz: [{cria: idade}, {guarda: {em: idade, valor: 15}}]}
      - {linha: 2, faz: [{cria: p}, {aponta: {de: p, para: idade}}]}
      - {linha: 3, faz: [{cria: pp}, {aponta: {de: pp, para: p}}]}
      - {linha: 5, faz: [{segue: pp}, {le: p}, {diz: '*pp é o que está em p: o mesmo endereço, e o C escreve 1'}, {mostra: '1'}]}
  # Protótipo de função, sem corpo.
  fora_da_trilha: [ciu_kc10_t02]
  provas:
    - crenca: ampersand_copies
      programa: |
        int idade = 15;
        int nota = 7;
        int *p = &idade;
        int **pp = &p;

        *pp = &nota;
        printf("%d\n", *p);
      previsao:
        pergunta: >
          pp guarda &p. O trecho escreve &nota por *pp, e depois mostra o
          que p alcança. O que aparece?
        opcoes:
          - "15: &p entregou uma cópia de p, e o p de verdade não mudou"
          - "7"
        real: 1
        crenca: 0
      espera: "7"
      afirma: >
        Saiu 7. &p não é uma cópia de p: é o endereço da própria caixa p.
        Por ele, *pp chegou nessa caixa e trocou o que estava lá — e p
        passou a apontar para nota.
  degraus:
    - id: esc_kc10_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Um ponteiro é uma caixa como as outras, e toda caixa tem endereço."
        - "O & dá onde a caixa fica, e não o que ela guarda."
      versoes:
        - pede: "O que &p dá, neste trecho?"
          antes: |-
            int idade = 15;
            int *p = &idade;
          pecas:
            - "O endereço da caixa p"
            - "Uma cópia de p: o & entrega uma cópia do ponteiro"
            - "O endereço de idade, que é o que p guarda"
          certa: [[0]]
          certa_texto: "O endereço da caixa p"
          erros:
            - exata: [1]
              crenca: ampersand_copies
              retorno: "O & nunca copia: ele diz ONDE a caixa fica. &p é o endereço da caixa p, e quem tiver esse endereço chega na própria p."
            - exata: [2]
              retorno: "O endereço de idade é o que está guardado DENTRO de p. &p é outra coisa: o endereço da caixa p."
          retorno_geral: "&p é o endereço da caixa p — onde ela fica, e não o que ela guarda."
        - pede: "O que &q dá, neste trecho?"
          antes: |-
            int nota = 7;
            int *q = &nota;
          pecas:
            - "O endereço de nota, que é o que q guarda"
            - "O endereço da caixa q"
            - "Uma cópia de q: o & entrega uma cópia do ponteiro"
          certa: [[1]]
          certa_texto: "O endereço da caixa q"
          erros:
            - exata: [2]
              crenca: ampersand_copies
              retorno: "O & nunca copia: ele diz ONDE a caixa fica. &q é o endereço da caixa q, e quem tiver esse endereço chega na própria q."
            - exata: [0]
              retorno: "O endereço de nota é o que está guardado DENTRO de q. &q é outra coisa: o endereço da caixa q."
          retorno_geral: "&q é o endereço da caixa q — onde ela fica, e não o que ela guarda."

    - id: esc_kc10_B1_2
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Para guardar o endereço de um int *, a caixa tem uma estrela a mais: int **pp;"
        - "pp = &p; guarda nela o endereço da caixa p."
      versoes:
        - pede: "Complete com a caixa que guarda o endereço de p."
          antes: |-
            int idade;
            int *p;
            int **pp;

            p = &idade;
          mostra: "___ = &p;"
          pecas: ["pp", "p", "idade"]
          certa: [[0]]
          certa_texto: "pp = &p;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "p guarda o endereço de um int, e &p é o endereço de um ponteiro: o compilador reclama. Quem guarda o endereço de p é a caixa de duas estrelas: pp = &p;"
            - exata: [2]
              invalida: true
              retorno: "idade guarda um número, e não um endereço: o compilador reclama. Quem guarda o endereço de p é pp: pp = &p;"
          retorno_geral: "O endereço de um int * se guarda num int **: pp = &p;"
        - pede: "Complete com a caixa que guarda o endereço de q."
          antes: |-
            int nota;
            int *q;
            int **qq;

            q = &nota;
          mostra: "___ = &q;"
          pecas: ["nota", "qq", "q"]
          certa: [[1]]
          certa_texto: "qq = &q;"
          erros:
            - exata: [2]
              invalida: true
              retorno: "q guarda o endereço de um int, e &q é o endereço de um ponteiro: o compilador reclama. Quem guarda o endereço de q é a caixa de duas estrelas: qq = &q;"
            - exata: [0]
              invalida: true
              retorno: "nota guarda um número, e não um endereço: o compilador reclama. Quem guarda o endereço de q é qq: qq = &q;"
          retorno_geral: "O endereço de um int * se guarda num int **: qq = &q;"

    - id: esc_kc10_B1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Com o endereço de p guardado em pp, *pp chega na própria caixa p."
      versoes:
        - pede: "A última linha pergunta se o que *pp alcança é igual a p. Que número aparece?"
          mostra: |-
            int idade = 15;
            int *p = &idade;
            int **pp = &p;

            printf("%d\n", *pp == p);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "0"
              retorno: "pp guarda o endereço da caixa p, e *pp chega nela: o que *pp encontra é o próprio p. A pergunta é verdadeira: 1."
            - texto: "15"
              retorno: "15 está em idade, a dois passos de pp. O printf mostra a resposta da pergunta *pp == p, que é verdadeira: 1."
          retorno_geral: "*pp chega na caixa p. O que ele encontra é o próprio p: 1."
        - pede: "A última linha pergunta se o que *qq alcança é diferente de q. Que número aparece?"
          mostra: |-
            int nota = 7;
            int *q = &nota;
            int **qq = &q;

            printf("%d\n", *qq != q);
          aceitas: ["0"]
          certa_texto: "0"
          erros:
            - texto: "1"
              retorno: "qq guarda o endereço da caixa q, e *qq chega nela: o que *qq encontra é o próprio q. Não é diferente: 0."
            - texto: "7"
              retorno: "7 está em nota, a dois passos de qq. O printf mostra a resposta da pergunta *qq != q, que é falsa: 0."
          retorno_geral: "*qq chega na caixa q. O que ele encontra é o próprio q: a resposta é 0."

    - id: esc_kc10_B1_4
      nome: "&p é o endereço da caixa p"
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int idade;
            int *p;
            int **pp;

            p = &idade;
          pecas: ["pp = &p;", "pp = p;", "pp = &idade;"]
          certa: [[0]]
          certa_texto: "pp = &p;"
          invalidas: [1, 2]
          erros:
            - exata: [1]
              retorno: "p guarda o endereço de um int, e pp espera o endereço de um ponteiro: o compilador reclama. O endereço da caixa p é &p."
            - exata: [2]
              retorno: "&idade é o endereço de um int. pp guarda o endereço de um ponteiro para int, e o compilador reclama. O que serve é &p."
          retorno_geral: "pp guarda o endereço de um ponteiro: pp = &p;"
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int nota;
            int *q;
            int **qq;

            q = &nota;
          pecas: ["qq = &nota;", "qq = q;", "qq = &q;"]
          certa: [[2]]
          certa_texto: "qq = &q;"
          invalidas: [0, 1]
          erros:
            - exata: [1]
              retorno: "q guarda o endereço de um int, e qq espera o endereço de um ponteiro: o compilador reclama. O endereço da caixa q é &q."
            - exata: [0]
              retorno: "&nota é o endereço de um int. qq guarda o endereço de um ponteiro para int, e o compilador reclama. O que serve é &q."
          retorno_geral: "qq guarda o endereço de um ponteiro: qq = &q;"

    - id: esc_kc10_B1_5
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "p começa apontando para nota. O trecho escreve outro endereço em p, por *pp. Que número aparece?"
          mostra: |-
            int idade = 15;
            int nota = 7;
            int *p = &nota;
            int **pp = &p;

            *pp = &idade;
            printf("%d\n", *p);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "7"
              retorno: "*pp é a própria caixa p: a linha *pp = &idade; trocou o endereço que p guardava. Agora *p chega em idade: 15."
          retorno_geral: "Por *pp o trecho escreveu na caixa p, que passou a apontar para idade: 15."
        - pede: "q começa apontando para idade. O trecho escreve outro endereço em q, por *qq. Que número aparece?"
          mostra: |-
            int idade = 20;
            int nota = 9;
            int *q = &idade;
            int **qq = &q;

            *qq = &nota;
            printf("%d\n", *q);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "20"
              retorno: "*qq é a própria caixa q: a linha *qq = &nota; trocou o endereço que q guardava. Agora *q chega em nota: 9."
          retorno_geral: "Por *qq o trecho escreveu na caixa q, que passou a apontar para nota: 9."

B2:
  revisao:
    frases:
      - "Cada * dá um passo: de uma caixa até a caixa cujo endereço ela guarda."
      - "*pp chega em p. **pp dá mais um passo, e chega em idade."
    codigo: |
      int idade = 15;
      int *p = &idade;
      int **pp = &p;

      printf("%d\n", **pp);
    saida: "15"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: pp, tipo: ponteiro, de: int **}
    passos:
      - {linha: 1, faz: [{cria: idade}, {guarda: {em: idade, valor: 15}}]}
      - {linha: 2, faz: [{cria: p}, {aponta: {de: p, para: idade}}]}
      - {linha: 3, faz: [{cria: pp}, {aponta: {de: pp, para: p}}]}
      - {linha: 5, faz: [{segue: pp}, {segue: p}, {le: idade}, {mostra: '15'}]}
  provas:
    - crenca: pointer_is_just_a_name
      programa: |
        int idade = 15;
        int nota = 7;
        int *p = &idade;

        p = &nota;
        *p = 0;
        printf("%d\n", idade);
      previsao:
        pergunta: >
          p começa apontando para idade, e depois recebe o endereço de
          nota. O trecho escreve 0 por *p e mostra idade. O que aparece?
        opcoes:
          - "0: p é outro nome de idade, e escrever por ele muda idade"
          - "15"
        real: 1
        crenca: 0
      espera: "15"
      afirma: >
        Saiu 15. p não é outro nome de idade: é uma caixa com um
        endereço, e o endereço foi trocado. O * deu um passo até onde p
        aponta AGORA, que é nota — e idade ficou como estava.
  degraus:
    - id: esc_kc10_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Um ponteiro não é outro nome da variável: é uma caixa à parte, que guarda um endereço."
        - "O * é um passo: sai da caixa do ponteiro e vai até a caixa cujo endereço está lá."
      versoes:
        - pede: "O que p é, neste trecho?"
          antes: |-
            int idade = 15;
            int *p = &idade;
          pecas:
            - "Uma caixa que guarda o endereço de idade"
            - "Outro nome da variável idade: o * não é um passo"
            - "Uma cópia de idade"
          certa: [[0]]
          certa_texto: "Uma caixa que guarda o endereço de idade"
          erros:
            - exata: [1]
              crenca: pointer_is_just_a_name
              retorno: "Um nome não tem lugar próprio, e p tem: é uma caixa, com o endereço de idade dentro. É por isso que *p é um passo, de p até idade."
            - exata: [2]
              retorno: "p não guarda o 15: guarda o endereço de idade. Para chegar ao 15 dá-se um passo, com *p."
          retorno_geral: "p é uma caixa com o endereço de idade. *p é o passo até lá."
        - pede: "O que q é, neste trecho?"
          antes: |-
            int nota = 7;
            int *q = &nota;
          pecas:
            - "Uma cópia de nota"
            - "Uma caixa que guarda o endereço de nota"
            - "Outro nome da variável nota: o * não é um passo"
          certa: [[1]]
          certa_texto: "Uma caixa que guarda o endereço de nota"
          erros:
            - exata: [2]
              crenca: pointer_is_just_a_name
              retorno: "Um nome não tem lugar próprio, e q tem: é uma caixa, com o endereço de nota dentro. É por isso que *q é um passo, de q até nota."
            - exata: [0]
              retorno: "q não guarda o 7: guarda o endereço de nota. Para chegar ao 7 dá-se um passo, com *q."
          retorno_geral: "q é uma caixa com o endereço de nota. *q é o passo até lá."

    - id: esc_kc10_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Com duas estrelas são dois passos: **pp vai de pp a p, e de p a idade."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade = 15;
            int *p = &idade;
            int **pp = &p;

            printf("%d\n", **pp);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "O primeiro * vai de pp até p; o segundo, de p até idade. Dois passos, e o que se acha lá é 15."
          retorno_geral: "Dois passos: de pp a p, de p a idade. Lá está o 15."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int nota = 7;
            int *q = &nota;
            int **qq = &q;

            printf("%d\n", **qq);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "0"
              retorno: "O primeiro * vai de qq até q; o segundo, de q até nota. Dois passos, e o que se acha lá é 7."
          retorno_geral: "Dois passos: de qq a q, de q a nota. Lá está o 7."

    - id: esc_kc10_B2_3
      guiado: true
      forma: escolher
      codigo: true
      frases:
        - "Um passo chega num ponteiro; dois passos chegam num int."
        - "O que cada um aceita receber é diferente: *pp recebe endereço, **pp recebe número."
      versoes:
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int idade = 15;
            int nota = 7;
            int *p = &idade;
            int **pp = &p;
          pecas: ["*pp = &nota;", "*pp = 9;", "**pp = &nota;"]
          certa: [[0]]
          certa_texto: "*pp = &nota;"
          invalidas: [1, 2]
          erros:
            - exata: [1]
              retorno: "*pp é a caixa p, que guarda endereço — e 9 é um número: o compilador reclama. Ali cabe um endereço: *pp = &nota;"
            - exata: [2]
              retorno: "**pp é a caixa idade, que guarda número — e &nota é um endereço: o compilador reclama. Endereço se escreve a um passo: *pp = &nota;"
          retorno_geral: "A um passo está p, que recebe endereço: *pp = &nota;"
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int idade = 15;
            int nota = 7;
            int *q = &nota;
            int **qq = &q;
          pecas: ["**qq = &idade;", "**qq = 9;", "*qq = 9;"]
          certa: [[1]]
          certa_texto: "**qq = 9;"
          invalidas: [0, 2]
          erros:
            - exata: [0]
              retorno: "**qq é a caixa nota, que guarda número — e &idade é um endereço: o compilador reclama. A dois passos cabe um número: **qq = 9;"
            - exata: [2]
              retorno: "*qq é a caixa q, que guarda endereço — e 9 é um número: o compilador reclama. O número se escreve a dois passos: **qq = 9;"
          retorno_geral: "A dois passos está nota, que recebe número: **qq = 9;"

    - id: esc_kc10_B2_4
      nome: "Um passo por estrela"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "O trecho escreve 9 a dois passos de pp. Que número aparece?"
          mostra: |-
            int idade = 15;
            int *p = &idade;
            int **pp = &p;

            **pp = 9;
            printf("%d\n", idade);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "15"
              retorno: "Dois passos a partir de pp: o primeiro chega em p, o segundo em idade. O 9 foi escrito em idade."
          retorno_geral: "**pp chega em idade em dois passos, e escreveu 9 lá."
        - pede: "O trecho escreve 0 a dois passos de qq. Que número aparece?"
          mostra: |-
            int nota = 7;
            int *q = &nota;
            int **qq = &q;

            **qq = 0;
            printf("%d\n", nota);
          aceitas: ["0"]
          certa_texto: "0"
          erros:
            - texto: "7"
              retorno: "Dois passos a partir de qq: o primeiro chega em q, o segundo em nota. O 0 foi escrito em nota."
          retorno_geral: "**qq chega em nota em dois passos, e escreveu 0 lá."

    - id: esc_kc10_B2_5
      guiado: false
      forma: digitar
      codigo: true
      frases: []
