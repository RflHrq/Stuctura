I3:
  revisao:
    frases:
      - "pp e p são duas caixas: pp guarda o endereço de p, e p guarda o endereço de idade."
      - "*pp chega em p. **pp passa por p, e só então chega no número."
    codigo: |
      int idade = 15;
      int *p = &idade;
      int **pp = &p;

      **pp = 9;
      printf("%d\n", *p);
    saida: "9"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: pp, tipo: ponteiro, de: int **}
    passos:
      - {linha: 1, faz: [{cria: idade}, {guarda: {em: idade, valor: 15}}]}
      - {linha: 2, faz: [{cria: p}, {aponta: {de: p, para: idade}}]}
      - {linha: 3, faz: [{cria: pp}, {aponta: {de: pp, para: p}}]}
      - {linha: 5, faz: [{segue: pp}, {segue: p}, {guarda: {em: idade, valor: 9}}]}
      - {linha: 6, faz: [{segue: p}, {le: idade}, {mostra: '9'}]}
  provas:
    - crenca: double_deref_is_data
      programa: |
        int idade = 15;
        int nota = 7;
        int *p = &idade;
        int **pp = &p;

        p = &nota;
        printf("%d\n", **pp);
      previsao:
        pergunta: >
          pp guarda &p. Depois, p passa a guardar o endereço de nota. O
          que **pp mostra?
        opcoes:
          - "7"
          - "15: **pp vai direto ao dado final, que era idade"
        real: 0
        crenca: 1
      espera: "7"
      afirma: >
        Saiu 7. **pp não vai direto a lugar nenhum: dá um passo até p, e
        outro até onde p aponta. Quando p trocou de endereço, o segundo
        passo passou a dar em nota.
  degraus:
    - id: esc_kc10_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Cada estrela é um passo, e cada passo para numa caixa."
        - "Um ponteiro para ponteiro guarda o endereço de outro ponteiro, e não o do número."
      versoes:
        - pede: "Como **pp chega no 15?"
          antes: |-
            int idade = 15;
            int *p = &idade;
            int **pp = &p;
          pecas:
            - "Em dois passos: de pp a p, e de p a idade"
            - "Direto: **pp acessa o dado final, e o nível a mais se resolve sozinho"
            - "Em um passo: pp já guarda o endereço de idade"
          certa: [[0]]
          certa_texto: "Em dois passos: de pp a p, e de p a idade"
          erros:
            - exata: [1]
              crenca: double_deref_is_data
              retorno: "Não há atalho: o primeiro * sai de pp e chega em p; o segundo sai de p e chega em idade. Se p mudar de endereço, **pp muda junto."
            - exata: [2]
              retorno: "pp guarda o endereço de p, e não o de idade. Até idade são dois passos: de pp a p, e de p a idade."
          retorno_geral: "São dois passos, e o do meio passa por p."
        - pede: "Como **qq chega no 7?"
          antes: |-
            int nota = 7;
            int *q = &nota;
            int **qq = &q;
          pecas:
            - "Em um passo: qq já guarda o endereço de nota"
            - "Em dois passos: de qq a q, e de q a nota"
            - "Direto: **qq acessa o dado final, e o nível a mais se resolve sozinho"
          certa: [[1]]
          certa_texto: "Em dois passos: de qq a q, e de q a nota"
          erros:
            - exata: [2]
              crenca: double_deref_is_data
              retorno: "Não há atalho: o primeiro * sai de qq e chega em q; o segundo sai de q e chega em nota. Se q mudar de endereço, **qq muda junto."
            - exata: [0]
              retorno: "qq guarda o endereço de q, e não o de nota. Até nota são dois passos: de qq a q, e de q a nota."
          retorno_geral: "São dois passos, e o do meio passa por q."

    - id: esc_kc10_I3_2
