I1:
  revisao:
    frases:
      - "A função que recebe p recebe uma cópia do endereço. Trocar a cópia não troca o p de quem chamou."
      - "Para trocar o p de quem chamou, ela recebe o endereço dele, &p, num int **."
    codigo: |
      void troca(int **pp, int *novo) { *pp = novo; }

      int idade = 15;
      int nota = 7;
      int *q = &idade;

      troca(&q, &nota);
      printf("%d\n", *q);
    saida: "7"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: nota, tipo: caixa, de: int}
      - {nome: q, tipo: ponteiro, de: int *}
      - {nome: troca, tipo: bancada, de: 'void troca(int **pp, int *novo)'}
      - {nome: pp, tipo: ponteiro, de: int **}
      - {nome: novo, tipo: ponteiro, de: int *}
    passos:
      - {linha: 3, faz: [{cria: idade}, {guarda: {em: idade, valor: 15}}]}
      - {linha: 4, faz: [{cria: nota}, {guarda: {em: nota, valor: 7}}]}
      - {linha: 5, faz: [{cria: q}, {aponta: {de: q, para: idade}}]}
      - {linha: 7, faz: [{chama: troca}, {cria: pp}, {aponta: {de: pp, para: q}}, {cria: novo}, {aponta: {de: novo, para: nota}}]}
      - {linha: 1, faz: [{segue: pp}, {le: novo}, {aponta: {de: q, para: nota}}, {diz: '*pp é a própria q: é nela que entra o endereço de nota'}]}
      - {linha: 7, faz: [{volta: troca}]}
      - {linha: 8, faz: [{segue: q}, {le: nota}, {mostra: '7'}]}
  # static, que é assunto do kc_12.
  fora_da_trilha: [ciu_kc10_011]
  provas:
    - crenca: modify_pp_changes_p
      programa: |
        void troca(int *p, int *novo) { p = novo; }

        int idade = 15;
        int nota = 7;
        int *q = &idade;

        troca(q, &nota);
        printf("%d\n", *q);
      previsao:
        pergunta: >
          A função troca o parâmetro p dela pelo endereço de nota. Depois
          da chamada, o trecho mostra o que q alcança. O que aparece?
        opcoes:
          - "15"
          - "7: trocar o parâmetro trocou o ponteiro de quem chamou"
        real: 0
        crenca: 1
      espera: "15"
      afirma: >
        Saiu 15. A função trocou p, a cópia dela. O q de quem chamou é
        outra caixa, e continua apontando para idade. Para trocar q, ela
        teria de receber o endereço de q.
  degraus:
    - id: esc_kc10_I1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Um parâmetro ponteiro recebe uma cópia do endereço que estava no ponteiro de quem chamou."
        - "São duas caixas: a do parâmetro, que é da função, e a de quem chamou."
      versoes:
        - pede: "A função troca o parâmetro dela. O q de quem chamou muda?"
          antes: |-
            void troca(int *p, int *novo) { p = novo; }

            int idade = 15;
            int nota = 7;
            int *q = &idade;

            troca(q, &nota);
          pecas:
            - "Não: p é uma cópia do endereço que estava em q"
            - "Muda: trocar o parâmetro ponteiro troca o ponteiro de quem chamou"
            - "Muda, mas volta quando a função termina"
          certa: [[0]]
          certa_texto: "Não: p é uma cópia do endereço que estava em q"
          erros:
            - exata: [1]
              crenca: modify_pp_changes_p
              retorno: "p é uma caixa da função, com uma cópia do endereço que estava em q. A linha p = novo; escreve em p; q é outra caixa, e fica como estava."
            - exata: [2]
              retorno: "q não muda nem por um instante: a função só escreve em p, a cópia dela. q continua apontando para idade o tempo todo."
          retorno_geral: "A função trocou a cópia. q continua apontando para idade."
