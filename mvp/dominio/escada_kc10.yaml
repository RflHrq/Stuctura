            - "Só v: void * guarda qualquer endereço"
          certa: [[2]]
          certa_texto: "Só v: void * guarda qualquer endereço"
          erros:
            - exata: [1]
              crenca: voidptr_is_universal
              retorno: "O void * serve a qualquer endereço. O void ** não: ele é o endereço de um void *, e &q é o endereço de um char *. O compilador reclama."
            - exata: [0]
              retorno: "Não basta o número de estrelas bater: vv é o endereço de um void *, e &q é o endereço de um char *. Quem aceita qualquer endereço é v."
          retorno_geral: "v, um void *, guarda qualquer endereço. vv só guarda o endereço de um void *."

    - id: esc_kc10_B3_4
      nome: "O tipo fixa os níveis"
