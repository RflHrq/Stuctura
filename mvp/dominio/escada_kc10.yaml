          erros:
            - exata: [1]
              crenca: voidptr_is_universal
              retorno: "O void * serve a qualquer endereço. O void ** não: ele é o endereço de um void *, e &p é o endereço de um int *. O compilador reclama."
            - exata: [2]
              retorno: "Não basta o número de estrelas bater: vv é o endereço de um void *, e &p é o endereço de um int *. Quem aceita qualquer endereço é v."
          retorno_geral: "v, um void *, guarda qualquer endereço. vv só guarda o endereço de um void *."
        - pede: "v é um void *, e vv é um void **. Qual dos dois pode guardar &q, o endereço de um char *?"
          antes: |-
            char letra;
            char *q;
            void **vv;
            void *v;
          pecas:
            - "Só vv: &q tem dois níveis, e vv também"
