topic: kc_07

# TÓPICO-PILOTO. É um dos quatro que a coleta usa de verdade (kc_02,
# kc_07, kc_11, kc_09), e por isso a fidelidade à curadoria pesa mais aqui
# do que nos tópicos de apoio.
#
# A METÁFORA DESTE TÓPICO: o quarteirão de casas grudadas.
#
# `int a[5]` é um quarteirão com cinco casas grudadas, numeradas em
# sequência, e o nome `a` é o nome do QUARTEIRÃO — não de uma casa. Quando
# você usa esse nome numa conta, a rua entende "o número da primeira
# casa": é um atalho. Mas em dois lugares o atalho não vale — quando você
# pergunta o TAMANHO do quarteirão, e quando pede o endereço DO
# QUARTEIRÃO.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Quarteirão" sugere que existe uma caixa guardando o quarteirão, do
#      jeito que p guarda um número. Não existe: o nome `a` não tem caixa
#      própria com um endereço dentro, e o atalho é do compilador. É
#      exatamente por isso que não dá para "trocar o quarteirão" por
#      outro, e quando a metáfora empurrar para "a é um bilhete", ela
#      cala — esse é o `array_is_pointer`, que a conclusão refuta.
#   2. A metáfora não diz nada sobre quem construiu o quarteirão nem por
#      quanto tempo ele fica. Isso é do kc_01.
#
# SETE NÓS, E A CURADORIA TEM NOVE — mas aqui a conta é outra, e melhor.
# Este é o PRIMEIRO tópico em que a curadoria tem crença para quase tudo:
# são SEIS, todas grade L e todas com entrada do FAQ. As seis estão aqui,
# cada uma no nó cuja afirmação ela nega de fato. O sétimo nó (B2) usa
# `declaration_allocates`, do kc_03 — e a própria curadoria registra que
# aquele nó é "importado de kc_03:I1".
#
# Duas dobras, as duas de premissa-e-aplicação:
#
#   curado B4 ("há contextos onde a conversão não ocorre: sizeof e &") +
#     I3 ("sizeof(a) dá o array; sizeof(p), o ponteiro") -> B4 deste grafo;
#   curado I4 ("como parâmetro, int a[] vira int *a; daí a perda do
#     tamanho") ficou, e é o I2 daqui — com a crença do tamanho perdido,
#     que é o que o FAQ 6.21 documenta.
#
# Sete nós custam ~7 passos a mais por sessão que seis. Por ser piloto,
# vale: é o tópico em que a medida tem de ser fina.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "int a[5] reserva 5 ints contíguos, e o nome vale pelo conjunto."
    plain_text: >
      int a[5] cria cinco caixas de inteiro grudadas uma na outra. O nome
      a vale para o conjunto inteiro, não para uma caixa só.
    # A AMPLIAÇÃO, de 09/11/2026. Dois fatos observáveis, e cada um
    # derruba uma metade da `array_confused_with_cell`: escrever numa
    # caixa não mexe na outra (então não é uma caixa só), e cada caixa
    # tem lugar próprio (então são cinco lugares).
    #
    # "Nesta máquina" fica escrito nos dois números, como o B2 do kc_02
    # já faz com o sizeof: tamanho de tipo é do ambiente, e afirmar 4 sem
    # ressalva seria afirmação que falha noutro laboratório. Os dois
    # números foram conferidos no compilador: 4 e 20 aqui.
    interpretation: >
      Cinco caixas, e não uma caixa com cinco coisas dentro. A diferença
      se vê escrevendo: ponha 10 em a[0], 20 em a[1], e pergunte a[0] de
      novo. Continua 10. Se fosse uma caixa só, guardar 20 nela teria
      substituído o que estava lá.


      E cada caixa tem lugar próprio. &a[0] e &a[1] respondem números
      diferentes, e a distância entre eles é o tamanho de um int — 4
      nesta máquina. Cinco endereços, cinco caixas, uma do lado da
      outra: é isso que "grudadas" quer dizer.


      O nome a é do conjunto, não de uma caixa. a[2] é uma caixa; a são
      as cinco. Por isso sizeof a dá o tamanho das cinco juntas — 20
      bytes aqui — e sizeof a[2] dá o de uma só.
    # DUAS, desde 09/11/2026, e o B1 é o único nó do tópico com duas.
    # `string_literal_is_array` é sobre literal de string (FAQ 1.32) e
    # serve aos sete itens do nó que usam `char` com literal; os outros
    # seis falam de `int a[3]`, `double dados[6]` e `long lista[8]`, e é
    # a segunda que os atende. Antes disso os seis eram atribuídos à
    # primeira, e o diagnóstico saía errado.
    negated_by:
      - string_literal_is_array
      - array_confused_with_cell

    # A EVIDENCIA DO kc_07, 12/11/2026. O `afirma` e TEXTO DE TELA --
    # `_prova` o manda inteiro ao cliente --, entao e curto; o resto fica
    # nestes comentarios.
    #
    # ESTE E O UNICO TOPICO EM QUE `array` PASSA O PORTAO: o cartao que o
    # ensina e `kc_07:B1`, e esta no inventario. Por isso aqui os
    # programas usam array a vontade -- em qualquer outro topico eles
    # ficariam barrados.
    evidencia:
      - afirma: >
          int a[5] reserva cinco ints contíguos, e o nome vale pelo
          conjunto: cada posição guarda o seu, e uma posição fica
          exatamente ao lado da outra.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[5];
              int i = 0;
              int soma = 0;

              while (i < 5) {
                  a[i] = i * 10;
                  i = i + 1;
              }
              i = 0;
              while (i < 5) {
                  soma = soma + a[i];
                  i = i + 1;
              }
              puts(soma == 100 ? "as cinco posicoes guardaram os cinco valores"
                               : "FALHOU");
              puts(&a[1] - &a[0] == 1 && &a[4] - &a[0] == 4
                   ? "e estao em fila: cada uma ao lado da anterior"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          as cinco posicoes guardaram os cinco valores
          e estao em fila: cada uma ao lado da anterior
  B2:
    type: observavel
    role: espinha
    support: []
    text: "int *p reserva só o ponteiro."
    plain_text: >
      int *p cria uma caixa só: a de p. Nenhuma caixa de inteiro nasce
      junto.
    negated_by:
      - declaration_allocates

    evidencia:
      - afirma: >
          int *p reserva só o ponteiro: ele não traz espaço para
          elemento nenhum — passa a levar ao espaço que o array já
          tinha, e escrever por ele escreve lá.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[3];
              int *p;

              a[0] = 1;
              a[1] = 2;
              a[2] = 3;
              p = a;
              *p = 70;
              puts(a[0] == 70 ? "escrever por p escreveu no espaco que era do array"
                              : "FALHOU");
              puts(a[1] == 2 && a[2] == 3
                   ? "e nada mais apareceu: p nao trouxe espaco nenhum"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          escrever por p escreveu no espaco que era do array
          e nada mais apareceu: p nao trouxe espaco nenhum
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      int *p reserva uma caixa só: a de p, para guardar um endereço.
      Nenhum int nasce junto. É a diferença de fundo entre as duas
      declarações deste tópico — int a[5] constrói cinco casas de inteiro,
      e int *p constrói zero.


      As casas, quando existem, vieram de outro lugar. Podem ser as de um
      array declarado em separado, e aí p guarda o endereço de uma delas.
      Podem ser um bloco pedido enquanto o programa roda. O que não
      acontece é o ponteiro trazer casa nenhuma consigo.


      Por isso o ponteiro é um visitante. Ele pode apontar para a primeira
      casa de um conjunto, para a terceira, ou para as casas de outro
      conjunto depois — e em nenhum desses movimentos ele cria ou destrói
      nada. O que muda é só o endereço guardado dentro dele.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "Em expressão, o nome do array converte-se no endereço do primeiro elemento."
    plain_text: >
      Quando você usa a numa conta, C troca a pelo endereço da primeira
      caixa. O que viaja é esse endereço, e não o conjunto.
    negated_by:
      - array_passed_by_reference

    evidencia:
      - afirma: >
          Em expressão, o nome do array vira o endereço do primeiro
          elemento: a e &a[0] levam ao mesmo lugar, e *a é a[0].
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[3];
              int *p = a;

              a[0] = 8;
              a[1] = 9;
              puts(p == &a[0] ? "o nome a entregou o endereco do primeiro elemento"
                              : "FALHOU");
              puts(*a == 8 ? "e *a le o primeiro elemento: *a e a[0]" : "FALHOU");
              puts(*(a + 1) == 9 ? "andando um, chega no segundo" : "FALHOU");
              return 0;
          }
        espera: |-
          o nome a entregou o endereco do primeiro elemento
          e *a le o primeiro elemento: *a e a[0]
          andando um, chega no segundo
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Quando o nome de um array aparece numa expressão, ele deixa de
      designar o conjunto e passa a valer o endereço da primeira casa. Não
      é uma conversão da chamada de função: acontece em qualquer conta, em
      qualquer atribuição a um ponteiro, em qualquer lugar onde o nome
      seja usado como valor.


      Por isso o atalho é tão invisível. Escrever int *p = a; funciona
      porque a já virou endereço antes de a atribuição acontecer, e
      escrever *a funciona porque o que está ali é um endereço, e a
      estrela viaja a partir dele.


      E é isso que explica a passagem, sem exceção nenhuma. Ao chamar
      f(a), o nome vira endereço e esse endereço é copiado para o
      parâmetro, do mesmo jeito que qualquer valor é copiado. O conjunto
      não viaja; o que viaja é um número. A função mexe no array de quem
      chamou porque tem o caminho até ele, e não porque C tenha mudado de
      regra.
  B4:
    type: observavel
    role: espinha
    support: []
    text: "Em sizeof e em & a conversão não acontece."
    plain_text: >
      Essa troca acontece quase em todo lugar. Em dois ela não acontece:
      sizeof(a) mede as caixas, e &a dá o endereço do conjunto.
    negated_by:
      - arr_equals_addr_of_arr

    # LIBERADA EM 12/11/2026. O comentario abaixo descreve o estado
    # ANTERIOR e fica como historia: o portao de exibicao passou a
    # aceitar cartao de topico ANTERIOR, pelo fecho dos pre-requisitos
    # declarados (`conceitos.anteriores`), e o kc_02 antecede
    # este topico.
    # Esta demonstracao agora chega a tela. Ver
    # `mvp/test_exibicao_por_prerequisito.py`.
    #
    # BARRADA PELO `sizeof`, que tem cartao no kc_02 e nao aqui. E a
    # premissa PEDE sizeof: ela fala dele. A demonstracao continua valendo
    # como evidencia; so nao vai para a tela de quem esta neste topico.
    #
    # AS DISTANCIAS SAO MEDIDAS, E NAO AFIRMADAS: nada aqui diz que int
    # tem 4 bytes. O que se compara e conjunto contra ponteiro, e passo de
    # &a contra passo de p -- relacoes que valem em qualquer maquina.
    evidencia:
      - afirma: >
          Em sizeof e em & a conversão não acontece: sizeof a mede o
          conjunto inteiro, não um endereço, e &a anda o array todo de
          uma vez.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[5];
              int *p = a;
              long tamanho_do_conjunto = (long) sizeof a;
              long tamanho_do_ponteiro = (long) sizeof p;
              long passo_de_a = (char *) (&a + 1) - (char *) &a[0];
              long passo_de_p = (char *) (p + 1) - (char *) p;

              puts(tamanho_do_conjunto > tamanho_do_ponteiro
                   ? "sizeof a mede o conjunto, e nao um endereco"
                   : "FALHOU");
              puts(passo_de_a == tamanho_do_conjunto
                   ? "e &a anda o array inteiro de uma vez"
                   : "FALHOU");
              puts(passo_de_p < passo_de_a
                   ? "enquanto o ponteiro anda um elemento so"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          sizeof a mede o conjunto, e nao um endereco
          e &a anda o array inteiro de uma vez
          enquanto o ponteiro anda um elemento so
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O atalho tem duas exceções, e nas duas o nome do array continua
      valendo pelo conjunto inteiro. Em sizeof a, o que se mede são todas
      as casas juntas — não o tamanho de um endereço. Em &a, o que se
      pergunta é o endereço DO CONJUNTO, e não o da primeira casa.


      Daí sai a contagem. sizeof a dividido por sizeof a[0] é o tamanho do
      conjunto dividido pelo tamanho de uma casa, e o resultado é quantas
      casas existem. A conta só fecha porque o de cima mediu o conjunto;
      se o nome tivesse virado endereço, o de cima seria o tamanho de um
      ponteiro e o resultado não significaria nada.


      E o &a tem um tipo próprio: ponteiro para o conjunto, não para uma
      casa. Ele marca o mesmo ponto da memória que a primeira casa — é por
      isso que a confusão nasce —, mas o que ele diz é outra coisa, e
      andar um passo a partir dele pula o conjunto inteiro.
  I1:
    type: inferencia
    role: espinha
    support: [B1, B4]
    text: "Não se atribui ao nome do array: ele não é modificável."
    plain_text: >
      Dá para trocar o que está dentro de cada caixa. Não dá para trocar o
      conjunto inteiro por outro.
    negated_by:
      - array_is_assignable

    evidencia:
      - afirma: >
          Não se atribui ao nome do array: ele não é um lugar
          modificável, e o compilador não aceita a atribuição.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[3];
              int outro[3];

              a = outro;
              puts(a[0] == outro[0] ? "ok" : "FALHOU");
              return 0;
          }
        nao_compila: true
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall. O que o padrão
          exige de todo compilador conforme é o diagnóstico; o que se
          observa aqui é a recusa deste.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O nome do array não é um lugar que receba valor. Ele designa o
      conjunto inteiro, e numa expressão vira o endereço da primeira casa
      — um valor calculado na hora, que não tem onde ficar guardado.
      Atribuir precisa de um destino, e ali não há destino.


      O que existe é mexer nas casas. Cada uma delas é um lugar comum, e
      recebe valor como qualquer variável: a[0] = 7 funciona, e repetir
      isso para todas as posições é como o conteúdo de um conjunto vai
      parar noutro. É a diferença entre trocar o quarteirão de lugar e
      trocar o que há dentro de cada casa.


      E é nisso que um ponteiro é diferente. Ele é uma caixa, tem lugar
      próprio, e guardar outro endereço nele é uma atribuição comum. Por
      isso p = b funciona e a = b não: um deles é um lugar onde cabe um
      endereço, e o outro é o conjunto.
  I2:
    type: inferencia
    role: espinha
    support: [B3]
    text: "Como parâmetro, int a[] é reescrito como int *a, e o tamanho se perde."
    plain_text: >
      Ao passar um array para uma função, só o endereço da primeira caixa
      viaja. Lá dentro não dá mais para saber quantas caixas eram.
    negated_by:
      - sizeof_array_via_pointer

    # O QUE ESTE PROGRAMA NAO FAZ: `sizeof a` dentro da funcao para
    # mostrar que o tamanho se perdeu. O gcc responde
    # `-Wsizeof-array-argument`, e aviso invalida evidencia. O que ele faz
    # e melhor: manda o parametro ANDAR. Nome de array nao anda -- o I1
    # deste topico e a recusa disso --, entao se ali ele anda, ali ele nao
    # e array.
    evidencia:
      - afirma: >
          Como parâmetro, int a[] é reescrito como int *a: dentro da
          função dá para mandar o nome andar, coisa que nenhum array
          aceita — porque ali ele já é um ponteiro.
        programa: |
          #include <stdio.h>

          static int segundo(int a[])
          {
              a = a + 1;
              return *a;
          }

          int main(void)
          {
              int a[3];

              a[0] = 10;
              a[1] = 20;
              a[2] = 30;
              puts(segundo(a) == 20
                   ? "dentro da funcao o nome andou, e entregou o segundo"
                   : "FALHOU");
              puts(a[0] == 10
                   ? "e o array de fora nao mexeu: o que andou foi a copia do endereco"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          dentro da funcao o nome andou, e entregou o segundo
          e o array de fora nao mexeu: o que andou foi a copia do endereco
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Escrever int v[] num parâmetro não declara um conjunto: o compilador
      reescreve aquilo como int *v. Os colchetes ficam ali como lembrete
      do que a função espera receber, e nada mais — por dentro, v é uma
      caixa de endereço como qualquer outra.


      Por isso o tamanho não chega. O que foi copiado na chamada foi um
      endereço, e endereço não carrega quantidade: ele diz onde começa, e
      não até onde vai. De dentro da função não há como descobrir quantas
      casas existem a partir dali.


      Então o tamanho viaja à parte. É por isso que tantas funções de C
      recebem um conjunto e um número — e é por isso que passar o número
      errado é um erro que o compilador não tem como apontar. Quem sabe o
      tamanho é quem declarou o conjunto.
  I3:
    type: inferencia
    role: conclusao
    support: [B2, B3, I1, I2]
    text: "Array e ponteiro são tipos distintos, ainda que a[i] e p[i] se pareçam."
    plain_text: >
      a e p são coisas diferentes, mesmo que a[i] e p[i] se escrevam do
      mesmo jeito.
    negated_by:
      - array_is_pointer
    evidencia:
      - afirma: >
          Array e ponteiro são tipos distintos, ainda que a[i] e p[i]
          deem o mesmo elemento: o ponteiro pode andar, e o nome do
          array fica parado.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a[3];
              int *p = a;
              int i = 1;

              a[0] = 1;
              a[1] = 2;
              a[2] = 3;
              puts(a[i] == p[i] ? "a[i] e p[i] dao o mesmo elemento" : "FALHOU");
              p = p + 1;
              puts(p[0] == 2 && a[0] == 1
                   ? "mas p andou e a ficou: sao tipos diferentes"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          a[i] e p[i] dao o mesmo elemento
          mas p andou e a ficou: sao tipos diferentes
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O que é igual é a escrita. a[1] e p[1] chegam no mesmo elemento
      quando p guarda o endereço do começo de a, e as duas formas se
      escrevem do mesmo jeito. Em muitos programas elas podem ser trocadas
      uma pela outra do começo ao fim, e nada acontece.


      O que é diferente é o que cada nome É. a é o conjunto: um bloco de
      casas, num lugar fixo, que não muda de endereço enquanto existe. p é
      uma caixa que guarda um endereço — e uma caixa aceita um endereço
      novo a qualquer momento.


      Por isso a semelhança tem limite, e o limite aparece quando o
      ponteiro se mexe. Enquanto p apontar para o começo de a, as duas
      escritas dizem a mesma coisa; depois que p recebe outro endereço, a
      continua onde sempre esteve e p passa a falar de outro lugar. Eram
      duas coisas o tempo todo.
