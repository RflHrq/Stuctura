# A escada do kc_07 — ponteiro e array.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI nunca viu um array. Os tópicos anteriores trabalharam
# com variáveis soltas (`idade`, `nota`), ponteiros para elas e funções
# de uma linha. Este é o tópico que mais apresenta coisa nova, e a ordem
# em que cada uma entra é esta:
#
#   int notas[3];              o array: caixas grudadas       B1, degrau 1
#   {10, 20, 30} e notas[1]    a lista e o índice              B1, degrau 2
#   sizeof e %zu               quanto espaço ocupa             B1, degrau 3
#   char nome[] = "ana";       o texto entre aspas             B1, degrau 4
#   p[1] num ponteiro                                          B2, degrau 3
#   p = notas;                 o nome vira endereço            B3, degrau 1
#   *notas                                                     B3, degrau 2
#   int v[] no parâmetro                                       B3, degrau 3
#   &v, o endereço do conjunto                                 B4, degrau 2
#
# A PALAVRA É "CAIXA". As escadas anteriores falam em variável e em
# lugar. Aqui o grafo, as razões e as 48 questões do banco falam em
# caixa ("cinco caixas de int, grudadas"), e é a palavra que deixa dizer
# que o array são várias e o ponteiro é uma só. O primeiro degrau faz a
# ponte: cada caixa é uma variável.
#
# NENHUM DEGRAU PEDE PARA DIGITAR UM TAMANHO QUE MUDA DE MÁQUINA. O
# `sizeof` entra com array de `char`, em que o número é o de caixas (um
# char ocupa 1, por definição da linguagem), e com a conta
# `sizeof notas / sizeof notas[0]`, que dá o número de caixas em
# qualquer máquina. O tamanho de um ponteiro (8 aqui, 4 em outras) só
# aparece em prova, com a nota de ambiente dizendo isso — e os arrays
# das provas têm 6 e 10 caixas, para o número nunca coincidir com o de
# um ponteiro.
#
# O B1 TEM DUAS CRENÇAS, e por isso duas provas e dois degraus guiados
# com a crença dita: "uma caixa com os valores dentro" (degrau 1) e
# "char *s e char s[] guardam do mesmo jeito" (degrau 4).
#
# AS PROVAS, e o que cada uma usa:
#
#   B1  uma caixa só             os endereços de notas[0] e notas[1]
#   B1  char * e char []         sizeof dos dois: 6 e 8
#   B2  int *p cria o dado       o compilador reclama de p[0]
#   B3  array vai por referência v = NULL na função, e notas intacto
#   B4  v e &v são o mesmo       o compilador aceita p = v; e reclama
#                                de q = &v;
#   I1  o nome recebe atribuição o compilador reclama de copia = notas;
#   I2  sizeof na função         sai 8, e não 10
#   I3  array é ponteiro         sizeof dos dois: 10 e 8
#
# AS QUESTÕES DE MARCAR. O banco do kc_07 não foi mexido. Dezesseis das
# 48 questões de diagnóstico e de treino usam o que as escadas não
# ensinam — escrever num texto entre aspas, `double` e `long`, `malloc`,
# protótipo, função de várias linhas, laço, `strcpy`, `extern`, ponteiro
# para ponteiro, a conta com endereço (`a + 1`) — e estão em
# `fora_da_trilha`, com o motivo em cada premissa.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "int notas[3]; cria três caixas de int, grudadas uma na outra."
      - "O nome notas vale para o conjunto. Cada caixa se alcança pelo número: notas[0], notas[1], notas[2]."
    codigo: |
      int notas[3] = {7, 8, 9};

      printf("%d\n", notas[2]);
    saida: "9"
  # Escrever num texto entre aspas (a escada não diz que ele não se
  # escreve); double e long.
  fora_da_trilha:
    - ciu_kc07_003
    - ciu_kc07_t03
    - mol_kc07_B1_treino_1__achar_o_erro_05
    - mol_kc07_B1_treino_1__comparar_casos_06
  provas:
    - crenca: array_confused_with_cell
      programa: |
        int notas[3] = {7, 8, 9};

        printf("%p\n", (void *)&notas[0]);
        printf("%p\n", (void *)&notas[1]);
      previsao:
        pergunta: >
          Os dois printf mostram o endereço de notas[0] e o de notas[1].
          O que aparece?
        opcoes:
          - "O mesmo endereço: os valores ficam todos numa caixa só"
          - "Dois endereços diferentes"
        real: 1
        crenca: 0
      espera: "0x1000\n0x1004"
      ambiente: >
        Os números dos lugares mudam de máquina para máquina; aqui eles
        aparecem como números de exemplo. O que foi conferido é que as
        duas linhas saem com endereços diferentes.
      afirma: >
        Saíram dois endereços diferentes. Cada valor do array tem a sua
        caixa, com o seu lugar: são três caixas, lado a lado, e não uma
        caixa com três valores dentro.
    - crenca: string_literal_is_array
      programa: |
        char nome[] = "maria";
        char *p = "maria";

        printf("%zu\n", sizeof nome);
        printf("%zu\n", sizeof p);
      previsao:
        pergunta: >
          sizeof diz quanto espaço cada variável ocupa, contado em caixas
          de char. O que os dois printf mostram?
        opcoes:
          - "Dois números diferentes"
          - "O mesmo número: as duas guardam as letras do mesmo jeito"
        real: 0
        crenca: 1
      espera: "6\n8"
      ambiente: >
        O 8 é o tamanho de um ponteiro nesta máquina; em outra pode ser
        4. O 6 não muda: são as cinco letras e a marca de fim.
      afirma: >
        Saíram 6 e 8. nome é o conjunto das seis caixas, com as letras
        dentro. p é uma caixa só, do tamanho de um endereço: as letras
        dele estão guardadas em outro lugar.
  degraus:
    - id: esc_kc07_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "int notas[3]; cria três caixas de int, grudadas uma na outra. Cada caixa é uma variável."
        - "O nome notas vale para o conjunto das três, e não para uma caixa só."
      versoes:
        - pede: "O que esta linha cria?"
          antes: "int notas[3];"
          pecas:
            - "Três caixas de int, lado a lado"
            - "Uma caixa só, com os três valores dentro"
            - "Um ponteiro, que depois aponta para três valores"
          certa: [[0]]
          certa_texto: "Três caixas de int, lado a lado"
          erros:
            - exata: [1]
              crenca: array_confused_with_cell
              retorno: "Não é uma caixa com três valores: são três caixas, cada uma com o seu lugar e o seu valor. notas é o nome do conjunto."
            - exata: [2]
              retorno: "Ponteiro nenhum nasce aqui. A linha cria as três caixas de int, e notas é o nome do conjunto delas."
          retorno_geral: "A linha cria três caixas de int, lado a lado. notas é o nome do conjunto."
        - pede: "O que esta linha cria?"
          antes: "int idades[5];"
          pecas:
            - "Cinco caixas de int, lado a lado"
            - "Uma caixa só, com os cinco valores dentro"
            - "Um ponteiro, que depois aponta para cinco valores"
          certa: [[0]]
          certa_texto: "Cinco caixas de int, lado a lado"
          erros:
            - exata: [1]
              crenca: array_confused_with_cell
              retorno: "Não é uma caixa com cinco valores: são cinco caixas, cada uma com o seu lugar e o seu valor. idades é o nome do conjunto."
            - exata: [2]
              retorno: "Ponteiro nenhum nasce aqui. A linha cria as cinco caixas de int, e idades é o nome do conjunto delas."
          retorno_geral: "A linha cria cinco caixas de int, lado a lado. idades é o nome do conjunto."

    - id: esc_kc07_B1_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "int notas[3] = {10, 20, 30}; cria as três caixas já com um valor em cada uma."
        - "Cada caixa, ou item, tem um número, e a contagem começa em 0: notas[0] é a primeira."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int notas[3] = {10, 20, 30};

            notas[0] = 7;
            printf("%d\n", notas[1]);
          aceitas: ["20"]
          certa_texto: "20"
          erros:
            - texto: "7"
              retorno: "A contagem começa em 0: o 7 foi para notas[0], a primeira caixa. notas[1] é a segunda, e continua com 20."
            - texto: "10"
              retorno: "notas[1] é a segunda caixa, e não a primeira: a contagem começa em 0. Ela guarda 20."
          retorno_geral: "notas[0] é a primeira caixa e notas[1] a segunda. A segunda guarda 20."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idades[3] = {15, 16, 17};

            idades[0] = 9;
            printf("%d\n", idades[1]);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "9"
              retorno: "A contagem começa em 0: o 9 foi para idades[0], a primeira caixa. idades[1] é a segunda, e continua com 16."
            - texto: "15"
              retorno: "idades[1] é a segunda caixa, e não a primeira: a contagem começa em 0. Ela guarda 16."
          retorno_geral: "idades[0] é a primeira caixa e idades[1] a segunda. A segunda guarda 16."

    - id: esc_kc07_B1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "sizeof diz quanto espaço uma variável ocupa, contado em caixas de char."
        - "No printf, o formato desse número é %zu."
      versoes:
        - pede: "v tem cinco caixas de char. Que número aparece?"
          mostra: |-
            char v[5];

            printf("%zu\n", sizeof v);
          aceitas: ["5"]
          certa_texto: "5"
          erros:
            - texto: "1"
              retorno: "sizeof v não mede uma caixa: mede v inteiro, que é o conjunto das cinco. Aparece 5."
          retorno_geral: "v é o conjunto das cinco caixas de char, e sizeof v mede o conjunto: 5."
        - pede: "letras tem oito caixas de char. Que número aparece?"
          mostra: |-
            char letras[8];

            printf("%zu\n", sizeof letras);
          aceitas: ["8"]
          certa_texto: "8"
          erros:
            - texto: "1"
              retorno: "sizeof letras não mede uma caixa: mede letras inteiro, que é o conjunto das oito. Aparece 8."
          retorno_geral: "letras é o conjunto das oito caixas de char, e sizeof letras mede o conjunto: 8."

    - id: esc_kc07_B1_4
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - 'char nome[] = "ana"; cria quatro caixas de char: a, n, a e uma marca de fim, o terminador.'
        - 'char *p = "ana"; cria só a caixa de p, com o endereço de letras guardadas em outro lugar.'
      versoes:
        - pede: "As duas linhas guardam as letras do mesmo jeito?"
          antes: |-
            char nome[] = "ana";
            char *p = "ana";
          pecas:
            - "Não: nome tem as quatro caixas, e p só um endereço"
            - "Sim: char nome[] e char *p guardam as letras do mesmo jeito"
            - "Não: p tem as quatro caixas, e nome só um endereço"
          certa: [[0]]
          certa_texto: "Não: nome tem as quatro caixas, e p só um endereço"
          erros:
            - exata: [1]
              crenca: string_literal_is_array
              retorno: "A escrita é parecida, mas o que nasce é diferente: nome é o conjunto das quatro caixas, com as letras dentro; p é uma caixa só, que guarda um endereço."
            - exata: [2]
              retorno: "É o contrário: quem tem as caixas com as letras é nome. p é um ponteiro: uma caixa só, com o endereço das letras."
          retorno_geral: "nome é o conjunto das quatro caixas, com as letras dentro. p é uma caixa só, com um endereço."
        - pede: "As duas linhas guardam as letras do mesmo jeito?"
          antes: |-
            char *q = "ufv";
            char sigla[] = "ufv";
          pecas:
            - "Sim: char *q e char sigla[] guardam as letras do mesmo jeito"
            - "Não: sigla tem as quatro caixas, e q só um endereço"
            - "Não: q tem as quatro caixas, e sigla só um endereço"
          certa: [[1]]
          certa_texto: "Não: sigla tem as quatro caixas, e q só um endereço"
          erros:
            - exata: [0]
              crenca: string_literal_is_array
              retorno: "A escrita é parecida, mas o que nasce é diferente: sigla é o conjunto das quatro caixas, com as letras dentro; q é uma caixa só, que guarda um endereço."
            - exata: [2]
              retorno: "É o contrário: quem tem as caixas com as letras é sigla. q é um ponteiro: uma caixa só, com o endereço das letras."
          retorno_geral: "sigla é o conjunto das quatro caixas, com as letras dentro. q é uma caixa só, com um endereço."

    - id: esc_kc07_B1_5
      nome: "Mexer numa caixa não mexe nas outras"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "O trecho zera uma das caixas e depois soma as três. Que número aparece?"
          mostra: |-
            int notas[3] = {7, 8, 9};

            notas[1] = 0;
            printf("%d\n", notas[0] + notas[1] + notas[2]);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "0"
              retorno: "O 0 foi para uma caixa só, notas[1]. As outras duas continuam com 7 e 9, e a soma dá 16."
            - texto: "24"
              retorno: "notas[1] deixou de valer 8: recebeu 0 na linha de cima. A soma é 7 mais 0 mais 9: 16."
          retorno_geral: "Só notas[1] mudou. A soma é 7 mais 0 mais 9: 16."
        - pede: "O trecho zera uma das caixas e depois soma as três. Que número aparece?"
          mostra: |-
            int idades[3] = {15, 16, 17};

            idades[0] = 0;
            printf("%d\n", idades[0] + idades[1] + idades[2]);
          aceitas: ["33"]
          certa_texto: "33"
          erros:
            - texto: "0"
              retorno: "O 0 foi para uma caixa só, idades[0]. As outras duas continuam com 16 e 17, e a soma dá 33."
            - texto: "48"
              retorno: "idades[0] deixou de valer 15: recebeu 0 na linha de cima. A soma é 0 mais 16 mais 17: 33."
          retorno_geral: "Só idades[0] mudou. A soma é 0 mais 16 mais 17: 33."

    - id: esc_kc07_B1_6
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Quantas caixas de char esta linha cria?"
          antes: 'char nome[] = "sol";'
          pecas:
            - "Quatro: as três letras e a marca de fim"
            - "Três: uma para cada letra"
            - "Uma: a de nome, com as letras dentro"
          certa: [[0]]
          certa_texto: "Quatro: as três letras e a marca de fim"
          erros:
            - exata: [1]
              retorno: "As letras são três, mas o texto entre aspas ganha uma caixa a mais, a da marca de fim. São quatro."
            - exata: [2]
              retorno: "Um array não é uma caixa com tudo dentro: cada letra tem a sua caixa, e a marca de fim também. São quatro."
          retorno_geral: "Uma caixa para cada letra, e mais a da marca de fim: quatro."
        - pede: "Quantas caixas de char esta linha cria?"
          antes: 'char cidade[] = "minas";'
          pecas:
            - "Cinco: uma para cada letra"
            - "Seis: as cinco letras e a marca de fim"
            - "Uma: a de cidade, com as letras dentro"
          certa: [[1]]
          certa_texto: "Seis: as cinco letras e a marca de fim"
          erros:
            - exata: [0]
              retorno: "As letras são cinco, mas o texto entre aspas ganha uma caixa a mais, a da marca de fim. São seis."
            - exata: [2]
              retorno: "Um array não é uma caixa com tudo dentro: cada letra tem a sua caixa, e a marca de fim também. São seis."
          retorno_geral: "Uma caixa para cada letra, e mais a da marca de fim: seis."

B2:
  revisao:
    frases:
      - "int *p; cria uma caixa só, a de p. Caixa de int, nenhuma."
      - "Para usar p[0], p recebe antes o endereço de caixas que existem: p = &notas[0];"
    codigo: |
      int notas[3] = {7, 8, 9};
      int *p;

      p = &notas[0];
      printf("%d\n", p[0]);
    saida: "7"
  # malloc.
  fora_da_trilha: [ciu_kc07_t06]
  provas:
    - crenca: declaration_allocates
      programa: |
        int notas[3];
        int *p;

        notas[0] = 1;
        p[0] = 1;
      previsao:
        pergunta: >
          As duas últimas linhas escrevem 1: uma em notas[0], a outra em
          p[0]. De qual delas o compilador reclama?
        opcoes:
          - "De nenhuma: int *p; já criou a caixa em que p[0] escreve"
          - "Da última: p não aponta para caixa nenhuma"
        real: 1
        crenca: 0
      reclama: "'p' is used uninitialized"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa
        não é executado: onde esse 1 iria parar, ninguém sabe.
      afirma: >
        O compilador reclama da última linha: p é usado sem ter recebido
        endereço ("used uninitialized"). int *p; criou a caixa do
        ponteiro, e mais nenhuma — não há caixa de int para p[0]
        escrever.
  degraus:
    - id: esc_kc07_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "int notas[3]; cria três caixas de int. int *p; cria uma caixa só: a de p."
        - "Com o ponteiro não nasce caixa de int nenhuma."
      versoes:
        - pede: "Depois destas duas linhas, quantas caixas de int existem?"
          antes: |-
            int notas[3];
            int *p;
          pecas:
            - "Três: as de notas"
            - "Quatro: as três de notas, e uma que nasceu para p apontar"
            - "Seis: p também ganha três"
          certa: [[0]]
          certa_texto: "Três: as de notas"
          erros:
            - exata: [1]
              crenca: declaration_allocates
              retorno: "int *p; cria só a caixa do ponteiro, que guarda um endereço. Caixa de int para ele apontar não nasce: são só as três de notas."
            - exata: [2]
              retorno: "p não é um array: é uma caixa só, a do ponteiro. Caixas de int, só as três de notas."
          retorno_geral: "As caixas de int são as três de notas. Com p nasce só a caixa do ponteiro."
        - pede: "Depois destas duas linhas, quantas caixas de int existem?"
          antes: |-
            int *q;
            int idades[5];
          pecas:
            - "Seis: as cinco de idades, e uma que nasceu para q apontar"
            - "Cinco: as de idades"
            - "Dez: q também ganha cinco"
          certa: [[1]]
          certa_texto: "Cinco: as de idades"
          erros:
            - exata: [0]
              crenca: declaration_allocates
              retorno: "int *q; cria só a caixa do ponteiro, que guarda um endereço. Caixa de int para ele apontar não nasce: são só as cinco de idades."
            - exata: [2]
              retorno: "q não é um array: é uma caixa só, a do ponteiro. Caixas de int, só as cinco de idades."
          retorno_geral: "As caixas de int são as cinco de idades. Com q nasce só a caixa do ponteiro."

    - id: esc_kc07_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Para servir, o ponteiro recebe o endereço de uma caixa que já existe: p = &notas[0];"
        - "Daí *p chega nela."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int notas[3] = {7, 8, 9};
            int *p;

            p = &notas[0];
            printf("%d\n", *p);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "0"
              retorno: "p não ficou vazio: recebeu o endereço de notas[0], a primeira caixa. *p chega nela, e acha 7."
            - texto: "8"
              retorno: "A contagem começa em 0: notas[0] é a primeira caixa, a do 7. É o endereço dela que p recebeu."
          retorno_geral: "p recebeu o endereço da primeira caixa de notas, e *p chega nela: 7."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idades[3] = {15, 16, 17};
            int *q;

            q = &idades[0];
            printf("%d\n", *q);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "q não ficou vazio: recebeu o endereço de idades[0], a primeira caixa. *q chega nela, e acha 15."
            - texto: "16"
              retorno: "A contagem começa em 0: idades[0] é a primeira caixa, a do 15. É o endereço dela que q recebeu."
          retorno_geral: "q recebeu o endereço da primeira caixa de idades, e *q chega nela: 15."

    - id: esc_kc07_B2_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "No ponteiro também se escreve o índice: p[0] é a caixa apontada, e p[1] a seguinte."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int notas[3] = {7, 8, 9};
            int *p;

            p = &notas[0];
            printf("%d\n", p[1]);
          aceitas: ["8"]
          certa_texto: "8"
