B4:
  revisao:
    frases:
      - "Em quase toda conta, v vira o endereço da primeira caixa. Em dois lugares, não."
      - "sizeof v mede o conjunto inteiro, e &v é o endereço do conjunto: outro tipo de endereço."
    codigo: |
      char v[10];

      printf("%zu\n", sizeof v);
    saida: "10"
  # A conta com endereço (a + 1), ponteiro para ponteiro, e comparação
  # impressa com conversão para (void *).
  fora_da_trilha: [ciu_kc07_012, ciu_kc07_t11, ciu_kc07_t12]
  provas:
    - crenca: arr_equals_addr_of_arr
      programa: |
        char v[10];
        char *p;
        char *q;

        p = v;
        q = &v;
      previsao:
        pergunta: >
          p e q apontam para char. Uma linha entrega v, a outra entrega
          &v. De qual delas o compilador reclama?
        opcoes:
          - "Da última: &v não é o mesmo que v"
          - "De nenhuma: v e &v são a mesma coisa"
        real: 0
        crenca: 1
      reclama: "incompatible pointer type"
      ambiente: >
        Mensagem do gcc 16.2. Nele a reclamação é um erro; em versões
        mais antigas, um aviso. Nos dois casos ele reclama da última
        linha, e só dela.
      afirma: >
        O compilador aceita p = v; e reclama de q = &v;. Se v e &v fossem
        a mesma coisa, as duas linhas valeriam. v vira o endereço de uma
        caixa de char; &v é o endereço do conjunto das dez.
  degraus:
    - id: esc_kc07_B4_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
