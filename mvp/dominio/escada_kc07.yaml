              retorno: "Em p = v; o nome vira o endereço da primeira caixa, e é esse endereço que p recebe. Quem fica com o conjunto inteiro é sizeof v."
            - exata: [2]
              retorno: "Em *v o nome vira o endereço da primeira caixa, e o * chega nela. Quem fica com o conjunto inteiro é sizeof v."
          retorno_geral: "Em sizeof v o nome não vira endereço: é o conjunto das dez caixas."
