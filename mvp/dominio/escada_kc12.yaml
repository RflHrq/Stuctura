I3:
  revisao:
    frases:
      - "Dá para ficar com um ponteiro apontando para o nada sem chamar free nenhuma vez: basta guardar o endereço de uma local."
      - "O jeito certo é quem chama criar a caixa e passar o endereço dela para a função preencher."
    codigo: |
      void poe(int *destino) { *destino = 7; }

      int n;
      poe(&n);
      printf("%d\n", n);
    saida: "7"
  # snprintf e %s; o operador ?:.
  fora_da_trilha: [ciu_kc12_t17, ciu_kc12_t18]
  provas:
    - crenca: local_survives_return
      programa: |
        int *f(void) { int n = 7; return &n; }

        int *p = f();
        printf("%d\n", *p);
      previsao:
        pergunta: >
          f devolve o endereço da sua local n, e o trecho lê o que p
          alcança. O que acontece?
        opcoes:
          - "O compilador reclama: n saiu no retorno, e p não leva a caixa nenhuma"
          - "7: retornar o endereço de uma local funciona, e n continua lá"
        real: 0
        crenca: 1
      reclama: "dereference of NULL 'p'"
      avisos: "-fanalyzer"
      ambiente: >
        Mensagem do gcc 16.2 com o analisador de fluxo ligado (-fanalyzer).
        Ao ver return &n, o gcc avisa e devolve NULL no lugar do endereço
        da caixa que vai sair; por isso o analisador fala em NULL. O padrão
        do C não diz o que esse endereço vale depois do retorno. O programa
        não é executado.
      afirma: >
        O compilador reclama: *p iria a lugar nenhum. n saiu no retorno de
        f, e o endereço dela não leva a caixa junto — p ficou pendente sem
        free nenhum. O jeito certo é quem chama dar a caixa.
  degraus:
    - id: esc_kc12_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Ponteiro pendente não vem só do free: o endereço de uma local, guardado depois do retorno, também aponta para o nada."
      versoes:
        - pede: "Nenhum free foi chamado. p aponta para uma caixa viva?"
          antes: |-
            int *f(void) { int n = 7; return &n; }

            int *p = f();
          pecas:
            - "Não: n saiu no retorno, e p ficou pendente"
            - "Sim: retornar o endereço de uma variável local funciona; ela continua lá"
            - "Sim: sem free, nada se perde"
          certa: [[0]]
          certa_texto: "Não: n saiu no retorno, e p ficou pendente"
          erros:
            - exata: [1]
              crenca: local_survives_return
              retorno: "A local não continua lá: n saiu no retorno de f. O endereço que voltou leva a lugar nenhum, e p ficou pendente."
            - exata: [2]
              retorno: "free não é o único jeito de perder uma caixa: a local sai sozinha no retorno. p ficou pendente sem free nenhum."
          retorno_geral: "n saiu no retorno: p ficou pendente, sem free nenhum."
        - pede: "Nenhum free foi chamado. q aponta para uma caixa viva?"
          antes: |-
            int *g(void) { int total = 3; return &total; }

            int *q = g();
          pecas:
            - "Sim: sem free, nada se perde"
            - "Sim: retornar o endereço de uma variável local funciona; ela continua lá"
            - "Não: total saiu no retorno, e q ficou pendente"
          certa: [[2]]
          certa_texto: "Não: total saiu no retorno, e q ficou pendente"
          erros:
            - exata: [1]
              crenca: local_survives_return
              retorno: "A local não continua lá: total saiu no retorno de g. O endereço que voltou leva a lugar nenhum, e q ficou pendente."
            - exata: [0]
              retorno: "free não é o único jeito de perder uma caixa: a local sai sozinha no retorno. q ficou pendente sem free nenhum."
          retorno_geral: "total saiu no retorno: q ficou pendente, sem free nenhum."

    - id: esc_kc12_I3_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "O jeito certo: quem chama cria a caixa e passa o endereço dela; a função preenche por ele, e a caixa continua viva."
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            void enche(int *destino) { *destino = 42; }

            int total = 0;
