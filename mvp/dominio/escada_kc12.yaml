I2:
  revisao:
    frases:
      - "static faz a caixa durar o programa inteiro, e o endereço dela vale depois do retorno."
      - "Mas o nome continua só de dentro da função: fora dela, n não existe."
    codigo: |
      int *f(void) { static int n = 7; return &n; }

      int *p = f();
      printf("%d\n", *p);
    saida: "7"
  # ++n.
  fora_da_trilha: [ciu_kc12_t15]
  provas:
    - crenca: static_is_scope
      programa: |
        void f(void) { static int n = 7; }

        f();
        printf("%d\n", n);
      previsao:
        pergunta: >
          n é uma local de f marcada static. Depois de chamar f, a última
          linha usa n fora de f. O que o compilador faz?
        opcoes:
          - "Aceita: static muda o escopo, e o nome n passa a valer fora de f"
          - "Reclama: o nome n continua só de dentro de f"
        real: 1
        crenca: 0
      reclama: "'n' undeclared"
      ambiente: >
        Mensagem do gcc 16.2. É um erro: o nome não existe ali. O programa
        não é executado.
      afirma: >
        O compilador reclama: fora de f, n não existe ("undeclared"). static
        muda a duração da caixa — ela dura o programa inteiro —, e não o
        escopo do nome. Por isso f pode devolver &n e o endereço vale, mas
        o nome n continua sendo só de dentro de f.
  degraus:
    - id: esc_kc12_I2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "static muda a duração: a caixa dura o programa inteiro, e o endereço dela vale depois do retorno."
        - "O nome não muda de lugar: n continua sendo um nome só de dentro da função."
