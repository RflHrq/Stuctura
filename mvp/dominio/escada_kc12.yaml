I1:
  revisao:
    frases:
      - "return n; copia o valor de n para quem chamou, e a cópia chega inteira."
      - "return &n; copia só o endereço: a caixa n fica para trás e sai no retorno."
    codigo: |
      int f(void) {
          int n = 7;
          return n;
      }

      printf("%d\n", f());
    saida: "7"
  # Diz que ali sai 0; este gcc devolve NULL no lugar do endereço da
  # local, e sai 1.
  fora_da_trilha: [ciu_kc12_t12]
  provas:
    - crenca: pointer_is_data
      programa: |
        int *f(void) { int n = 7; return &n; }

        int *p = f();
        printf("%d\n", p == NULL);
      previsao:
        pergunta: >
          f devolve &n, e p recebe o que voltou. A última linha pergunta se
          p é NULL. O que aparece?
        opcoes:
          - "0: p trouxe a própria variável n, com o 7 dentro"
          - "1"
        real: 1
        crenca: 0
      espera: "1"
      ambiente: >
        Resultado do gcc 16.2. Ao ver return &n, ele avisa ("function
        returns address of local variable") e devolve NULL no lugar do
        endereço da caixa que vai sair. O padrão do C não diz o que esse
        endereço vale depois do retorno; o gcc escolheu NULL.
      afirma: >
        Saiu 1. O que f devolveu foi um endereço, e não a variável: neste
        gcc, NULL, porque a caixa de n saiu no retorno e o endereço dela de
        nada serviria. A variável não viaja; só o endereço.
  degraus:
    - id: esc_kc12_I1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
