# A escada do kc_12 — ponteiro pendente por escopo.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI já viu `return`, a função em várias linhas, pilha e
# monte, `malloc` e `free` (kc_01), a função que recebe um endereço e
# escreve por ele (kc_06), e o ponteiro pendente que sobra do `free`
# (kc_09). Este tópico mostra o outro jeito de ficar com um ponteiro
# para o nada: sem `free` nenhum.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   static int n                 a local que dura o programa      B1, degrau 3
#   "pendente", sem free         o endereço de uma local          I3, degrau 1
#   quem chama dá a caixa        void poe(int *destino)           I3, degrau 2
#
# O resto — return &n, a cópia do valor que volta, o endereço de uma
# local entregue a outra função — usa o que os tópicos anteriores já
# apresentaram.
#
# AS PROVAS, e o que cada uma usa. Três são o que o compilador diz, e
# três são saídas:
#
#   B1  a memória é uma só       aceita devolver o bloco de malloc e
#                                reclama de devolver &n
#   B2  &n entrega uma cópia     poe(&n) dentro de f escreve na própria
#                                n: 9
#   B3  o retorno fica guardado  x = dobro(2); dobro(10); x continua 4
#   I1  retornar &n devolve a    p == NULL depois de p = f(): 1 (nota
#       variável                 de ambiente: o gcc 16.2 devolve NULL no
#                                lugar do endereço de uma local)
#   I2  static muda o escopo     o compilador reclama de usar n fora de
#                                f, mesmo com static
#   I3  a local continua lá      o analisador reclama de *p, com p vindo
#                                de return &n
#
# O GCC E O ENDEREÇO DE UMA LOCAL. Ao ver return &n, o gcc 16.2 avisa
# ("function returns address of local variable") e devolve NULL no lugar.
# O padrão do C não diz o que esse endereço vale depois do retorno; o gcc
# escolheu NULL. Por isso a prova do I1 imprime 1, e por isso a questão
# ciu_kc12_t12, que diz que ali sai 0, fica fora da trilha (ver abaixo).
# A premissa do I2 diz que o erro "às vezes parece funcionar": é verdade
# em C, quando o lugar ainda guarda o valor, mas não neste gcc com
# return &n. A escada diz a ideia sem prometer que a pessoa vai ver.
#
# AS QUESTÕES DE MARCAR. Sete das 36 questões de diagnóstico e de treino
# ficam fora: seis usam o que as escadas não ensinam — variável global,
# `n++` e `++n`, protótipo sem corpo, `%s`, `snprintf` e o `?:` — e a
# t12 afirma uma saída que este gcc não dá. O banco não foi mexido. Todas
# as premissas abrem com questão de código.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Opus 5.5, em 18/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "As caixas criadas dentro de uma função existem enquanto ela roda. Quando ela retorna, deixam de existir, sozinhas."
      - "Cada chamada cria caixas novas: a anterior não deixa nada para a seguinte."
    codigo: |
      int dobra(void) {
          int n = 3;
          n = n + n;
          return n;
      }

      dobra();
      printf("%d\n", dobra());
    saida: "6"
  # Variável global.
  fora_da_trilha: [ciu_kc12_002]
  provas:
    - crenca: memory_is_uniform
      programa: |
        int *a(void) { int *p = malloc(sizeof(int)); return p; }
        int *b(void) { int n = 1; return &n; }

        free(a());
        b();
      previsao:
        pergunta: >
          a devolve o endereço de um bloco de malloc, e b o endereço da
          sua local n. De qual das duas o compilador reclama?
        opcoes:
          - "De b: n sai no retorno, e o bloco de malloc fica"
          - "De nenhuma: memória é uma só, e as duas devolvem um endereço"
        real: 0
        crenca: 1
      reclama: "function returns address of local variable"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa não
        é executado.
      afirma: >
        O compilador aceita a, que devolve o endereço do bloco, e reclama
        de b, que devolve &n. As duas caixas seguem regras de vida
        diferentes: o bloco de malloc fica até o free; a local sai,
        sozinha, no retorno.
  degraus:
    - id: esc_kc12_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "As caixas criadas dentro de uma função existem enquanto ela roda."
        - "Quando a função retorna, essas caixas deixam de existir, sozinhas: ninguém precisa mandar apagar."
      versoes:
        - pede: "conta terminou. O que aconteceu com a caixa n?"
          antes: |-
            int conta(void) { int n = 7; return n; }

            conta();
          pecas:
            - "Deixou de existir, sozinha, no retorno"
            - "Nada: memória é uma região única, sem distinção de regras de vida"
            - "Continua lá até alguém chamar free"
          certa: [[0]]
          certa_texto: "Deixou de existir, sozinha, no retorno"
          erros:
            - exata: [1]
              crenca: memory_is_uniform
              retorno: "A memória tem regras de vida diferentes: uma caixa criada dentro da função dura só enquanto ela roda. n saiu, sozinha, no retorno."
            - exata: [2]
              retorno: "free é para blocos de malloc. n é uma caixa da função: sai sozinha no retorno, sem ninguém mandar."
          retorno_geral: "n é uma caixa da função: deixou de existir, sozinha, quando conta retornou."
        - pede: "soma terminou. O que aconteceu com a caixa total?"
          antes: |-
            int soma(void) { int total = 4; return total; }

            soma();
          pecas:
            - "Continua lá até alguém chamar free"
            - "Deixou de existir, sozinha, no retorno"
            - "Nada: memória é uma região única, sem distinção de regras de vida"
          certa: [[1]]
          certa_texto: "Deixou de existir, sozinha, no retorno"
          erros:
            - exata: [2]
              crenca: memory_is_uniform
              retorno: "A memória tem regras de vida diferentes: uma caixa criada dentro da função dura só enquanto ela roda. total saiu, sozinha, no retorno."
            - exata: [0]
              retorno: "free é para blocos de malloc. total é uma caixa da função: sai sozinha no retorno, sem ninguém mandar."
          retorno_geral: "total é uma caixa da função: deixou de existir, sozinha, quando soma retornou."

    - id: esc_kc12_B1_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Cada chamada cria caixas novas. O que a chamada anterior deixou nas dela não está mais lá."
      versoes:
        - pede: "A função é chamada duas vezes, e só a segunda é mostrada. Que número aparece?"
          mostra: |-
            int passo(void) {
                int n = 1;
                n = n + 1;
                return n;
            }

            passo();
            printf("%d\n", passo());
          aceitas: ["2"]
          certa_texto: "2"
          erros:
            - texto: "3"
              retorno: "A primeira chamada levou o seu n a 2, mas essa caixa saiu no retorno. A segunda cria outro n, que começa em 1: 2."
            - texto: "1"
              retorno: "Dentro de passo, n começa em 1 e vira 2 antes do return. A chamada mostrada devolve 2."
          retorno_geral: "Cada chamada cria o seu n, que começa em 1 e vira 2. A segunda devolve 2."
        - pede: "A função é chamada duas vezes, e só a segunda é mostrada. Que número aparece?"
          mostra: |-
            int soma(void) {
                int total = 5;
                total = total + 5;
                return total;
            }

            soma();
            printf("%d\n", soma());
          aceitas: ["10"]
          certa_texto: "10"
          erros:
            - texto: "15"
              retorno: "A primeira chamada levou o seu total a 10, mas essa caixa saiu no retorno. A segunda cria outro total, que começa em 5: 10."
            - texto: "5"
              retorno: "Dentro de soma, total começa em 5 e vira 10 antes do return. A chamada mostrada devolve 10."
          retorno_geral: "Cada chamada cria o seu total, que começa em 5 e vira 10. A segunda devolve 10."

    - id: esc_kc12_B1_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Um bloco de malloc segue outra regra: fica até o free. Uma local marcada static também: dura o programa inteiro."
      versoes:
        - pede: "Qual das duas devolve um endereço que ainda vale depois do retorno?"
          antes: |-
            int *a(void) { int *p = malloc(sizeof(int)); return p; }
            int *b(void) { int n = 1; return &n; }
          pecas:
            - "a: o bloco de malloc fica até o free"
            - "b: n continua lá depois do retorno"
            - "As duas: memória é uma região única, sem distinção de regras de vida"
          certa: [[0]]
          certa_texto: "a: o bloco de malloc fica até o free"
          erros:
            - exata: [2]
              crenca: memory_is_uniform
              retorno: "As duas caixas seguem regras diferentes: o bloco de malloc fica até o free; a local n sai no retorno de b. Só o endereço de a ainda vale."
            - exata: [1]
              retorno: "n é local de b: sai no retorno. O endereço que b devolve leva a uma caixa que não existe mais."
          retorno_geral: "Só o bloco de malloc dura depois do retorno: a devolve um endereço que vale."
        - pede: "Qual das duas devolve um endereço que ainda vale depois do retorno?"
          antes: |-
            int *a(void) { int n = 2; return &n; }
            int *b(void) { static int n = 2; return &n; }
          pecas:
            - "a: o n dela continua lá depois do retorno"
            - "As duas: memória é uma região única, sem distinção de regras de vida"
            - "b: o n marcado static dura o programa inteiro"
          certa: [[2]]
          certa_texto: "b: o n marcado static dura o programa inteiro"
          erros:
            - exata: [1]
              crenca: memory_is_uniform
              retorno: "As duas caixas seguem regras diferentes: a local comum sai no retorno; a marcada static dura o programa. Só o endereço de b ainda vale."
            - exata: [0]
              retorno: "O n de a é uma local comum: sai no retorno. O endereço que a devolve leva a uma caixa que não existe mais."
          retorno_geral: "Só a local marcada static dura depois do retorno: b devolve um endereço que vale."

    - id: esc_kc12_B1_4
      nome: "As locais saem sozinhas no retorno"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "A função é chamada três vezes, e só a terceira é mostrada. Que número aparece?"
          mostra: |-
            int marca(void) {
                int pontos = 10;
                pontos = pontos + 1;
                return pontos;
            }

            marca();
            marca();
            printf("%d\n", marca());
          aceitas: ["11"]
          certa_texto: "11"
          erros:
            - texto: "13"
              retorno: "Cada chamada cria o seu pontos, que começa em 10. O das chamadas anteriores saiu no retorno: a terceira devolve 11."
            - texto: "10"
              retorno: "Dentro de marca, pontos começa em 10 e vira 11 antes do return: 11."
          retorno_geral: "Cada chamada cria o seu pontos, que começa em 10 e vira 11. A terceira devolve 11."
        - pede: "A função é chamada três vezes, e só a terceira é mostrada. Que número aparece?"
          mostra: |-
            int vez(void) {
                int n = 0;
                n = n + 2;
                return n;
            }

            vez();
            vez();
            printf("%d\n", vez());
          aceitas: ["2"]
          certa_texto: "2"
          erros:
            - texto: "6"
              retorno: "Cada chamada cria o seu n, que começa em 0. O das chamadas anteriores saiu no retorno: a terceira devolve 2."
            - texto: "0"
              retorno: "Dentro de vez, n começa em 0 e vira 2 antes do return: 2."
          retorno_geral: "Cada chamada cria o seu n, que começa em 0 e vira 2. A terceira devolve 2."

    - id: esc_kc12_B1_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "É preciso chamar free para a caixa n deixar de existir?"
          antes: "void f(void) { int n = 7; }"
          pecas:
            - "Não: n sai sozinha quando f retorna"
            - "Sim: sem free, n fica para sempre"
            - "Sim: toda caixa segue a mesma regra"
          certa: [[0]]
          certa_texto: "Não: n sai sozinha quando f retorna"
          erros:
            - exata: [1]
              retorno: "free é para blocos de malloc. n é uma caixa de f: sai sozinha quando f retorna."
            - exata: [2]
              retorno: "As caixas não seguem todas a mesma regra: a local sai no retorno, e o bloco de malloc fica até o free."
          retorno_geral: "n é uma caixa de f: sai sozinha no retorno, sem free."
        - pede: "É preciso chamar free para a caixa total deixar de existir?"
          antes: "int g(void) { int total = 0; return total; }"
          pecas:
            - "Sim: toda caixa segue a mesma regra"
            - "Sim: sem free, total fica para sempre"
            - "Não: total sai sozinha quando g retorna"
          certa: [[2]]
          certa_texto: "Não: total sai sozinha quando g retorna"
          erros:
            - exata: [1]
              retorno: "free é para blocos de malloc. total é uma caixa de g: sai sozinha quando g retorna."
            - exata: [0]
              retorno: "As caixas não seguem todas a mesma regra: a local sai no retorno, e o bloco de malloc fica até o free."
          retorno_geral: "total é uma caixa de g: sai sozinha no retorno, sem free."

B2:
  revisao:
    frases:
      - "Enquanto a função roda, o endereço de uma caixa dela é um endereço como outro qualquer."
      - "Por ele dá para escrever na própria caixa, ali dentro ou em outra função."
    codigo: |
      void f(void) {
          int n = 5;
          int *p = &n;
          *p = 8;
          printf("%d\n", n);
      }

      f();
    saida: "8"
  provas:
    - crenca: ampersand_copies
      programa: |
        void poe(int *d) { *d = 9; }
        void f(void) { int n = 7; poe(&n); printf("%d\n", n); }

        f();
      previsao:
        pergunta: >
          f entrega &n a poe, que escreve 9 pelo endereço recebido. Depois
          f mostra n. O que aparece?
        opcoes:
          - "7: &n entregou uma cópia de n, e poe escreveu na cópia"
          - "9"
        real: 1
        crenca: 0
      espera: "9"
      afirma: >
        Saiu 9. &n não é uma cópia de n: é o endereço da própria caixa n,
        e enquanto f roda ele vale como qualquer outro. Por ele, poe
        escreveu na n de f.
  degraus:
    - id: esc_kc12_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Enquanto a função roda, &n é o endereço da caixa n: um endereço como outro qualquer."
        - "&n não é uma cópia de n: é onde a própria n está."
      versoes:
        - pede: "f está rodando. O que &n dá?"
          antes: |-
            void f(void) {
                int n = 7;
                int *p = &n;
            }
          pecas:
            - "O endereço da caixa n, que vale enquanto f roda"
            - "Uma cópia de n: &x entrega uma cópia de x, e é a cópia que viaja"
            - "Um endereço que vale para sempre"
          certa: [[0]]
          certa_texto: "O endereço da caixa n, que vale enquanto f roda"
          erros:
            - exata: [1]
              crenca: ampersand_copies
              retorno: "O & nunca copia: &n é o endereço da própria caixa n. Enquanto f roda, ele vale como qualquer outro endereço."
            - exata: [2]
              retorno: "Vale enquanto f roda: quando f retorna, a caixa n sai, e o endereço fica sem caixa."
          retorno_geral: "&n é o endereço da caixa n, e vale enquanto f roda."
        - pede: "g está rodando. O que &total dá?"
          antes: |-
            void g(void) {
                int total = 3;
                int *q = &total;
            }
          pecas:
            - "Um endereço que vale para sempre"
            - "O endereço da caixa total, que vale enquanto g roda"
            - "Uma cópia de total: &x entrega uma cópia de x, e é a cópia que viaja"
          certa: [[1]]
          certa_texto: "O endereço da caixa total, que vale enquanto g roda"
          erros:
            - exata: [2]
              crenca: ampersand_copies
              retorno: "O & nunca copia: &total é o endereço da própria caixa total. Enquanto g roda, ele vale como qualquer outro endereço."
            - exata: [0]
              retorno: "Vale enquanto g roda: quando g retorna, a caixa total sai, e o endereço fica sem caixa."
          retorno_geral: "&total é o endereço da caixa total, e vale enquanto g roda."

    - id: esc_kc12_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Por p, dá para escrever na própria n enquanto f roda."
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            void f(void) {
                int n = 1;
                int *p = &n;
                *p = 4;
                printf("%d\n", n);
            }

            f();
          aceitas: ["4"]
          certa_texto: "4"
          erros:
            - texto: "1"
              retorno: "p guarda o endereço da própria n, e não de uma cópia. *p = 4 escreveu em n: 4."
          retorno_geral: "*p = 4 escreveu na própria n, pelo endereço: 4."
        - pede: "Que número aparece?"
          mostra: |-
            void g(void) {
                int total = 2;
                int *q = &total;
                *q = 6;
                printf("%d\n", total);
            }

            g();
          aceitas: ["6"]
          certa_texto: "6"
          erros:
            - texto: "2"
              retorno: "q guarda o endereço da própria total, e não de uma cópia. *q = 6 escreveu em total: 6."
          retorno_geral: "*q = 6 escreveu na própria total, pelo endereço: 6."

    - id: esc_kc12_B2_3
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Esse endereço pode ir para outra função enquanto a dona da caixa roda: zera(&n) entrega a caixa n, e zera escreve nela."
      versoes:
        - pede: "Complete a chamada para zera escrever em n."
          antes: |-
            void zera(int *d) { *d = 0; }

            int n = 7;
          mostra: "zera(___);"
          pecas: ["&n", "n", "*n"]
          certa: [[0]]
          certa_texto: "zera(&n);"
          erros:
            - exata: [1]
              invalida: true
              retorno: "n é um int, e zera quer um endereço: o compilador reclama. A caixa n vai pelo endereço: zera(&n)."
            - exata: [2]
              invalida: true
              retorno: "*n não existe: n é um int, e não um ponteiro. O compilador reclama. O que serve é zera(&n)."
          retorno_geral: "zera recebe o endereço da caixa: zera(&n);"
        - pede: "Complete a chamada para zera escrever em total."
          antes: |-
            void zera(int *d) { *d = 0; }

            int total = 3;
          mostra: "zera(___);"
          pecas: ["*total", "&total", "total"]
          certa: [[1]]
          certa_texto: "zera(&total);"
          erros:
            - exata: [2]
              invalida: true
              retorno: "total é um int, e zera quer um endereço: o compilador reclama. A caixa total vai pelo endereço: zera(&total)."
            - exata: [0]
              invalida: true
              retorno: "*total não existe: total é um int, e não um ponteiro. O compilador reclama. O que serve é zera(&total)."
          retorno_geral: "zera recebe o endereço da caixa: zera(&total);"

    - id: esc_kc12_B2_4
      nome: "Enquanto a função roda, o endereço da local vale"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            void soma1(int *d) { *d = *d + 1; }
            void f(void) { int n = 4; soma1(&n); printf("%d\n", n); }

            f();
          aceitas: ["5"]
          certa_texto: "5"
          erros:
            - texto: "4"
              retorno: "f entregou &n, o endereço da própria n. soma1 escreveu por ele: n passou a 5."
          retorno_geral: "soma1 escreveu na n de f, pelo endereço: 5."
        - pede: "Que número aparece?"
          mostra: |-
            void dobra(int *d) { *d = *d + *d; }
            void g(void) { int total = 3; dobra(&total); printf("%d\n", total); }

            g();
          aceitas: ["6"]
          certa_texto: "6"
          erros:
            - texto: "3"
              retorno: "g entregou &total, o endereço da própria total. dobra escreveu por ele: total passou a 6."
          retorno_geral: "dobra escreveu na total de g, pelo endereço: 6."

    - id: esc_kc12_B2_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "f entrega &n a zera, enquanto roda. O que viaja?"
          antes: "void f(void) { int n = 7; zera(&n); }"
          pecas:
            - "O endereço da caixa n"
            - "Uma cópia de n"
            - "A caixa n inteira"
          certa: [[0]]
          certa_texto: "O endereço da caixa n"
          erros:
            - exata: [1]
              retorno: "O & não copia: o que viaja é o endereço da própria n. Por ele, zera chega na caixa de f."
            - exata: [2]
