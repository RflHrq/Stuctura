            - "Uma cópia do 7"
          certa: [[0]]
          certa_texto: "Uma cópia do endereço de n; a caixa n fica para trás"
          erros:
            - exata: [1]
              crenca: pointer_is_data
              retorno: "O ponteiro não é o dado: é o endereço dele. return &n copia o endereço, e a caixa n fica para trás, saindo no retorno."
            - exata: [2]
              retorno: "Quem devolve uma cópia do 7 é return n;. return &n devolve o endereço de n, e a caixa fica para trás."
          retorno_geral: "f entrega o endereço de n; a caixa n fica para trás e sai no retorno."
        - pede: "O que g entrega a quem chamou?"
