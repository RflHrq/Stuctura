# A escada do kc_00 — declaração de variáveis.
#
# O QUE É. Para cada premissa do tópico, a sequência de degraus que leva
# do mais mecânico até a ideia (docs/trilha.md, 6.16). Explicar e
# exercitar são a mesma sequência: um degrau guiado é uma ou duas frases
# e um exercício pequeno; um degrau de prática é só o exercício. É o
# caminho de quem não sabe e de quem escolheu "Me explique antes"; quem
# acerta firme a pergunta da premissa não passa por aqui.
#
# QUEM LÊ ESTE ARQUIVO é `mvp/trilha_escada.py`. Quem o confere com o
# compilador é `scripts/confere_escada.py`: toda linha dita certa
# compila, toda linha dita inválida é recusada, e todo valor esperado é
# o que o programa imprime. O texto corrido, para leitura humana, está
# em `docs/escada-kc00-leitura.md`.
#
# A RÉGUA DO TEXTO (6.16), que este arquivo segue:
#   1. um degrau, uma ideia; no máximo duas frases curtas;
#   2. só usa o que um degrau anterior ensinou — nada de tamanho,
#      conversão, ponteiro ou comentário;
#   3. primeiro o que se faz, depois a ideia;
#   4. código que um iniciante escreveria;
#   5. cada degrau muda uma coisa em relação ao anterior;
#   6. todo erro previsto tem retorno próprio, que diz o que faltou;
#   7. analogia não entra no lugar do passo.
#
# UM CENÁRIO SÓ, do começo ao fim: `idade` e `nota` (int) e `turma`
# (char). A segunda versão de cada degrau — a que aparece quando a pessoa
# erra a primeira — troca nomes e valores: `ano`, `pontos`, `inicial`.
#
# O `printf` ENTRA NO B3, e não antes: é lá que ler uma variável passa a
# ser o assunto. B1 e B2 não mostram saída nenhuma.
#
# NO B3 NADA É EXECUTADO. Os trechos que leem antes de escrever estão lá
# para a pessoa ESCOLHER e ORDENAR; o conferidor só os compila. Rodá-los
# seria o comportamento que a premissa ensina a evitar.
#
# A CRENÇA DE CADA PREMISSA aparece numa alternativa de um degrau
# guiado, e só ali o erro leva `crenca`. Em quatro das cinco ela é DITA
# com todas as letras ("Tanto faz: o tipo é só um aviso"). No I1 não há
# como dizê-la sem escrever o código que ela produz: a alternativa é a
# linha `7 = nota;`, que é a crença em ação — o mesmo exemplo que o
# grafo do tópico usa. Uma resposta errada que apenas combina com uma
# crença não é atribuída a ela.
#
# "RECLAMA", E NÃO "NÃO COMPILA", nos retornos: que o compilador recuse
# é fato sobre um compilador; que ele tenha de reclamar é o que o padrão
# exige de todos. É a regra que o projeto já segue nos cartões.
#
# COPIAR DE OUTRA VARIÁVEL (`nota = pontos;`) é ensinado no degrau 5 do
# I1, guiado, antes de ser cobrado no último. A primeira versão cobrava
# sem ensinar, e a revisão do ramo pegou.
#
# AS PROVAS. Cada premissa traz, em `provas`, a demonstração que responde
# à crença que a nega — a tela "a máquina respondeu" de quem DISSE a
# crença. A primeira versão da trilha mostrava ali a demonstração do
# grafo, escrita para o examinador (`#include`, `main`, um `puts` com
# condição): era a tela mais difícil da sessão. Aqui a prova é o trecho
# que um iniciante escreveria, com os nomes dos degraus, e vem depois de
# uma PREVISÃO: a pessoa diz o que acha que a máquina vai fazer, e só
# então vê. `real` é a alternativa que a máquina confirma; `crenca`, a
# que a crença espera.
#
# Três das cinco provas são o que o compilador DIZ, e não uma saída
# (`reclama`): os trechos do B2 e do B3 leem variável sem valor, e não
# são executados nunca. A mensagem é a do gcc, em inglês, como ela sai;
# a frase de `afirma` diz em português o que ela quer dizer.
#
# A PROVA DO B2 USA `nota = idade;`, que só é ensinado no I1. Ela não
# pede que a pessoa escreva a linha: a pergunta da previsão diz o que a
# linha faz. Sem ler uma variável não há como o compilador dizer que ela
# existe e está sem valor — e é essa a frase que responde à crença.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "Toda declaração tem o tipo, o nome e o ponto e vírgula, nessa ordem."
      - "O tipo decide o que cabe: int para número inteiro, char para um caractere."
    codigo: |
      int idade;
      char turma;
    saida: ""
  # A cena (docs/interface.md, seção 8): cada linha da revisão, e o que
  # ela fez. Conferida contra o compilador por scripts/confere_escada.py.
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: turma, tipo: caixa, de: char}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 2, faz: [{cria: turma}]}
  provas:
    - crenca: type_is_a_hint
      programa: |
        int idade;
        char turma;

        idade = 300;
        turma = 300;
      previsao:
        pergunta: "O compilador reclama de alguma destas linhas?"
        opcoes:
          - "Não: 300 cabe nas duas variáveis"
          - "Sim, de idade = 300;"
          - "Sim, de turma = 300;"
        real: 2
        crenca: 0
      reclama: "overflow in conversion from 'int' to 'char' changes value from '300' to '44'"
      ambiente: >
        Mensagem do gcc 16.2 para a linha de turma. Outro compilador
        reclama com outras palavras.
      afirma: >
        O mesmo 300 coube em idade e não coube em turma: o compilador avisa
        que, num char, o valor mudaria para 44. O tipo não é só um aviso —
        é ele que decide o que cabe na variável.
  degraus:
    - id: esc_kc00_B1_1
      guiado: true
      forma: tocar
      codigo: true
      frases:
        - "Para guardar um valor, o programa pede ao C uma variável."
        - "O pedido tem três partes: o tipo, o nome e um ponto e vírgula no fim."
      versoes:
        - pede: "Toque no nome da variável."
          mostra: "int idade;"
          pecas: ["int", "idade", ";"]
          certa: [[1]]
          certa_texto: "idade"
          erros:
            - exata: [0]
              retorno: "int é o tipo: diz que ali vai um número inteiro. O nome é a palavra que você escolhe: idade."
            - exata: [2]
              retorno: "O ponto e vírgula só fecha a linha. O nome é a palavra que você escolhe: idade."
          retorno_geral: "O nome é a palavra do meio, a que você escolhe: idade."
        - pede: "Toque no nome da variável."
          mostra: "int ano;"
          pecas: ["int", "ano", ";"]
          certa: [[1]]
          certa_texto: "ano"
          erros:
            - exata: [0]
              retorno: "int é o tipo: diz que ali vai um número inteiro. O nome é a palavra que você escolhe: ano."
            - exata: [2]
              retorno: "O ponto e vírgula só fecha a linha. O nome é a palavra que você escolhe: ano."
          retorno_geral: "O nome é a palavra do meio, a que você escolhe: ano."

    - id: esc_kc00_B1_2
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Agora é você quem escreve o pedido."
        - "A ordem é sempre a mesma: primeiro o tipo, depois o nome, e o ponto e vírgula fecha."
      versoes:
        - pede: "Declare uma variável inteira chamada nota."
          pecas: ["int", "nota", ";", "idade"]
          certa: [[0, 1, 2]]
          certa_texto: "int nota;"
          erros:
            - exata: [1, 0, 2]
              invalida: true
              retorno: "Em C o tipo vem primeiro e o nome depois: int nota;"
            - exata: [0, 3, 2]
              retorno: "Essa linha declara idade. O nome pedido era nota: int nota;"
            - sem: [2]
              invalida: true
              retorno: "Faltou o ponto e vírgula. Toda declaração termina com ele: int nota;"
          retorno_geral: "A declaração é o tipo, o nome e o ponto e vírgula: int nota;"
        - pede: "Declare uma variável inteira chamada ano."
          pecas: ["int", "ano", ";", "nota"]
          certa: [[0, 1, 2]]
          certa_texto: "int ano;"
          erros:
            - exata: [1, 0, 2]
              invalida: true
              retorno: "Em C o tipo vem primeiro e o nome depois: int ano;"
            - exata: [0, 3, 2]
              retorno: "Essa linha declara nota. O nome pedido era ano: int ano;"
            - sem: [2]
              invalida: true
              retorno: "Faltou o ponto e vírgula. Toda declaração termina com ele: int ano;"
          retorno_geral: "A declaração é o tipo, o nome e o ponto e vírgula: int ano;"

    - id: esc_kc00_B1_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O tipo diz que espécie de valor cabe na variável."
        - "int guarda um número inteiro, como 20. char guarda um caractere, como 'B'."
      versoes:
        - pede: "Qual declaração serve para guardar a letra de uma turma, como 'B'?"
          pecas:
            - "char turma;"
            - "int turma;"
            - "Tanto faz: o tipo é só um aviso"
          certa: [[0]]
          certa_texto: "char turma;"
          erros:
            - exata: [1]
              retorno: "int é para número inteiro. Uma letra pede char: char turma;"
            - exata: [2]
              crenca: type_is_a_hint
              retorno: "O tipo não é só um aviso: é ele que decide o que cabe na variável. Uma letra pede char: char turma;"
          retorno_geral: "Para guardar uma letra, o tipo é char: char turma;"
        - pede: "Qual declaração serve para guardar a idade de uma pessoa, como 20?"
          pecas:
            - "int idade;"
            - "char idade;"
            - "Tanto faz: o tipo é só um aviso"
          certa: [[0]]
          certa_texto: "int idade;"
          erros:
            - exata: [1]
              retorno: "char é para um caractere, como uma letra. Um número inteiro pede int: int idade;"
            - exata: [2]
              crenca: type_is_a_hint
              retorno: "O tipo não é só um aviso: é ele que decide o que cabe na variável. Um número inteiro pede int: int idade;"
          retorno_geral: "Para guardar um número inteiro, o tipo é int: int idade;"

    - id: esc_kc00_B1_4
      nome: "Declarar cada variável com o tipo certo"
      guiado: false
      forma: montar
      codigo: true
      frases: []
      versoes:
        - pede: "Declare duas variáveis: um inteiro chamado idade e um caractere chamado turma."
          pecas: ["int", "idade;", "char", "turma;"]
          certa: [[0, 1, 2, 3], [2, 3, 0, 1]]
          certa_texto: |-
            int idade;
            char turma;
          erros:
            - exata: [2, 1, 0, 3]
              retorno: "Os tipos ficaram trocados: idade é um número inteiro (int) e turma é uma letra (char)."
            - exata: [0, 3, 2, 1]
              retorno: "Os tipos ficaram trocados: idade é um número inteiro (int) e turma é uma letra (char)."
            - exata: [1, 0, 3, 2]
              invalida: true
              retorno: "O tipo vem antes do nome, nas duas declarações: int idade; char turma;"
          retorno_geral: "São duas declarações, cada uma com o tipo antes do nome: int idade; char turma;"
        - pede: "Declare duas variáveis: um inteiro chamado ano e um caractere chamado inicial."
          pecas: ["int", "ano;", "char", "inicial;"]
          certa: [[0, 1, 2, 3], [2, 3, 0, 1]]
          certa_texto: |-
            int ano;
            char inicial;
          erros:
            - exata: [2, 1, 0, 3]
              retorno: "Os tipos ficaram trocados: ano é um número inteiro (int) e inicial é uma letra (char)."
            - exata: [0, 3, 2, 1]
              retorno: "Os tipos ficaram trocados: ano é um número inteiro (int) e inicial é uma letra (char)."
            - exata: [1, 0, 3, 2]
              invalida: true
              retorno: "O tipo vem antes do nome, nas duas declarações: int ano; char inicial;"
          retorno_geral: "São duas declarações, cada uma com o tipo antes do nome: int ano; char inicial;"

    - id: esc_kc00_B1_5
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Uma destas linhas não é uma declaração válida. Qual?"
          pecas: ["int idade;", "idade int;", "char turma;"]
          certa: [[1]]
          invalidas: [1]
          certa_texto: "idade int;"
          erros:
            - exata: [0]
              retorno: "Essa é válida: tem o tipo, o nome e o ponto e vírgula, nessa ordem."
            - exata: [2]
              retorno: "Essa é válida: char é o tipo e turma é o nome."
          retorno_geral: "A inválida é a que põe o nome antes do tipo: idade int;"
        - pede: "Uma destas linhas não é uma declaração válida. Qual?"
          pecas: ["char inicial;", "inicial char;", "int ano;"]
          certa: [[1]]
          invalidas: [1]
          certa_texto: "inicial char;"
          erros:
            - exata: [0]
              retorno: "Essa é válida: char é o tipo e inicial é o nome."
            - exata: [2]
              retorno: "Essa é válida: tem o tipo, o nome e o ponto e vírgula, nessa ordem."
          retorno_geral: "A inválida é a que põe o nome antes do tipo: inicial char;"

B2:
  revisao:
    frases:
      - "A declaração reserva o lugar: a partir dela a variável existe."
      - "O valor é outra coisa: só entra quando uma linha escreve nele."
    codigo: |
      int idade;
      idade = 20;
    saida: ""
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 2, faz: [{guarda: {em: idade, valor: 20}}]}
  provas:
    - crenca: no_value_no_memory
      programa: |
        int idade;
        int nota;

        nota = idade;
      previsao:
        pergunta: >
          A última linha copia para nota o que está em idade. O que o
          compilador diz dela?
        opcoes:
          - "Que idade não existe"
          - "Que idade está sendo usada sem ter recebido valor"
          - "Nada: ele aceita calado"
        real: 1
        crenca: 0
      reclama: "'idade' is used uninitialized"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa não
        é executado: o que ele leria em idade, ninguém sabe.
      afirma: >
        O compilador não disse que idade não existe. Disse que ela está
        sendo usada sem valor ("used uninitialized"). A declaração já criou
        a variável; o que falta é o valor.
  degraus:
    - id: esc_kc00_B2_1
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Uma variável declarada já pode receber um valor."
        - "Para guardar, escreva o nome, o sinal de igual, o valor e o ponto e vírgula."
      versoes:
        - pede: "Guarde 20 em idade."
          antes: "int idade;"
          pecas: ["idade", "=", "20", ";", "int"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "idade = 20;"
          erros:
            - exata: [4, 0, 1, 2, 3]
              invalida: true
              retorno: "idade já foi declarada na linha de cima. Declarar de novo é pedir outra variável com o mesmo nome, e o compilador reclama. Basta idade = 20;"
            - exata: [2, 1, 0, 3]
              invalida: true
              retorno: "A variável que recebe fica antes do sinal de igual, e o valor depois: idade = 20;"
            - sem: [3]
              invalida: true
              retorno: "Faltou o ponto e vírgula no fim da linha: idade = 20;"
          retorno_geral: "A linha é o nome, o sinal de igual, o valor e o ponto e vírgula: idade = 20;"
        - pede: "Guarde 2026 em ano."
          antes: "int ano;"
          pecas: ["ano", "=", "2026", ";", "int"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "ano = 2026;"
          erros:
            - exata: [4, 0, 1, 2, 3]
              invalida: true
              retorno: "ano já foi declarada na linha de cima. Declarar de novo é pedir outra variável com o mesmo nome, e o compilador reclama. Basta ano = 2026;"
            - exata: [2, 1, 0, 3]
              invalida: true
              retorno: "A variável que recebe fica antes do sinal de igual, e o valor depois: ano = 2026;"
            - sem: [3]
              invalida: true
              retorno: "Faltou o ponto e vírgula no fim da linha: ano = 2026;"
          retorno_geral: "A linha é o nome, o sinal de igual, o valor e o ponto e vírgula: ano = 2026;"

    - id: esc_kc00_B2_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Repare: você escreveu na variável sem declarar de novo."
        - "Ela existe desde a linha da declaração, mesmo antes de receber qualquer valor."
      versoes:
        - pede: "Logo depois de int idade; e antes de qualquer valor, a variável idade já existe?"
          pecas:
            - "Sim: a declaração já reservou o lugar dela"
            - "Não: ela só existe depois de receber um valor"
          certa: [[0]]
          certa_texto: "Sim: a declaração já reservou o lugar dela"
          erros:
            - exata: [1]
              crenca: no_value_no_memory
              retorno: "Ela já existe. Quem reserva o lugar é a declaração; o valor entra depois, num lugar que já está lá."
          retorno_geral: "A variável existe desde a declaração; o valor só vem depois."
        - pede: "Logo depois de char turma; e antes de qualquer valor, a variável turma já existe?"
          pecas:
            - "Sim: a declaração já reservou o lugar dela"
            - "Não: ela só existe depois de receber um valor"
          certa: [[0]]
          certa_texto: "Sim: a declaração já reservou o lugar dela"
          erros:
            - exata: [1]
              crenca: no_value_no_memory
              retorno: "Ela já existe. Quem reserva o lugar é a declaração; o valor entra depois, num lugar que já está lá."
          retorno_geral: "A variável existe desde a declaração; o valor só vem depois."

    - id: esc_kc00_B2_3
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Só dá para guardar valor numa variável que já foi declarada."
      versoes:
        - pede: "Complete com a variável que já existe."
          antes: "int nota;"
          mostra: "___ = 7;"
          pecas: ["nota", "idade", "int"]
          certa: [[0]]
          certa_texto: "nota = 7;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "idade não foi declarada neste trecho. A variável que existe aqui é nota: nota = 7;"
            - exata: [2]
              invalida: true
              retorno: "int é um tipo, não uma variável. Quem recebe o valor é nota: nota = 7;"
          retorno_geral: "A variável declarada neste trecho é nota: nota = 7;"
        - pede: "Complete com a variável que já existe."
          antes: "int pontos;"
          mostra: "___ = 10;"
          pecas: ["pontos", "nota", "int"]
          certa: [[0]]
          certa_texto: "pontos = 10;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "nota não foi declarada neste trecho. A variável que existe aqui é pontos: pontos = 10;"
            - exata: [2]
              invalida: true
              retorno: "int é um tipo, não uma variável. Quem recebe o valor é pontos: pontos = 10;"
          retorno_geral: "A variável declarada neste trecho é pontos: pontos = 10;"

    - id: esc_kc00_B2_4
      nome: "Declarar e depois guardar um valor"
      guiado: false
      forma: montar
      codigo: true
      frases: []
      versoes:
        - pede: "Monte o trecho: declare um inteiro chamado nota e depois guarde 7 nele."
          pecas: ["int nota;", "nota = 7;", "idade = 7;"]
          certa: [[0, 1]]
          certa_texto: |-
            int nota;
            nota = 7;
          erros:
            - exata: [1, 0]
              invalida: true
              retorno: "A declaração vem primeiro: antes dela a variável não existe, e não há onde guardar o 7."
            - exata: [0, 2]
              invalida: true
              retorno: "idade não foi declarada neste trecho. A variável que existe é nota: nota = 7;"
            - sem: [0]
              retorno: "Faltou declarar. Sem int nota; a variável não existe."
          retorno_geral: "Primeiro a declaração, depois o valor: int nota; e então nota = 7;"
        - pede: "Monte o trecho: declare um inteiro chamado pontos e depois guarde 10 nele."
          pecas: ["int pontos;", "pontos = 10;", "nota = 10;"]
          certa: [[0, 1]]
          certa_texto: |-
            int pontos;
            pontos = 10;
          erros:
            - exata: [1, 0]
              invalida: true
              retorno: "A declaração vem primeiro: antes dela a variável não existe, e não há onde guardar o 10."
            - exata: [0, 2]
              invalida: true
              retorno: "nota não foi declarada neste trecho. A variável que existe é pontos: pontos = 10;"
            - sem: [0]
              retorno: "Faltou declarar. Sem int pontos; a variável não existe."
          retorno_geral: "Primeiro a declaração, depois o valor: int pontos; e então pontos = 10;"

    - id: esc_kc00_B2_5
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Um destes trechos usa uma variável que não foi declarada. Qual?"
          pecas:
            - |-
              int idade;
              idade = 20;
            - "nota = 7;"
            - |-
              int ano;
              ano = 2026;
          certa: [[1]]
          invalidas: [1]
          certa_texto: "nota = 7;"
          erros:
            - exata: [0]
              retorno: "Aqui idade foi declarada na primeira linha, então já existe quando recebe o 20."
            - exata: [2]
              retorno: "Aqui ano foi declarada na primeira linha, então já existe quando recebe o valor."
          retorno_geral: "O trecho sem declaração é nota = 7; — ali a variável nota não existe."
        - pede: "Um destes trechos usa uma variável que não foi declarada. Qual?"
          pecas:
            - |-
              int pontos;
              pontos = 10;
            - |-
              int nota;
              nota = 7;
            - "turma = 'B';"
          certa: [[2]]
          invalidas: [2]
          certa_texto: "turma = 'B';"
          erros:
