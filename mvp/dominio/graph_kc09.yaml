topic: kc_09

# TÓPICO-PILOTO, o terceiro a ficar pronto dos quatro que a coleta usa
# (kc_02, kc_07, kc_11, kc_09).
#
# A PENDÊNCIA DE ORDEM QUE ESTAVA AQUI CAIU EM 12/11/2026. Ela dizia que
# os pré-requisitos curados deste tópico são [kc_08, kc_06] e que o
# kc_08 (alocação dinâmica) ainda NÃO existia. Ele existe, com os seis
# nós, evidência nos seis e os seis cartões de ensino assinados — então
# a ordem de ensino não tem mais buraco aqui. O kc_06 também está
# completo. O que fica da observação antiga é o fato técnico: o motor
# carrega um tópico por processo, e por isso a ordem é decisão de quem
# monta a sessão, não do carregador.
#
# A METÁFORA DESTE TÓPICO: devolver o terreno, e o papel que fica na sua
# mão.
#
# Continua o terreno alugado do kc_01. Você devolve o lote à prefeitura:
# ela anota que aquele lote está livre, e pode entregá-lo a outra pessoa a
# qualquer momento. Mas o papel com o número do lote continua na SUA mão,
# do jeito que estava — a prefeitura não entra na sua casa para rasgar o
# seu papel. O papel parece bom, e não é: ele leva a um lote que já não é
# seu.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "A prefeitura anota que está livre" sugere que existe um aviso que
#      você pode consultar. Não existe: nada no programa avisa que o papel
#      ficou ruim. É por isso que escrever NULL no papel é VOCÊ mesmo
#      anotando, e é o nó I3.
#   2. "O lote continua lá, vazio" sugere que dá para olhar e ver que está
#      vazio. Não dá: o lote pode já ter outro dono, com as coisas dele
#      dentro. E usar o papel não é arriscado — é inválido. A metáfora diz
#      que não é seu, nunca o que você vai encontrar lá.
#
# OITO NÓS, E A CURADORIA TEM DEZ — a menor distância até aqui, e de
# propósito: é piloto. A curadoria tem cinco crenças, e duas delas negam o
# MESMO nó (I3), o que a decisão 19 não admite. Então:
#
#   as cinco crenças curadas ficaram, cada uma num nó diferente:
#     free_nullifies -> I1, free_kills_pointer -> I2,
#     null_after_free_redundant -> I3, heap_persists -> B4,
#     double_free_is_safe -> I4 (a conclusão);
#   três nós ganharam crença de fora, e nos dois primeiros a própria
#     curadoria já registra a importação:
#     B2 ("free(p) recebe uma cópia de p", importado de kc_06:I1) ->
#       function_gets_original;
#     B3 ("p é variável do chamador", importado de kc_02:I2) ->
#       pointer_lives_in_heap;
#     B1 ("free recebe o endereço do bloco") -> pointer_knows_block_size,
#       crença NOVA, do FAQ 7.26;
#   o curado I5 ("usar p depois, mesmo sem desreferenciar, é indefinido")
#     dobrou na conclusão. A curadoria registra ZERO caminhos nele, e a
#     mesma entrada do FAQ que sustenta a conclusão — a 7.21 — pergunta
#     exatamente isso: "How unsafe is it to use (assign, compare) a
#     pointer value after it's been freed?"

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "free recebe o endereço do bloco, e só isso."
    plain_text: >
      free recebe o endereço do pedaço que você quer devolver. O tamanho
      quem guardou foi o alocador, quando entregou.
    negated_by:
      - pointer_knows_block_size

    # A EVIDENCIA DO kc_09, 12/11/2026. O `afirma` e TEXTO DE TELA.
    #
    # NENHUM PROGRAMA DESTE TOPICO LE p DEPOIS DO free. Nao e cuidado de
    # estilo: ler o valor de um ponteiro ja devolvido e indeterminado, e
    # e exatamente o que o I4 deste grafo afirma. Evidencia que fizesse
    # isso estaria exibindo como prova o que o topico ensina a nao fazer.
    evidencia:
      - afirma: >
          free recebe o endereço do bloco, e só isso: devolver por uma
          segunda variável que carrega o mesmo endereço funciona do
          mesmo jeito.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);
              char *copia = NULL;
              int depois = 0;

              if (p == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *p = 'z';
              copia = p;
              puts(copia == p ? "a copia carrega o mesmo endereco do bloco" : "FALHOU");
              free(copia);
              depois = 1;
              puts(depois == 1
                   ? "e devolver por ela bastou: free so precisava do endereco"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          a copia carrega o mesmo endereco do bloco
          e devolver por ela bastou: free so precisava do endereco
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      A chamada de devolução leva um endereço, e nada mais. Você escreve
      free e o número do lote; não há segundo argumento, não há tamanho,
      não há contagem de elementos. A forma da chamada é a mesma para um
      lote de um byte e para um de mil.


      O tamanho existe, e quem o guarda é o alocador. Quando ele atendeu o
      seu pedido, anotou nas contas dele quanto havia entregado naquele
      endereço — e é dessas contas que ele lê na hora de receber o lote de
      volta. Essas anotações não são suas, não estão no seu ponteiro, e
      não há como consultá-las pelo programa.


      Por isso a conta do tamanho continua sendo sua. Se o seu programa
      precisa saber quantos elementos há num bloco, essa informação tem de
      ser guardada por você, numa variável ao lado. O ponteiro traz o
      endereço e o tipo de um elemento; quantos elementos cabem lá é coisa
      que ele nunca carregou, e quem conta com isso descobre tarde.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "free(p) recebe uma cópia de p, como qualquer chamada."
    plain_text: >
      Ao chamar free(p), o que entra na função é uma cópia de p — como em
      qualquer chamada de C.
    negated_by:
      - function_gets_original

    # BARRADA por `funcao_com_parametro`, e a demonstracao e por
    # SUBSTITUICAO: nao da para olhar free por dentro, entao o que se
    # mostra e a REGRA de chamada que vale para ela -- e que o kc_06
    # inteiro estabelece. O `afirma` diz isso na primeira linha, para que
    # ninguem leia nela uma afirmacao sobre o codigo da free.
    evidencia:
      - afirma: >
          free(p) é uma chamada como qualquer outra, e recebe uma cópia
          de p: quem recebe um ponteiro por valor pode trocar o que
          recebeu, e o ponteiro de quem chamou fica como estava.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          static void recebe(char *q)
          {
              char outro = 'x';

              q = &outro;
              puts(*q == 'x' ? "dentro, o parametro passou a levar a outro lugar"
                             : "FALHOU");
          }

          int main(void)
          {
              char dado = 'z';
              char *p = &dado;

              recebe(p);
              puts(*p == 'z'
                   ? "e fora, p continua levando ao mesmo: foi uma copia que viajou"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          dentro, o parametro passou a levar a outro lugar
          e fora, p continua levando ao mesmo: foi uma copia que viajou
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Em C, chamar uma função é copiar os argumentos. O que o parâmetro
      recebe é o valor que você passou, numa caixa nova, que nasce na
      chamada e morre no fim dela. Isso vale para número, vale para
      ponteiro, e vale para a devolução de memória: free não é construção
      especial da linguagem, é uma função como as suas.


      A cópia carrega o valor, e no caso de um ponteiro o valor é o
      endereço. É por isso que a função alcança o lote: ela tem o caminho
      até ele, e escrever no destino é escrever no lote de quem chamou. O
      endereço copiado leva ao mesmo lugar que o original — não é cópia do
      lote, é cópia do caminho.


      O que a cópia não faz é voltar. Se a função atribui algo ao próprio
      parâmetro, mexe na caixa dela, que vai acabar — e a variável de quem
      chamou não fica sabendo. Quem precisa que a variável de fora mude
      tem de passar o endereço DELA, e não o valor dela. É a mesma regra,
      lida do outro lado.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "p é variável de quem chamou, e não mora junto com o bloco."
    plain_text: >
      A caixa p é sua, de quem chamou. Ela não pertence à função free, e
      não fica dentro do bloco que ela aponta.
    negated_by:
      - pointer_lives_in_heap

    evidencia:
      - afirma: >
          p é variável de quem chamou e não mora junto com o bloco: o
          lugar onde p está guardado não é o lugar que p indica.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);

              if (p == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *p = 'z';
              puts((void *) &p != (void *) p
                   ? "o lugar onde p esta guardado nao e o lugar que p indica"
                   : "FALHOU");
              p = NULL;
              puts(p == NULL
                   ? "e p e variavel de quem chamou: aceita outro valor quando se quer"
                   : "FALHOU");
              free(NULL);
              return 0;
          }
        espera: |-
          o lugar onde p esta guardado nao e o lugar que p indica
          e p e variavel de quem chamou: aceita outro valor quando se quer
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O ponteiro e o bloco são duas coisas, e ficam em dois lugares. A
      caixa que guarda o endereço é uma variável comum, declarada por
      você, no escopo em que você a escreveu; o bloco foi pedido ao
      alocador e está onde ele o pôs. Devolver um não encosta no outro.


      A confusão tem uma origem clara: o ponteiro só serve por causa do
      bloco, e falamos dos dois como se fossem um — dizemos que o ponteiro
      é o lote. Na prática, a caixa dele está na sua função, e vai acabar
      quando a função acabar, como qualquer local; o bloco não acaba aí, e
      é isso que o free existe para resolver.


      Neste tópico a distinção decide tudo. A variável p é de quem chamou,
      e nada que aconteça do lado do bloco a alcança. É daqui que sai a
      resposta à pergunta mais feita sobre o free: ele recebeu o endereço
      do bloco, pode agir no bloco, e não tem caminho nenhum até a sua
      caixa.
  B4:
    type: observavel
    role: espinha
    support: []
    text: "Devolver o bloco o marca como não mais válido."
    plain_text: >
      Devolvido, o pedaço deixa de ser seu. Pode ser entregue a outro
      pedido a qualquer momento.
    negated_by:
      - heap_persists

    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          Devolver o bloco o marca como não mais válido: escrever nele
          depois do free faz o compilador avisar que o ponteiro foi
          usado depois de devolvido.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);

              if (p == NULL) {
                  return 1;
              }
              free(p);
              *p = 'x';
              return 0;
          }
        avisa: >
          used after 'free'
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Devolver o bloco encerra o seu direito a ele. A partir daquela linha
      o lote está à disposição do alocador, que pode entregá-lo ao próximo
      pedido — com o conteúdo do próximo dono dentro. Não é que o bloco
      desapareça: é que ele não é mais seu, e isso basta.


      A ideia contrária tem uma origem documentada, e não é descuido:
      documentação antiga de malloc dizia que o conteúdo da memória
      liberada ficava intocado, e disso se concluiu que dava para
      continuar lendo. O que aquela frase descrevia era o comportamento de
      uma implementação, não uma garantia da linguagem — e é a garantia
      que decide o que o seu programa pode fazer.


      Por isso o estrago costuma vir calado. A linguagem não diz nada
      sobre o que há no lote depois da devolução, e não dizer nada inclui
      não impedir que pareça certo: um programa que lê dali pode rodar sem
      reclamar hoje e falhar amanhã, com outra entrada, em outra máquina,
      no dia em que aquele espaço tiver sido entregue a outro pedido. Erro
      que às vezes funciona é mais difícil de achar que erro que nunca
      funciona.
  I1:
    type: inferencia
    role: espinha
    support: [B2, B3]
    text: "free não pode alterar p, nem se quisesse."
    plain_text: >
      Então free não tem como mudar o que está dentro de p: ela só recebeu
      uma cópia do valor, e a caixa não é dela.
    negated_by:
      - free_nullifies

    evidencia:
      - afirma: >
          free não pode alterar p nem se quisesse, e a regra não é dela:
          nenhuma função que recebe um ponteiro por valor altera o
          ponteiro de quem chamou.
        programa: |
          #include <stdio.h>

          static void tenta(char *q)
          {
              q = NULL;
              puts(q == NULL ? "dentro, o parametro virou NULL" : "FALHOU");
          }

          int main(void)
          {
              char dado = 'z';
              char *p = &dado;

              tenta(p);
              puts(p != NULL ? "e fora, p nao virou: a troca ficou na copia" : "FALHOU");
              return 0;
          }
        espera: |-
          dentro, o parametro virou NULL
          e fora, p nao virou: a troca ficou na copia
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B2 e o B3 somados. O free recebeu uma
      cópia do valor de p, e a caixa de p é uma variável de quem chamou.
      Para escrever naquela caixa seria preciso ter o endereço dela — e
      esse endereço nunca foi passado. O que viajou foi o número do lote,
      não o lugar onde você o guarda.


      A diferença entre não querer e não poder é toda a questão. Não há
      decisão de projeto aqui: mesmo que o free quisesse limpar o seu
      ponteiro, ele não teria por onde. Ele conhece o lote, pode
      devolvê-lo, e não tem caminho nenhum até a sua variável. Qualquer
      função em C está nessa situação com os argumentos que recebe por
      valor.


      Por isso o registro é obrigação de quem chamou. Depois da devolução,
      a sua variável continua com o número de um lote que não é mais seu,
      e nada no programa a corrige sozinha. Quem pode escrever ali é você,
      na linha seguinte — e é esse o assunto do nó que vem depois.
  I2:
    type: inferencia
    role: espinha
    support: [B3, I1]
    text: "p continua existindo, com o mesmo valor."
    plain_text: >
      Depois do free, a caixa p continua ali, com o mesmo endereço escrito
      dentro.
    negated_by:
      - free_kills_pointer

    evidencia:
      - afirma: >
          p continua existindo depois do free: a variável está lá,
          aceita um valor novo e responde — o que a chamada devolveu foi
          o bloco, e não a variável.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);

              if (p == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *p = 'z';
              free(p);
              p = NULL;
              puts(p == NULL
                   ? "depois do free, a variavel p aceitou um valor novo e respondeu"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          depois do free, a variavel p aceitou um valor novo e respondeu
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B3 e o I1 levados ao fim. A caixa de p é
      sua, o free não tem caminho até ela, e então nada acontece com ela.
      Depois da devolução, p é a mesma variável que era, no mesmo lugar,
      com o conteúdo que tinha. O que mudou foi do outro lado: o lote.


      A ideia contrária vem de confundir as duas coisas numa. Falamos
      "liberei o ponteiro" quando liberamos o bloco, e a frase sugere que
      a variável também foi embora — que ela deixou de existir, ou que foi
      zerada, ou que usá-la daria erro na hora. Nada disso: o que o free
      recebeu foi o número do lote, e é sobre o lote que ele agiu.


      E é justamente a variável continuar viva que torna isto perigoso. Se
      ela deixasse de existir, o compilador reclamaria no uso seguinte e o
      erro apareceria cedo. Em vez disso ela está lá, com aparência boa, e
      o programa que a usa compila e muitas vezes roda. O ponteiro que
      continua apontando para um lote que não é mais seu tem nome, e é o
      assunto da conclusão deste tópico.
  I3:
    type: inferencia
    role: espinha
    support: [I2]
    text: "Atribuir NULL a p é o que registra o estado."
    plain_text: >
      Nada no programa avisa que aquele endereço ficou ruim. Escrever NULL
      em p logo depois do free deixa registrado que ela não aponta mais
      para nada.
    negated_by:
      - null_after_free_redundant

    evidencia:
      - afirma: >
          Atribuir NULL a p é o que registra o estado: sem isso nada no
          programa distingue um ponteiro já devolvido de um válido, e
          com isso o teste de sempre separa os dois.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);
              char *q = malloc(1);
              int usaveis = 0;

              if (p == NULL || q == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *p = 'a';
              *q = 'b';
              free(p);
              p = NULL;
              if (p != NULL) {
                  usaveis = usaveis + 1;
              }
              if (q != NULL) {
                  usaveis = usaveis + 1;
              }
              puts(usaveis == 1
                   ? "o teste de sempre separou o devolvido do valido: sobrou um"
                   : "FALHOU");
              free(q);
              return 0;
          }
        espera: |-
          o teste de sempre separou o devolvido do valido: sobrou um
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o I2 levado adiante. Se p continua
      existindo com o número de um lote que já não é seu, então há um fato
      verdadeiro que o programa não registrou em lugar nenhum. E não há
      nada no programa que avise: nenhuma função pergunta, nenhum teste
      descobre, nada acende. O estado existe e não está escrito.


      A linha que escreve NULL é onde ele passa a estar escrito. Ela não
      muda o lote nem desfaz a devolução — o que ela faz é pôr, na sua
      variável, um valor que significa não aponto para lugar nenhum. Com
      isso o teste que todo mundo já escreve passa a dizer a verdade, e um
      uso indevido é barrado pela mesma guarda que você usaria de qualquer
      jeito.


      A ideia de que a linha é dispensável vem direto de achar que o free
      a escreveu. Quem acredita que o free zera o ponteiro conclui, com
      coerência, que escrever NULL depois é repetir trabalho feito.
      Desfeita aquela crença, esta cai sozinha: não há trabalho feito para
      repetir, e a linha é a única coisa no programa que registra o que
      aconteceu.
  I4:
    type: inferencia
    role: conclusao
    support: [B1, B4, I2, I3]
    text: >
      p guarda um endereço que não designa objeto válido — e usar p
      depois, mesmo sem desreferenciar, é comportamento indefinido.
    plain_text: >
      Juntando: p continua com um endereço bom de aparência, apontando
      para um lugar que já não guarda nada seu. Até copiar ou comparar p
      já é território sem garantia.
    negated_by:
      - double_free_is_safe
    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          Usar p depois do free é indefinido mesmo sem desreferenciar:
          aqui p só é entregue de novo ao free, sem nenhum asterisco, e
          o compilador já avisa.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);

              if (p == NULL) {
                  return 1;
              }
              free(p);
              free(p);
              return 0;
          }
        avisa: >
          used after 'free'
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto é o fecho dos sete nós anteriores. A devolução levou só o
      endereço, o lote deixou de ser seu, a sua variável continuou lá com
      o número dele, e nada no programa registrou isso a não ser a linha
      que você escreveu. Um ponteiro nessa situação tem nome: ele está
      pendente. Não é um ponteiro ruim porque o número está errado — o
      número está certo, e é justamente isso que o torna perigoso.


      E usar quer dizer mais do que você espera. Não é só escrever ou ler
      pelo ponteiro: copiá-lo para outra variável já é território sem
      garantia, comparar o valor dele também, e devolvê-lo outra vez
      também. A regra não fala do que você vai encontrar no lote — ela
      fala do ponteiro: o valor que ele guarda deixou de designar objeto
      válido, e mexer nesse valor é que está fora.


      Por isso a disciplina é curta e vale sempre. Devolveu, anote na
      mesma hora, em todos os papéis que guardavam aquele endereço; e
      teste antes de usar. Com a anotação feita, a guarda de sempre dá
      conta: ela barra o uso, barra a segunda devolução, e o programa
      segue. Sem ela não há teste que ajude, porque o que há na variável
      tem aparência de bom.
