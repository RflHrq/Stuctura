# Crenças do kc_07 — OITO, e o B1 tem duas.
#
# Eram sete, uma por nó, e seis delas são da curadoria: grade L, todas
# com entrada do FAQ do comp.lang.c. A sétima (`declaration_allocates`)
# vem do kc_03, e a própria curadoria registra que o nó B2 é "importado
# de kc_03:I1".
#
# A OITAVA ENTROU EM 09/11/2026, grade `D`, e o tópico segue com zero
# `E` — que é o que a regra do piloto exige e o que um teste cobra
# (`test_piloto_nao_tem_crenca_estimada`).
#
# Ela existe porque uma revisão achou um defeito de MEDIDA: seis dos
# treze distratores de `string_literal_is_array` estavam em itens sem
# literal de string nenhum — falavam de `int a[3]`, `double dados[6]`,
# `long lista[8]`.
#
# E ela NASCEU `E` E VIROU `D` no mesmo dia, porque a primeira busca
# procurou a palavra errada. Está contado na fonte dela.
#
# E o defeito não era descuido. `string_literal_is_array` era a ÚNICA
# crença que negava o B1, e o carregador de moldes exige que ao menos
# uma crença da família negue o próprio nó: tirá-la de lá deixaria o B1
# sem atribuição nenhuma. O autor não tinha outra para pôr.
#
# A seção 6 do FAQ (arrays e ponteiros, 24 entradas) foi lida pelo índice
# nesta sessão, e as entradas citadas foram conferidas uma a uma em
# c-faq.com.
#
# UMA CORREÇÃO À CURADORIA, registrada aqui: `string_literal_is_array`
# estava citada como FAQ 6.6b, que é "Isn't this an array assignment?
# char a[] = ...". A entrada que trata exatamente da crença é a 1.32,
# "What is the difference between these initializations? char a[] =
# "string literal"; char *p = "string literal";". As duas ficam citadas, a
# 1.32 primeiro — é a precisa, e foi lida no original.

- id: array_confused_with_cell
  negates: kc_07:B1
  provenance: D
  label_pt: "Uma variável guarda vários valores de uma vez: int a[5] é uma caixa com os cinco dentro, e int *p guarda do mesmo jeito."
  source: >
    Sorva (2012), Apêndice A, Tabela A.1, DOIS itens, que são as duas
    metades desta frase:

    p. 367, item 151 (tópico `Misc`): "Confusion between an array and
    its cell." (du Boulay 1986). É a segunda metade: não distinguir o
    conjunto da caixa, que é exatamente o que B1 afirma ao dizer que o
    nome "vale para o conjunto inteiro, não para uma caixa só".

    p. 359, item 9 (tópico `VarAssign`): "A variable can hold multiple
    values at a time / 'remembers' old values." (du Boulay 1986;
    Soloway et al. 1982; Putnam et al. 1986; Sleeman et al. 1986;
    Doukakis et al. 2007). É a primeira metade, e tem CINCO estudos
    independentes atrás dela — é a mais bem documentada das oito crenças
    deste tópico.

    A BUSCA ANTERIOR ERROU DE VOCABULÁRIO, e é a segunda vez que isso
    acontece neste catálogo. Esta crença entrou como `E` com a nota
    "procurei e não está lá", porque a procura foi por ARRAY na seção 6
    do FAQ do comp.lang.c — uma fonte de C, onde a palavra existe. O
    item 9 do Sorva fala de VARIÁVEL, e o 151 está no tópico `Misc`, não
    num tópico de array. Mesmo padrão do `pointer_has_no_address`, que
    passou de `E` para `T` quando a busca foi refeita.

    CALIBRAGEM DA PÁGINA: conferida contra a própria curadoria deste
    projeto. A citação existente diz "p. 360, item 14", e o item 14 cai
    na p. 360 pelos marcadores de rodapé do texto integral. As páginas
    acima seguem a mesma régua.

    `D` E NÃO `T`: os estudos são em BASIC e Logo, mas "confusão entre o
    array e a célula dele" não depende de linguagem — array e célula
    existem nas três. Não há transposição a declarar, diferente do
    `pointer_has_no_address`, onde C acrescenta `&p` observável.

    E ELA NÃO É A `array_is_pointer`: aquela é sobre o que as duas
    coisas SÃO, e o I3 existe para refutá-la. Esta é sobre uma variável
    guardar vários valores de uma vez, e é o que o B1 afirma. Dá para
    sustentar uma sem nunca ter pensado na outra — e nos quatro itens em
    que as duas são oferecidas juntas, é essa diferença que a coleta vai
    medir.

    Texto integral lido em 09/11/2026 no repositório aberto da Aalto
    (`aaltodoc`, handle 123456789/3534), bundle TEXT.

- id: string_literal_is_array
  negates: kc_07:B1
  provenance: L
  label_pt: "char *s = \"abc\" e char s[] = \"abc\" guardam do mesmo jeito."
  source: >
    FAQ comp.lang.c 1.32: "What is the difference between these
    initializations? char a[] = \"string literal\"; char *p = \"string
    literal\"; My program crashes if I try to assign a new value to
    p[i]." A resposta separa os dois usos de um literal — inicializar um
    array de char, ou dar a um ponteiro o endereço do literal — e é essa
    separação que B1 afirma. Ver também 6.6b, que era a citação da
    curadoria. Textos conferidos em c-faq.com.

- id: declaration_allocates
  negates: kc_07:B2
  provenance: T
  label_pt: "int *p já cria o dado apontado automaticamente."
  source: >
    Kaczmarczyk et al. (2010), p. 109, Tabela 2, MMR4; e FAQ comp.lang.c
    7.10, "I'm trying to declare a pointer and allocate some space for it,
    but it's not working: char *p; *p = malloc(10);". A mesma crença está
    no catálogo do kc_03, e a curadoria registra que este nó é importado
    de lá — `kc_03:I1`.

- id: array_passed_by_reference
  negates: kc_07:B3
  provenance: L
  label_pt: "Arrays são passados por referência, diferente do resto de C."
  source: >
    FAQ comp.lang.c 6.4b, cujo título é a crença dita por quem a tem: "So
    arrays are passed by reference, even though the rest of C uses pass by
    value?" Ela nega a premissa de que o que viaja é o endereço do
    primeiro elemento: se o array fosse passado por referência, o conjunto
    inteiro é que estaria em jogo. É a crença da curadoria, com a fonte
    dela.

- id: arr_equals_addr_of_arr
  negates: kc_07:B4
  provenance: L
  label_pt: "arr e &arr são a mesma coisa."
  source: >
    FAQ comp.lang.c 6.12: "Since array references decay into pointers, if
    arr is an array, what's the difference between arr and &arr?" A
    pergunta é a crença. Ela nega justamente a premissa de que há contexto
    em que a conversão não acontece — se fossem a mesma coisa, o `&` não
    seria exceção. É a crença da curadoria, com a fonte dela.

- id: array_is_assignable
  negates: kc_07:I1
  provenance: L
  label_pt: "Dá para atribuir ao nome de um array, como em str = f()."
  source: >
    FAQ comp.lang.c 6.5: "Why can't I do something like this? extern char
    *getpass(); char str[10]; str = getpass(\"Enter password: \");"; e
    6.6, "If you can't assign to arrays, then how can int f(char str[]) {
    str = \"none\"; } work?"; e 6.7, "How can an array be an lvalue, if
    you can't assign to it?". As três perguntas existem porque a crença
    existe. É a crença da curadoria, com a fonte dela.

- id: sizeof_array_via_pointer
  negates: kc_07:I2
  provenance: L
  label_pt: "Dentro da função, sizeof ainda mede o array inteiro."
  source: >
    FAQ comp.lang.c 6.21: "Why doesn't sizeof properly report the size of
    an array when the array is a parameter to a function? I have a test
    routine f(char a[10]) { int i = sizeof(a); printf(\"%d\n\", i); } and
    it prints 4, not 10." É o enunciado exato da perda do tamanho, que é o
    que I2 afirma. Ver também 7.28. É a crença da curadoria, com a fonte
    dela.

- id: array_is_pointer
  negates: kc_07:I3
  provenance: L
  label_pt: "Array e ponteiro são a mesma coisa."
  source: >
    FAQ comp.lang.c 6.2: "But I heard that char a[] was identical to char
    *a."; 6.9, "Someone explained to me that arrays were really just
    constant pointers."; e 6.10, "I'm still mystified. Is a pointer a kind
    of array, or is an array a kind of pointer?". Três entradas para a
    mesma ideia, o que é por si evidência de quanta gente a tem. É a
    crença da curadoria, com a fonte dela, e nega a conclusão do tópico.
