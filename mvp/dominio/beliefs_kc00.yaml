- id: type_is_a_hint
  negates: kc_00:B1
  provenance: E
  label_pt: "Toda variável ocupa o mesmo espaço; o tipo é só um aviso para o compilador."
  source: >
    Elaborada a partir do modelo de maquina, nao de fonte empirica: e a unica
    crenca E do catalogo, e entra declarada como HIPOTESE A TESTAR. Os tres
    distratores de B1 que nao tinham dono apontam para ela. Se nenhum
    participante a sustentar, o achado e esse.

- id: no_value_no_memory
  negates: kc_00:B2
  provenance: D
  label_pt: "Se eu não dei valor, a variável ainda não existe na memória."
  source: >
    Kaczmarczyk, Petrick, East & Herman (2010), SIGCSE, "Identifying
    Student Misconceptions of Programming", APUD Sorva (2012), Apêndice
    A, p. 360, item 22: "Unassigned variables of primitive type (in
    Java) have no memory allocated."

    MEDIAÇÃO DECLARADA, 11/11/2026: o artigo original não foi aberto —
    ele existe (DOI 10.1145/1734263.1734299, conferido no OpenAlex) e não
    tem cópia de acesso aberto. O que foi lido é o item do Sorva que o
    atribui, e a citação diz isso. A referência anterior trazia o código
    "(PVR2)" do artigo, que não pode ser conferido em segunda mão e saiu.

- id: declaration_zeroes
  negates: kc_00:B3
  provenance: D
  label_pt: "Declarar já zera a variável, tipo em outras linguagens."
  source: >
    du Boulay (1986); Samurçay (1989), APUD Sorva (2012), Apêndice A,
    p. 359, item 10: "Variables always receive a particular default
    value upon creation."

    MEDIAÇÃO DECLARADA, 11/11/2026: os dois estudos não foram abertos; o
    que foi lido é o item do Sorva que os atribui.

    E a REFUTAÇÃO, que é outra coisa e estava ocupando o campo da fonte:
    Kernighan & Ritchie, The C Programming Language, 2a ed., seção 2.4,
    contradiz a crença — mas isso é a obra técnica que diz que a crença é
    FALSA, não a fonte que registra que alguém a tem. Os dois papéis
    ficam separados aqui.

- id: variable_remembers
  negates: kc_00:B4
  provenance: T
  label_pt: "A variável lembra os valores antigos, não só o último."
  source: >
    du Boulay (1986); Soloway et al. (1982); Putnam et al. (1986);
    Sleeman et al. (1986); Doukakis et al. (2007), APUD Sorva (2012),
    Apêndice A, p. 359, item 9: "A variable can hold multiple values at a
    time / 'remembers' old values."

    CINCO estudos independentes atrás do mesmo item — é a crença mais
    bem documentada deste tópico.

    HERMANS ET AL. (2018) SAIU, 11/11/2026. A citação anterior o trazia,
    e ele NÃO APARECE em item nenhum da Tabela A.1 do Sorva nem na
    bibliografia dela — zero ocorrências no texto integral. Sem a obra
    aberta e sem corroboração, a citação não se sustenta, e citação que
    não se sustenta sai.

- id: assignment_symmetric
  negates: kc_00:I1
  provenance: D
  label_pt: "Atribuição funciona dos dois lados, tipo igualdade matemática."
  source: >
    Sleeman et al. (1986), APUD Sorva (2012), Apêndice A, p. 359,
    item 12: "Primitive assignment works both directions (swaps)."

    O ITEM MUDOU DE 11 PARA 12 em 11/11/2026, e é A TERCEIRA VEZ que
    este catálogo erra de item ou de vocabulário e acha o certo ao
    refazer a busca. A citação anterior era o item 11, "Primitive
    assignment works in opposite direction", e vinha com a aproximação
    declarada: o 11 é sobre a direção INVERTIDA (`a = b` fazer b receber
    a) e esta crença é sobre os DOIS lados. O item 12, logo abaixo dele
    na mesma página, diz exatamente "works both directions" — que é a
    frase do rótulo, traduzida.

    Foi a aproximação DECLARADA que tornou isso achável: a nota dizia
    qual era a diferença entre o item e a crença, e foi essa diferença
    que apontou para o item vizinho. Citação que esconde a folga não dá
    esse aviso.

    E A GRADE SUBIU `L` → `D`: agora há frase entre aspas, página e
    item, e a frase foi localizada no texto integral. O artigo do
    Sleeman et al. não foi aberto — a citação é `apud`, e diz isso.
