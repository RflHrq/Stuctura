            guarda();
            guarda();
            guarda();
          pecas:
            - "Três: nenhum foi devolvido"
            - "Nenhum: o sistema devolve cada bloco quando a função termina"
            - "Um: cada chamada reusa o bloco da anterior"
          certa: [[0]]
