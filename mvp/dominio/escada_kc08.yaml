            - "No monte: o ponteiro mora no monte porque aponta para lá"
            - "Dentro do bloco que ela aponta"
          certa: [[0]]
          certa_texto: "Na pilha: p é uma variável local"
          erros:
            - exata: [1]
              crenca: pointer_lives_in_heap
              retorno: "Apontar para o monte não leva ninguém para lá. p foi declarada como qualquer variável local, e fica na pilha; no monte está só o bloco."
            - exata: [2]
              retorno: "O bloco guarda o int. p é outra coisa: uma variável local, na pilha, que guarda o endereço do bloco."
          retorno_geral: "p é uma variável local, na pilha. No monte está o bloco."
        - pede: "Onde mora a variável q?"
