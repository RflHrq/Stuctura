      - "Enquanto não houver free, ele continua ocupado."
    codigo: |
      int *novo(void) { int *p = malloc(sizeof(int)); *p = 7; return p; }

      int *q;

      q = novo();
      printf("%d\n", *q);
      free(q);
    saida: "7"
  cena:
    atores:
      - {nome: novo, tipo: bancada, de: int *novo(void)}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
      - {nome: q, tipo: ponteiro, de: int *}
    passos:
      - {linha: 3, faz: [{cria: q}]}
      - {linha: 5, faz: [{chama: novo}]}
      - {linha: 1, faz: [{cria: p}, {aluga: {nome: bloco, para: p}}, {segue: p}, {guarda: {em: bloco, valor: 7}}, {le: p}, {diz: novo devolve o endereço do bloco}]}
      - {linha: 5, faz: [{volta: novo}, {aponta: {de: q, para: bloco}}, {diz: 'o bloco continua: ele é do monte, não da bancada'}]}
      - {linha: 6, faz: [{segue: q}, {le: bloco}, {mostra: '7'}]}
      - {linha: 7, faz: [{devolve: bloco}]}
