  fora_da_trilha: [ciu_kc08_017, ciu_kc08_t17]
  provas:
    - crenca: system_frees_auto
      programa: |
        void guarda(void) { int *p = malloc(sizeof(int)); if (p != NULL) *p = 7; }

        guarda();
        guarda();
      previsao:
        pergunta: >
          A função pede um bloco, escreve nele e termina. Ela é chamada
          duas vezes. Seguindo o programa, o compilador reclama de alguma
          coisa?
        opcoes:
          - "Sim: o bloco vaza quando a função termina"
          - "Não: o bloco é devolvido sozinho no fim da função"
        real: 0
        crenca: 1
      reclama: "leak of 'p'"
      avisos: "-fanalyzer"
      ambiente: >
        Mensagem do gcc 16.2 com o analisador de fluxo ligado
        (-fanalyzer). "leak" é vazamento: memória pedida e nunca
        devolvida. O programa não é executado.
      afirma: >
        O compilador reclama: o bloco de p vaza ("leak of 'p'"). A função
        termina, p acaba, e o bloco fica ocupado sem ninguém que saiba o
        endereço. Se o fim da função o devolvesse, não haveria vazamento
        para apontar.
  degraus:
    - id: esc_kc08_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
