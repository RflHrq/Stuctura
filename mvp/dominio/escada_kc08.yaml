      - "p aponta para o monte, mas não mora lá."
    codigo: |
      int *p;
      int *q;

      p = malloc(sizeof(int));
      *p = 7;
      q = p;
      p = NULL;
      printf("%d\n", *q);
      free(q);
    saida: "7"
  cena:
    atores:
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: q, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
    passos:
      - {linha: 1, faz: [{cria: p}]}
      - {linha: 2, faz: [{cria: q}]}
      - {linha: 4, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 5, faz: [{segue: p}, {guarda: {em: bloco, valor: 7}}]}
      - {linha: 6, faz: [{le: p}, {aponta: {de: q, para: bloco}}]}
      - {linha: 7, faz: [{nulo: p}, {diz: 'o bloco não some: q ainda tem o endereço dele'}]}
      - {linha: 8, faz: [{segue: q}, {le: bloco}, {mostra: '7'}]}
      - {linha: 9, faz: [{devolve: bloco}]}
  provas:
    - crenca: pointer_lives_in_heap
      programa: |
        int *p;

        p = malloc(sizeof(int));
        free(p);
        free(&p);
      previsao:
        pergunta: >
          free devolve o que foi pedido com malloc. O trecho chama free
          para o bloco, e depois para a própria variável p. De qual das
          duas o compilador reclama?
        opcoes:
          - "Da última: p não é do monte"
          - "De nenhuma: p mora no monte, junto com o bloco"
        real: 0
        crenca: 1
      reclama: "'free' called on unallocated object 'p'"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa
        não é executado: devolver o que não foi pedido não tem resultado
        definido.
      afirma: >
        O compilador aceita free(p); e reclama de free(&p);: a variável p
        não foi pedida com malloc ("unallocated object"). Ela é uma
        variável local, na pilha. No monte está o bloco que ela apontava.
  degraus:
    - id: esc_kc08_I1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
