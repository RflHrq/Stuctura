# A escada do kc_08 — alocação dinâmica.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI já pediu um bloco com `malloc(sizeof(int))`, já o
# devolveu com `free`, e sabe que há pilha e monte (kc_01). Este tópico
# olha o `malloc` de perto: o que o número dele conta, o que ele devolve,
# o que vem dentro do bloco, e o que acontece quando ele não consegue.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   "byte": o espaço de uma caixa de char                      B1, degrau 1
#   a multiplicação: 3 * sizeof(int)                           B1, degrau 2
#   o bloco de vários ints, usado com p[0], p[1]               B1, degrau 2
#   calloc, que entrega o bloco zerado                         B3, degrau 3
#   conferir o NULL depois do malloc                           I2, degrau 1
#
# NENHUM DEGRAU PEDE PARA DIGITAR UM TAMANHO QUE MUDA DE MÁQUINA: quanto
# vale sizeof(int) não é resposta de ninguém. Os degraus de `digitar`
# usam o bloco — escrevem e leem valores — e a conta dos bytes fica nos
# de escolher.
#
# AS PROVAS, e o que cada uma usa. Cinco das seis são o que o compilador
# diz; três pedem o analisador de fluxo (-fanalyzer), que segue o caminho
# do programa, e a nota de ambiente de cada uma diz isso.
#
#   B1  malloc conta elementos     o analisador reclama de malloc(5) para int
#   B2  o ponteiro é o dado        dois ponteiros, um bloco: sai 5
#   B3  malloc zera                o compilador reclama de ler o bloco
#   I1  o ponteiro mora no monte   o compilador reclama de free(&p)
#   I2  malloc sempre funciona     o analisador reclama da escrita sem conferir
#   I3  o sistema devolve sozinho  o analisador aponta o bloco que vazou
#
# O I3 E O B3 DO kc_01 TÊM A MESMA CRENÇA ("o sistema libera sozinho"), e
# por isso a mesma evidência: o bloco que vaza. O cenário é outro — lá,
# duas funções, uma que devolve e uma que esquece; aqui, uma função
# chamada duas vezes.
#
# AS QUESTÕES DE MARCAR. O banco do kc_08 não foi mexido. Nove das 36
# questões de diagnóstico e de treino usam o que as escadas não ensinam —
# laço, `+=`, `strlen` e `strcpy`, `%s`, a conversão para `(void *)`, o
# `int main`, o `return` solto no trecho — e estão em `fora_da_trilha`.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 14/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "O número de malloc é um tamanho em bytes, e um byte é o espaço de uma caixa de char."
      - "Para três ints a conta é sua: malloc(3 * sizeof(int))."
    codigo: |
      int *p;

      p = malloc(3 * sizeof(int));
      p[2] = 9;
      printf("%d\n", p[2]);
      free(p);
    saida: "9"
  cena:
    atores:
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int, tamanho: 3}
    passos:
      - {linha: 1, faz: [{cria: p}]}
      - {linha: 3, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 4, faz: [{segue: p}, {guarda: {em: 'bloco[2]', valor: 9}}]}
      - {linha: 5, faz: [{segue: p}, {le: 'bloco[2]'}, {mostra: '9'}]}
      - {linha: 6, faz: [{devolve: bloco}]}
  # strlen e strcpy.
  fora_da_trilha: [ciu_kc08_t02]
  provas:
    - crenca: malloc_conta_elementos
      programa: |
        int *p;
        int *q;

        p = malloc(5 * sizeof(int));
        q = malloc(5);
        free(p);
        free(q);
      previsao:
        pergunta: >
          As duas linhas querem lugar para ints. Uma faz a conta dos
          bytes, a outra pede só 5. Seguindo o programa, de qual delas o
          compilador reclama?
        opcoes:
          - "De nenhuma: malloc(5) já reserva cinco ints"
          - "Da segunda: 5 bytes não é tamanho de int nenhum"
        real: 1
        crenca: 0
      reclama: "allocated buffer size is not a multiple of the pointee's size"
      avisos: "-fanalyzer"
      ambiente: >
        Mensagem do gcc 16.2 com o analisador de fluxo ligado
        (-fanalyzer). Ela diz que o tamanho pedido não é múltiplo do
        tamanho do que o ponteiro aponta: nesta máquina um int ocupa 4
        bytes, e 5 não dá um número inteiro de ints. O programa não é
        executado.
      afirma: >
        O compilador aceita malloc(5 * sizeof(int)) e reclama de
        malloc(5): cinco bytes não formam um número inteiro de ints.
        malloc conta bytes; quem conta os ints é a multiplicação.
  degraus:
    - id: esc_kc08_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O número entre os parênteses de malloc é um tamanho em bytes, e um byte é o espaço de uma caixa de char."
        - "malloc não sabe o que você vai guardar ali: nem olha o tipo do ponteiro."
      versoes:
        - pede: "O que a última linha pede ao sistema?"
          antes: |-
            int *p;

            p = malloc(10);
          pecas:
            - "Um bloco de dez bytes"
            - "Lugar para dez ints: malloc conta elementos do tipo de p"
            - "Dez ints, já com zero"
          certa: [[0]]
          certa_texto: "Um bloco de dez bytes"
          erros:
            - exata: [1]
              crenca: malloc_conta_elementos
              retorno: "malloc não olha o tipo de p, e não conta ints: o número dele é um tamanho em bytes. malloc(10) pede dez bytes."
            - exata: [2]
              retorno: "malloc não conta ints nem escreve zero em nada: o número dele é um tamanho em bytes. malloc(10) pede dez bytes."
          retorno_geral: "O número de malloc é um tamanho em bytes: dez bytes."
        - pede: "O que a última linha pede ao sistema?"
          antes: |-
            int *q;

            q = malloc(6);
          pecas:
            - "Lugar para seis ints: malloc conta elementos do tipo de q"
            - "Seis ints, já com zero"
            - "Um bloco de seis bytes"
          certa: [[2]]
          certa_texto: "Um bloco de seis bytes"
          erros:
            - exata: [0]
              crenca: malloc_conta_elementos
              retorno: "malloc não olha o tipo de q, e não conta ints: o número dele é um tamanho em bytes. malloc(6) pede seis bytes."
            - exata: [1]
              retorno: "malloc não conta ints nem escreve zero em nada: o número dele é um tamanho em bytes. malloc(6) pede seis bytes."
          retorno_geral: "O número de malloc é um tamanho em bytes: seis bytes."

    - id: esc_kc08_B1_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Para vários ints, a conta dos bytes é sua: quantos, vezes o tamanho de um. O sinal de vezes é o *."
        - "malloc(3 * sizeof(int)) pede lugar para três ints: p[0], p[1] e p[2]."
      versoes:
        - pede: "O bloco tem lugar para três ints. Que número aparece?"
          mostra: |-
            int *p;

            p = malloc(3 * sizeof(int));
            p[0] = 7;
            p[1] = 8;
            p[2] = 9;
            printf("%d\n", p[2]);
            free(p);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "7 foi para p[0], a primeira posição do bloco. O printf mostra p[2], a terceira: 9."
            - texto: "3"
              retorno: "3 é quantos ints cabem no bloco. O printf mostra o que está em p[2], a terceira posição: 9."
          retorno_geral: "O bloco tem três posições, e p[2] é a terceira: 9."
        - pede: "O bloco tem lugar para dois ints. Que número aparece?"
          mostra: |-
            int *q;

            q = malloc(2 * sizeof(int));
            q[0] = 15;
            q[1] = 16;
            printf("%d\n", q[1]);
            free(q);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "15"
              retorno: "15 foi para q[0], a primeira posição do bloco. O printf mostra q[1], a segunda: 16."
            - texto: "2"
              retorno: "2 é quantos ints cabem no bloco. O printf mostra o que está em q[1], a segunda posição: 16."
          retorno_geral: "O bloco tem duas posições, e q[1] é a segunda: 16."

    - id: esc_kc08_B1_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "malloc não faz a conta por você: quem multiplica é quem pede."
      versoes:
        - pede: "Qual destas linhas pede lugar para cinco ints?"
          antes: "int *p;"
          pecas:
            - "p = malloc(5 * sizeof(int));"
            - "p = malloc(5);"
            - "p = malloc(sizeof(int));"
          certa: [[0]]
          certa_texto: "p = malloc(5 * sizeof(int));"
          erros:
            - exata: [1]
              retorno: "malloc(5) pede cinco bytes, e um int ocupa mais que um. Para cinco ints, a conta é 5 * sizeof(int)."
            - exata: [2]
              retorno: "sizeof(int) é o tamanho de um int só. Para cinco, multiplica-se: 5 * sizeof(int)."
          retorno_geral: "Cinco vezes o tamanho de um int: p = malloc(5 * sizeof(int));"
        - pede: "Qual destas linhas pede lugar para oito ints?"
          antes: "int *q;"
          pecas:
            - "q = malloc(sizeof(int));"
            - "q = malloc(8 * sizeof(int));"
            - "q = malloc(8);"
          certa: [[1]]
          certa_texto: "q = malloc(8 * sizeof(int));"
          erros:
            - exata: [2]
              retorno: "malloc(8) pede oito bytes, e um int ocupa mais que um. Para oito ints, a conta é 8 * sizeof(int)."
            - exata: [0]
              retorno: "sizeof(int) é o tamanho de um int só. Para oito, multiplica-se: 8 * sizeof(int)."
          retorno_geral: "Oito vezes o tamanho de um int: q = malloc(8 * sizeof(int));"

    - id: esc_kc08_B1_4
      nome: "malloc conta bytes: a multiplicação é sua"
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "A última linha quer lugar para três ints. Qual é o problema dela?"
          antes: |-
            int *p;

            p = malloc(3);
          pecas:
            - "Pede 3 bytes, e três ints ocupam mais que isso"
            - "Nenhum: malloc(3) reserva três ints"
            - "Falta o tipo: tinha de ser malloc(int, 3)"
          certa: [[0]]
          certa_texto: "Pede 3 bytes, e três ints ocupam mais que isso"
          erros:
            - exata: [1]
              retorno: "malloc conta bytes, e não ints: malloc(3) entrega três bytes. Para três ints, a conta é 3 * sizeof(int)."
            - exata: [2]
              retorno: "malloc recebe um número só, o tamanho em bytes. Quem põe o tipo na conta é você: 3 * sizeof(int)."
          retorno_geral: "malloc(3) pede três bytes. Para três ints: malloc(3 * sizeof(int))."
        - pede: "A última linha quer lugar para seis ints. Qual é o problema dela?"
          antes: |-
            int *q;

            q = malloc(6);
          pecas:
            - "Falta o tipo: tinha de ser malloc(int, 6)"
            - "Pede 6 bytes, e seis ints ocupam mais que isso"
            - "Nenhum: malloc(6) reserva seis ints"
          certa: [[1]]
          certa_texto: "Pede 6 bytes, e seis ints ocupam mais que isso"
          erros:
            - exata: [2]
              retorno: "malloc conta bytes, e não ints: malloc(6) entrega seis bytes. Para seis ints, a conta é 6 * sizeof(int)."
            - exata: [0]
              retorno: "malloc recebe um número só, o tamanho em bytes. Quem põe o tipo na conta é você: 6 * sizeof(int)."
          retorno_geral: "malloc(6) pede seis bytes. Para seis ints: malloc(6 * sizeof(int))."

    - id: esc_kc08_B1_5
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "O bloco tem lugar para dois ints. Que número aparece?"
          mostra: |-
            int *p;

            p = malloc(2 * sizeof(int));
            p[0] = 15;
            p[1] = p[0] + 1;
            printf("%d\n", p[1]);
            free(p);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "15"
              retorno: "15 está em p[0]. p[1], a segunda posição, recebeu p[0] + 1: 16."
          retorno_geral: "p[1] recebeu o valor de p[0] mais 1: 16."
        - pede: "O bloco tem lugar para dois ints. Que número aparece?"
          mostra: |-
            int *q;

            q = malloc(2 * sizeof(int));
            q[0] = 7;
            q[1] = q[0] + 2;
            printf("%d\n", q[1]);
            free(q);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "7 está em q[0]. q[1], a segunda posição, recebeu q[0] + 2: 9."
          retorno_geral: "q[1] recebeu o valor de q[0] mais 2: 9."

B2:
  revisao:
    frases:
      - "malloc devolve o endereço do bloco que conseguiu, ou NULL se não conseguiu."
      - "O endereço se guarda no ponteiro: p = malloc(...). O bloco é outra coisa, e chega-se nele com *p."
    codigo: |
      int *p;

      p = malloc(sizeof(int));
      *p = 7;
      printf("%d\n", *p);
      free(p);
    saida: "7"
  cena:
    atores:
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
    passos:
      - {linha: 1, faz: [{cria: p}]}
      - {linha: 3, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 4, faz: [{segue: p}, {guarda: {em: bloco, valor: 7}}]}
      - {linha: 5, faz: [{segue: p}, {le: bloco}, {mostra: '7'}]}
      - {linha: 6, faz: [{devolve: bloco}]}
  # A conversão para (void *) com o %p; e o return solto no trecho.
  fora_da_trilha: [ciu_kc08_006, ciu_kc08_t06]
  provas:
    - crenca: pointer_is_data
      programa: |
        int *p;
        int *q;

        p = malloc(sizeof(int));
        *p = 1;
        q = p;
        *q = 5;
        printf("%d\n", *p);
        free(p);
      previsao:
        pergunta: >
          q = p; copia o que está guardado em p. Depois o trecho escreve
          5 por q, e mostra o que p alcança. O que aparece?
        opcoes:
          - "1: q ficou com uma cópia do dado, e o de p não mudou"
          - "5"
        real: 1
        crenca: 0
      espera: "5"
      afirma: >
        Saiu 5. q = p; copiou um endereço, e não o dado: os dois
        ponteiros apontam para o mesmo bloco, e o que q escreveu é o que
        p lê. O ponteiro guarda ONDE o dado está; o dado fica no bloco.
  degraus:
    - id: esc_kc08_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "malloc não entrega o bloco em si: devolve o endereço dele."
        - "Se não conseguir bloco nenhum, devolve NULL."
      versoes:
        - pede: "Depois da última linha, o que fica guardado em p?"
          antes: |-
            int *p;

            p = malloc(sizeof(int));
          pecas:
            - "O endereço do bloco, ou NULL"
            - "O próprio bloco: o que malloc devolve é o dado"
            - "O valor que estava no bloco"
          certa: [[0]]
          certa_texto: "O endereço do bloco, ou NULL"
          erros:
            - exata: [1]
              crenca: pointer_is_data
              retorno: "O bloco fica no monte, e não cabe em p. O que malloc devolve, e p guarda, é o endereço do bloco — ou NULL."
            - exata: [2]
              retorno: "O valor do bloco se lê com *p. Em p fica o endereço que malloc devolveu, ou NULL."
          retorno_geral: "p guarda o endereço do bloco, ou NULL se malloc não conseguiu."
        - pede: "Depois da última linha, o que fica guardado em q?"
          antes: |-
            int *q;

            q = malloc(2 * sizeof(int));
          pecas:
            - "O valor que estava no bloco"
            - "O endereço do bloco, ou NULL"
            - "O próprio bloco: o que malloc devolve é o dado"
          certa: [[1]]
          certa_texto: "O endereço do bloco, ou NULL"
          erros:
            - exata: [2]
              crenca: pointer_is_data
              retorno: "O bloco fica no monte, e não cabe em q. O que malloc devolve, e q guarda, é o endereço do bloco — ou NULL."
            - exata: [0]
              retorno: "O valor do bloco se lê com q[0] ou *q. Em q fica o endereço que malloc devolveu, ou NULL."
          retorno_geral: "q guarda o endereço do bloco, ou NULL se malloc não conseguiu."

    - id: esc_kc08_B2_2
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "O endereço que malloc devolve se guarda num ponteiro, como todo endereço."
        - "*p é o que está NO bloco, e só serve depois de p ter o endereço."
      versoes:
        - pede: "Complete com quem recebe o que malloc devolve."
          antes: "int *p;"
          mostra: "___ = malloc(sizeof(int));"
          pecas: ["p", "*p", "&p"]
          certa: [[0]]
          certa_texto: "p = malloc(sizeof(int));"
          erros:
            - exata: [1]
              invalida: true
              retorno: "*p é lugar de int, e malloc devolve um endereço: o compilador reclama. Quem guarda endereço é o ponteiro: p = malloc(sizeof(int));"
            - exata: [2]
              invalida: true
              retorno: "&p é o endereço de p, e não um lugar que recebe valor: o compilador reclama. Quem recebe é o ponteiro: p = malloc(sizeof(int));"
          retorno_geral: "malloc devolve um endereço, e quem guarda endereço é o ponteiro: p = malloc(sizeof(int));"
        - pede: "Complete com quem recebe o que malloc devolve."
          antes: "int *q;"
          mostra: "___ = malloc(sizeof(int));"
          pecas: ["&q", "q", "*q"]
          certa: [[1]]
          certa_texto: "q = malloc(sizeof(int));"
          erros:
            - exata: [2]
              invalida: true
              retorno: "*q é lugar de int, e malloc devolve um endereço: o compilador reclama. Quem guarda endereço é o ponteiro: q = malloc(sizeof(int));"
            - exata: [0]
              invalida: true
              retorno: "&q é o endereço de q, e não um lugar que recebe valor: o compilador reclama. Quem recebe é o ponteiro: q = malloc(sizeof(int));"
          retorno_geral: "malloc devolve um endereço, e quem guarda endereço é o ponteiro: q = malloc(sizeof(int));"

    - id: esc_kc08_B2_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "p guarda um endereço, e não o bloco."
        - "Copiar p para q copia o endereço: os dois passam a apontar para o mesmo bloco."
      versoes:
        - pede: "O trecho escreve por q e lê por p. Que número aparece?"
          mostra: |-
            int *p;
            int *q;

            p = malloc(sizeof(int));
            q = p;
            *q = 7;
            printf("%d\n", *p);
            free(p);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "0"
              retorno: "q = p; copiou o endereço, e não o bloco: há um bloco só. O 7 escrito por q é o que *p encontra."
          retorno_geral: "p e q guardam o mesmo endereço: o 7 escrito por q está no bloco que p lê."
        - pede: "O trecho escreve por p e lê por q. Que número aparece?"
          mostra: |-
            int *p;
            int *q;

            p = malloc(sizeof(int));
            q = p;
            *p = 15;
            printf("%d\n", *q);
            free(q);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "q = p; copiou o endereço, e não o bloco: há um bloco só. O 15 escrito por p é o que *q encontra."
          retorno_geral: "p e q guardam o mesmo endereço: o 15 escrito por p está no bloco que q lê."

    - id: esc_kc08_B2_4
      nome: "O ponteiro guarda o endereço, e não o bloco"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "q recebe o que está em p, e soma 1 no bloco. Que número aparece?"
          mostra: |-
            int *p;
            int *q;

            p = malloc(sizeof(int));
            *p = 7;
            q = p;
            *q = *q + 1;
            printf("%d\n", *p);
            free(p);
          aceitas: ["8"]
          certa_texto: "8"
          erros:
            - texto: "7"
              retorno: "q recebeu o endereço que estava em p: os dois apontam para o mesmo bloco. O 1 somado por q está no bloco que p lê."
          retorno_geral: "Há um bloco só, com dois ponteiros. O 7 virou 8 por q, e é 8 que p lê."
        - pede: "q recebe o que está em p, e soma 5 no bloco. Que número aparece?"
          mostra: |-
            int *p;
            int *q;

            p = malloc(sizeof(int));
            *p = 15;
            q = p;
            *q = *q + 5;
            printf("%d\n", *p);
            free(p);
          aceitas: ["20"]
          certa_texto: "20"
          erros:
            - texto: "15"
              retorno: "q recebeu o endereço que estava em p: os dois apontam para o mesmo bloco. O 5 somado por q está no bloco que p lê."
          retorno_geral: "Há um bloco só, com dois ponteiros. O 15 virou 20 por q, e é 20 que p lê."

    - id: esc_kc08_B2_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "No fim deste trecho, quantos blocos existem?"
          antes: |-
            int *p;
            int *q;

            p = malloc(sizeof(int));
            q = p;
