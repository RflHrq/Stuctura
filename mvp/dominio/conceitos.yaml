# O inventário de conceitos: o que o aluno já teve oportunidade de aprender.
#
# REGRA DE LIBERAÇÃO, e ela é estreita de propósito: só entra como
# `disponivel` o conceito cuja EXPLICAÇÃO está no material de ensino,
# acompanhada de exemplo. Construto que aparece num exemplo cuja
# explicação é sobre outra coisa **não** conta — é menção, não ensino.
#
# AUDITORIA DE 05/11/2026, por leitura dos cartões de ensino do kc_00,
# kc_01 e kc_02. A varredura por padrão produziu três falsos positivos
# (`derreferencia`, `sizeof`, `funcao_com_parametro`), todos do mesmo
# tipo: o construto está num exemplo que ensina outra coisa. É por isso
# que esta auditoria foi feita lendo, e não medindo.
#
# COMO LER `evidencia`: `onde` é o cartão de ensino, `tipo` diz se houve
# explicação com exemplo ou só menção. Qualquer liberação aqui tem de
# poder ser conferida abrindo aquele cartão.
#
# `cartoes` É O MESMO QUE `onde`, legível por máquina — `kc_02:B1`, na
# convenção que as crenças já usam em `negates`. Entrou em 09/11/2026
# para o primeiro mecanismo do histórico individual: o log passar a
# dizer que CONCEITO um cartão apresentou, e não só qual nó.
#
# A prosa de `onde` FICA, e continua sendo a evidência: quem aprova lê
# prosa. E `cartoes` não é varredura de código — a auditoria de 05/11
# achou três falsos positivos de varredura por padrão (`derreferencia`,
# `sizeof`, `funcao_com_parametro`), todos com o construto num exemplo
# que ensina outra coisa. Só declara cartão quem tem `tipo` de
# explicação; usar não é ensinar.
#
# O QUE ESTA AUDITORIA ACHOU, e vale mais que o inventário: o kc_02
# ensina em três cartões que um ponteiro guarda um endereço, e **nunca
# ensina a usar esse endereço**. Desreferência não aparece em cartão
# nenhum, nem aqui nem no kc_01 com explicação — ela estreia em item de
# diagnóstico de nível 2. A pessoa é testada num construto que o sistema
# não apresentou.

conceitos:

  endereco:
    nome: "endereço: o número que identifica um lugar da memória"
    status: disponivel
    introduzido_em: kc_02
    evidencia:
      cartoes: ["kc_02:B1"]
      onde: "kc_02, cartão de ensino B1"
      texto: "A memória é uma rua de lugares numerados. O número do lugar
              é o endereço — não o que está guardado nele."
      exemplo: 'int idade = 20; printf("%p", (void *)&idade);'
      tipo: explicacao_com_exemplo

  ponteiro:
    nome: "ponteiro: variável que ocupa lugar e tem endereço próprio"
    status: disponivel
    introduzido_em: kc_02
    evidencia:
      cartoes: ["kc_02:B2"]
      onde: "kc_02, cartão de ensino B2"
      texto: "p é uma caixa como as outras: ocupa espaço, e a caixa p
              também tem um endereço, que é dela."
      exemplo: 'int x = 42; int *p = &x;'
      tipo: explicacao_com_exemplo

  operador_endereco:
    nome: "o operador & : pegar o endereço de uma variável"
    status: disponivel
    introduzido_em: kc_02
    evidencia:
      cartoes: ["kc_02:B1", "kc_02:B2", "kc_02:B3"]
      onde: "kc_02, cartões de ensino B1, B2 e B3"
      texto: "os três cartões usam &idade e &x no exemplo, e o texto de
              cada um diz o que o resultado é — em B2, 'a caixa p também
              tem um endereço, que é dela', com &p ao lado"
      tipo: explicacao_com_exemplo
      ressalva: >
        É a mais fraca das três liberações. O texto explica o que um
        endereço É; o operador aparece rotulado por comentário, e não
        definido em prosa. Se for rebaixado para so_avaliado, as três
        cadeias que dependem dele caem junto.

  # ------------------------------------------------------------------
  # NÃO LIBERADOS, com o que foi encontrado e por que não basta
  # ------------------------------------------------------------------

  derreferencia:
    nome: "o operador * : chegar ao valor que está no endereço"
    status: disponivel
    introduzido_em: kc_02
    evidencia:
      cartoes: ["kc_02:B3"]
      arquivo: kc_02
      secao: B3
      tipo: explicacao_com_leitura_e_escrita
      onde: "kc_02, cartão de ensino B3, campo `interpretation`"
      texto: >
        O cartão explica as três expressões no primeiro parágrafo — o
        operador & obtém o endereço, e o asterisco acessa o conteúdo do
        lugar cujo endereço está em p —, demonstra a LEITURA
        (`printf("%d", *p)` sai 42) e a ESCRITA (`*p = 7`, e x passa a
        valer 7), e fecha distinguindo &x, p e *p lado a lado. O exemplo
        foi compilado e executado antes de entrar.
      aprovacao: >
        Liberado em 05/11/2026 por revisão do dono, depois de duas
        correções pedidas por ele: a explicação de &x subiu para o
        primeiro parágrafo, porque o aluno encontra &x na primeira linha
        do exemplo e só a recebia no quarto; e a metáfora do "caminho de
        volta" saiu, porque sugere que o asterisco apenas desfaz o &, o
        que não vale em qualquer contexto.
      antes: >
        Era `so_avaliado`. O kc_01, cartão B3, mostrava `*p = 7` dentro
        de um exemplo de malloc cujo texto é sobre tempo de vida, não
        sobre o asterisco — menção, não ensino. A desreferência era
        cobrada desde o nível 1 sem ter sido apresentada em cartão
        nenhum dos três tópicos do caminho.

  printf_ponteiro:
    nome: "imprimir endereço com %p"
    status: desconhecido
    introduzido_em: ""
    evidencia:
      onde: "kc_02, cartões B1, B2 e B3"
      texto: >
        Aparece nos três exemplos do ensino e não é explicado em lugar
        nenhum: nenhum texto diz o que %p faz nem por que o cast para
        void * está ali. Usar não é ensinar.
      tipo: usado_sem_explicacao

  sizeof:
    nome: "sizeof: o tamanho em bytes"
    status: disponivel
    introduzido_em: kc_02
    evidencia:
      cartoes: ["kc_02:B2"]
      onde: "kc_02, cartão de ensino B2, campo `interpretation`"
      texto: >
        "O tamanho se pergunta com sizeof. sizeof(alguma coisa) devolve
        quantos bytes aquilo ocupa na memória, e é o compilador que
        responde, pelo tipo: sizeof(x), com x inteiro, dá 4 nesta
        máquina. Pergunte sizeof(p) e ele dá 8."
      exemplo: 'int x = 42; int *p = &x;   /* sizeof(x) dá 4, sizeof(p) dá 8 */'
      tipo: explicacao_com_exemplo
      aprovacao: >
        Liberado em 08/11/2026, junto com o material de ensino profundo
        do kc_02. O B2 é nó OBSERVÁVEL, e `_cartoes()` o põe na
        abertura: todo mundo que entra no kc_02 vê esta explicação,
        não só quem declara lacuna.
      antes: >
        Era `so_avaliado`: `sizeof(int)` aparecia dentro do malloc do
        cartão B3 do kc_01, num exemplo cujo texto é sobre tempo de
        vida, e no kc_02 só em item de nível 2. Menção, não ensino.
      nota: >
        `disponivel` quer dizer que o aluno TEVE OPORTUNIDADE de
        aprender — é o que o cabeçalho deste arquivo define. Não quer
        dizer compreendido nem demonstrado: quem mede isso é o
        diagnóstico e o reteste, não o inventário.

  ponteiro_de_ponteiro:
    nome: "ponteiro para ponteiro (int **)"
    status: so_avaliado
    introduzido_em: ""
    evidencia:
      onde: "kc_02, um item de diagnóstico de nível 3"
      texto: "aparece uma vez, em avaliação, nunca em ensino"
      tipo: so_em_avaliacao

  comparacao_de_ponteiros:
    nome: "comparar ponteiros com =="
    status: so_avaliado
    introduzido_em: ""
    evidencia:
      onde: "kc_02, itens"
      texto: "nenhum cartão de ensino compara ponteiros"
      tipo: so_em_avaliacao

  tipo_do_ponteiro:
    nome: "o ponteiro tem tipo, e quem sabe dele é o compilador"
    status: so_avaliado
    introduzido_em: ""
    evidencia:
      onde: "kc_02, nó I2 e seus itens"
      texto: >
        É premissa do tópico e tem itens, mas não tem cartão de ensino:
        o ensino cobre B1, B2 e B3, e I2 é inferência.
      tipo: so_em_avaliacao

  compilacao:
    nome: "o que acontece na compilação, e o que sobra no executável"
    status: so_avaliado
    introduzido_em: ""
    evidencia:
      onde: "itens dos três tópicos"
      texto: "nenhum cartão de ensino trata de compilação"
      tipo: so_em_avaliacao

  atribuicao_entre_tipos:
    nome: "o compilador recusa atribuição entre tipos incompatíveis"
    status: nao_introduzido
    introduzido_em: ""
    evidencia:
      onde: "em lugar nenhum de kc_00, kc_01 ou kc_02"
      texto: "nem ensino, nem item"
      tipo: nao_encontrado

  funcao_com_parametro:
    nome: "função que recebe parâmetro, e passagem por valor"
    status: nao_introduzido
    introduzido_em: ""
    evidencia:
      onde: "kc_01, cartões B2 e B3"
      texto: >
        Funções aparecem, e PARÂMETRO NENHUM: as duas assinaturas dos
        cartões são `int conta(void)` e `int *faz(void)`. Passagem por
        valor não é tratada em cartão nenhum dos três tópicos.
      tipo: nao_encontrado
      # 08/11/2026 -- NAO FOI PROMOVIDO, e o motivo e fino.
      #
      # A ampliacao do I3 do kc_02 agora EXPLICA passagem por valor, com
      # exemplo: "a funcao recebe uma COPIA do valor... o endereco
      # tambem e um valor, e uma copia do endereco ainda aponta para a
      # mesma caixa". Pela regra de liberacao deste arquivo, isso seria
      # explicacao com exemplo.
      #
      # CORRECAO, 08/11/2026 -- a nota anterior aqui ESTAVA ERRADA.
      #
      # Eu havia escrito que a ampliacao do I3 so chega a quem declara
      # lacuna, porque `_cartoes()` poe na abertura apenas os nos
      # observaveis. A primeira metade e verdade; a conclusao, nao.
      #
      # `_apresenta` (mvp/motor.py) usa `_tela_construcao(d, nid,
      # "primeiro_contato")` -- o MESMO cartao completo, com ampliacao,
      # colado na primeira pergunta sobre aquele no. Medido com a
      # persona que acerta tudo: os seis nos do kc_02 recebem tela de
      # ensino com ampliacao, os tres de inferencia por primeiro
      # contato. Nenhuma premissa e perguntada sem ter sido apresentada,
      # e existe teste que percorre a sessao inteira cobrando isso.
      #
      # E a abertura de TRES cartoes e decisao pedagogica, nao limitacao.
      # O commit fa8df68 escreve: "Nao enfileirei as seis na abertura de
      # proposito: seis telas antes da primeira pergunta e aula, nao
      # diagnostico."
      #
      # ENTAO A PERGUNTA MUDA. Dentro do kc_02, o conceito E apresentado
      # antes de ser cobrado. O que resta e se quem chega aos OUTROS
      # topicos passou pelo kc_02 -- o que o grafo de pre-requisitos
      # declara (kc_06 -> kc_04 -> kc_02) e nada hoje obriga, porque o
      # topico e escolhido por variavel de ambiente.
      #
      # A promocao para `disponivel`, com `introduzido_em: kc_02`, e a
      # mesma forma que `derreferencia` ja usa. Fica para o dono: nao
      # promovo conceito para deixar validador verde.
      consequencia: >
        Bloqueia o degrau substituto proposto para o `scanf`, que se
        apoiava justamente em passagem por valor.

  scanf:
    nome: "scanf, e o & que ele exige"
    status: nao_introduzido
    introduzido_em: ""
    evidencia:
      onde: "em lugar nenhum de kc_00, kc_01 ou kc_02"
      texto: >
        Nem ensino, nem item, nem crença. O degrau que o usa apoiava-se
        numa familiaridade vinda da disciplina, que este sistema não tem
        como comprovar.
      tipo: nao_encontrado

  array:
    nome: "array: um conjunto de casas grudadas"
    status: disponivel
    introduzido_em: kc_07
    evidencia:
      cartoes: ["kc_07:B1"]
      onde: "kc_07, cartão de ensino B1, campo `interpretation`"
      texto: >
        "Cinco caixas, e não uma caixa com cinco coisas dentro. A
        diferença se vê escrevendo: ponha 10 em a[0], 20 em a[1], e
        pergunte a[0] de novo. Continua 10. [...] O nome a é do
        conjunto, não de uma caixa. a[2] é uma caixa; a são as cinco."
      exemplo: 'int a[3]; a[0] = 10; a[1] = 20;'
      tipo: explicacao_com_exemplo
      aprovacao: >
        Liberado em 09/11/2026, com o material de ensino profundo do B1
        do kc_07. O B1 é nó OBSERVÁVEL, e `_cartoes()` o põe na
        abertura: todo mundo que entra no kc_07 vê esta explicação, não
        só quem declara lacuna. É a mesma condição pela qual o `sizeof`
        passou e o `funcao_com_parametro` não.
      antes: >
        Era `desconhecido` — ninguém tinha declarado. A auditoria de
        05/11 cobriu kc_00, kc_01 e kc_02, que é o caminho até o kc_02,
        e o kc_07 ficou sem leitura. A nota dizia isso.
      nota: >
        O cartão tem TESTE DE MESA, e é ele que carrega o ensino: uma
        linha por instrução, uma coluna por caixa, mostrando que
        escrever em a[1] não mexe em a[0] e que os três endereços
        distam 4. A tabela é gerada executando o exemplo, e o gerador
        aprendeu índice de array no mesmo dia para isso ser possível.

        O que isto destrava: as 30 cobranças de `array` do kc_07 param
        de ser cobrança sem ensino, e cai uma das três travas da cadeia
        `array_is_pointer` — sobram `atribuicao_entre_tipos` e
        `compilacao`.
