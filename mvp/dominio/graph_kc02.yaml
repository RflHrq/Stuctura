topic: kc_02

# A METÁFORA DESTE TÓPICO: a rua de casas numeradas.
#
# Cada lugar da memória é uma casa, com um número na porta (o endereço) e
# alguma coisa dentro (o valor). Um ponteiro é uma casa como as outras —
# e o que está dentro dela é o número de outra casa.
#
# ONDE ELA QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. Números de casa andam de um em um. Endereços andam do tamanho do
#      objeto — p + 1 não é o byte seguinte. Isso é kc_11, e aqui a
#      metáfora cala.
#   2. A casa de um papel com um número escrito não deixa de ser casa.
#      É a confusão do B2, e é por isso que a próxima regra existe.
#
# A REGRA DA SETA: desenhe a seta, nunca diga que o ponteiro É a seta.
# "Ponteiro é a flecha que aponta" é a frase que fabrica a crença
# pointer_has_no_address — um ponteiro que é seta não ocupa lugar, não tem
# endereço, e &p deixa de fazer sentido. A seta é o que a gente desenha
# para enxergar a relação; o ponteiro é a caixa de onde ela sai.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "Cada lugar da memória tem um número que o identifica: o endereço."
    plain_text: >
      A memória é uma rua de lugares numerados. O número do lugar é o
      endereço — não o que está guardado nele.
    negated_by:
      - memory_is_by_name
    evidencia:
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # O endereco identifica o lugar: lugares diferentes dao numeros
      # diferentes, e o mesmo lugar da sempre o mesmo numero.
      #
      # A COMPARACAO PASSA POR UMA FUNCAO de proposito. A primeira
      # versao desta evidencia escrevia `&x == &x` direto, e o gcc
      # respondeu `warning: self-comparison always evaluates to true
      # [-Wtautological-compare]`: aquilo era verdadeiro por SINTAXE,
      # dobrado em tempo de compilacao, e nao media nada sobre
      # memoria. Dentro de `igual` o compilador nao sabe de onde vem
      # cada argumento, e a comparacao e dos dois numeros, em tempo de
      # execucao -- que e a afirmacao do no.
      #
      # E nenhuma VARIAVEL ponteiro aparece: `&x` o proprio cartao
      # deste no ja usa, e `int *p` e o B2.
      - afirma: >
          O endereço identifica o lugar: lugares diferentes dão números
          diferentes, e o mesmo lugar dá sempre o mesmo número.
        programa: |
          #include <stdio.h>

          static int igual(int *a, int *b)
          {
              return a == b;
          }

          int main(void)
          {
              int x = 10, y = 20;

              puts(igual(&x, &y) == 0
                   ? "lugares diferentes tem numeros diferentes"
                   : "FALHOU");
              puts(igual(&x, &x) == 1
                   ? "o mesmo lugar tem sempre o mesmo numero"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          lugares diferentes tem numeros diferentes
          o mesmo lugar tem sempre o mesmo numero
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # Lugares diferentes tem numeros diferentes -- a metade que se
      # pode mostrar aqui, na forma exata que este cartao ensina.
      #
      # ESTA EXISTE PARA CHEGAR A PESSOA, e e a mesma divisao que o
      # cartao ja faz. A demonstracao acima passa a comparacao por uma
      # funcao, para que o compilador nao dobre `&x == &x` em tempo de
      # compilacao -- e funcao com parametro nao tem cartao que a
      # ensine, entao o portao de exibicao a barra, com razao.
      #
      # O QUE SE PERDE: a metade "mesmo lugar". Nao e descuido, e o
      # limite do que se demonstra sem ponteiro: para um lugar ter
      # dois nomes e preciso guardar o endereco em algum lugar, e isso
      # e o B2. O comentario deste no registra a mesma conclusao sobre
      # o exemplo do cartao -- ele AFIRMA o caso igual e DEMONSTRA o
      # caso diferente. A prova faz igual.
      - afirma: >
          Lugares diferentes têm números diferentes: duas variáveis, dois
          endereços, e a comparação entre eles dá zero.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int idade = 20;
              int outra = 7;
              int mesmo_lugar = &idade == &outra;

              printf("&idade == &outra da %d\n", mesmo_lugar);
              puts(mesmo_lugar == 0
                   ? "lugares diferentes tem numeros diferentes"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          &idade == &outra da 0
          lugares diferentes tem numeros diferentes
    # AMPLIACAO EXPLICATIVA, 05/11/2026 — nao e premissa nova.
    #
    # A auditoria da cadeia liberada achou que ela exigia comparacao de
    # enderecos sem declarar o requisito e sem que cartao nenhum
    # ensinasse. O B1 ja afirma que o endereco IDENTIFICA um lugar, e
    # identificar e exatamente o que permite dizer se dois lugares sao o
    # mesmo — entao a operacao pertence a este cartao.
    #
    # O LIMITE TECNICO, e ele decide o que entra:
    #
    #   &idade == &outra    compila limpo, da 0        <- esta aqui
    #   &idade == &idade    AVISA (self-comparison)    <- fica fora
    #   p == &x             limpo, mas p e do B2       <- fica fora
    #
    # A metade "mesmo lugar" exige dois nomes para o mesmo lugar, e sem
    # ponteiro o unico jeito e comparar um endereco consigo mesmo, que o
    # gcc acusa. Entao o cartao AFIRMA o caso igual e DEMONSTRA o caso
    # diferente. Afirmar sem demonstrar e menos que o ideal, e e melhor
    # que demonstrar com um exemplo que sai avisando.
    #
    # E NENHUM PONTEIRO APARECE AQUI: ponteiro e o B2, e antecipa-lo
    # seria o erro que esta auditoria existe para pegar.
    interpretation: >
      O endereço serve para identificar: dois endereços iguais são o
      mesmo lugar, e dois endereços diferentes são lugares diferentes.
      Em C isso se pergunta com ==, do mesmo jeito que se comparam dois
      números — porque é disso que se trata.


      No exemplo, idade e outra são duas variáveis, cada uma no seu
      lugar. Por isso &idade == &outra dá 0: lugares diferentes. Se
      desse 1, as duas estariam no mesmo lugar, e escrever numa mudaria
      a outra.


      Guarde a leitura do resultado: 1 quer dizer mesmo lugar, 0 quer
      dizer lugares diferentes.

  B2:
    type: observavel
    role: espinha
    support: []
    text: "Um ponteiro é uma variável: ocupa um lugar e tem endereço próprio."
    plain_text: >
      p é uma caixa como as outras: ocupa espaço, e a caixa p também tem
      um endereço, que é dela.
    negated_by:
      - pointer_has_no_address
    evidencia:
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # O ponteiro ocupa lugar e tem endereco proprio: `&p` existe, nao
      # e `&x`, e serve para chegar de volta em `p`.
      - afirma: >
          O ponteiro ocupa lugar e tem endereço próprio: &p existe, não é
          &x, e serve para chegar de volta em p.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 10;
              int *p = &x;
              int **pp = &p;

              puts(sizeof p > 0 ? "o ponteiro ocupa lugar" : "FALHOU");
              puts((void *) &p != (void *) &x ? "a caixa p nao e a caixa x"
                                              : "FALHOU");
              puts(*pp == p ? "o endereco de p leva de volta a p" : "FALHOU");
              return 0;
          }
        espera: |-
          o ponteiro ocupa lugar
          a caixa p nao e a caixa x
          o endereco de p leva de volta a p
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # O ponteiro ocupa lugar e a caixa dele nao e a caixa de `x` --
      # as duas metades que se podem mostrar SEM construto novo.
      #
      # ESTA EXISTE PARA CHEGAR A PESSOA. A demonstracao acima usa
      # `int **pp`, e `ponteiro_de_ponteiro` nao tem cartao que o
      # ensine: o portao de exibicao a barra, com razao. Mostrar
      # ponteiro de ponteiro a quem esta no kc_02 repetiria o defeito
      # que reprovou a cadeia do `pointer_and_target_are_one`, cujo
      # degrau de ABERTURA exigia construto que cartao nenhum
      # ensinava.
      #
      # O QUE SE PERDE sem o `**pp`: a volta. Lá, `*pp == p` mostra que
      # o endereco de `p` SERVE para chegar de volta em `p`. Aqui fica
      # so que `&p` existe e nao e `&x`. E menos, e e o que o caminho
      # permite -- a demonstracao completa continua conferida pelo
      # oraculo, para o trabalho.
      - afirma: >
          O ponteiro ocupa lugar, e a caixa dele não é a caixa de x: são
          dois lugares diferentes.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 10;
              int *p = &x;
              int ocupa = sizeof p > 0;
              int separadas = (void *) &p != (void *) &x;

              puts(ocupa ? "o ponteiro ocupa lugar" : "FALHOU");
              puts(separadas ? "a caixa p nao e a caixa x" : "FALHOU");
              return 0;
          }
        espera: |-
          o ponteiro ocupa lugar
          a caixa p nao e a caixa x

    # AMPLIACAO EXPLICATIVA, 08/11/2026 -- nao e premissa nova.
    #
    # E AQUI que `sizeof` e explicado, e nao no I2. O inventario o tem
    # como `so_avaliado` -- mencionado dentro de um malloc do kc_01 cujo
    # texto e sobre tempo de vida. Se esta ampliacao ficar, a evidencia
    # do inventario deve apontar para ca.
    #
    # A REGRA DA SETA vale em cada linha, e nenhuma derreferencia: *p e
    # o B3.
    interpretation: >
      Se p é uma caixa, então p tem as duas coisas que toda
      caixa tem: um lugar e um tamanho. O lugar se pergunta com
      &p, do mesmo jeito que se pergunta &x — e as duas
      respostas saem diferentes, porque são duas caixas.

      O tamanho se pergunta com sizeof. sizeof(alguma coisa)
      devolve quantos bytes aquilo ocupa na memória, e é o
      compilador que responde, pelo tipo: sizeof(x), com x
      inteiro, dá 4 nesta máquina. Pergunte sizeof(p) e ele dá 8
      — p ocupa espaço, e ocupa um espaço seu, que não é o de x.
      O 8 se repete para int *, char * ou double *, porque o que
      p guarda é sempre um endereço, e endereço tem um tamanho
      só.

      É por aqui que o desenho da seta engana. A seta mostra a
      relação entre as duas caixas, e para isso ela serve. Mas
      seta não tem lugar nem tamanho, e p tem os dois. Quem
      pensa o ponteiro COMO a seta fica sem resposta para "onde
      fica p?" — e &p é uma pergunta que o compilador responde
      sem reclamar.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "O valor guardado num ponteiro é um endereço."
    plain_text: >
      O que está dentro de p é um endereço: o número do lugar onde outra
      caixa fica.
    negated_by:
      - pointer_is_data
    evidencia:
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # O que esta guardado em `p` e o endereco de `x`, e escrever por
      # ali muda `x` -- que e o que faz dele endereco e nao numero
      # solto.
      - afirma: >
          O que está guardado em p é o endereço de x, e escrever por ali
          muda x — é isso que faz dele endereço, e não número solto.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 10;
              int *p = &x;

              puts(p == &x ? "o que esta dentro de p e o endereco de x"
                           : "FALHOU");
              *p = 99;
              printf("escrever por p mudou x: %d\n", x);
              puts(x == 99 ? "logo o valor em p era o endereco de x" : "FALHOU");
              return 0;
          }
        espera: |-
          o que esta dentro de p e o endereco de x
          escrever por p mudou x: 99
          logo o valor em p era o endereco de x
    # AMPLIACAO EXPLICATIVA, 05/11/2026 — nao e premissa nova.
    #
    # A auditoria do material achou que o kc_02 ensinava em tres cartoes
    # que um ponteiro guarda um endereco e NUNCA ensinava a usar esse
    # endereco: desreferencia nao aparecia com explicacao em cartao
    # nenhum dos tres topicos do caminho, e era cobrada desde o nivel 1.
    #
    # A afirmacao do B3 nao mudou, a crenca que o nega nao mudou, e
    # nenhum no entrou no grafo. O que entrou foi a explicacao da
    # consequencia direta do que o B3 ja afirmava: se o que esta dentro
    # de p e um endereco, da para ir ate la.
    #
    # Este campo e lido SO pela tela de ensino. O `plain_text` nao foi
    # esticado porque ele aparece em sete telas, e numa delas e a
    # alternativa certa da camada 2.
    # REVISAO DE 05/11/2026, duas mudancas e os dois motivos:
    #
    # 1. A explicacao de &x subiu para o primeiro paragrafo. O aluno
    #    encontra &x na PRIMEIRA linha do exemplo e so recebia a
    #    explicacao no quarto paragrafo — quem parasse de ler antes do
    #    fim levava a distincao p x *p e nao a de &x.
    #
    # 2. "O asterisco e o caminho de volta" deixou de ficar sozinho. A
    #    metafora e intuitiva e sugere que * simplesmente desfaz o &, o
    #    que nao vale em qualquer contexto. Ela some, e no lugar fica o
    #    que * faz: acessa o conteudo do lugar apontado.
    #
    # E a acentuacao foi consertada. O texto nasceu sem acento nenhum —
    # "endereco", "numero", "nao" — enquanto todo o resto do material e
    # portugues correto. Foi confusao minha entre a regra da CRASE (o
    # caractere de acento grave, que o cliente escreveria literalmente
    # na tela) e a acentuacao normal, que e obrigatoria.
    interpretation: >
      Se o que está dentro de p é o endereço de x, então dá para ir até
      lá. O operador & obtém o endereço de uma variável: &x é o endereço
      de x. O asterisco permite acessar o conteúdo do lugar cujo
      endereço está guardado em p: *p não é p.


      Lendo: *p mostra 42, que é o valor que mora em x. Repare que p
      sozinho não serve para obter esse conteúdo: p guarda o número do
      lugar, enquanto *p acessa o que está naquele lugar.


      Escrevendo: *p = 7 não muda p. Muda o conteúdo do objeto apontado,
      e por isso x passa a valer 7 sem a letra x aparecer na linha.


      Três expressões, três coisas: &x é o endereço de x; p guarda esse
      endereço; *p acessa o conteúdo que mora naquele lugar.

  I1:
    type: inferencia
    role: espinha
    support: [B2, B3]
    text: "O ponteiro e o objeto apontado são duas coisas, cada uma no seu lugar."
    plain_text: >
      Então p e a caixa apontada são duas caixas diferentes, em dois
      lugares diferentes.
    negated_by:
      - pointer_and_target_are_one
    evidencia:
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # Sao duas coisas: ficam em lugares diferentes, e REATRIBUIR o
      # ponteiro nao mexe no objeto que ele apontava.
      - afirma: >
          São duas coisas: ficam em lugares diferentes, e reatribuir o
          ponteiro não mexe no objeto que ele apontava.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 10, y = 20;
              int *p = &x;

              puts((void *) &p != (void *) &x ? "p e x ficam em lugares diferentes"
                                              : "FALHOU");
              p = &y;
              printf("mudar p nao mexeu em x: %d\n", x);
              printf("e p agora alcanca y: %d\n", *p);
              return 0;
          }
        espera: |-
          p e x ficam em lugares diferentes
          mudar p nao mexeu em x: 10
          e p agora alcanca y: 20

    # AMPLIACAO EXPLICATIVA, 08/11/2026 -- nao e premissa nova.
    #
    # O I1 e INFERENCIA, e sai de B2 + B3. A ampliacao mostra a
    # DERIVACAO em vez de so afirmar: quem aceitou que p e uma caixa e
    # que dentro dela ha um endereco nao tem como recusar que sao duas.
    interpretation: >
      Esta não é uma ideia nova: ela cai das duas anteriores. O
      B2 disse que p é uma caixa, com lugar próprio. O B3 disse
      que o que está dentro de p é o endereço de outra caixa.
      Junte as duas e você tem duas caixas — a de p e a apontada
      — em dois lugares, e &p e p respondem números diferentes.

      O que decorre disso é o que separa as duas operações do
      tópico. Escrever p = &y mexe no conteúdo de p: troca o
      endereço guardado, e a caixa antes apontada continua
      exatamente como estava. Escrever *p = 99 não toca em p:
      usa o endereço que está nele para chegar à outra caixa e
      mudar o que mora lá.

      Mexer no ponteiro e mexer no apontado são coisas
      diferentes porque são caixas diferentes. Quem acha que são
      a mesma espera que p = &y também mude o valor antigo — e a
      máquina mostra que não muda.
  I2:
    type: inferencia
    role: espinha
    support: [B1, B3]
    text: "Um ponteiro tem tipo, e por isso não é um inteiro qualquer."
    # Esta é a frase que a revisão pegou errada no material antigo, que
    # dizia que o endereço "carrega junto o tipo do que está no destino".
    # Não carrega: em tempo de execução não viaja tipo nenhum junto do
    # endereço. O tipo é do ponteiro, e quem sabe dele é o compilador.
    plain_text: >
      Quem sabe o tipo de p é o compilador, que leu int *p. Por isso p
      não é só um número solto.
    negated_by:
      - pointer_is_integer
    evidencia:
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # TEM TIPO: somar 1 anda um tamanho diferente em cada tipo, logo
      # quem soma sabe de que tipo e o ponteiro. Em `char` anda 1 byte,
      # e isso o padrao garante (`sizeof(char) == 1`).
      - afirma: >
          O ponteiro tem tipo: somar 1 anda um tamanho diferente em cada
          tipo, logo quem soma sabe de que tipo é o ponteiro. Em char anda
          1 byte, e isso o padrão garante.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              char   c[2];
              int    i[2];
              double d[2];
              int passo_char   = (int) ((char *) (c + 1) - (char *) c);
              int passo_int    = (int) ((char *) (i + 1) - (char *) i);
              int passo_double = (int) ((char *) (d + 1) - (char *) d);

              puts(passo_char < passo_int && passo_int < passo_double
                   ? "somar 1 anda um tamanho diferente em cada tipo"
                   : "FALHOU");
              puts(passo_char == 1
                   ? "em char anda 1 byte, e isso o padrao garante"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          somar 1 anda um tamanho diferente em cada tipo
          em char anda 1 byte, e isso o padrao garante
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # E POR ISSO NAO E UM INTEIRO QUALQUER: guardar o ponteiro num
      # `int` e violacao de restricao da linguagem, e todo compilador
      # conforme tem de DIAGNOSTICAR. Um inteiro qualquer aceitaria a
      # atribuicao calado. A demonstracao aqui e a recusa, nao a saida.
      - afirma: >
          E por isso não é um inteiro qualquer: guardar o ponteiro num int
          é violação de restrição da linguagem, e todo compilador conforme
          tem de diagnosticar. A demonstração aqui é a recusa, e não a
          saída.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 10;
              int *p = &x;
              int n = p;              /* um inteiro qualquer aceitaria isto */

              printf("%d\n", n);
              return 0;
          }
        nao_compila: true
        # O `ambiente` ANTIGO, guardado como comentario em 12/11/2026. Ele
        # tambem e TEXTO DE TELA -- viaja na prova por recusa --, e estava em
        # ASCII, com crase, e com nota de manutencao que o participante leria:
        #
        # gcc 16.2.0 (MinGW-W64 x86_64-ucrt-posix-seh), `-std=c17 -Wall`:
        # `error: initialization of 'int' from 'int *' makes integer from
        # pointer without a cast [-Wint-conversion]`.
        #
        # E A RECUSA E DESTE COMPILADOR, NAO DE C. Em gcc anterior ao 14 a
        # mesma linha e AVISO e o programa compila: o `-Wint-conversion`
        # virou erro por padrao no 14. O que o padrao garante e o
        # diagnostico, nao a recusa de traduzir -- e a primeira
        # demonstracao deste no, que roda e compara saida, nao depende de
        # compilador nenhum.
        #
        # O historico deste no registra que o projeto JA AFIRMOU "o
        # compilador recusa" uma vez, no material antigo, e teve de voltar
        # atras. A clausula exata do padrao fica a citar quando o ISO/IEC
        # 9899 estiver aberto; aqui ela nao entra de memoria.
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall: o compilador recusa
          a linha com um erro de conversão de ponteiro para inteiro. A
          recusa é deste compilador, e não de C: no gcc anterior ao 14 a
          mesma linha é só um aviso, e o programa compila. O que o padrão
          garante é o diagnóstico, e não a recusa de traduzir.

    # REESCRITA, 08/11/2026: de 277 para 137 palavras.
    #
    # E A ABERTURA MUDOU POR UM DEFEITO CONCEITUAL, nao por tamanho. Ela
    # dizia 'um endereco e um numero, e isso e verdade' -- e isso e quase
    # a propria crenca que este no existe para negar: pointer_is_integer
    # diz 'ponteiro e so um numero inteiro'. A ampliacao abria afirmando
    # a concepcao que ela deve desmontar. Agora: 'pode ser representado
    # numericamente, mas isso nao conta toda a historia'.
    #
    # O QUE SAIU, e onde mora agora:
    #   aritmetica de ponteiro (p + 1) -> kc_11, e o cabecalho deste
    #     grafo manda calar sobre ela aqui;
    #   `int *p = x;` -> ja e o item ciu_kc02_014, no degrau 2;
    #   a ressalva de severidade -> so existia porque o texto afirmava
    #     que o compilador recusa; tirada a afirmacao, ela perde a funcao.
    interpretation: >
      Um endereço pode ser representado numericamente, mas isso
      não conta toda a história. A sua declaração disse mais do
      que o número: ela disse o que esperar encontrar quando se
      chegar lá. Foi isso que você escreveu em int *p — não "p
      guarda um número", e sim "p guarda o lugar de um int".

      No exemplo, a mesma pergunta vai a dois ponteiros.
      sizeof(*p) == sizeof(*q) dá 0: o que mora no fim de p não
      tem o tamanho do que mora no fim de q. E sizeof(*p) ==
      sizeof(x) dá 1: no fim de p mora um int, igual a x. Os
      dois guardam endereço, e o que os separa é o tipo.

      E quem carrega essa informação não é a memória nem o
      endereço: é o compilador, que leu a sua declaração antes
      de o programa existir.

  I3:
    type: inferencia
    role: conclusao
    support: [I1, I2]
    text: >
      Guardar um endereço permite alcançar a mesma caixa de outro ponto do
      programa.
    plain_text: >
      Com o endereço na mão, dá para chegar naquela caixa de qualquer
      ponto do programa, sem copiar o conteúdo.
    negated_by:
      - pointer_is_pointless
    evidencia:
      # A LEGENDA ANTIGA DESTA DEMONSTRACAO, guardada como comentario em
      # 12/11/2026. Ela estava no campo `afirma`, que e TEXTO DE TELA --
      # em ASCII, com crase, e no que tinha de nota de manutencao o
      # participante leria junto. O conteudo fica para quem mantem:
      #
      # Guardar o endereco alcanca a mesma caixa de outro ponto do
      # programa: outra funcao escreve em `x` sem receber copia de `x`.
      - afirma: >
          Guardar o endereço alcança a mesma caixa de outro ponto do
          programa: outra função escreve em x sem receber cópia de x.
        programa: |
          #include <stdio.h>

          static void poe(int *onde, int valor)
          {
              *onde = valor;
          }

          int main(void)
          {
              int x = 10;

              poe(&x, 99);
              printf("outra funcao alcancou a caixa x: %d\n", x);
              puts(x == 99 ? "e alcancou pelo endereco, sem copiar o conteudo"
                           : "FALHOU");
              return 0;
          }
        espera: |-
          outra funcao alcancou a caixa x: 99
          e alcancou pelo endereco, sem copiar o conteudo

    # REESCRITA, 08/11/2026: de 205 para 123 palavras.
    #
    # E A CONCLUSAO MUDOU POR SER FALSA, nao por tamanho. Ela dizia que
    # o ponteiro e 'a UNICA forma de uma funcao alcancar a caixa de quem
    # a chamou', e nao e: variavel global tambem alcanca. Agora o texto
    # diz o que de fato se ganha -- acessar e modificar diretamente, sem
    # depender de global -- sem afirmar uma exclusividade que nao existe.
    interpretation: >
      Quando você passa uma variável para uma função, a função
      recebe uma CÓPIA do valor. Ela mexe na cópia, a cópia
      morre no fim, e a sua variável continua como estava. Por
      isso uma função que recebe int v não tem como alterar a
      variável de quem a chamou.

      O endereço resolve isso porque ele também é um valor — e
      um valor que pode ser copiado sem perder o que importa. A
      função recebe uma cópia do ENDEREÇO, e uma cópia do
      endereço ainda aponta para a mesma caixa. Com ela, *q =
      ... chega à caixa original.

      É assim que uma função consegue acessar e modificar
      diretamente a variável de quem a chamou, sem depender de
      uma variável global.
