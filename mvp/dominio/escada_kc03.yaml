# A escada do kc_03 — declaração e inicialização de ponteiros.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00 e do kc_02, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI passou pelo kc_00 e pelo kc_02: sabe declarar, guardar
# e ler uma variável; sabe o que é endereço (`&idade`), declarar um
# ponteiro (`int *p;`), guardar um endereço nele (`p = &idade;`) e
# chegar ao lugar apontado (`*p`). O cenário continua: `idade`, `nota`,
# `turma`, e os ponteiros `p`, `q` e `c`.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   int *p, q;        dois nomes numa linha, e de quem é o *    B2, degrau 2
#   int *p, *q;       dois ponteiros numa linha                 B2, degrau 3
#   NULL              "não aponta para lugar nenhum"            I2, degrau 1
#   p = NULL;         escrever NULL num ponteiro                I2, degrau 2
#   int *p = NULL;    o ponteiro que já nasce com NULL          I2, degrau 3
#
# NADA AQUI É EXECUTADO LENDO O QUE NINGUÉM ESCREVEU. O assunto do
# tópico é justamente a variável e o ponteiro sem valor escolhido. Os
# degraus de `digitar` só rodam trechos em que tudo recebeu valor antes
# de ser lido; os trechos que usam ponteiro sem endereço aparecem para a
# pessoa ESCOLHER e ORDENAR, e o conferidor só os compila. Cinco das
# seis provas são o que o compilador DIZ, e não uma saída.
#
# O `if` NÃO ENTRA. A premissa do I2 fala de NULL, e o jeito usual de
# usá-lo é um teste (`if (p == NULL)`). O teste é assunto do kc_05; aqui
# o NULL é só um valor que se escreve — e que não aparece sozinho.
#
# AS QUESTÕES DE MARCAR. O banco do kc_03 foi escrito para o fluxo
# anterior, em que um cartão ensinava cada construto, e NÃO foi mexido:
# os cartões do tópico foram escritos contando com o cenário de cada
# questão. Onze das 36 questões de diagnóstico e de treino usam o que
# esta escada não ensina — `sizeof`, vetor, laço, `malloc`, `if`, função
# de várias linhas —, e estão em `fora_da_trilha`, na premissa de cada
# uma. Em quatro premissas a que ficou de fora é justamente a de código
# de degrau 2, que abriria a premissa; nelas a trilha abre com a de
# código que sobrou (B1, I2 e I3) ou, no B3, com a de conceito — é a
# única premissa do tópico que fica com duas questões só.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "Declarar cria o lugar da variável, antes de qualquer valor."
      - "Vale para toda variável: int idade; cria o lugar de idade, e int *p; cria o lugar de p."
    codigo: |
      int idade;
      int *p;
    saida: ""
  # sizeof com %zu, e vetor: a escada não ensina nenhum dos dois.
  fora_da_trilha: [ciu_kc03_002, ciu_kc03_t03]
  provas:
    - crenca: no_value_no_memory
      programa: |
        int nota;
        int *q;

        q = &nota;
        *q = 7;
        printf("%d\n", nota);
      previsao:
        pergunta: >
          Quando a linha q = &nota; roda, nota ainda não recebeu valor
          nenhum. O que o trecho imprime?
        opcoes:
          - "7"
          - "Nada: sem valor, nota ainda não existe, e não tem endereço"
        real: 0
        crenca: 1
      espera: "7"
      afirma: >
        Saiu 7. O endereço de nota foi pego antes de ela ter valor, e o
        7 entrou por ele. O lugar existe desde a declaração; o valor só
        chega depois.
  degraus:
    - id: esc_kc03_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Declarar uma variável já reserva o lugar dela na memória."
        - "O valor vem depois. O lugar existe desde a declaração."
      versoes:
        - pede: "Depois dessa linha, o que já existe?"
          antes: "int idade;"
          pecas:
            - "O lugar de idade, reservado"
            - "Nada ainda: sem valor, a variável não existe"
            - "O lugar de idade, com zero dentro"
          certa: [[0]]
          certa_texto: "O lugar de idade, reservado"
          erros:
            - exata: [1]
              crenca: no_value_no_memory
              retorno: "A declaração já reserva o lugar, com valor ou sem. O que falta a idade é o valor, e não a existência."
            - exata: [2]
              retorno: "O lugar existe, mas ninguém escreveu zero nele. Declarar reserva; não escreve."
          retorno_geral: "A declaração reserva o lugar de idade. O valor vem depois."
        - pede: "Depois dessa linha, o que já existe?"
          antes: "int nota;"
          pecas:
            - "O lugar de nota, reservado"
            - "Nada ainda: sem valor, a variável não existe"
            - "O lugar de nota, com zero dentro"
          certa: [[0]]
          certa_texto: "O lugar de nota, reservado"
          erros:
            - exata: [1]
              crenca: no_value_no_memory
              retorno: "A declaração já reserva o lugar, com valor ou sem. O que falta a nota é o valor, e não a existência."
            - exata: [2]
              retorno: "O lugar existe, mas ninguém escreveu zero nele. Declarar reserva; não escreve."
          retorno_geral: "A declaração reserva o lugar de nota. O valor vem depois."

    - id: esc_kc03_B1_2
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Como o lugar já existe, ele já tem endereço."
        - "Dá para guardar o endereço de idade num ponteiro antes de idade receber qualquer valor."
      versoes:
        - pede: "idade ainda não tem valor. Guarde o endereço dela em p."
          antes: |-
            int idade;
            int *p;
          pecas: ["p", "=", "&idade", ";", "idade"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "p = &idade;"
          erros:
            - exata: [0, 1, 4, 3]
              retorno: "idade, sem o &, seria o valor guardado, e ela ainda nem tem valor. O que já existe é o lugar: p = &idade;"
            - exata: [2, 1, 0, 3]
              invalida: true
              retorno: "Quem recebe fica à esquerda do sinal de igual. É p que recebe o endereço: p = &idade;"
          retorno_geral: "O lugar de idade já existe, e o endereço dele é &idade: p = &idade;"
        - pede: "nota ainda não tem valor. Guarde o endereço dela em q."
          antes: |-
            int nota;
            int *q;
          pecas: ["q", "=", "&nota", ";", "nota"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "q = &nota;"
          erros:
            - exata: [0, 1, 4, 3]
              retorno: "nota, sem o &, seria o valor guardado, e ela ainda nem tem valor. O que já existe é o lugar: q = &nota;"
            - exata: [2, 1, 0, 3]
              invalida: true
              retorno: "Quem recebe fica à esquerda do sinal de igual. É q que recebe o endereço: q = &nota;"
          retorno_geral: "O lugar de nota já existe, e o endereço dele é &nota: q = &nota;"

    - id: esc_kc03_B1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Com o endereço na mão, dá para escrever no lugar de idade pelo ponteiro."
        - "É a primeira escrita em idade, e ela encontra o lugar pronto."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int *p;

            p = &idade;
            *p = 15;
            printf("%d\n", idade);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "Ninguém pôs zero em idade. A linha *p = 15; escreveu 15 no lugar dela, que existia desde a declaração."
          retorno_geral: "O lugar de idade existe desde a declaração. *p = 15; escreveu nele: o trecho mostra 15."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int pontos;
            int *q;

            q = &pontos;
            *q = 3;
            printf("%d\n", pontos);
          aceitas: ["3"]
          certa_texto: "3"
          erros:
            - texto: "0"
              retorno: "Ninguém pôs zero em pontos. A linha *q = 3; escreveu 3 no lugar dela, que existia desde a declaração."
          retorno_geral: "O lugar de pontos existe desde a declaração. *q = 3; escreveu nele: o trecho mostra 3."

    - id: esc_kc03_B1_4
      guiado: false
      forma: montar
      codigo: true
      frases: []
      versoes:
        - pede: "Declare um inteiro chamado nota e, sem dar valor a ele, guarde o endereço dele em q."
          antes: "int *q;"
          pecas: ["int nota;", "q = &nota;", "nota = 0;", "q = nota;"]
          certa: [[0, 1]]
          certa_texto: "int nota; q = &nota;"
          erros:
            - exata: [1, 0]
              invalida: true
              retorno: "Primeiro a declaração, que cria o lugar. Só depois o endereço: int nota; e então q = &nota;"
            - exata: [0, 3]
              invalida: true
              retorno: "nota, sem o &, é o valor guardado, e o ponteiro recebe endereço. O compilador reclama. O certo é q = &nota;"
            - exata: [0, 2, 1]
              retorno: "Não precisava do valor: o lugar de nota existe desde a declaração. Bastam int nota; e q = &nota;"
          retorno_geral: "São duas linhas: int nota; cria o lugar, e q = &nota; guarda o endereço dele."
        - pede: "Declare um inteiro chamado idade e, sem dar valor a ele, guarde o endereço dele em p."
          antes: "int *p;"
          pecas: ["int idade;", "p = &idade;", "idade = 0;", "p = idade;"]
          certa: [[0, 1]]
          certa_texto: "int idade; p = &idade;"
          erros:
            - exata: [1, 0]
              invalida: true
              retorno: "Primeiro a declaração, que cria o lugar. Só depois o endereço: int idade; e então p = &idade;"
            - exata: [0, 3]
              invalida: true
              retorno: "idade, sem o &, é o valor guardado, e o ponteiro recebe endereço. O compilador reclama. O certo é p = &idade;"
            - exata: [0, 2, 1]
              retorno: "Não precisava do valor: o lugar de idade existe desde a declaração. Bastam int idade; e p = &idade;"
          retorno_geral: "São duas linhas: int idade; cria o lugar, e p = &idade; guarda o endereço dele."

    - id: esc_kc03_B1_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Quantos lugares da memória estas três linhas reservam?"
          antes: |-
            int idade;
            int nota;
            int *p;
          pecas:
            - "Três: um para cada nome declarado"
            - "Dois: o ponteiro não conta"
            - "Nenhum: nada recebeu valor"
          certa: [[0]]
          certa_texto: "Três: um para cada nome declarado"
          erros:
            - exata: [1]
              retorno: "O ponteiro é uma variável como as outras, e a declaração reserva o lugar dele também. São três."
            - exata: [2]
              retorno: "Declarar já reserva o lugar, com valor ou sem. São três nomes declarados, e três lugares."
          retorno_geral: "Cada declaração reserva um lugar: o de idade, o de nota e o de p."
        - pede: "Quantos lugares da memória estas três linhas reservam?"
          antes: |-
            char turma;
            int *q;
            int pontos;
          pecas:
            - "Três: um para cada nome declarado"
            - "Dois: o ponteiro não conta"
            - "Nenhum: nada recebeu valor"
          certa: [[0]]
          certa_texto: "Três: um para cada nome declarado"
          erros:
            - exata: [1]
              retorno: "O ponteiro é uma variável como as outras, e a declaração reserva o lugar dele também. São três."
            - exata: [2]
              retorno: "Declarar já reserva o lugar, com valor ou sem. São três nomes declarados, e três lugares."
          retorno_geral: "Cada declaração reserva um lugar: o de turma, o de q e o de pontos."

B2:
  revisao:
    frases:
      - "Em int *p; a variável criada se chama p. O * diz o que p é: um ponteiro."
      - "Cada nome leva o seu *: int *p, *q; declara dois ponteiros, e int *p, q; um ponteiro e um int."
    codigo: |
      int *p, *q;
    saida: ""
  provas:
    - crenca: estrela_e_do_tipo
      programa: |
        int idade;
        int* p, q;

        p = &idade;
        q = &idade;
      previsao:
        pergunta: >
          A segunda linha escreve o * junto do tipo e declara p e q. O
          compilador reclama de alguma das duas últimas linhas?
        opcoes:
          - "Não: int* vale para os dois, e p e q são ponteiros"
          - "Sim, de p = &idade;"
          - "Sim, de q = &idade;"
        real: 2
        crenca: 0
      reclama: "makes integer from pointer without a cast"
      ambiente: >
        Mensagem do gcc 16.2 para a linha de q. Todo compilador de C tem
        de reclamar dela, cada um com as suas palavras.
      afirma: >
        O compilador reclama só de q: ele é um int comum, e &idade é um
        endereço. O * não pertence ao tipo — pertence ao nome em que
        está colado, e ali só p ficou ponteiro.
  degraus:
    - id: esc_kc03_B2_1
      guiado: true
      forma: tocar
      codigo: true
      frases:
        - "Em int *p; a variável que nasce se chama p."
        - "O * não é outra variável: ele faz parte do que p é."
      versoes:
        - pede: "Toque no nome da variável declarada."
          mostra: "int *p;"
          pecas: ["int", "*", "p", ";"]
          certa: [[2]]
          certa_texto: "p"
          erros:
            - exata: [1]
              retorno: "O * não é nome nem variável: ele diz que p é um ponteiro. O nome é p."
            - exata: [0]
              retorno: "int é o tipo do que fica no endereço guardado. O nome da variável é p."
            - exata: [3]
              retorno: "O ponto e vírgula só fecha a linha. O nome da variável é p."
          retorno_geral: "A variável declarada se chama p. O * diz que ela é um ponteiro."
        - pede: "Toque no nome da variável declarada."
          mostra: "char *c;"
          pecas: ["char", "*", "c", ";"]
          certa: [[2]]
          certa_texto: "c"
          erros:
            - exata: [1]
              retorno: "O * não é nome nem variável: ele diz que c é um ponteiro. O nome é c."
            - exata: [0]
              retorno: "char é o tipo do que fica no endereço guardado. O nome da variável é c."
            - exata: [3]
              retorno: "O ponto e vírgula só fecha a linha. O nome da variável é c."
          retorno_geral: "A variável declarada se chama c. O * diz que ela é um ponteiro."

    - id: esc_kc03_B2_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Dá para declarar dois nomes numa linha, separados por vírgula."
        - "O * vale só para o nome em que está colado: em int *p, q; p é ponteiro, e q é um int comum."
      versoes:
        - pede: "O que esta linha declara?"
          antes: "int *p, q;"
          pecas:
            - "Um ponteiro, p, e um int comum, q"
            - "Dois ponteiros: o * é do tipo, e vale para os dois"
            - "Dois ints comuns"
          certa: [[0]]
          certa_texto: "Um ponteiro, p, e um int comum, q"
          erros:
            - exata: [1]
              crenca: estrela_e_do_tipo
              retorno: "O * não pertence ao tipo: pertence ao nome em que está colado. Aqui só p é ponteiro; q é um int comum."
            - exata: [2]
              retorno: "p tem o * na frente, e é ponteiro. q não tem, e é um int comum."
          retorno_geral: "p, que leva o *, é ponteiro. q, que não leva, é um int comum."
        - pede: "O que esta linha declara?"
          antes: "char *c, d;"
          pecas:
            - "Um ponteiro, c, e um char comum, d"
            - "Dois ponteiros: o * é do tipo, e vale para os dois"
            - "Dois chars comuns"
          certa: [[0]]
          certa_texto: "Um ponteiro, c, e um char comum, d"
          erros:
            - exata: [1]
              crenca: estrela_e_do_tipo
              retorno: "O * não pertence ao tipo: pertence ao nome em que está colado. Aqui só c é ponteiro; d é um char comum."
            - exata: [2]
              retorno: "c tem o * na frente, e é ponteiro. d não tem, e é um char comum."
          retorno_geral: "c, que leva o *, é ponteiro. d, que não leva, é um char comum."

    - id: esc_kc03_B2_3
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Para declarar dois ponteiros na mesma linha, ponha um * em cada nome."
      versoes:
        - pede: "Declare, numa linha só, dois ponteiros para inteiro: p e q."
          pecas: ["int", "*p", ",", "*q", ";", "q"]
          certa: [[0, 1, 2, 3, 4]]
          certa_texto: "int *p, *q;"
          erros:
            - exata: [0, 1, 2, 5, 4]
              retorno: "Assim q fica um int comum: o * de p não vale para ele. Cada ponteiro leva o seu: int *p, *q;"
          retorno_geral: "Cada nome leva o seu *: int *p, *q;"
        - pede: "Declare, numa linha só, dois ponteiros para caractere: c e d."
          pecas: ["char", "*c", ",", "*d", ";", "d"]
          certa: [[0, 1, 2, 3, 4]]
          certa_texto: "char *c, *d;"
          erros:
            - exata: [0, 1, 2, 5, 4]
              retorno: "Assim d fica um char comum: o * de c não vale para ele. Cada ponteiro leva o seu: char *c, *d;"
          retorno_geral: "Cada nome leva o seu *: char *c, *d;"

    - id: esc_kc03_B2_4
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Qual linha declara dois ponteiros?"
          pecas: ["int *p, *q;", "int* p, q;", "int p, q;"]
          certa: [[0]]
          certa_texto: "int *p, *q;"
          erros:
            - exata: [1]
              retorno: "Mudar o espaço de lugar não muda nada: o * continua valendo só para p, e q fica um int comum. Dois ponteiros: int *p, *q;"
            - exata: [2]
              retorno: "Sem * nenhum, os dois são ints comuns. Dois ponteiros: int *p, *q;"
          retorno_geral: "Dois ponteiros pedem dois asteriscos, um em cada nome: int *p, *q;"
        - pede: "Qual linha declara dois ponteiros?"
          pecas: ["char* c, d;", "char *c, *d;", "char c, d;"]
          certa: [[1]]
          certa_texto: "char *c, *d;"
          erros:
            - exata: [0]
              retorno: "Mudar o espaço de lugar não muda nada: o * continua valendo só para c, e d fica um char comum. Dois ponteiros: char *c, *d;"
            - exata: [2]
              retorno: "Sem * nenhum, os dois são chars comuns. Dois ponteiros: char *c, *d;"
          retorno_geral: "Dois ponteiros pedem dois asteriscos, um em cada nome: char *c, *d;"

    - id: esc_kc03_B2_5
      guiado: false
      forma: completar
      codigo: true
      frases: []
      versoes:
        - pede: "q foi declarada na segunda linha. Complete com o que q pode receber."
          antes: |-
            int idade;
            int *p, q;
          mostra: "q = ___;"
          pecas: ["15", "&idade", "p"]
          certa: [[0]]
          certa_texto: "q = 15;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "q não é ponteiro: o * da segunda linha é só de p. q é um int comum, e recebe um número: q = 15;"
            - exata: [2]
              invalida: true
              retorno: "p é ponteiro, e q é um int comum: o * não valeu para ele. q recebe um número: q = 15;"
          retorno_geral: "Em int *p, q; só p é ponteiro. q é um int comum: q = 15;"
        - pede: "n foi declarada na segunda linha. Complete com o que n pode receber."
          antes: |-
            int nota;
            int *q, n;
          mostra: "n = ___;"
          pecas: ["7", "&nota", "q"]
          certa: [[0]]
          certa_texto: "n = 7;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "n não é ponteiro: o * da segunda linha é só de q. n é um int comum, e recebe um número: n = 7;"
            - exata: [2]
              invalida: true
              retorno: "q é ponteiro, e n é um int comum: o * não valeu para ele. n recebe um número: n = 7;"
          retorno_geral: "Em int *q, n; só q é ponteiro. n é um int comum: n = 7;"

B3:
  revisao:
    frases:
      - "O C não escreve nada na variável quando você declara: nem zero."
      - "Vale para o ponteiro também: logo depois de int *p; ninguém escolheu o que p guarda."
    codigo: |
      int nota;
      int *p;

      nota = 0;
      p = &nota;
    saida: ""
  # Função de várias linhas, variável fora de função, laço e vetor: a
  # escada não ensina nenhum deles.
  fora_da_trilha: [ciu_kc03_008, ciu_kc03_009, ciu_kc03_t08, ciu_kc03_t09]
  provas:
    - crenca: declaration_zeroes
      programa: |
        int nota;

        printf("%d\n", nota);
      previsao:
        pergunta: "O compilador reclama de alguma coisa neste trecho?"
        opcoes:
          - "Não: nota foi declarada, e começa valendo 0"
          - "Sim: nota está sendo lida sem ter recebido valor"
        real: 1
        crenca: 0
      reclama: "'nota' is used uninitialized"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa não
        é executado: o que ele imprimiria, ninguém sabe.
      afirma: >
        Se declarar zerasse a variável, não haveria do que reclamar. O
