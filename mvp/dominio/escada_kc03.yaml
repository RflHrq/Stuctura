I1:
  revisao:
    frases:
      - "int *p; cria uma variável só: p. O lugar apontado não vem junto."
      - "Para p ter para onde apontar, é preciso existir outra variável, e p receber o endereço dela."
    codigo: |
      int idade;
      int *p;

      p = &idade;
      *p = 10;
      printf("%d\n", idade);
    saida: "10"
  # malloc e sizeof: a escada não ensina nenhum dos dois.
  fora_da_trilha: [ciu_kc03_t11]
  provas:
    - crenca: declaration_allocates
      programa: |
        int *p;

        printf("%d\n", *p);
