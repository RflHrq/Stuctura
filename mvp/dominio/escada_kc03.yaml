    frases:
      - "NULL é o valor que se escreve num ponteiro para dizer: não aponta para lugar nenhum."
      - "Um ponteiro só vale NULL se uma linha escreveu NULL nele. Sem isso, guarda um valor que ninguém escolheu."
    codigo: |
