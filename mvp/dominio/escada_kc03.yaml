I3:
  revisao:
    frases:
      - "Um ponteiro recém-declarado guarda um valor que ninguém escolheu."
      - "Usar *p nesse momento é ir a um lugar que ninguém escolheu. Primeiro p recebe um endereço; só depois vem o *p."
    codigo: |
      int nota;
      int *p;

      p = &nota;
      *p = 7;
      printf("%d\n", nota);
    saida: "7"
  # Colchetes de vetor: a escada não ensina.
  fora_da_trilha: [ciu_kc03_017]
  provas:
    - crenca: pode_usar_logo
      programa: |
        int *p;

        *p = 10;
      previsao:
        pergunta: "O compilador reclama da última linha?"
        opcoes:
          - "Não: depois de int *p; já dá para escrever em *p"
          - "Sim: p ainda não recebeu endereço nenhum"
        real: 1
        crenca: 0
      reclama: "'p' is used uninitialized"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa não
        é executado: o lugar onde o 10 cairia, ninguém escolheu.
      afirma: >
        O compilador avisa que p é usado sem ter recebido valor. *p vai
        ao lugar cujo endereço está em p — e em p, por enquanto, há um
        número que ninguém escolheu.
  degraus:
    - id: esc_kc03_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "*p vai ao lugar cujo endereço está guardado em p."
        - "Se p ainda não recebeu endereço, esse lugar é um que ninguém escolheu."
      versoes:
        - pede: "Para onde a última linha manda o 10?"
          antes: |-
            int *p;

            *p = 10;
          pecas:
            - "Para um lugar que ninguém escolheu: p não recebeu endereço"
            - "Para o lugar de p: depois de declarar, já dá para escrever em *p"
            - "Para lugar nenhum: a linha não faz nada"
          certa: [[0]]
          certa_texto: "Para um lugar que ninguém escolheu: p não recebeu endereço"
          erros:
            - exata: [1]
              crenca: pode_usar_logo
              retorno: "Declarar p não dá a ele um endereço. *p vai aonde o valor guardado em p mandar, e esse valor ninguém escolheu."
            - exata: [2]
              retorno: "A linha faz, e é esse o problema: ela escreve no lugar que o valor guardado em p indicar. Ninguém escolheu esse lugar."
          retorno_geral: "p não recebeu endereço. *p = 10; escreveria num lugar que ninguém escolheu."
        - pede: "Para onde a última linha manda o 'B'?"
          antes: |-
            char *c;

            *c = 'B';
          pecas:
            - "Para um lugar que ninguém escolheu: c não recebeu endereço"
            - "Para o lugar de c: depois de declarar, já dá para escrever em *c"
            - "Para lugar nenhum: a linha não faz nada"
          certa: [[0]]
          certa_texto: "Para um lugar que ninguém escolheu: c não recebeu endereço"
          erros:
            - exata: [1]
              crenca: pode_usar_logo
              retorno: "Declarar c não dá a ele um endereço. *c vai aonde o valor guardado em c mandar, e esse valor ninguém escolheu."
            - exata: [2]
              retorno: "A linha faz, e é esse o problema: ela escreve no lugar que o valor guardado em c indicar. Ninguém escolheu esse lugar."
          retorno_geral: "c não recebeu endereço. *c = 'B'; escreveria num lugar que ninguém escolheu."

    - id: esc_kc03_I3_2
      guiado: true
