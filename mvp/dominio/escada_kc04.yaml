      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 2, faz: [{cria: p}]}
      - {linha: 4, faz: [{guarda: {em: idade, valor: 42}}]}
