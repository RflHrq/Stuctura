I3:
  revisao:
    frases:
      - "O & pergunta onde a variável está. O * vai até um endereço. Um desfaz o outro."
      - "Por isso *(&idade) é a própria idade — e o endereço se guarda em p, nunca em *p."
    codigo: |
      int idade;

      idade = 7;
      printf("%d\n", *(&idade));
    saida: "7"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 3, faz: [{guarda: {em: idade, valor: 7}}]}
      - {linha: 4, faz: [{diz: '&idade é o endereço de idade, e o * segue esse endereço de volta até idade'}, {le: idade}, {mostra: '7'}]}
  # malloc: a escada não ensina.
  fora_da_trilha: [ciu_kc04_017]
  provas:
    - crenca: star_assigns_pointer
      programa: |
        int idade;
        int *p;

        *p = &idade;
      previsao:
        pergunta: "O compilador reclama da última linha?"
        opcoes:
          - "Sim: *p é o lugar apontado, que guarda um int, e não um endereço"
          - "Não: é em *p que o endereço fica guardado"
        real: 0
        crenca: 1
      reclama: "makes integer from pointer without a cast"
      ambiente: >
        Mensagem do gcc 16.2. Todo compilador de C tem de reclamar desta
        linha, cada um com as suas palavras.
      afirma: >
        O compilador reclama: *p é o lugar apontado, feito para um int,
        e &idade é um endereço. Quem guarda o endereço é o ponteiro, sem
        o *: p = &idade;
  degraus:
    - id: esc_kc04_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O & pergunta: onde está esta variável?"
        - "O * diz: vá até este endereço, e veja o que mora lá."
      versoes:
        - pede: "O que é *(&idade)?"
          antes: |-
            int idade;
            idade = 7;
          pecas:
            - "A própria idade"
            - "O endereço de idade"
            - "Uma cópia de idade"
          certa: [[0]]
          certa_texto: "A própria idade"
          erros:
            - exata: [1]
              retorno: "O endereço é só o &idade. O * na frente vai até esse endereço, e o que está lá é a própria idade."
            - exata: [2]
              retorno: "Nada foi copiado: o & deu o endereço, e o * foi até ele. Chega-se na própria idade."
          retorno_geral: "O & dá o endereço, e o * vai até ele: *(&idade) é a própria idade."
        - pede: "O que é *(&nota)?"
          antes: |-
            int nota;
            nota = 4;
          pecas:
            - "A própria nota"
            - "O endereço de nota"
            - "Uma cópia de nota"
          certa: [[0]]
          certa_texto: "A própria nota"
          erros:
            - exata: [1]
              retorno: "O endereço é só o &nota. O * na frente vai até esse endereço, e o que está lá é a própria nota."
            - exata: [2]
              retorno: "Nada foi copiado: o & deu o endereço, e o * foi até ele. Chega-se na própria nota."
          retorno_geral: "O & dá o endereço, e o * vai até ele: *(&nota) é a própria nota."

    - id: esc_kc04_I3_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Como *(&idade) é a própria idade, escrever ali é escrever em idade."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;

            idade = 7;
            *(&idade) = 9;
            printf("%d\n", idade);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "*(&idade) é a própria idade: o * desfez o &. A linha escreveu 9 em idade."
          retorno_geral: "*(&idade) = 9; é o mesmo que idade = 9; O trecho mostra 9."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
