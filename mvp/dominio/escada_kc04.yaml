# A escada do kc_04 — dereferência: & e *.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI passou pelo kc_00, pelo kc_02 e pelo kc_03: já escreveu
# `&idade`, `int *p;`, `p = &idade;`, `*p`, `*p = 20;` e uma função de
# uma linha que recebe endereço. Este tópico NÃO apresenta construto
# novo: ele volta aos dois sinais, um de cada vez, e diz com precisão o
# que cada um faz — de onde se pode pedir endereço, o que o & entrega, o
# que o * faz, e em qual dos dois se escreve o quê.
#
# O ÚNICO SINAL A MAIS É O PARÊNTESE de `*(&idade)`, no I3: é a premissa.
#
# O CENÁRIO continua: `idade`, `nota`, `pontos`, `ano`, com `p` e `q`.
#
# NO I2 A PROVA MOSTRA ENDEREÇO. A crença é "mexer em *p mexe no
# ponteiro", e o que a desmente é o endereço guardado em p ser o mesmo
# antes e depois de `*p = 20;`. A saída vem com endereços de exemplo, e
# o conferidor exige a forma: duas linhas, o MESMO endereço.
#
# AS QUESTÕES DE MARCAR. O banco do kc_04 não foi mexido. Nove das 36
# questões de diagnóstico e de treino usam o que as escadas até aqui não
# ensinam, e estão em `fora_da_trilha`: protótipo de função sem corpo,
# vetor, `malloc`, o `++`, a multiplicação escrita com o mesmo `*`, a
# comparação impressa com `%d` e a aritmética de ponteiro (`p = p + 1`),
# que é assunto do kc_11. Em quatro premissas a que saiu é a de código
# de degrau 2; nelas a trilha abre com a de código de degrau 3.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por: Rafael Henrique dos Santos Simão, em 24/11/2026
#   (leu o texto de leitura desta escada, docs/escada-kc04-leitura.md,
#   e validou o conteúdo)

B1:
  revisao:
    frases:
      - "Endereço é de lugar: só tem endereço o que ocupa um lugar na memória."
      - "Uma variável ocupa. Um número escrito no código, como 5, não: por isso &idade existe, e &5 não."
    codigo: |
      int idade;
      int *p;

      p = &idade;
    saida: ""
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 2, faz: [{cria: p}]}
      - {linha: 4, faz: [{aponta: {de: p, para: idade}}]}
  # Protótipo de função sem corpo, função que devolve valor, e vetor.
  fora_da_trilha: [ciu_kc04_002, ciu_kc04_t02, ciu_kc04_t03]
  provas:
    - crenca: ampersand_takes_value
      programa: |
        int *p;

        p = &5;
      previsao:
        pergunta: "O compilador reclama da última linha?"
        opcoes:
          - "Não: o & dá o endereço do 5"
          - "Sim: o 5 não ocupa lugar nenhum, e não tem endereço"
        real: 1
        crenca: 0
      reclama: "lvalue required as unary '&' operand"
      ambiente: >
        Mensagem do gcc 16.2. Todo compilador de C tem de reclamar desta
        linha, cada um com as suas palavras.
      afirma: >
        O compilador reclama: o & pede algo que ocupe um lugar, e um
        número escrito no código não ocupa nenhum. Endereço é de lugar,
        e não de valor.
  degraus:
    - id: esc_kc04_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O endereço é o número de um lugar da memória."
        - "Só tem endereço o que ocupa um lugar na memória."
      versoes:
        - pede: "De qual destes dá para pedir o endereço?"
          antes: |-
            int idade;
            idade = 15;
          pecas:
            - "De idade: ela ocupa um lugar"
            - "Do 15: é o valor que está guardado"
            - "Dos dois: o & funciona em qualquer coisa"
          certa: [[0]]
          certa_texto: "De idade: ela ocupa um lugar"
          erros:
            - exata: [1]
              retorno: "15 é um valor escrito no código: não ocupa lugar nenhum. Quem ocupa é a variável idade, e é dela o endereço."
            - exata: [2]
              crenca: ampersand_takes_value
              retorno: "O & só funciona no que ocupa um lugar. idade ocupa; o 15 escrito no código, não."
          retorno_geral: "Só a variável ocupa um lugar. O endereço é de idade, e não do 15."
        - pede: "De qual destes dá para pedir o endereço?"
          antes: |-
            int nota;
            nota = 7;
          pecas:
            - "De nota: ela ocupa um lugar"
            - "Do 7: é o valor que está guardado"
            - "Dos dois: o & funciona em qualquer coisa"
          certa: [[0]]
          certa_texto: "De nota: ela ocupa um lugar"
          erros:
            - exata: [1]
              retorno: "7 é um valor escrito no código: não ocupa lugar nenhum. Quem ocupa é a variável nota, e é dela o endereço."
            - exata: [2]
              crenca: ampersand_takes_value
              retorno: "O & só funciona no que ocupa um lugar. nota ocupa; o 7 escrito no código, não."
          retorno_geral: "Só a variável ocupa um lugar. O endereço é de nota, e não do 7."

    - id: esc_kc04_B1_2
      guiado: true
      forma: escolher
      codigo: true
      frases:
        - "Por isso o & só é aceito antes do nome de uma variável."
        - "Antes de um número escrito no código, o compilador reclama."
      versoes:
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int idade;
            int *p;
          pecas: ["p = &idade;", "p = &5;", "p = &15;"]
          certa: [[0]]
          certa_texto: "p = &idade;"
          invalidas: [1, 2]
          erros:
            - exata: [1]
              retorno: "5 é um número escrito no código: não ocupa lugar, e não tem endereço. O compilador reclama. Aceita: p = &idade;"
            - exata: [2]
              retorno: "15 é um número escrito no código: não ocupa lugar, e não tem endereço. O compilador reclama. Aceita: p = &idade;"
          retorno_geral: "O & vai antes de uma variável, que ocupa um lugar: p = &idade;"
        - pede: "Qual destas linhas o compilador aceita?"
          antes: |-
            int nota;
            int *q;
          pecas: ["q = &7;", "q = &nota;", "q = &0;"]
          certa: [[1]]
          certa_texto: "q = &nota;"
          invalidas: [0, 2]
          erros:
            - exata: [0]
              retorno: "7 é um número escrito no código: não ocupa lugar, e não tem endereço. O compilador reclama. Aceita: q = &nota;"
            - exata: [2]
              retorno: "0 é um número escrito no código: não ocupa lugar, e não tem endereço. O compilador reclama. Aceita: q = &nota;"
          retorno_geral: "O & vai antes de uma variável, que ocupa um lugar: q = &nota;"

    - id: esc_kc04_B1_3
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Quando uma função espera um endereço, o que vai na chamada é o endereço de uma variável."
        - "Para entregar o endereço de um valor, o valor tem de morar numa variável."
      versoes:
        - pede: "A função espera um endereço. Chame-a para ela zerar idade."
          antes: |-
            void zera(int *q) { *q = 0; }

            int idade;

            idade = 15;
          pecas: ["zera(", "&idade", ");", "&15", "15"]
          certa: [[0, 1, 2]]
          certa_texto: "zera(&idade);"
          erros:
            - exata: [0, 3, 2]
              invalida: true
              retorno: "15 é um valor escrito no código, e não tem endereço. Quem tem é a variável onde ele mora: zera(&idade);"
            - exata: [0, 4, 2]
              invalida: true
              retorno: "15 é um valor, e a função espera um endereço. O endereço é o da variável: zera(&idade);"
          retorno_geral: "O endereço que existe é o da variável: zera(&idade);"
        - pede: "A função espera um endereço. Chame-a para ela zerar nota."
          antes: |-
            void zera(int *q) { *q = 0; }

            int nota;

            nota = 7;
          pecas: ["zera(", "&nota", ");", "&7", "7"]
          certa: [[0, 1, 2]]
          certa_texto: "zera(&nota);"
          erros:
            - exata: [0, 3, 2]
              invalida: true
              retorno: "7 é um valor escrito no código, e não tem endereço. Quem tem é a variável onde ele mora: zera(&nota);"
            - exata: [0, 4, 2]
              invalida: true
              retorno: "7 é um valor, e a função espera um endereço. O endereço é o da variável: zera(&nota);"
          retorno_geral: "O endereço que existe é o da variável: zera(&nota);"

    - id: esc_kc04_B1_4
      nome: "Pedir endereço só do que ocupa um lugar"
      guiado: false
      forma: completar
      codigo: true
      frases: []
      versoes:
        - pede: "Complete com algo que tem endereço."
          antes: |-
            int nota;
            int *q;

            nota = 7;
          mostra: "q = &___;"
          pecas: ["nota", "7", "0"]
          certa: [[0]]
          certa_texto: "q = &nota;"
          erros:
            - exata: [1]
              invalida: true
              retorno: "7 é um valor escrito no código: não ocupa lugar. Quem ocupa é nota: q = &nota;"
            - exata: [2]
              invalida: true
              retorno: "0 é um valor escrito no código: não ocupa lugar. Quem ocupa é nota: q = &nota;"
          retorno_geral: "Tem endereço o que ocupa um lugar: a variável nota. q = &nota;"
        - pede: "Complete com algo que tem endereço."
          antes: |-
            int idade;
            int *p;

            idade = 15;
          mostra: "p = &___;"
          pecas: ["15", "idade", "20"]
          certa: [[1]]
          certa_texto: "p = &idade;"
          erros:
            - exata: [0]
              invalida: true
              retorno: "15 é um valor escrito no código: não ocupa lugar. Quem ocupa é idade: p = &idade;"
            - exata: [2]
              invalida: true
              retorno: "20 é um valor escrito no código: não ocupa lugar. Quem ocupa é idade: p = &idade;"
          retorno_geral: "Tem endereço o que ocupa um lugar: a variável idade. p = &idade;"

    - id: esc_kc04_B1_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Por que o compilador reclama da última linha?"
          antes: |-
            int *p;

            p = &20;
          pecas:
            - "Porque 20 não ocupa lugar na memória, e não tem endereço"
            - "Porque p ainda não recebeu valor"
            - "Porque faltou o * antes de p"
          certa: [[0]]
          certa_texto: "Porque 20 não ocupa lugar na memória, e não tem endereço"
          erros:
            - exata: [1]
              retorno: "p estar sem valor não impede de escrever nele. O problema é o &20: um número escrito no código não tem endereço."
            - exata: [2]
              retorno: "Para guardar um endereço no ponteiro é p, sem o *, mesmo. O problema é o &20: um número escrito no código não tem endereço."
          retorno_geral: "O problema é o &20: um número escrito no código não ocupa lugar, e não tem endereço."
        - pede: "Por que o compilador reclama da última linha?"
          antes: |-
            int *q;

            q = &3;
          pecas:
            - "Porque 3 não ocupa lugar na memória, e não tem endereço"
            - "Porque q ainda não recebeu valor"
            - "Porque faltou o * antes de q"
          certa: [[0]]
          certa_texto: "Porque 3 não ocupa lugar na memória, e não tem endereço"
          erros:
            - exata: [1]
              retorno: "q estar sem valor não impede de escrever nele. O problema é o &3: um número escrito no código não tem endereço."
            - exata: [2]
              retorno: "Para guardar um endereço no ponteiro é q, sem o *, mesmo. O problema é o &3: um número escrito no código não tem endereço."
          retorno_geral: "O problema é o &3: um número escrito no código não ocupa lugar, e não tem endereço."

B2:
  revisao:
    frases:
      - "&idade é o endereço de idade. Pedir o endereço não copia o valor."
      - "Quem recebe &idade recebe o caminho até a própria idade: o que escrever por ele fica nela."
    codigo: |
      int idade;
      int *p;

      idade = 15;
      p = &idade;
      *p = 16;
      printf("%d\n", idade);
    saida: "16"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 2, faz: [{cria: p}]}
      - {linha: 4, faz: [{guarda: {em: idade, valor: 15}}]}
      - {linha: 5, faz: [{aponta: {de: p, para: idade}}]}
      - {linha: 6, faz: [{segue: p}, {guarda: {em: idade, valor: 16}}]}
      - {linha: 7, faz: [{le: idade}, {mostra: '16'}]}
  # A multiplicação escrita com o mesmo * da dereferência: *n = *n * 2;
  fora_da_trilha: [ciu_kc04_t06]
  provas:
    - crenca: ampersand_copies
      programa: |
        void marca(int *q) { *q = 9; }

        int nota;

        nota = 7;
        marca(&nota);
        printf("%d\n", nota);
      previsao:
        pergunta: >
          A chamada entrega &nota à função, e a função escreve 9 no que
          recebeu. O que o trecho imprime?
        opcoes:
          - "7"
          - "9"
        real: 1
        crenca: 0
      espera: "9"
      afirma: >
        Saiu 9. Se &nota entregasse uma cópia, a função teria escrito na
        cópia, e nota continuaria com 7. O & entrega o endereço: a
        função chegou na própria nota.
  degraus:
    - id: esc_kc04_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "&idade é o endereço de idade: o número do lugar dela."
        - "Pedir o endereço de uma variável não copia o que ela guarda."
      versoes:
        - pede: "Depois da última linha, em quantos lugares o 15 está guardado?"
          antes: |-
            int idade;
            int *p;

            idade = 15;
            p = &idade;
          pecas:
            - "Em um só: idade"
            - "Em dois: &idade entregou uma cópia do valor a p"
            - "Em nenhum: o 15 saiu de idade e foi para p"
          certa: [[0]]
          certa_texto: "Em um só: idade"
          erros:
            - exata: [1]
              crenca: ampersand_copies
              retorno: "&idade não copia o valor: entrega o endereço. p guarda o número do lugar, e o 15 continua só em idade."
            - exata: [2]
              retorno: "Nada sai de idade. p recebe o endereço, e o 15 continua onde estava."
          retorno_geral: "p recebeu o endereço, e não o valor. O 15 está guardado só em idade."
        - pede: "Depois da última linha, em quantos lugares o 7 está guardado?"
          antes: |-
            int nota;
            int *q;

            nota = 7;
            q = &nota;
          pecas:
            - "Em um só: nota"
            - "Em dois: &nota entregou uma cópia do valor a q"
            - "Em nenhum: o 7 saiu de nota e foi para q"
          certa: [[0]]
          certa_texto: "Em um só: nota"
          erros:
            - exata: [1]
              crenca: ampersand_copies
              retorno: "&nota não copia o valor: entrega o endereço. q guarda o número do lugar, e o 7 continua só em nota."
            - exata: [2]
              retorno: "Nada sai de nota. q recebe o endereço, e o 7 continua onde estava."
          retorno_geral: "q recebeu o endereço, e não o valor. O 7 está guardado só em nota."

    - id: esc_kc04_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Como p tem o endereço, e não uma cópia, o que muda em idade aparece por *p."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int *p;

            idade = 15;
            p = &idade;
            idade = 16;
            printf("%d\n", *p);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "15"
              retorno: "p não guardou uma cópia do 15: guardou o endereço. *p foi até idade e achou o que está lá agora, 16."
          retorno_geral: "p tem o endereço de idade. *p acha o valor de agora: 16."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int nota;
            int *q;

            nota = 7;
            q = &nota;
            nota = 9;
            printf("%d\n", *q);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "q não guardou uma cópia do 7: guardou o endereço. *q foi até nota e achou o que está lá agora, 9."
          retorno_geral: "q tem o endereço de nota. *q acha o valor de agora: 9."

    - id: esc_kc04_B2_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Com a função é igual: zera(&idade); entrega o endereço, e não uma cópia."
        - "Por isso o que a função escreve em *q fica na própria idade."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            void zera(int *q) { *q = 0; }

            int idade;

            idade = 15;
            zera(&idade);
            printf("%d\n", idade);
          aceitas: ["0"]
          certa_texto: "0"
          erros:
            - texto: "15"
              retorno: "A função não recebeu uma cópia: recebeu o endereço de idade. *q = 0; escreveu na própria idade."
          retorno_geral: "&idade entrega o endereço. A função escreveu na própria idade: o trecho mostra 0."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            void zera(int *q) { *q = 0; }

            int pontos;

            pontos = 3;
            zera(&pontos);
            printf("%d\n", pontos);
          aceitas: ["0"]
          certa_texto: "0"
          erros:
            - texto: "3"
              retorno: "A função não recebeu uma cópia: recebeu o endereço de pontos. *q = 0; escreveu na própria pontos."
          retorno_geral: "&pontos entrega o endereço. A função escreveu na própria pontos: o trecho mostra 0."

    - id: esc_kc04_B2_4
      nome: "Distinguir a cópia do valor do endereço"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int nota;
            int *p;

            idade = 15;
            p = &idade;
            nota = *p;
            *p = 20;
            printf("%d\n", nota);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "20"
              retorno: "nota = *p; copiou o valor que estava em idade naquele momento: 15. Depois *p = 20; mudou idade, e a cópia em nota ficou como estava."
          retorno_geral: "nota recebeu uma cópia do valor, 15. Quem tem o endereço é p; nota não muda quando idade muda."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int pontos;
            int ano;
            int *q;

            pontos = 3;
            q = &pontos;
            ano = *q;
            *q = 8;
            printf("%d\n", ano);
          aceitas: ["3"]
          certa_texto: "3"
          erros:
            - texto: "8"
              retorno: "ano = *q; copiou o valor que estava em pontos naquele momento: 3. Depois *q = 8; mudou pontos, e a cópia em ano ficou como estava."
          retorno_geral: "ano recebeu uma cópia do valor, 3. Quem tem o endereço é q; ano não muda quando pontos muda."

    - id: esc_kc04_B2_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Qual destas linhas, posta no fim, mudaria idade?"
          antes: |-
            int idade;
            int nota;
            int *p;

            idade = 15;
            nota = idade;
            p = &idade;
          pecas:
            - "*p = 99; — p tem o endereço de idade"
            - "nota = 99; — nota recebeu o valor de idade"
            - "Qualquer uma: nota e p vieram de idade"
          certa: [[0]]
          certa_texto: "*p = 99; — p tem o endereço de idade"
          erros:
            - exata: [1]
              retorno: "nota recebeu uma cópia do valor, e é outra variável: mexer nela não mexe em idade. Quem chega em idade é *p."
            - exata: [2]
              retorno: "nota guarda uma cópia do valor; p guarda o endereço. Só pelo endereço se chega na própria idade: *p = 99;"
          retorno_geral: "nota tem uma cópia; p tem o endereço. Quem muda idade é *p = 99;"
        - pede: "Qual destas linhas, posta no fim, mudaria pontos?"
          antes: |-
            int pontos;
            int ano;
            int *q;

            pontos = 3;
            ano = pontos;
            q = &pontos;
          pecas:
            - "ano = 99; — ano recebeu o valor de pontos"
            - "*q = 99; — q tem o endereço de pontos"
            - "Qualquer uma: ano e q vieram de pontos"
          certa: [[1]]
          certa_texto: "*q = 99; — q tem o endereço de pontos"
          erros:
            - exata: [0]
