# Banco de atividades — kc_08, "alocação dinâmica"
#
# Seis nós, sete itens cada: 42. Um de entrada (o degrau mais baixo, na
# analogia), três de diagnóstico (um por degrau, com o par teórica +
# código) e três de treino.
#
# REGRA DE DISTRATOR (motor.razoes_de): as razões da camada 2 saem das
# ALTERNATIVAS DO PRÓPRIO ITEM. Em todo item, um distrator aponta a crença
# do próprio nó — senão o nó nunca recebe atribuição — e outro a de um
# vizinho. A crença do próprio nó abre a cédula (vem na alternativa `b`).
#
# UMA REGRA A MAIS NESTE TÓPICO: nenhum item depende de sizeof(int) valer
# 4. Onde o número aparece, ele está no código do próprio item
# (`malloc(4)` é quatro bytes, e isso é verdade em qualquer máquina) ou a
# resposta é relativa. `sizeof(char)` valendo 1 é exceção: isso o padrão
# garante, e um item de treino usa esse fato de propósito.

analogy: >
  Alugar o terreno. Continua o terreno alugado do kc_01, e mostra a hora
  em que ele é alugado. malloc(n) é pedir à prefeitura um terreno de n
  METROS — não de n casas: quantos metros cada casa tem é conta sua. A
  prefeitura responde com o NÚMERO do lote, ou diz que não tem lote. E ela
  não limpa o terreno antes de entregar: o que estiver lá é sobra do
  último inquilino. O papel com o número fica na sua gaveta e o terreno
  fica no loteamento — duas coisas, dois lugares. E o terreno é seu até
  você devolver: ninguém devolve por você.
  ONDE QUEBRA: "pedir à prefeitura" sugere que você negocia e sai com o
  terreno, e não é assim — "não tem lote" é uma das respostas possíveis, e
  conferir isso é obrigação sua. E a metáfora não diz nada sobre o que
  acontece com o terreno depois que você devolve: isso é do kc_09.

resgates:

  B1: >
    Você pede metros, não casas. malloc(10) são dez bytes, e ponto —
    ele não sabe o que você vai guardar ali. Se o que você quer são dez
    inteiros, a multiplicação é sua: dez vezes o tamanho de um inteiro.

  B2: >
    A prefeitura não te entrega o terreno na mão: ela te dá o NÚMERO do
    lote. É esse número que entra na sua caixa de ponteiro. E se não
    houver lote, a resposta é NULL — que também é uma resposta.

  B3: >
    Ninguém limpou o terreno antes de entregar. O que estiver lá é sobra
    do inquilino anterior, e não há promessa nenhuma sobre o que é. Para
    ler algo que faça sentido, você escreve primeiro.

  I1: >
    O papel com o número fica na sua gaveta; o terreno fica no loteamento.
    São duas coisas, em dois lugares, e com vidas diferentes: a gaveta
    pode ir embora no fim da função, e o terreno não.

  I2: >
    "Não tem lote" é uma das duas respostas possíveis, e ela chega como
    NULL. Conferir não é precaução exagerada: é tratar a segunda resposta
    que a função pode dar.

  I3: >
    O terreno é seu até você devolver. O fim da função não devolve, e o
    alocador não recolhe sozinho enquanto o programa roda. Quem devolve é
    o free, escrito por você.

exemplos:

  B1: |
    malloc(10);                  /* dez BYTES */
    malloc(10 * sizeof(int));    /* dez ints  */

  B2: |
    int *p = malloc(4);
    /* em p: o endereco. Ou NULL. */

  B3: |
    int *p = malloc(sizeof(int));
    *p;          /* sobra: ninguem limpou */

  I1: |
    int *p = malloc(4);
    /* a caixa de p: na pilha  */
    /* o bloco: no monte       */

  I2: |
    int *p = malloc(n);
    if (p == NULL) return;       /* a outra resposta */

  I3: |
    int *p = malloc(40);
    free(p);     /* quem devolve e voce */

