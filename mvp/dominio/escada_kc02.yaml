# A escada do kc_02 — o que é um ponteiro.
#
# O QUE É. Para cada premissa do tópico, a sequência de degraus que leva
# do mais mecânico até a ideia (docs/trilha.md, 6.16), e a prova de cada
# crença que nega a premissa. Segue o molde do kc_00
# (`escada_kc00.yaml`), e a mesma régua do texto: um degrau, uma ideia;
# no máximo duas frases curtas; só o que um degrau anterior ensinou;
# primeiro o que se faz, depois a ideia; código que um iniciante
# escreveria; todo erro previsto com o retorno dele.
#
# QUEM CHEGA AQUI passou pelo kc_00: sabe declarar (`int idade;`),
# guardar (`idade = 15;`), ler com `printf("%d\n", idade);` e declarar
# já com valor. O cenário continua o dele — `idade`, `nota`, `turma` —,
# e os ponteiros se chamam `p` e `q`, como nas premissas do tópico. A
# segunda versão de cada degrau troca `idade` e `p` por `nota` e `q`.
#
# O QUE ESTE TÓPICO APRESENTA, na ordem, e onde:
#
#   &idade            o endereço de uma variável          B1, degrau 2
#   %p e (void *)     mostrar um endereço na tela         B1, degrau 3
#   int *p;           declarar um ponteiro                B2, degrau 1
#   &p                o endereço do próprio ponteiro      B2, degrau 3
#   p = &idade;       guardar um endereço                 B3, degrau 1
#   *p                ler o valor que mora no endereço    B3, degrau 3
#   *p = 20;          escrever pelo endereço              B3, degrau 4
#   char *c;          o tipo do ponteiro                  I2, degrau 1
#   função e chamada  zera(idade); e zera(&idade);        I3, degraus 1 a 3
#
# ENDEREÇO NÃO SE DIGITA. O número de um lugar muda de máquina para
# máquina e de execução para execução; nenhum degrau de `digitar` pede
# um. Os degraus sobre endereços são de escolher, completar e montar, e
# os de `digitar` pedem sempre um valor guardado.
#
# A PROVA DO B2 MOSTRA DOIS ENDEREÇOS, e por isso a saída dela vem com
# números de exemplo (`0x1000`, `0x2A00`). O conferidor não exige esses
# números: exige a FORMA — duas linhas, dois endereços diferentes — e a
# nota de ambiente diz isso a quem lê.
#
# NO I3 ENTRA A FUNÇÃO, que o kc_00 não ensinou. A premissa é "alcançar a
# mesma caixa de outro ponto do programa", e não há outro ponto do
# programa sem uma função. Ela entra do jeito mais curto que existe: uma
# linha, um parâmetro, sem `return` — e o primeiro degrau é sobre a
# cópia, que é o que a variável comum faz e o ponteiro não. A linha da
# função fica acima do trecho, e o conferidor a põe fora do `main`.
#
# AS QUESTÕES DE MARCAR do tópico não foram reescritas: o banco do kc_02
# já passou por leitura e revisão, e os portões mecânicos não acusam
# erro nele. Duas coisas ficam ditas, e são decisão do Rafael:
#
#   - elas usam `x`, `y`, `a` e `b`, e esta escada usa `idade` e `nota`.
#     Dentro do tópico os dois cenários convivem;
#   - quatro das 58 usam o que esta escada não ensina — `sizeof` com
#     `%zu`, ponteiro para ponteiro e `double`. Estão em
#     `fora_da_trilha`, na premissa de cada uma: a trilha não as serve,
#     e o fluxo anterior, que tem cartão para `sizeof`, continua
#     servindo.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# "O COMPILADOR RECLAMA", e não "não compila": guardar um inteiro num
# ponteiro é erro no gcc 14 em diante e aviso antes dele. O que vale
# para todos é que ele tem de reclamar.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "Toda variável fica num lugar da memória, e todo lugar tem um número: o endereço."
      - "idade é o valor guardado. &idade é o endereço: o número do lugar."
    codigo: |
      int idade;

      idade = 15;
      printf("%d\n", idade);
    saida: "15"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 3, faz: [{guarda: {em: idade, valor: 15}}]}
      - {linha: 4, faz: [{le: idade}, {mostra: '15'}]}
  provas:
    - crenca: memory_is_by_name
      programa: |
        int idade;
        int *p;

        idade = 15;
        p = &idade;
        *p = 16;
        printf("%d\n", idade);
      previsao:
        pergunta: >
          p guarda o endereço de idade, e a linha *p = 16; escreve 16 no
          lugar que tem esse endereço. Ela não cita o nome idade. O que o
          trecho imprime?
        opcoes:
          - "15"
          - "16"
        real: 1
        crenca: 0
      espera: "16"
      afirma: >
        Saiu 16. A linha que mudou o valor não cita o nome idade: chegou
        lá pelo endereço. O nome é do código que você escreve; a máquina
        acha a variável pelo número do lugar.
  degraus:
    - id: esc_kc02_B1_1
      guiado: true
      forma: escolher
      codigo: false
      # Com um endereço de exemplo, e não a definição de volta: a primeira
      # versão deste degrau perguntava "o que é o endereço de idade?" logo
      # depois de dizer o que é, e a alternativa certa era a frase copiada
      # (o Rafael, em 19/11/2026: "essa questão está meio confusa"). Aqui a
      # pessoa separa o conteúdo (15) do endereço (1000) num caso concreto,
      # e a crença continua dita — agora como resposta à pergunta.
      frases:
        - "Toda variável fica num lugar da memória, e cada lugar tem um número: o endereço."
        - "É como uma casa: o endereço diz onde ela fica, e não o que tem dentro."
      versoes:
        - pede: "Neste exemplo, idade ficou no lugar de número 1000 e guarda 15. Qual é o endereço de idade?"
          antes: |-
            int idade;
            idade = 15;
          pecas:
            - "1000"
            - "15"
            - "idade não tem endereço: o computador a acha pelo nome"
          certa: [[0]]
          certa_texto: "1000"
          erros:
            - exata: [1]
              retorno: "15 é o que está guardado dentro de idade. O endereço é o número do lugar onde ela fica: 1000."
            - exata: [2]
              crenca: memory_is_by_name
              retorno: "O nome é para quem escreve o código. Para a máquina, idade é o lugar 1000: é por esse número que ela chega lá."
          retorno_geral: "O endereço de idade é 1000, o número do lugar. O 15 é o que está guardado lá dentro."
        - pede: "Neste exemplo, nota ficou no lugar de número 2000 e guarda 7. Qual é o endereço de nota?"
          antes: |-
            int nota;
            nota = 7;
          pecas:
            - "2000"
            - "7"
            - "nota não tem endereço: o computador a acha pelo nome"
          certa: [[0]]
          certa_texto: "2000"
          erros:
            - exata: [1]
              retorno: "7 é o que está guardado dentro de nota. O endereço é o número do lugar onde ela fica: 2000."
            - exata: [2]
              crenca: memory_is_by_name
              retorno: "O nome é para quem escreve o código. Para a máquina, nota é o lugar 2000: é por esse número que ela chega lá."
          retorno_geral: "O endereço de nota é 2000, o número do lugar. O 7 é o que está guardado lá dentro."

    - id: esc_kc02_B1_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Em C, o & antes do nome pede o endereço da variável."
        - "idade é o valor guardado. &idade é o endereço de idade."
      versoes:
        - pede: "Qual destas é o endereço de idade?"
          antes: |-
            int idade;
            idade = 15;
          pecas: ["&idade", "idade", "15"]
          certa: [[0]]
          certa_texto: "&idade"
          erros:
            - exata: [1]
              retorno: "idade, sem o &, é o valor guardado: 15. O endereço se pede com o & na frente: &idade"
            - exata: [2]
              retorno: "15 é o valor guardado. O endereço se pede com o & antes do nome: &idade"
          retorno_geral: "O endereço de idade se escreve &idade."
        - pede: "Qual destas é o endereço de nota?"
          antes: |-
            int nota;
            nota = 7;
          pecas: ["&nota", "nota", "7"]
          certa: [[0]]
          certa_texto: "&nota"
          erros:
            - exata: [1]
              retorno: "nota, sem o &, é o valor guardado: 7. O endereço se pede com o & na frente: &nota"
            - exata: [2]
              retorno: "7 é o valor guardado. O endereço se pede com o & antes do nome: &nota"
          retorno_geral: "O endereço de nota se escreve &nota."

    - id: esc_kc02_B1_3
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Para mostrar um endereço na tela, o printf usa %p no lugar do %d."
        - "O (void *) antes do endereço é o jeito de entregá-lo ao %p: escreva sempre assim."
      versoes:
        - pede: "Complete para mostrar o endereço de idade."
          antes: |-
            int idade;
            idade = 15;
          mostra: 'printf("%p\n", (void *)___);'
          pecas: ["&idade", "idade", "15"]
          certa: [[0]]
          certa_texto: 'printf("%p\n", (void *)&idade);'
          erros:
            - exata: [1]
              retorno: "idade, sem o &, é o valor guardado. Para o endereço falta o &: (void *)&idade"
            - exata: [2]
              retorno: "15 é o valor guardado em idade. O endereço dela é &idade."
          retorno_geral: 'O endereço de idade é &idade: printf("%p\n", (void *)&idade);'
        - pede: "Complete para mostrar o endereço de nota."
          antes: |-
            int nota;
            nota = 7;
          mostra: 'printf("%p\n", (void *)___);'
          pecas: ["&nota", "nota", "7"]
          certa: [[0]]
          certa_texto: 'printf("%p\n", (void *)&nota);'
          erros:
            - exata: [1]
              retorno: "nota, sem o &, é o valor guardado. Para o endereço falta o &: (void *)&nota"
            - exata: [2]
              retorno: "7 é o valor guardado em nota. O endereço dela é &nota."
          retorno_geral: 'O endereço de nota é &nota: printf("%p\n", (void *)&nota);'

    - id: esc_kc02_B1_4
      nome: "Mostrar na tela o endereço de uma variável"
      guiado: false
      forma: montar
      codigo: true
      frases: []
      versoes:
        - pede: "Monte a linha que mostra na tela o endereço de nota."
          antes: |-
            int nota;
            nota = 7;
          pecas: ['printf("%p\n",', "(void *)", "&nota", ");", "nota"]
          certa: [[0, 1, 2, 3]]
          certa_texto: 'printf("%p\n", (void *)&nota);'
          erros:
            - exata: [0, 1, 4, 3]
              retorno: "nota, sem o &, é o valor guardado. O endereço é &nota."
            - exata: [0, 2, 3]
              retorno: "Faltou o (void *) antes do endereço: é assim que o %p o recebe."
            - exata: [0, 4, 3]
              retorno: "nota, sem o &, é o valor guardado, e faltou o (void *). O endereço vai assim: (void *)&nota"
          retorno_geral: 'A linha é o printf com %p, o (void *) e o endereço: printf("%p\n", (void *)&nota);'
        - pede: "Monte a linha que mostra na tela o endereço de idade."
          antes: |-
            int idade;
            idade = 15;
          pecas: ['printf("%p\n",', "(void *)", "&idade", ");", "idade"]
          certa: [[0, 1, 2, 3]]
          certa_texto: 'printf("%p\n", (void *)&idade);'
          erros:
            - exata: [0, 1, 4, 3]
              retorno: "idade, sem o &, é o valor guardado. O endereço é &idade."
            - exata: [0, 2, 3]
              retorno: "Faltou o (void *) antes do endereço: é assim que o %p o recebe."
            - exata: [0, 4, 3]
              retorno: "idade, sem o &, é o valor guardado, e faltou o (void *). O endereço vai assim: (void *)&idade"
          retorno_geral: 'A linha é o printf com %p, o (void *) e o endereço: printf("%p\n", (void *)&idade);'

    - id: esc_kc02_B1_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "A última linha troca o valor de idade. O que acontece com o endereço dela?"
          antes: |-
            int idade;

            idade = 15;
            idade = 16;
          pecas:
            - "Continua o mesmo: mudou o que está guardado, e não o lugar"
            - "Muda também: valor novo, endereço novo"
            - "Some: o endereço era do 15"
          certa: [[0]]
          certa_texto: "Continua o mesmo: mudou o que está guardado, e não o lugar"
          erros:
            - exata: [1]
              retorno: "O endereço é do lugar, e não do valor. idade continua no mesmo lugar; só o que está guardado mudou."
            - exata: [2]
              retorno: "O endereço é do lugar onde idade fica, e não do 15. O lugar continua lá, agora guardando 16."
          retorno_geral: "O endereço é o número do lugar. Trocar o valor guardado não muda o lugar."
        - pede: "A última linha troca o valor de nota. O que acontece com o endereço dela?"
          antes: |-
            int nota;

            nota = 7;
            nota = 9;
          pecas:
            - "Continua o mesmo: mudou o que está guardado, e não o lugar"
            - "Muda também: valor novo, endereço novo"
            - "Some: o endereço era do 7"
          certa: [[0]]
          certa_texto: "Continua o mesmo: mudou o que está guardado, e não o lugar"
          erros:
            - exata: [1]
              retorno: "O endereço é do lugar, e não do valor. nota continua no mesmo lugar; só o que está guardado mudou."
            - exata: [2]
              retorno: "O endereço é do lugar onde nota fica, e não do 7. O lugar continua lá, agora guardando 9."
          retorno_geral: "O endereço é o número do lugar. Trocar o valor guardado não muda o lugar."

B2:
  revisao:
    frases:
      - "Um ponteiro é uma variável como as outras: tem tipo, nome e um lugar na memória."
      - "Por ser variável, o ponteiro também tem endereço. O de p é &p."
    codigo: |
      int idade;
      int *p;
    saida: ""
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 1, faz: [{cria: idade}]}
      - {linha: 2, faz: [{cria: p}]}
  # Usam sizeof com %zu, e ponteiro para ponteiro (int **pp): a escada
  # não ensina nenhum dos dois. O banco não muda; a trilha não as serve.
  fora_da_trilha: [kc02_gb2_n2_2, kc02_gb2_n3_3]
  provas:
    - crenca: pointer_has_no_address
      programa: |
        int idade;
        int *p;

        p = &idade;
        printf("%p\n", (void *)&idade);
        printf("%p\n", (void *)&p);
      previsao:
        pergunta: >
          A primeira linha de printf mostra o endereço de idade. A
          segunda pede o endereço do próprio ponteiro. O que as duas
          mostram?
        opcoes:
          - "Dois endereços diferentes"
          - "O mesmo endereço, duas vezes"
          - "Só a primeira mostra: ponteiro não tem endereço"
        real: 0
        crenca: 2
      espera: "0x1000\n0x2A00"
      ambiente: >
        Os números dos lugares mudam de máquina para máquina; aqui eles
        aparecem como números de exemplo. O que foi conferido é que as
        duas linhas saem, e com endereços diferentes.
      afirma: >
        Saíram dois endereços, e diferentes: um é o lugar de idade, o
        outro é o lugar do próprio p. O ponteiro não é só uma seta — é
        uma variável, e ocupa o lugar dela.
  degraus:
    - id: esc_kc02_B2_1
      guiado: true
      forma: tocar
      codigo: true
      frases:
        - "Um endereço também pode ser guardado numa variável."
        - "A variável que guarda endereço se chama ponteiro, e se declara com um * antes do nome: int *p;"
      versoes:
        - pede: "Toque no sinal que faz de p um ponteiro."
          mostra: "int *p;"
          pecas: ["int", "*", "p", ";"]
          certa: [[1]]
          certa_texto: "*"
          erros:
            - exata: [0]
              retorno: "int diz o que mora no endereço guardado: um inteiro. Quem faz de p um ponteiro é o * antes do nome."
            - exata: [2]
              retorno: "p é o nome. Quem faz dele um ponteiro é o * que vem antes."
            - exata: [3]
              retorno: "O ponto e vírgula só fecha a linha. Quem faz de p um ponteiro é o * antes do nome."
          retorno_geral: "É o * antes do nome que faz de p um ponteiro: int *p;"
        - pede: "Toque no sinal que faz de q um ponteiro."
          mostra: "int *q;"
          pecas: ["int", "*", "q", ";"]
          certa: [[1]]
          certa_texto: "*"
          erros:
            - exata: [0]
              retorno: "int diz o que mora no endereço guardado: um inteiro. Quem faz de q um ponteiro é o * antes do nome."
            - exata: [2]
              retorno: "q é o nome. Quem faz dele um ponteiro é o * que vem antes."
            - exata: [3]
              retorno: "O ponto e vírgula só fecha a linha. Quem faz de q um ponteiro é o * antes do nome."
          retorno_geral: "É o * antes do nome que faz de q um ponteiro: int *q;"

    - id: esc_kc02_B2_2
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Declarar um ponteiro é declarar uma variável: tipo, nome e ponto e vírgula."
        - "A diferença é o * antes do nome."
      versoes:
        - pede: "Declare um ponteiro para inteiro chamado p."
          pecas: ["int", "*", "p", ";", "&"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "int *p;"
          erros:
            - exata: [0, 2, 3]
              retorno: "Sem o *, p é um inteiro comum, e não um ponteiro. Com ele: int *p;"
            - exata: [0, 4, 2, 3]
              invalida: true
              retorno: "O & pede o endereço de uma variável que já existe. Na declaração do ponteiro o sinal é o *: int *p;"
            - exata: [1, 0, 2, 3]
              invalida: true
              retorno: "O tipo vem primeiro, e o * fica colado no nome: int *p;"
          retorno_geral: "A declaração é o tipo, o *, o nome e o ponto e vírgula: int *p;"
        - pede: "Declare um ponteiro para inteiro chamado q."
          pecas: ["int", "*", "q", ";", "&"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "int *q;"
          erros:
            - exata: [0, 2, 3]
              retorno: "Sem o *, q é um inteiro comum, e não um ponteiro. Com ele: int *q;"
            - exata: [0, 4, 2, 3]
              invalida: true
              retorno: "O & pede o endereço de uma variável que já existe. Na declaração do ponteiro o sinal é o *: int *q;"
            - exata: [1, 0, 2, 3]
              invalida: true
              retorno: "O tipo vem primeiro, e o * fica colado no nome: int *q;"
          retorno_geral: "A declaração é o tipo, o *, o nome e o ponto e vírgula: int *q;"

    - id: esc_kc02_B2_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O ponteiro é uma variável como as outras: ocupa um lugar da memória."
        - "Por isso ele também tem endereço. O de p é &p."
      versoes:
        - pede: "Depois dessas duas linhas, quantos lugares da memória estão reservados?"
          antes: |-
            int idade;
            int *p;
          pecas:
            - "Dois: o de idade e o de p"
            - "Um: o de idade. O ponteiro é só uma seta, não ocupa lugar"
            - "Nenhum: nenhuma das duas recebeu valor"
          certa: [[0]]
          certa_texto: "Dois: o de idade e o de p"
          erros:
            - exata: [1]
              crenca: pointer_has_no_address
              retorno: "O ponteiro não é só uma seta: é uma variável, e ocupa o lugar dela. São dois lugares, o de idade e o de p."
            - exata: [2]
              retorno: "Declarar já reserva o lugar, com valor ou sem. São dois lugares: o de idade e o de p."
          retorno_geral: "São dois lugares: o de idade e o de p. O ponteiro é uma variável, e ocupa o dele."
        - pede: "Depois dessas duas linhas, quantos lugares da memória estão reservados?"
          antes: |-
            int nota;
            int *q;
          pecas:
            - "Dois: o de nota e o de q"
            - "Um: o de nota. O ponteiro é só uma seta, não ocupa lugar"
            - "Nenhum: nenhuma das duas recebeu valor"
          certa: [[0]]
          certa_texto: "Dois: o de nota e o de q"
          erros:
            - exata: [1]
              crenca: pointer_has_no_address
              retorno: "O ponteiro não é só uma seta: é uma variável, e ocupa o lugar dela. São dois lugares, o de nota e o de q."
            - exata: [2]
              retorno: "Declarar já reserva o lugar, com valor ou sem. São dois lugares: o de nota e o de q."
          retorno_geral: "São dois lugares: o de nota e o de q. O ponteiro é uma variável, e ocupa o dele."

    - id: esc_kc02_B2_4
      nome: "Pedir o endereço do próprio ponteiro"
      guiado: false
      forma: completar
      codigo: true
      frases: []
      versoes:
        - pede: "Complete para mostrar o endereço do próprio ponteiro."
          antes: |-
            int idade;
            int *p;
          mostra: 'printf("%p\n", (void *)___);'
          pecas: ["&p", "&idade", "*p"]
          certa: [[0]]
          certa_texto: 'printf("%p\n", (void *)&p);'
          erros:
            - exata: [1]
              retorno: "&idade é o endereço de idade. O ponteiro é outra variável, com o endereço dela: &p"
            - exata: [2]
              retorno: "O * é da declaração do ponteiro. O endereço de qualquer variável se pede com o &: &p"
