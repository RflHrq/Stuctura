# Crenças do kc_01 — uma por nó, e cada uma de uma espécie de erro.
#
# Duas vêm da curadoria antiga, com a fonte que você já tinha levantado.
# Três são novas, e a procedência delas é FRACA de propósito declarado: o
# catálogo do Sorva (2012) foi procurado item a item e não tem concepção
# crisp sobre "o programa ter memória própria" nem sobre "existirem duas
# disciplinas de vida". O que ele tem é o item 5 — uma dificuldade, não
# uma crença —, e está citado onde serve.
#
# Procedência fraca declarada vale mais que procedência inventada. Se o
# ensaio não sustentar as duas `E`, isso também é achado.

- id: memoria_e_do_computador
  negates: kc_01:B1
  provenance: E
  label_pt: "A memória é do computador, não do programa: o que está lá é o que o último programa deixou."
  source: >
    ELABORADA, e entra como HIPÓTESE A TESTAR. PROCUREI no catálogo do
    Sorva (2012) e não há item sobre o programa ter espaço próprio; o mais
    próximo é o item 141, p. 367 — "Objects are stored in folders on the
    hard drive and lookup means searching through them" —, que é
    observação do próprio autor ("local"), não achado de estudo, e é sobre
    objetos, não sobre o espaço do processo.
    Se nenhum participante a sustentar, o achado é esse.

- id: local_sobrevive
  negates: kc_01:B2
  provenance: T
  label_pt: "A variável que a função criou continua lá depois que a função termina."
  source: >
    Sorva (2012), p. 359, item 5: "Difficulties understanding the lifetime
    of values" (du Boulay 1986). É DIFICULDADE, não crença enunciada — o
    próprio apêndice avisa que alguns itens são difuldades de contorno
    incerto. A crença acima é a forma afirmativa que ela toma em C, e a
    transposição está declarada: em linguagens com coleta automática o
    objeto sobrevive enquanto alguém o alcança, e a regra "acabou a
    função, acabou tudo" não vale lá.
    PRECISA DE FONTE MELHOR antes da coleta, ou desce para E.

- id: system_frees_auto
  negates: kc_01:B3
  provenance: L
  label_pt: "O sistema libera a memória do heap automaticamente."
  source: >
    FAQ comp.lang.c 7.22: "When I call malloc to allocate memory for a
    pointer which is local to a function, do I have to explicitly free
    it?" A resposta é "Yes", e termina com a frase que é a premissa:
    "Memory allocated with malloc always persists until you explicitly
    free it."

    CITAÇÃO CORRIGIDA. Isto citava "FAQ 7.24 e 7.25", e as duas não
    sustentam a crença como ela está escrita. A 7.24 ("Must I free
    allocated memory before the program exits?") responde "You shouldn't
    have to. A real operating system definitively reclaims all memory
    when a program exits" — ou seja, no ENCERRAMENTO DO PROGRAMA o
    sistema de fato recolhe, e isso é verdade. A 7.25 é sobre o `free`
    não devolver memória ao sistema operacional. Nenhuma das duas fala
    do bloco sobreviver ao RETORNO DA FUNÇÃO, que é o que esta premissa
    afirma e o que a crença nega. As duas ficam citadas como contraste,
    porque a distinção importa: o sistema recolhe no fim do programa, e
    não no fim da função.

    Ver também FAQ 7.24 e 7.25, pelo contraste acima.

- id: heap_dies_with_function
  negates: kc_01:I1
  provenance: T
  sem_item: >
    Procurado no Apendice A do Sorva (2012) em 11/11/2026, pelo
    vocabulario do fenomeno e nao pelo termo de C: lifetime, scope,
    deallocate, garbage, destroy, persist, dynamic. O mais proximo e
    o item 5, p. 359, que e dificuldade com tempo de vida e nao a
    crenca de que o bloco do malloc morre com a funcao. Nao ha item.
  label_pt: "O bloco do malloc também some quando a função termina."
  source: >
    TRANSPOSIÇÃO, com a analogia declarada: em Java e Python o que a
    função alocou e não é mais alcançado desaparece sozinho, e a regra que
    a pessoa traz é "saiu da função, foi-se". Em C a diferença entre a
    pilha e o monte é exatamente onde ela quebra.
    PRECISA DE FONTE antes da coleta, ou desce para E.

    A BUSCA FOI REFEITA em 11/11/2026, pelo vocabulario do fenomeno e
    nao pelo termo de C -- que e o metodo que fez duas outras crencas
    subirem de grade neste catalogo. Procurei no Apendice A do Sorva
    por lifetime, scope, deallocate, garbage, destroy, persist: o mais
    proximo e o item 5, p. 359, "Difficulties understanding the
    lifetime of values" (du Boulay 1986), que e DIFICULDADE com tempo
    de vida, nao a crenca de que o bloco do malloc morre com a funcao.
    Nao ha item. A analogia continua sendo toda a procedencia que esta
    crenca tem, e e isso que a grade T afirma.

- id: memory_is_uniform
  negates: kc_01:I2
  provenance: E
  sem_item: >
    Procurado item por item no Apendice A do Sorva (2012) em
    11/11/2026: nao ha item sobre a memoria ser regiao unica sem
    distincao de regras de tempo de vida. O item 5, p. 359, e
    dificuldade com tempo de vida; o item 123, p. 366, e sobre
    objetos receberem a mesma QUANTIDADE de memoria. Nao ha item.
  label_pt: "Memória é uma região única, sem distinção de regras de vida."
  source: >
    HIPÓTESE A TESTAR, e desceu de `T` para `E` em 11/11/2026 por falta
    de fonte que se sustente.

    A citação anterior era "Kaczmarczyk et al. (2010), p. 109, Tabela 1,
    tema T1". O artigo existe — DOI 10.1145/1734263.1734299, conferido no
    OpenAlex — e NÃO TEM cópia de acesso aberto: a afirmação sobre a
    página 109 e o tema T1 não é verificável por quem escreveu isto.

    E PROCUREI no Apêndice A do Sorva, item por item: não há item sobre a
    memória ser região única sem distinção de regras de tempo de vida. O
    mais próximo é o item 5, p. 359 — "Difficulties understanding the
    lifetime of values" (du Boulay 1986) —, que é DIFICULDADE com tempo
    de vida, não a crença de que a memória é indiferenciada. E o item
    123, p. 366, é sobre objetos receberem a mesma QUANTIDADE de
    memória, que é outra coisa.

    Fica declarada como hipótese. Se nenhum participante a sustentar, o
    achado é esse. Os dois tópicos em que ela aparece — kc_01 e kc_12 —
    não são piloto, então ela não viola a regra que proíbe `E` em
    piloto.
