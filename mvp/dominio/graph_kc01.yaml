topic: kc_01

# A METÁFORA DESTE TÓPICO: a rua, com duas quadras.
#
# Continua a rua do kc_02 — lugares numerados —, e acrescenta o que faltava
# lá: a rua tem DUAS QUADRAS, com regras de arrumação diferentes.
#
#   A quadra de cima (a pilha): as casas são montadas quando você entra
#   numa rua lateral e desmontadas quando você sai. Ninguém pergunta; é
#   automático, e é por isso que o que estava lá dentro vai junto.
#
#   A quadra de baixo (o monte): você aluga um terreno e ele é seu até
#   você devolver. Sair da rua lateral não devolve nada.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. Quadra sugere lugares vizinhos e ordenados. Pilha e monte não são
#      vizinhos de endereço, e nada garante onde cada um fica. O desenho
#      mostra duas áreas; não mostra qual vem antes.
#   2. "Desmontar a casa" sugere que o lugar some. O lugar continua lá —
#      o que acaba é o DIREITO de usá-lo. É a diferença entre o espaço e
#      a permissão, e é ela que faz `return &local` compilar e quebrar.
#      Quando a metáfora obrigaria a dizer que o lugar sumiu, ela cala.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "Enquanto executa, o programa tem um espaço de memória só dele."
    plain_text: >
      Enquanto o programa roda, ele tem uma rua só dele. Outro programa
      não mexe nessa rua.
    negated_by:
      - memoria_e_do_computador

    # A EVIDENCIA DO kc_01, 12/11/2026. O `afirma` e TEXTO DE TELA --
    # `_prova` o manda inteiro ao cliente --, entao e curto e diz uma
    # coisa so. O resto fica nestes comentarios.
    #
    # A PREMISSA DIZ "espaco so dele", E UM PROGRAMA NAO VE DE FORA.
    # Isolamento entre processos nao se observa de dentro de um deles: o
    # que se observa e a CONSEQUENCIA dele, que esta no `afirma` com
    # todas as letras -- o que foi escrito continua la, e lugares
    # diferentes guardam coisas diferentes ao mesmo tempo. Prometer mais
    # que isso seria afirmar o que o programa nao mostra.
    evidencia:
      - afirma: >
          O que se pode mostrar de dentro: enquanto o programa roda, os
          lugares são dele — o que ele escreveu continua lá no fim, e
          lugares diferentes guardam coisas diferentes ao mesmo tempo.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int primeiro = 11;
              int segundo = 22;
              int terceiro = 33;
              int volta = 0;

              while (volta < 100000) {
                  volta = volta + 1;
              }
              puts(primeiro == 11 && segundo == 22 && terceiro == 33
                   ? "cem mil passos depois, os tres lugares respondem o mesmo"
                   : "FALHOU");
              puts(primeiro != segundo && segundo != terceiro
                   ? "e sao lugares distintos: cada um guarda o seu ao mesmo tempo"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          cem mil passos depois, os tres lugares respondem o mesmo
          e sao lugares distintos: cada um guarda o seu ao mesmo tempo
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Enquanto está executando, o programa tem um espaço de memória que é
      dele. O que ele escreve lá continua como ele escreveu, e nenhum
      outro programa alcança aquele espaço para ler ou mexer. É por isso
      que você pode contar com o que o seu código guardou: a caixa
      responde a você.


      E é por isso que dois programas não se falam pela memória. Mesmo que
      os dois declarem uma variável com o mesmo nome, e mesmo que os dois
      acabem usando o mesmo número de endereço, são dois espaços separados
      — o número vale dentro de cada um, e não entre eles. Trocar
      informação entre programas é outro assunto, e exige que alguém a
      passe de propósito.


      Quando o programa termina, o espaço volta para o sistema. O próximo
      programa recebe um espaço seu, e nada do que estava lá é promessa
      para ele: não há garantia nenhuma do que ele vai encontrar numa
      variável que ninguém escreveu. Essa é a ponte para o nó que fala do
      conteúdo indeterminado, e é também por isso que o exemplo deste
      cartão não tenta olhar.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "Uma variável local existe enquanto a função dela está executando."
    plain_text: >
      As casas criadas dentro de uma função aparecem quando ela começa e
      somem quando ela termina.
    negated_by:
      - local_sobrevive

    evidencia:
      - afirma: >
          A variável local existe enquanto a função dela está
          executando: cada chamada começa com uma variável nova, e o
          valor da chamada anterior não está lá.
        programa: |
          #include <stdio.h>

          static int conta(void)
          {
              int n = 0;

              n = n + 1;
              return n;
          }

          int main(void)
          {
              int primeira = conta();
              int segunda = conta();

              puts(primeira == 1 ? "a primeira chamada devolveu 1" : "FALHOU");
              puts(segunda == 1
                   ? "e a segunda tambem: a variavel da chamada anterior nao ficou"
                   : "FALHOU");
              return 0;
          }
        espera: |-
          a primeira chamada devolveu 1
          e a segunda tambem: a variavel da chamada anterior nao ficou
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Uma variável declarada dentro de uma função nasce quando a execução
      chega à declaração e acaba quando a função termina. Não é uma regra
      sobre o nome ser invisível de fora: o espaço dela deixa de ser dela.
      Cada chamada da função tem o seu, novo, e o da chamada anterior já
      não existe.


      Isso é automático, e ninguém escreve nada para que aconteça. É a
      diferença que dá nome às duas áreas deste tópico: do lado da pilha,
      as caixas são montadas ao entrar na função e desmontadas ao sair,
      sem pedido e sem aviso. Entender o tempo de vida é o que torna
      previsível um programa com muitas funções, e é também onde ele
      costuma ser mal entendido.


      Quando você precisa que o valor dure além da chamada, o caminho é
      copiá-lo para fora. Uma função devolve um valor, e quem chamou o
      guarda numa caixa sua — aí o valor sobrevive, na caixa de quem
      chamou, e não na que acabou. Devolver o ENDEREÇO de uma variável
      local é outra coisa, e não funciona: o endereço continua apontando
      para um lugar que deixou de ser daquela variável.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "Um bloco pedido com malloc não acaba quando a função termina."
    plain_text: >
      O terreno que você aluga com malloc continua seu depois que a
      função acaba.
    negated_by:
      - system_frees_auto

    # MALLOC SEM ARRAY e de proposito: `conceitos.construtos_de` barraria
    # `array`, que so tem cartao no kc_07. Um bloco de um int basta para a
    # premissa, que e sobre QUANDO o bloco acaba, e nao sobre quantos
    # cabem.
    #
    # O `free` ESTA LA porque a premissa e "nao acaba quando a funcao
    # termina" -- e nao "nunca acaba". Programa de evidencia que vaza
    # ensina pela forma o contrario do que diz na prosa.
    evidencia:
      - afirma: >
          O bloco pedido com malloc não acaba quando a função termina: o
          que foi escrito dentro dela continua lá depois que ela voltou,
          e só sai quando você devolve o bloco.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          static char *faz(void)
          {
              char *bloco = malloc(1);

              if (bloco != NULL) {
                  *bloco = 'A';
              }
              return bloco;
          }

          int main(void)
          {
              char *meu = faz();

              if (meu == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              puts(*meu == 'A'
                   ? "a funcao terminou, e o A escrito dentro dela continua la"
                   : "FALHOU");
              *meu = 'B';
              puts(*meu == 'B' ? "e o bloco continua meu: da para escrever de novo"
                              : "FALHOU");
              free(meu);
              return 0;
          }
        espera: |-
          a funcao terminou, e o A escrito dentro dela continua la
          e o bloco continua meu: da para escrever de novo
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O bloco pedido ao alocador não segue a regra da função que o pediu.
      A caixa do ponteiro, sim: ela é local e acaba no fim da chamada,
      como qualquer local. O bloco é outra coisa, em outra área, e
      continua reservado até alguém devolvê-lo com uma chamada escrita de
      propósito.


      A ideia contrária tem de onde vir. Variáveis comuns somem sozinhas
      no fim da função, e isso funciona tão bem que passa despercebido; e
      quando o programa inteiro termina, o sistema recolhe tudo mesmo.
      Entre um e outro está o tempo em que o programa roda — e é nesse
      tempo que o bloco não devolvido fica ocupado.


      Por isso a devolução é sua. Enquanto o programa vive, cada bloco
      pedido e não devolvido continua ocupado, e o alocador não tem como
      saber que você não precisa mais dele. Num programa que pede muitas
      vezes, o que se acumula não é um erro visível: é memória que some
      aos poucos, sem nada quebrar na hora.
  I1:
    type: inferencia
    role: espinha
    support: [B2, B3]
    text: "Há duas disciplinas de vida: uma automática, outra na sua mão."
    plain_text: >
      Então há dois jeitos: a casa some sozinha, e o terreno fica até
      você devolver.
    negated_by:
      - heap_dies_with_function

    evidencia:
      - afirma: >
          São duas disciplinas de vida no mesmo programa: a da variável
          local, que recomeça a cada chamada sem ninguém pedir, e a do
          bloco pedido, que fica até você devolver.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          static int automatica(void)
          {
              int n = 0;

              n = n + 1;
              return n;
          }

          static char *pedida(void)
          {
              char *bloco = malloc(1);

              if (bloco != NULL) {
                  *bloco = 0;
              }
              return bloco;
          }

          int main(void)
          {
              char *b = pedida();

              if (b == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              automatica();
              *b = *b + 1;
              automatica();
              *b = *b + 1;
              puts(automatica() == 1
                   ? "a local recomeca do zero toda chamada, sem ninguem pedir"
                   : "FALHOU");
              puts(*b == 2
                   ? "e o bloco pedido guardou as duas somas: ele fica ate voce devolver"
                   : "FALHOU");
              free(b);
              return 0;
          }
        espera: |-
          a local recomeca do zero toda chamada, sem ninguem pedir
          e o bloco pedido guardou as duas somas: ele fica ate voce devolver
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o B2 e o B3 postos lado a lado. A variável
      local nasce quando a execução chega à declaração e acaba no fim da
      função, sem que ninguém escreva nada para isso. O bloco pedido ao
      alocador nasce no pedido e acaba na devolução, e a devolução é uma
      linha que alguém escreve. Duas coisas, duas regras — e é só isso que
      esta premissa afirma.


      A ideia de que o bloco também some com a função não é confusão: é
      uma regra de outra linguagem. Em várias delas, o que a função alocou
      e não é mais alcançado desaparece sozinho, e quem aprendeu assim
      traz a regra pronta. A diferença não está em o espaço acabar ou não
      — está em QUEM decide quando. Lá, quem decide é a linguagem; aqui,
      numa das duas áreas, é você.


      E saber de qual das duas se está falando é o que torna o programa
      previsível. Quando você precisa que um valor dure além da chamada, o
      caminho é a área cuja vida você controla; quando o valor só serve
      durante a chamada, a área automática resolve sem custo nenhum de
      código. Escolher errado dá dois tipos de erro de lados opostos: usar
      o que já acabou, ou nunca devolver o que continua.
  I2:
    type: inferencia
    role: conclusao
    support: [B1, I1]
    text: >
      A memória do programa tem duas áreas com regras diferentes: a pilha
      e o monte.
    plain_text: >
      Logo a rua tem duas quadras, com regras de arrumação diferentes.
    negated_by:
      - memory_is_uniform
    # O QUE ESTE PROGRAMA NAO FAZ: comparar enderecos do automatico e do
    # pedido para mostrar que ficam "longe". Distancia entre areas e
    # fato sobre ESTA maquina, e o projeto ja tem regra para isso -- a
    # mesma que trocou "nao compila" por "reclama". O que se demonstra
    # aqui e uma regra da LINGUAGEM: o tamanho de um e fixado no codigo,
    # o do outro e decidido rodando.
    evidencia:
      - afirma: >
          As duas áreas seguem regras diferentes, e uma delas aparece no
          tamanho: o da variável local é fixado no código, e o do bloco
          pedido é decidido enquanto o programa roda.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              int quantos = 0;
              char *bloco = NULL;

              while (quantos < 7) {
                  quantos = quantos + 1;
              }
              bloco = malloc(quantos);
              if (bloco == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *bloco = 5;
              puts(quantos == 7
                   ? "o tamanho do pedido veio de uma conta feita rodando: 7"
                   : "FALHOU");
              puts(*bloco == 5
                   ? "e o bloco desse tamanho aceitou a escrita"
                   : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          o tamanho do pedido veio de uma conta feita rodando: 7
          e o bloco desse tamanho aceitou a escrita
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto é o fecho do tópico. O espaço é do programa enquanto ele roda,
      e dentro desse espaço há duas regras de vida: uma que age sozinha no
      fim de cada função, e outra que espera uma chamada sua. Duas regras
      querem dizer duas áreas, porque é a regra que define a área — e é
      por isso que a conclusão não acrescenta fato novo, e sim um nome.


      As duas áreas têm nome, e os nomes dizem como cada uma se arruma. A
      pilha é onde ficam as variáveis locais: as caixas são montadas ao
      entrar na função e desmontadas ao sair, em ordem, e o espaço usado
      por uma chamada volta a ficar livre para a próxima. O monte é de
      onde vêm os blocos pedidos: cada pedido reserva um pedaço, que fica
      reservado até a devolução, em qualquer ordem.


      E saber em qual área algo está decide o que você pode fazer com ele.
      O que está na pilha não precisa de devolução, e entregá-lo ao
      alocador é inválido; o que está no monte precisa, e esquecer é a
      falha do outro lado. As duas coisas convivem no mesmo programa,
      muitas vezes na mesma função, e distinguir uma da outra é o que esta
      unidade inteira vem construindo.
