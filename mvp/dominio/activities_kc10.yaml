# Banco de atividades — kc_10, "ponteiro para ponteiro"
#
# Seis nós, sete itens cada: 42. Um de entrada (o degrau mais baixo, na
# analogia), três de diagnóstico (um por degrau, com o par teórica +
# código) e três de treino.
#
# REGRA DE DISTRATOR (motor.razoes_de): as razões da camada 2 saem das
# ALTERNATIVAS DO PRÓPRIO ITEM. Em todo item, um distrator aponta a crença
# do próprio nó — senão o nó nunca recebe atribuição — e outro a de um
# vizinho. A crença do próprio nó abre a cédula (vem na alternativa `b`).
#
# UMA REGRA A MAIS NESTE TÓPICO: todo item de código declara os níveis
# inteiros, de x até pp, mesmo quando o item só pergunta sobre um deles.
# Dois níveis é o limite do que uma pessoa segue de cabeça, e omitir uma
# linha faria a pessoa errar por ter perdido a conta — o que mede atenção,
# não premissa. Dois itens trazem o código LITERAL do FAQ: o
# `ciu_kc10_011` é a pergunta 4.8, e o `ciu_kc10_008` é a 4.9.

analogy: >
  O papel que aponta para outra gaveta. Continua a rua: p é uma gaveta com
  um papel dentro, e no papel está um número de casa. pp é OUTRA gaveta, e
  o papel dela traz o número da gaveta de p. Cada * é abrir uma gaveta:
  abra a de pp e você acha o papel de p; abra a de p e você chega na casa.
  ONDE QUEBRA: "abrir gaveta" sugere que dá para continuar abrindo quantas
  vezes você quiser, e não dá — quantos níveis existem está escrito no
  TIPO, e pôr uma estrela a mais não cria um nível. E a metáfora não diz
  nada sobre int a[3][4]: aquilo não é gaveta dentro de gaveta, é um
  quarteirão de doze casas grudadas.

resgates:

  B1: >
    A gaveta de p é uma gaveta como qualquer outra: ela ocupa um lugar e
    tem endereço próprio. É por isso que `&p` existe e faz sentido — e
    guardar o que `&p` devolve exige uma gaveta de mais um nível.

  B2: >
    Cada estrela é uma gaveta que se abre. Uma estrela: você sai de pp e
    chega no papel de p. Duas: você sai de pp, passa por p, e chega na
    casa. Um passo por estrela, nem mais nem menos.

  B3: >
    Quantas gavetas existem entre pp e a casa está escrito no tipo, antes
    de o programa rodar. Não há como chutar, não há como descobrir
    abrindo, e não existe uma gaveta genérica que sirva para qualquer
    número de níveis.

  I1: >
    Para alguém trocar o papel que está DENTRO da sua gaveta, essa pessoa
    precisa saber onde a gaveta está. Dar o papel não serve: ela mexeria
    numa cópia do papel. O que serve é dar o endereço da gaveta.

  I2: >
    int a[3][4] é um quarteirão: doze casas grudadas, em três fileiras. Não
    são três gavetas, cada uma apontando para uma fileira que mora em
    outro lugar. A regra do nome que vira endereço vale uma vez, e não
    duas.

  I3: >
    Então são duas caixas, em dois níveis. `*pp` chega na caixa de p — e o
    que está lá é um ponteiro. `**pp` dá mais um passo e chega no número.
    Uma estrela a mais não desce um nível que o tipo não tem.

exemplos:

  B1: |
    int  x = 1;
    int *p = &x;
    int **pp = &p;   /* &p: endereco da caixa p */

  B2: |
    *pp     /* um passo: chega em p   */
    **pp    /* dois passos: chega em x */

  B3: |
    int **pp;        /* dois niveis, escritos aqui */
    /* nao existe ponteiro-para-ponteiro generico */

  I1: |
    void f(int **pp) { *pp = NULL; }
    f(&p);           /* &p, e nao p */

  I2: |
    int a[3][4];     /* doze caixas grudadas */
    /* nao e int ** */

  I3: |
    *pp  == p        /* verdadeiro */
    **pp == x        /* verdadeiro */

