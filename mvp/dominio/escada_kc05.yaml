I3:
  revisao:
    frases:
      - "*p com p valendo NULL manda o programa a um lugar que não existe."
      - "O que acontece ali não é definido. Por isso se pergunta antes: if (p != NULL)"
    codigo: |
      int idade;
      int *p;

      idade = 15;
      p = NULL;
      if (p != NULL) *p = 20;
      printf("%d\n", idade);
    saida: "15"
  # malloc e sizeof; o %s.
  fora_da_trilha: [ciu_kc05_017, ciu_kc05_t18]
  provas:
    - crenca: null_is_safe_to_deref
      programa: |
        int *p;

        p = NULL;
        printf("%d\n", *p);
      previsao:
        pergunta: >
          p vale NULL, e o printf pede o valor que mora no lugar
          apontado. O que o compilador diz dessa linha?
        opcoes:
          - "Nada: *p com p nulo devolve 0, como um lugar vazio"
          - "Que ela vai a um ponteiro nulo"
        real: 1
        crenca: 0
      reclama: "null pointer dereference"
      avisos: "-O2 -Wnull-dereference"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos de fluxo ligados (-O2
        -Wnull-dereference). O programa não é executado: o que ele faria
        nessa linha não é definido.
      afirma: >
        O compilador aponta a linha: ela vai ao lugar apontado por um
        ponteiro nulo ("null pointer dereference"). Lá não há lugar que
        devolva 0. O que o programa faz nesse ponto não é definido.
  degraus:
    - id: esc_kc05_I3_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "*p vai ao lugar cujo endereço está em p."
        - "Com p valendo NULL não há lugar: o que o programa faz aí não é definido. Pode parar, pode seguir errado."
      versoes:
        - pede: "O que a última linha faz?"
          antes: |-
            int *p;

            p = NULL;
            *p = 1;
          pecas:
            - "Não dá para dizer: ela vai a um lugar que não existe"
            - "Nada de mais: *p com p nulo vale 0, como um lugar vazio"
            - "Escreve 1 dentro do próprio p"
          certa: [[0]]
          certa_texto: "Não dá para dizer: ela vai a um lugar que não existe"
          erros:
            - exata: [1]
              crenca: null_is_safe_to_deref
              retorno: "Não há lugar vazio ali: não há lugar nenhum. A linguagem não define o que acontece — o programa pode parar, ou seguir errado."
            - exata: [2]
              retorno: "Escrever no próprio ponteiro seria p = ...; sem o *. Com o *, a linha vai ao lugar apontado, e p não aponta para nenhum."
          retorno_geral: "p não aponta para lugar nenhum. O que *p = 1; faz não é definido."
        - pede: "O que a última linha faz?"
          antes: |-
            int nota;
            int *q;

            q = NULL;
            nota = *q;
          pecas:
            - "Não dá para dizer: ela vai a um lugar que não existe"
            - "Nada de mais: *q com q nulo vale 0, como um lugar vazio"
            - "Copia o NULL para nota"
          certa: [[0]]
          certa_texto: "Não dá para dizer: ela vai a um lugar que não existe"
          erros:
            - exata: [1]
              crenca: null_is_safe_to_deref
              retorno: "Não há lugar vazio ali: não há lugar nenhum. A linguagem não define o que acontece — o programa pode parar, ou seguir errado."
            - exata: [2]
              retorno: "Copiar o valor do ponteiro seria sem o *. Com o *, a linha vai ao lugar apontado, e q não aponta para nenhum."
          retorno_geral: "q não aponta para lugar nenhum. O que nota = *q; faz não é definido."

