# A escada do kc_05 — o ponteiro NULL.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI passou pelo kc_00, kc_02, kc_03 e kc_04. Do kc_03 traz
# o NULL como valor que se escreve num ponteiro (`p = NULL;`,
# `int *p = NULL;`). Aqui o NULL passa a ser PERGUNTADO.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   p == NULL         a pergunta, que responde 1 ou 0       B1, degrau 2
#   if (...) linha;   a linha que só roda se a resposta     B1, degrau 3
#                     for sim
#   p = 0;            o 0 escrito no código                 B2, degrau 1
#   (int *)n          a conversão forçada                   B2, degrau 3
#   p != NULL         a pergunta ao contrário               I1, degrau 3
#   if (p)            o mesmo que if (p != NULL)            I3, degrau 2
#
# O `if` ENTRA DO JEITO MAIS CURTO: uma pergunta entre parênteses e uma
# linha só, na mesma linha. Sem chaves, sem `else`.
#
# NADA É EXECUTADO INDO A UM PONTEIRO NULO. Os degraus de `digitar` só
# rodam trechos em que o `*p` está guardado por uma pergunta, ou em que
# o ponteiro aponta para uma variável. Os trechos que vão a um ponteiro
# nulo aparecem para a pessoa escolher, e o conferidor só os compila.
#
# TRÊS PROVAS PEDIRAM MAIS DO CONFERIDOR:
#
#   - a do B1 mostra que o compilador reclama do ponteiro sem valor e
#     NÃO reclama do que vale NULL. `cala` é o trecho de mensagem que
#     não pode aparecer;
#   - a do B2 depende de a reclamação ser de UMA linha só (`p = n;`, e
#     não `p = 0;`). O conferidor passou a exigir que a mensagem de
#     `reclama` apareça uma vez, e uma só;
#   - a do I3 é um aviso que o gcc só dá olhando o fluxo do programa.
#     `avisos` leva as opções a mais (`-O2 -Wnull-dereference`), e a
#     nota de ambiente as diz.
#
# A PROVA DO I2 VALE NESTE COMPILADOR. A crença é "NULL é o inteiro 0 em
# todo lugar", e o que a máquina mostra é que guardar NULL num int faz o
# gcc reclamar — porque, nele, NULL é escrito como ponteiro. A linguagem
# permite escrevê-lo de outro jeito, e a nota de ambiente diz isso.
#
# AS QUESTÕES DE MARCAR. O banco do kc_05 não foi mexido. Doze das 36
# questões de diagnóstico e de treino usam o que as escadas não ensinam
# — `sizeof`, `malloc`, protótipo de função, `return`, `&&`, vetor,
# `memcpy` e parentes, `%c` e `%s` — e estão em `fora_da_trilha`. O I2
# é a única premissa que abre com a questão de conceito: as duas de
# código de diagnóstico dele são sobre `memcpy`.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "NULL é um valor: o que se guarda num ponteiro para dizer que ele não aponta para lugar nenhum."
      - "Um ponteiro que vale NULL tem valor. Sem valor escolhido está o ponteiro em que ninguém escreveu."
    codigo: |
      int *p;

      p = NULL;
      printf("%d\n", p == NULL);
    saida: "1"
  # sizeof com %zu; protótipo de função e o if (p) sem comparação.
  fora_da_trilha: [ciu_kc05_002, ciu_kc05_t02]
  provas:
    - crenca: null_is_absence
      programa: |
        int *p;
        int *q;
        int *r;

        p = NULL;
        r = p;
        r = q;
      previsao:
        pergunta: >
          p recebeu NULL, e q não recebeu nada. As duas últimas linhas
          copiam de p e de q. De qual delas o compilador reclama?
        opcoes:
          - "Das duas: p e q estão sem valor"
          - "Só de r = q;"
          - "De nenhuma"
        real: 1
        crenca: 0
      reclama: "'q' is used uninitialized"
      cala: "'p' is used uninitialized"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa não
        é executado: o que ele copiaria de q, ninguém sabe.
      afirma: >
        O compilador reclama só de q, que está sem valor. De p ele não
        diz nada: NULL é um valor como os outros, e copiar de p é copiar
        um valor.
  degraus:
    - id: esc_kc05_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "NULL é um valor que se guarda num ponteiro. Ele quer dizer: não aponta para lugar nenhum."
        - "É um valor escolhido, escrito por uma linha, e não o ponteiro estar vazio."
      versoes:
        - pede: "Depois da última linha, p tem valor?"
          antes: |-
            int *p;

            p = NULL;
          pecas:
            - "Tem: o valor NULL, que a linha escreveu"
            - "Não: NULL quer dizer que p está vazio, sem valor dentro"
            - "Tem: o endereço de uma variável"
          certa: [[0]]
          certa_texto: "Tem: o valor NULL, que a linha escreveu"
          erros:
            - exata: [1]
              crenca: null_is_absence
              retorno: "NULL não é falta de valor: é um valor, e a linha o escreveu em p. Ele diz uma coisa certa: p não aponta para lugar nenhum."
            - exata: [2]
              retorno: "Nenhuma variável teve o endereço guardado em p. O valor que a linha escreveu é NULL: não aponta para lugar nenhum."
          retorno_geral: "p tem valor: NULL, que a última linha escreveu."
        - pede: "Depois dessa linha, q tem valor?"
          antes: "int *q = NULL;"
          pecas:
            - "Tem: o valor NULL, que a linha escreveu"
            - "Não: NULL quer dizer que q está vazio, sem valor dentro"
            - "Tem: o endereço de uma variável"
          certa: [[0]]
          certa_texto: "Tem: o valor NULL, que a linha escreveu"
          erros:
            - exata: [1]
              crenca: null_is_absence
              retorno: "NULL não é falta de valor: é um valor, e a linha o escreveu em q. Ele diz uma coisa certa: q não aponta para lugar nenhum."
            - exata: [2]
              retorno: "Nenhuma variável teve o endereço guardado em q. O valor que a linha escreveu é NULL: não aponta para lugar nenhum."
          retorno_geral: "q tem valor: NULL, que a linha escreveu."

    - id: esc_kc05_B1_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Dá para perguntar se um ponteiro vale NULL: p == NULL."
        - "A resposta é um número: 1 quando é verdade, 0 quando não é. O printf com %d mostra."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int *p;

            p = NULL;
            printf("%d\n", p == NULL);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "0"
              retorno: "p recebeu NULL na linha anterior. A pergunta p == NULL é verdadeira, e a resposta é 1."
          retorno_geral: "p vale NULL: a pergunta p == NULL é verdadeira, e a resposta é 1."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int *q;

            q = &idade;
            printf("%d\n", q == NULL);
          aceitas: ["0"]
          certa_texto: "0"
          erros:
            - texto: "1"
              retorno: "q recebeu o endereço de idade, e não NULL. A pergunta q == NULL é falsa, e a resposta é 0."
          retorno_geral: "q guarda o endereço de idade: a pergunta q == NULL é falsa, e a resposta é 0."

    - id: esc_kc05_B1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Com if, uma linha só roda quando a resposta é sim."
        - "Em if (p == NULL) idade = 20; a escrita em idade só acontece se p valer NULL."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int *p;

            idade = 15;
            p = NULL;
            if (p == NULL) idade = 20;
            printf("%d\n", idade);
          aceitas: ["20"]
          certa_texto: "20"
          erros:
            - texto: "15"
              retorno: "p vale NULL, então a pergunta é verdadeira e a linha do if rodou: idade passou a guardar 20."
          retorno_geral: "p vale NULL. A pergunta do if é verdadeira, e idade recebe 20."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int *p;

            idade = 15;
            p = &idade;
            if (p == NULL) idade = 20;
            printf("%d\n", idade);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "20"
              retorno: "p guarda o endereço de idade, e não NULL. A pergunta é falsa, e a linha do if não rodou: idade continua com 15."
          retorno_geral: "p não vale NULL. A pergunta do if é falsa, e idade continua com 15."

    - id: esc_kc05_B1_4
      guiado: true
      forma: montar
      codigo: true
      frases:
        - "Como NULL é um valor, ele se copia como qualquer outro."
      versoes:
        - pede: "p vale NULL. Faça q valer NULL também, copiando de p."
          antes: |-
            int *p;
            int *q;

            p = NULL;
          pecas: ["q", "=", "p", ";", "*p"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "q = p;"
          erros:
            - exata: [0, 1, 4, 3]
              invalida: true
              retorno: "*p iria ao lugar apontado, e p não aponta para lugar nenhum. O valor de p se copia sem o *: q = p;"
            - exata: [2, 1, 0, 3]
              retorno: "Assim é p que recebe o que está em q, e q não tem valor escolhido. Quem recebe fica à esquerda: q = p;"
          retorno_geral: "O valor guardado em p se copia sem o *: q = p;"
        - pede: "c vale NULL. Faça d valer NULL também, copiando de c."
          antes: |-
            char *c;
            char *d;

            c = NULL;
          pecas: ["d", "=", "c", ";", "*c"]
          certa: [[0, 1, 2, 3]]
          certa_texto: "d = c;"
          erros:
            - exata: [0, 1, 4, 3]
              invalida: true
              retorno: "*c iria ao lugar apontado, e c não aponta para lugar nenhum. O valor de c se copia sem o *: d = c;"
            - exata: [2, 1, 0, 3]
              retorno: "Assim é c que recebe o que está em d, e d não tem valor escolhido. Quem recebe fica à esquerda: d = c;"
          retorno_geral: "O valor guardado em c se copia sem o *: d = c;"

    - id: esc_kc05_B1_5
      nome: "Copiar NULL de um ponteiro para outro"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int *p;
            int *q;

            p = NULL;
            q = p;
            printf("%d\n", q == NULL);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "0"
              retorno: "q = p; copiou o valor de p, que era NULL. q passou a valer NULL também, e a resposta é 1."
          retorno_geral: "NULL é um valor, e foi copiado de p para q. A pergunta q == NULL dá 1."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
            int *p;
            int *q;

            p = &idade;
            q = p;
            printf("%d\n", q == NULL);
          aceitas: ["0"]
          certa_texto: "0"
          erros:
            - texto: "1"
              retorno: "q = p; copiou o endereço de idade. q não vale NULL, e a resposta é 0."
          retorno_geral: "q recebeu o endereço de idade, copiado de p. A pergunta q == NULL dá 0."

    - id: esc_kc05_B1_6
      guiado: false
      forma: montar
      codigo: true
      frases: []
      versoes:
        - pede: "Declare um ponteiro para inteiro chamado p e, na linha seguinte, escreva nele o valor que diz: não aponta para lugar nenhum."
          pecas: ["int *p;", "p = NULL;", "*p = NULL;", "int p;"]
          certa: [[0, 1]]
          certa_texto: "int *p; p = NULL;"
          erros:
            - exata: [0, 2]
              invalida: true
              retorno: "*p é o lugar apontado, e p ainda não aponta para lugar nenhum. O NULL vai no próprio ponteiro: p = NULL;"
            - exata: [3, 1]
              invalida: true
              retorno: "Sem o *, p é um int comum, e NULL é valor de ponteiro. A declaração é int *p;"
            - exata: [1, 0]
              invalida: true
              retorno: "Primeiro a declaração, depois a escrita: int *p; e então p = NULL;"
          retorno_geral: "São duas linhas: int *p; e p = NULL;"
        - pede: "Declare um ponteiro para caractere chamado c e, na linha seguinte, escreva nele o valor que diz: não aponta para lugar nenhum."
          pecas: ["char *c;", "c = NULL;", "*c = NULL;", "char c;"]
          certa: [[0, 1]]
          certa_texto: "char *c; c = NULL;"
          erros:
            - exata: [0, 2]
              invalida: true
              retorno: "*c é o lugar apontado, e c ainda não aponta para lugar nenhum. O NULL vai no próprio ponteiro: c = NULL;"
            - exata: [3, 1]
              invalida: true
              retorno: "Sem o *, c é um char comum, e NULL é valor de ponteiro. A declaração é char *c;"
            - exata: [1, 0]
              invalida: true
              retorno: "Primeiro a declaração, depois a escrita: char *c; e então c = NULL;"
          retorno_geral: "São duas linhas: char *c; e c = NULL;"

B2:
  revisao:
    frases:
      - "O 0 escrito no código, posto num ponteiro, é o ponteiro nulo: p = 0; faz o mesmo que p = NULL;"
      - "Vale para o 0 escrito ali. Um zero guardado numa variável inteira é só um número, e o compilador não o aceita num ponteiro."
    codigo: |
      int *p;

      p = 0;
      printf("%d\n", p == NULL);
    saida: "1"
  # malloc, void * e return.
  fora_da_trilha: [ciu_kc05_t06]
  provas:
    - crenca: any_zero_is_null
      programa: |
        int n;
        int *p;

        n = 0;
        p = 0;
        p = n;
      previsao:
        pergunta: >
          As duas últimas linhas põem um zero em p: o 0 escrito no
          código, e o zero guardado em n. De qual delas o compilador
          reclama?
        opcoes:
          - "De nenhuma: zero é zero, e qualquer zero vira o ponteiro nulo"
          - "Só de p = n;"
          - "Das duas"
        real: 1
        crenca: 0
      reclama: "makes pointer from integer without a cast"
      ambiente: >
        Mensagem do gcc 16.2, para a linha p = n;. Todo compilador de C
        tem de reclamar dela, cada um com as suas palavras.
      afirma: >
        O compilador aceita p = 0; e reclama de p = n;, mesmo com n
        valendo zero. O que vira ponteiro nulo é o 0 escrito no código,
        e não qualquer zero.
  degraus:
    - id: esc_kc05_B2_1
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "O 0 escrito no código, posto num ponteiro, é o ponteiro nulo."
        - "p = 0; faz o mesmo que p = NULL;"
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int *p;

            p = 0;
            printf("%d\n", p == NULL);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "0"
              retorno: "O 0 escrito no código vira o ponteiro nulo: p = 0; deixa p valendo NULL, e a resposta é 1."
          retorno_geral: "p = 0; põe o ponteiro nulo em p. A pergunta p == NULL dá 1."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int *q = 0;

            printf("%d\n", q == NULL);
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "0"
              retorno: "O 0 escrito no código vira o ponteiro nulo: q nasce valendo NULL, e a resposta é 1."
          retorno_geral: "int *q = 0; faz q nascer com o ponteiro nulo. A pergunta q == NULL dá 1."

    - id: esc_kc05_B2_2
      guiado: true
      forma: escolher
      codigo: true
      frases:
        - "Isso vale para o 0 escrito ali, na linha."
        - "Um zero guardado numa variável inteira é um número comum: o compilador reclama de p = n;"
      versoes:
        - pede: "n guarda zero. Qual destas linhas o compilador aceita?"
          antes: |-
            int n;
            int *p;

            n = 0;
          pecas: ["p = 0;", "p = n;", "p = &0;"]
          certa: [[0]]
          certa_texto: "p = 0;"
          invalidas: [1, 2]
          erros:
            - exata: [1]
              retorno: "n é uma variável inteira: o que ela guarda é um número comum, mesmo sendo zero. O compilador reclama. Aceita: p = 0;"
            - exata: [2]
              retorno: "0 é um número escrito no código, e não tem endereço. Para o ponteiro nulo basta o próprio 0: p = 0;"
          retorno_geral: "Só o 0 escrito na linha vira o ponteiro nulo: p = 0;"
        - pede: "pontos guarda zero. Qual destas linhas o compilador aceita?"
          antes: |-
            int pontos;
            int *q;

            pontos = 0;
          pecas: ["q = pontos;", "q = 0;", "q = &0;"]
          certa: [[1]]
          certa_texto: "q = 0;"
          invalidas: [0, 2]
          erros:
            - exata: [0]
              retorno: "pontos é uma variável inteira: o que ela guarda é um número comum, mesmo sendo zero. O compilador reclama. Aceita: q = 0;"
            - exata: [2]
              retorno: "0 é um número escrito no código, e não tem endereço. Para o ponteiro nulo basta o próprio 0: q = 0;"
          retorno_geral: "Só o 0 escrito na linha vira o ponteiro nulo: q = 0;"

    - id: esc_kc05_B2_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Dá para forçar: q = (int *)n; manda o compilador tratar o número de n como endereço, e ele aceita."
        - "Mas a linguagem não promete que saia dali o ponteiro nulo, mesmo com n valendo zero."
      versoes:
        - pede: "Qual dos dois é o ponteiro nulo com certeza?"
          antes: |-
            int n;
            int *p;
            int *q;

            n = 0;
            p = 0;
            q = (int *)n;
          pecas:
            - "Só p: recebeu o 0 escrito no código"
            - "Os dois: qualquer zero vira o ponteiro nulo"
            - "Só q: recebeu o zero da variável, que é o de verdade"
          certa: [[0]]
          certa_texto: "Só p: recebeu o 0 escrito no código"
          erros:
            - exata: [1]
              crenca: any_zero_is_null
              retorno: "A garantia é do 0 escrito no código. O zero que chega dentro de n é um número comum: forçado para dentro de q, não tem promessa nenhuma."
            - exata: [2]
              retorno: "É o contrário: a garantia é do 0 escrito na linha. O zero que vem de n foi forçado para dentro de q, sem promessa nenhuma."
          retorno_geral: "Com certeza, só p: a garantia é do 0 escrito no código."
        - pede: "Qual dos dois é o ponteiro nulo com certeza?"
          antes: |-
            int pontos;
            int *p;
            int *q;

            pontos = 0;
            p = (int *)pontos;
            q = 0;
          pecas:
            - "Só q: recebeu o 0 escrito no código"
            - "Os dois: qualquer zero vira o ponteiro nulo"
            - "Só p: recebeu o zero da variável, que é o de verdade"
          certa: [[0]]
          certa_texto: "Só q: recebeu o 0 escrito no código"
          erros:
            - exata: [1]
              crenca: any_zero_is_null
              retorno: "A garantia é do 0 escrito no código. O zero que chega dentro de pontos é um número comum: forçado para dentro de p, não tem promessa nenhuma."
            - exata: [2]
              retorno: "É o contrário: a garantia é do 0 escrito na linha. O zero que vem de pontos foi forçado para dentro de p, sem promessa nenhuma."
          retorno_geral: "Com certeza, só q: a garantia é do 0 escrito no código."

    - id: esc_kc05_B2_4
      nome: "Aceitar no ponteiro só o 0 escrito no código"
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Uma destas linhas faz o compilador reclamar. Qual?"
          antes: |-
            int n;
            int *p;

            n = 0;
          pecas: ["p = NULL;", "p = 0;", "p = n;"]
          certa: [[2]]
          certa_texto: "p = n;"
          invalidas: [2]
          erros:
            - exata: [0]
              retorno: "p = NULL; escreve o ponteiro nulo, e é aceita. A que não é: p = n;, que põe um inteiro comum num ponteiro."
            - exata: [1]
              retorno: "p = 0; usa o 0 escrito no código, que vira o ponteiro nulo. A que não é aceita: p = n;"
          retorno_geral: "n é um inteiro comum, mesmo valendo zero: p = n; faz o compilador reclamar."
        - pede: "Uma destas linhas faz o compilador reclamar. Qual?"
          antes: |-
            int pontos;
            int *q;

            pontos = 0;
          pecas: ["q = pontos;", "q = 0;", "q = NULL;"]
          certa: [[0]]
          certa_texto: "q = pontos;"
          invalidas: [0]
          erros:
            - exata: [1]
              retorno: "q = 0; usa o 0 escrito no código, que vira o ponteiro nulo. A que não é aceita: q = pontos;"
            - exata: [2]
              retorno: "q = NULL; escreve o ponteiro nulo, e é aceita. A que não é: q = pontos;, que põe um inteiro comum num ponteiro."
          retorno_geral: "pontos é um inteiro comum, mesmo valendo zero: q = pontos; faz o compilador reclamar."

    - id: esc_kc05_B2_5
      guiado: false
      forma: montar
      codigo: true
      frases: []
      versoes:
