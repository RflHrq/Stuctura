topic: kc_03

# A METÁFORA DESTE TÓPICO: o papel que já vem rabiscado.
#
# Continua a rua do kc_02. Declarar `int *p;` é ganhar a casa de p, com um
# papel dentro — e o papel NÃO vem em branco: traz o que o último morador
# rabiscou nele. Não é zero, não é "nada", não é um endereço escolhido.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. Um papel rabiscado sugere que havia um número ali, de alguém. O que
#      está na memória pode não ser endereço de coisa nenhuma — pode não
#      formar um número que leve a lugar algum. "Rabisco" é melhor que
#      "número antigo", e quando a metáfora empurrar para "o endereço de
#      outra pessoa", ela cala.
#   2. A metáfora não diz NADA sobre a casa apontada, e isso é de
#      propósito: o ponto do tópico é que essa casa não existe ainda.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "A declaração reserva espaço para a variável declarada."
    plain_text: >
      Declarar uma variável cria a caixa dela. Uma caixa: a que você
      nomeou.
    negated_by:
      - no_value_no_memory

    # A EVIDENCIA DO kc_03, 12/11/2026. O `afirma` e TEXTO DE TELA, entao
    # e curto; o resto fica nestes comentarios.
    evidencia:
      - afirma: >
          A declaração já reserva o espaço de p: logo na linha seguinte
          p aceita um endereço e passa a levar até lá, sem que nada
          precise criá-lo antes.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p;

              p = &x;
              puts(*p == 1 ? "p recebeu um endereco e levou ate o 1 de x" : "FALHOU");
              x = 2;
              puts(*p == 2 ? "e continua levando: o espaco de p estava la desde a declaracao"
                           : "FALHOU");
              return 0;
          }
        espera: |-
          p recebeu um endereco e levou ate o 1 de x
          e continua levando: o espaco de p estava la desde a declaracao
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Declarar é o ato que cria a variável. A partir daquela linha existe
      um lugar na memória que é dela, com um número de porta — e isso
      acontece antes de qualquer valor entrar, e acontece mesmo que nenhum
      entre nunca.


      O tipo decide a forma desse lugar. int x reserva espaço com o
      formato de um inteiro; double y reserva outro, com formato de número
      fracionário. Não é a mesma caixa com um rótulo diferente: é o tipo
      que diz quantos bytes e como o que estiver lá dentro deve ser lido.


      Por isso o espaço já está pronto para receber, e já está pronto para
      recusar o que não cabe. Escrever 0.5 numa caixa de int não aumenta a
      caixa — o 0.5 é cortado para caber. A caixa veio antes do valor, e
      foi ela que mandou.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "Em int *p, quem é declarado é p, e não *p."
    plain_text: >
      Em int *p, quem é criado é p. O asterisco faz parte do que p é, e
      não é uma segunda caixa.
    negated_by:
      - estrela_e_do_tipo

    evidencia:
      - afirma: >
          Em int *p, quem é declarado é p: na mesma linha, int *p, q
          declara um ponteiro e um int, e o q sai int — o asterisco
          ficou com p, não com o tipo.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p, q;

              q = 5;
              p = &q;
              puts(q == 5 ? "q aceitou um inteiro: ele saiu int, nao ponteiro"
                          : "FALHOU");
              puts(*p == 5 ? "e p aceitou o endereco de q: o asterisco ficou com p"
                           : "FALHOU");
              return 0;
          }
        espera: |-
          q aceitou um inteiro: ele saiu int, nao ponteiro
          e p aceitou o endereco de q: o asterisco ficou com p
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      A declaração int *p; cria um nome, e o nome é p. Não existe no
      programa nenhuma variável chamada *p — essa escrita é uma operação
      que você faz COM p depois, e não um nome que alguém possa declarar.


      O asterisco pertence a p, e não ao int. Onde você põe o espaço em
      branco não muda nada: int *p, int* p e int * p são a mesma
      declaração, e o compilador lê as três igual. A estrela está grudada
      no declarador, não no tipo.


      E a maneira de ler é de dentro para fora: p é o nome; *p diz que p é
      um ponteiro; int diz que o que está do outro lado é um inteiro. Lida
      assim, a declaração diz "p é um ponteiro para int" — que é
      exatamente o que ela faz.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "C não zera uma variável automática ao declará-la."
    plain_text: >
      C não limpa a caixa nova. O que estava naquele lugar antes
      continua lá.
    negated_by:
      - declaration_zeroes

    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          C não zera a variável automática ao declará-la: copiar o que
          está nela logo depois da declaração faz o compilador avisar
          que ela foi usada sem valor.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p;
              int *q = p;

              return q == NULL;
          }
        avisa: >
          is used uninitialized
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      A declaração reserva o espaço e para por aí. Ela não escreve nada
      dentro, e o que estava naquele lugar antes continua lá — restos de
      alguma coisa que o programa já fez, ou nunca usou. C não promete
      nada sobre esse conteúdo.


      A ideia de que a variável começa em zero não é invenção de ninguém:
      outras linguagens fazem isso mesmo, e C faz para uma parte da
      memória — a das variáveis que vivem o programa inteiro. Para as
      locais, as que nascem e morrem dentro de uma função, não há promessa
      alguma.


      Por isso o valor inicial é trabalho seu. Escrever int total = 0; não
      é formalidade: é a linha que põe o zero lá. Sem ela, a primeira soma
      parte de um número que ninguém escolheu — e o programa pode acertar
      hoje e errar amanhã, com o mesmo código.
  I1:
    type: inferencia
    role: espinha
    support: [B1, B2]
    text: "Declarar p não cria o objeto para onde p vai apontar."
    plain_text: >
      Então declarar p não cria a caixa apontada. Até aqui existe uma
      caixa só.
    negated_by:
      - declaration_allocates

    evidencia:
      - afirma: >
          Declarar p cria p, e mais nada: para p levar a algum lugar foi
          preciso um objeto que já existia, ou um bloco pedido na hora.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char dado = 'z';
              char *p;
              char *pedido;

              p = &dado;
              puts(*p == 'z' ? "p passou a levar a um objeto que ja existia" : "FALHOU");
              pedido = malloc(1);
              if (pedido == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *pedido = 'k';
              puts(*pedido == 'k' ? "e onde nao havia objeto, foi preciso pedir um"
                                  : "FALHOU");
              free(pedido);
              return 0;
          }
        espera: |-
          p passou a levar a um objeto que ja existia
          e onde nao havia objeto, foi preciso pedir um
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é a soma das duas anteriores. A declaração
      reserva espaço para a variável declarada, e a variável declarada em
      int *p; é p. Então ela reservou espaço para p — uma caixa de guardar
      endereço — e para mais nada.


      O objeto apontado é outra variável, e ele tem de vir de outro lugar.
      Pode ser um int declarado em separado, e aí você escreve p = &x.
      Pode ser um bloco que você pede enquanto o programa roda. O que não
      existe é a terceira possibilidade: declarar p e achar que o int
      apareceu junto.


      Por isso contar caixas ajuda. Depois de int *p; existe UMA caixa
      nova. Depois de int x; int *p; existem duas, e elas ainda não têm
      relação nenhuma entre si — quem as liga é a linha que escreve o
      endereço de uma dentro da outra.
  I2:
    type: inferencia
    role: espinha
    support: [B3, I1]
    text: "Logo depois da declaração, p contém lixo, e não NULL."
    plain_text: >
      Nesse ponto p guarda um valor qualquer, sobra do que estava ali.
      Não é NULL.
    negated_by:
      - uninitialized_is_null

    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          Logo depois da declaração p contém lixo, e não NULL: até
          perguntar se p é NULL já é usar o que está lá — e é disso que
          o compilador avisa.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p;

              if (p == NULL) {
                  return 1;
              }
              return 0;
          }
        avisa: >
          is used uninitialized
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      NULL é um valor, e valores entram nas caixas porque alguém os
      escreve. Ele quer dizer "não aponto para lugar nenhum" — uma
      informação útil, e que só está lá se uma linha do seu programa a
      tiver colocado.


      Um ponteiro recém-declarado não tem esse valor nem nenhum outro que
      alguém tenha escolhido. Ele tem o que estava naquele espaço antes, e
      isso pode se parecer com qualquer coisa. Dizer que ele "está vazio"
      ou que "vale NULL" é dizer algo que o padrão não promete.


      E é isso que estraga o teste. if (p == NULL) é uma pergunta honesta
      quando NULL foi escrito ali de propósito; feita num ponteiro que
      ninguém inicializou, ela compara com um valor que não significa nada
      — e pode responder "não é NULL" sobre um endereço que não leva a
      lugar nenhum.
  I3:
    type: inferencia
    role: conclusao
    support: [I1, I2]
    text: "Usar *p antes de dar um endereço a p é inválido."
    plain_text: >
      Por isso usar *p antes de dar um endereço a p vai a um lugar que
      ninguém escolheu.
    negated_by:
      - pode_usar_logo
    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          Usar *p antes de dar um endereço a p é inválido: o compilador
          avisa que p está sendo usado sem valor, e o programa não é
          executado — escrever ali é escrever em lugar nenhum conhecido.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p;

              *p = 5;
              return 0;
          }
        avisa: >
          is used uninitialized
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Escrever em *p é uma ordem com destino: vá até o endereço que está
      em p e escreva lá. Ela só faz sentido se o que está em p for um
      endereço que alguém escolheu — e logo depois de int *p; ninguém
      escolheu nada.


      Então falta um passo, e ele é sempre o mesmo: dar um endereço a p.
      De uma variável que já existe, com p = &x. De um bloco pedido
      enquanto o programa roda. De outro ponteiro que já tenha um.
      Qualquer um serve; nenhum pode faltar.


      E o compilador aceitar não é sinal de nada. Ele confere a FORMA: *p
      = 10 é uma escrita bem escrita, e ele traduz. Quem decide se aquilo
      tem significado é o que está em p na hora de rodar — e sobre isso o
      padrão não promete coisa alguma. Programa que parece funcionar nesta
      máquina pode não funcionar na próxima execução.
