topic: kc_03

# A METÁFORA DESTE TÓPICO: o papel que já vem rabiscado.
#
# Continua a rua do kc_02. Declarar `int *p;` é ganhar a casa de p, com um
# papel dentro — e o papel NÃO vem em branco: traz o que o último morador
# rabiscou nele. Não é zero, não é "nada", não é um endereço escolhido.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. Um papel rabiscado sugere que havia um número ali, de alguém. O que
#      está na memória pode não ser endereço de coisa nenhuma — pode não
#      formar um número que leve a lugar algum. "Rabisco" é melhor que
#      "número antigo", e quando a metáfora empurrar para "o endereço de
#      outra pessoa", ela cala.
#   2. A metáfora não diz NADA sobre a casa apontada, e isso é de
#      propósito: o ponto do tópico é que essa casa não existe ainda.

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "A declaração reserva espaço para a variável declarada."
    plain_text: >
      Declarar uma variável cria a caixa dela. Uma caixa: a que você
      nomeou.
    negated_by:
      - no_value_no_memory

    # A EVIDENCIA DO kc_03, 12/11/2026. O `afirma` e TEXTO DE TELA, entao
    # e curto; o resto fica nestes comentarios.
    evidencia:
      - afirma: >
          A declaração já reserva o espaço de p: logo na linha seguinte
          p aceita um endereço e passa a levar até lá, sem que nada
          precise criá-lo antes.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;
              int *p;

              p = &x;
              puts(*p == 1 ? "p recebeu um endereco e levou ate o 1 de x" : "FALHOU");
              x = 2;
              puts(*p == 2 ? "e continua levando: o espaco de p estava la desde a declaracao"
                           : "FALHOU");
              return 0;
          }
        espera: |-
          p recebeu um endereco e levou ate o 1 de x
          e continua levando: o espaco de p estava la desde a declaracao
  B2:
    type: observavel
    role: espinha
    support: []
    text: "Em int *p, quem é declarado é p, e não *p."
    plain_text: >
      Em int *p, quem é criado é p. O asterisco faz parte do que p é, e
      não é uma segunda caixa.
    negated_by:
      - estrela_e_do_tipo

    evidencia:
      - afirma: >
          Em int *p, quem é declarado é p: na mesma linha, int *p, q
          declara um ponteiro e um int, e o q sai int — o asterisco
          ficou com p, não com o tipo.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int *p, q;

              q = 5;
              p = &q;
              puts(q == 5 ? "q aceitou um inteiro: ele saiu int, nao ponteiro"
                          : "FALHOU");
              puts(*p == 5 ? "e p aceitou o endereco de q: o asterisco ficou com p"
                           : "FALHOU");
              return 0;
          }
        espera: |-
          q aceitou um inteiro: ele saiu int, nao ponteiro
          e p aceitou o endereco de q: o asterisco ficou com p
  B3:
    type: observavel
    role: espinha
    support: []
    text: "C não zera uma variável automática ao declará-la."
    plain_text: >
      C não limpa a caixa nova. O que estava naquele lugar antes
      continua lá.
    negated_by:
      - declaration_zeroes

  I1:
    type: inferencia
    role: espinha
    support: [B1, B2]
    text: "Declarar p não cria o objeto para onde p vai apontar."
    plain_text: >
      Então declarar p não cria a caixa apontada. Até aqui existe uma
      caixa só.
    negated_by:
      - declaration_allocates

    evidencia:
      - afirma: >
          Declarar p cria p, e mais nada: para p levar a algum lugar foi
          preciso um objeto que já existia, ou um bloco pedido na hora.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char dado = 'z';
              char *p;
              char *pedido;

              p = &dado;
              puts(*p == 'z' ? "p passou a levar a um objeto que ja existia" : "FALHOU");
              pedido = malloc(1);
              if (pedido == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *pedido = 'k';
              puts(*pedido == 'k' ? "e onde nao havia objeto, foi preciso pedir um"
                                  : "FALHOU");
              free(pedido);
              return 0;
          }
        espera: |-
          p passou a levar a um objeto que ja existia
          e onde nao havia objeto, foi preciso pedir um
  I2:
    type: inferencia
    role: espinha
    support: [B3, I1]
    text: "Logo depois da declaração, p contém lixo, e não NULL."
    plain_text: >
      Nesse ponto p guarda um valor qualquer, sobra do que estava ali.
      Não é NULL.
    negated_by:
      - uninitialized_is_null

  I3:
    type: inferencia
    role: conclusao
    support: [I1, I2]
    text: "Usar *p antes de dar um endereço a p é inválido."
    plain_text: >
      Por isso usar *p antes de dar um endereço a p vai a um lugar que
      ninguém escolheu.
    negated_by:
      - pode_usar_logo
