B3:
  revisao:
    frases:
      - "São duas coisas: o bloco, no monte, e a caixa de p, que é uma variável sua."
      - "free devolve o bloco. A caixa de p não está dentro dele, e fica onde foi declarada."
    codigo: |
      int *p;

      p = malloc(sizeof(int));
      free(p);
      p = NULL;
      printf("%d\n", p == NULL);
    saida: "1"
  cena:
    atores:
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
    passos:
      - {linha: 1, faz: [{cria: p}]}
      - {linha: 3, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 4, faz: [{devolve: bloco}, {diz: 'p ainda tem o endereço, mas o bloco já não é do programa'}]}
      - {linha: 5, faz: [{nulo: p}]}
      - {linha: 6, faz: [{le: p}, {diz: 'p == NULL é verdade, e o C escreve 1'}, {mostra: '1'}]}
  # Variável declarada fora da função.
  fora_da_trilha: [ciu_kc09_009]
  provas:
    - crenca: pointer_lives_in_heap
      programa: |
        int *p;

        p = malloc(sizeof(int));
        printf("%p\n", (void *)&p);
        printf("%p\n", (void *)p);
        free(p);
      previsao:
        pergunta: >
          O primeiro printf mostra o endereço da caixa p. O segundo
          mostra o endereço do bloco, que é o que p guarda. O que
          aparece?
        opcoes:
          - "Dois endereços diferentes"
          - "O mesmo endereço: a caixa de p fica dentro do bloco"
        real: 0
        crenca: 1
      espera: "0x1000\n0x2A00"
      ambiente: >
        Os números dos lugares mudam de máquina para máquina; aqui eles
        aparecem como números de exemplo. O que foi conferido é que as
        duas linhas saem com endereços diferentes.
      afirma: >
        Saíram dois endereços diferentes. A caixa de p está num lugar; o
        bloco, em outro. p aponta para o monte, mas não mora nele — e é
        por isso que devolver o bloco não leva a caixa junto.
  degraus:
    - id: esc_kc09_B3_1
      guiado: true
      forma: escolher
      codigo: false
