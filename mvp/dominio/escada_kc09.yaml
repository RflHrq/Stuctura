# A escada do kc_09 — free() e ponteiro pendente.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI já pede bloco, confere o NULL e devolve com free
# (kc_01, kc_08), e já sabe que a chamada de função copia o que recebe
# (kc_06). Este tópico junta as duas coisas num lugar só: a linha
# free(p); — o que entra nela, o que ela devolve, e o que sobra em p.
#
# O QUE ESTE TÓPICO APRESENTA: nenhum construto novo. Entra uma palavra,
# "pendente" (I2, degrau 1), e um fato sobre o free: free(NULL) não faz
# nada (I4, degrau 2).
#
# SÃO OITO PREMISSAS, e três delas ficam muito perto uma da outra: o I1
# (free não muda p), o I2 (p continua lá) e o I3 (o NULL é você que
# escreve). Para não ser a mesma pergunta três vezes, cada uma tem o seu
# ângulo: o I1 olha o VALOR de p (igual à cópia feita antes); o I2 olha
# a VARIÁVEL (dá para usar de novo, e não dá para declarar outra vez); o
# I3 olha o REGISTRO (com o NULL escrito, a pergunta de sempre volta a
# valer).
#
# COMPARAR p DEPOIS DO free. Os passos e as provas do I1 e do I3
# imprimem p == NULL depois do free, para mostrar que free não escreveu
# NULL. A última premissa do tópico diz que o padrão do C não garante nem
# essa comparação. As duas coisas são ditas: a nota de ambiente dessas
# provas avisa, e o I4 tem um passo guiado que diz que aquelas
# comparações valem nesta máquina.
#
# AS PROVAS, e o que cada uma usa:
#
#   B1  o ponteiro carrega o tamanho  o compilador reclama de
#                                     sizeof p / sizeof p[0]
#   B2  a função recebe o original    x = NULL na função, e p intacto: 0
#   B3  o ponteiro mora no monte      o endereço da caixa e o do bloco
#   B4  o bloco vale depois do free   o compilador reclama de ler o bloco
#   I1  p vira NULL                   p == NULL depois do free: 0
#   I2  free apaga a variável p       p recebe outro bloco, e sai 9
#   I3  o NULL é redundante           com o NULL e sem ele: 1 e 0
#   I4  dois free são seguros         o analisador aponta o segundo
#
# AS QUESTÕES DE MARCAR. O banco do kc_09 não foi mexido. Sete das 48
# questões de diagnóstico e de treino usam o que as escadas não ensinam —
# ponteiro para ponteiro (que é o tópico seguinte), `struct` e variável
# global — e estão em `fora_da_trilha`.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 14/11/2026
# revisado_por: Rafael Henrique dos Santos Simão, em 24/11/2026
#   (leu o texto de leitura desta escada, docs/escada-kc09-leitura.md,
#   viu as cenas no sistema e validou o conteúdo)

B1:
  revisao:
    frases:
      - "free(p) recebe só o endereço do bloco. O tamanho, quem anotou foi o alocador, quando entregou."
      - "O ponteiro não carrega tamanho: guarda um endereço, e mais nada."
    codigo: |
      int *p;

      p = malloc(3 * sizeof(int));
      p[2] = 9;
      printf("%d\n", p[2]);
      free(p);
    saida: "9"
  cena:
    atores:
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int, tamanho: 3}
    passos:
      - {linha: 1, faz: [{cria: p}]}
      - {linha: 3, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 4, faz: [{segue: p}, {guarda: {em: 'bloco[2]', valor: 9}}]}
      - {linha: 5, faz: [{segue: p}, {le: 'bloco[2]'}, {mostra: '9'}]}
      - {linha: 6, faz: [{devolve: bloco}]}
  provas:
    - crenca: pointer_knows_block_size
      programa: |
        int *p;

        p = malloc(10 * sizeof(int));
        printf("%zu\n", sizeof p / sizeof p[0]);
        free(p);
      previsao:
        pergunta: >
          Com um array, a conta sizeof v / sizeof v[0] dá o número de
          itens. Aqui ela é feita com p, um ponteiro para um bloco de dez
          ints. O compilador reclama de alguma coisa?
        opcoes:
          - "Não: o ponteiro carrega o tamanho do bloco, e a conta dá 10"
          - "Sim: avisa que essa conta não dá o número de itens"
        real: 1
        crenca: 0
      reclama: "does not compute the number of array elements"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall): a divisão
        "não calcula o número de elementos". O programa não é executado.
      afirma: >
        O compilador avisa que a conta não dá o número de itens: sizeof p
        mede o ponteiro, e não o bloco. p guarda só um endereço. O
        tamanho do bloco ficou anotado com o alocador, e é por isso que
        free(p) não precisa que você diga.
  degraus:
    - id: esc_kc09_B1_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Quem anota o tamanho do bloco é o alocador, na hora de entregá-lo."
        - "Por isso free(p) funciona recebendo só o endereço."
      versoes:
        - pede: "Depois da última linha, o que está guardado em p?"
          antes: |-
            int *p;

            p = malloc(10 * sizeof(int));
          pecas:
            - "Só o endereço do bloco"
            - "O endereço e o tamanho: o ponteiro carrega o tamanho do bloco"
            - "Os dez ints"
          certa: [[0]]
          certa_texto: "Só o endereço do bloco"
          erros:
            - exata: [1]
              crenca: pointer_knows_block_size
              retorno: "Em p cabe um endereço, e mais nada. Quantos bytes o bloco tem ficou anotado com o alocador, que foi quem entregou."
            - exata: [2]
              retorno: "Os dez ints ficam no bloco, no monte. Em p fica só o endereço dele."
          retorno_geral: "p guarda só o endereço do bloco. O tamanho ficou com o alocador."
        - pede: "Depois da última linha, o que está guardado em q?"
          antes: |-
            int *q;

            q = malloc(6 * sizeof(int));
          pecas:
            - "Os seis ints"
            - "Só o endereço do bloco"
            - "O endereço e o tamanho: o ponteiro carrega o tamanho do bloco"
          certa: [[1]]
          certa_texto: "Só o endereço do bloco"
          erros:
            - exata: [2]
              crenca: pointer_knows_block_size
              retorno: "Em q cabe um endereço, e mais nada. Quantos bytes o bloco tem ficou anotado com o alocador, que foi quem entregou."
            - exata: [0]
              retorno: "Os seis ints ficam no bloco, no monte. Em q fica só o endereço dele."
          retorno_geral: "q guarda só o endereço do bloco. O tamanho ficou com o alocador."

    - id: esc_kc09_B1_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "sizeof de um array mede o conjunto inteiro das caixas."
        - "sizeof de um ponteiro mede só a caixa do ponteiro: quantas caixas há no bloco, ele não sabe."
      versoes:
        - pede: "v é um array de dez; p aponta para um bloco de dez. Qual dos dois sizeof dá 10?"
          antes: |-
            char v[10];
            char *p;

            p = malloc(10);
          pecas:
            - "Só sizeof v: v é o conjunto; p é um endereço"
            - "Os dois: p também sabe o tamanho do bloco"
            - "Só sizeof p: é ele que aponta para o bloco"
          certa: [[0]]
          certa_texto: "Só sizeof v: v é o conjunto; p é um endereço"
          erros:
            - exata: [1]
              retorno: "p guarda um endereço, e sizeof p mede o ponteiro, e não o bloco. Só v, que é o conjunto das dez caixas, dá 10."
            - exata: [2]
              retorno: "Apontar para o bloco não é saber o tamanho dele: sizeof p mede o ponteiro. Quem dá 10 é sizeof v."
          retorno_geral: "sizeof v dá 10, as dez caixas. sizeof p mede só o ponteiro."
        - pede: "letras é um array de seis; q aponta para um bloco de seis. Qual dos dois sizeof dá 6?"
          antes: |-
            char *q;
            char letras[6];

            q = malloc(6);
          pecas:
            - "Os dois: q também sabe o tamanho do bloco"
            - "Só sizeof q: é ele que aponta para o bloco"
            - "Só sizeof letras: letras é o conjunto; q é um endereço"
          certa: [[2]]
          certa_texto: "Só sizeof letras: letras é o conjunto; q é um endereço"
          erros:
            - exata: [0]
              retorno: "q guarda um endereço, e sizeof q mede o ponteiro, e não o bloco. Só letras, que é o conjunto das seis caixas, dá 6."
            - exata: [1]
              retorno: "Apontar para o bloco não é saber o tamanho dele: sizeof q mede o ponteiro. Quem dá 6 é sizeof letras."
          retorno_geral: "sizeof letras dá 6, as seis caixas. sizeof q mede só o ponteiro."

    - id: esc_kc09_B1_3
      guiado: true
      forma: completar
      codigo: true
      frases:
        - "Por isso free recebe uma coisa só, o endereço. O tamanho não se diz: o alocador já tem."
      versoes:
        - pede: "Complete a chamada que devolve o bloco de dez ints."
          antes: |-
            int *p;

            p = malloc(10 * sizeof(int));
          mostra: "free(___);"
          pecas: ["p", "p, 10", "10"]
          certa: [[0]]
          certa_texto: "free(p);"
          erros:
            - exata: [1]
              invalida: true
              retorno: "free recebe uma coisa só, o endereço: com dois valores o compilador reclama. O tamanho o alocador já anotou: free(p);"
            - exata: [2]
              invalida: true
              retorno: "10 é quantos ints foram pedidos, e não um endereço: o compilador reclama. free recebe o endereço do bloco: free(p);"
          retorno_geral: "free recebe só o endereço do bloco: free(p);"
        - pede: "Complete a chamada que devolve o bloco de seis ints."
          antes: |-
            int *q;

            q = malloc(6 * sizeof(int));
          mostra: "free(___);"
          pecas: ["6", "q", "q, 6"]
          certa: [[1]]
          certa_texto: "free(q);"
          erros:
            - exata: [2]
              invalida: true
              retorno: "free recebe uma coisa só, o endereço: com dois valores o compilador reclama. O tamanho o alocador já anotou: free(q);"
            - exata: [0]
              invalida: true
              retorno: "6 é quantos ints foram pedidos, e não um endereço: o compilador reclama. free recebe o endereço do bloco: free(q);"
          retorno_geral: "free recebe só o endereço do bloco: free(q);"

    - id: esc_kc09_B1_4
      nome: "O ponteiro guarda o endereço, não o tamanho"
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "A função recebe p. Ela consegue descobrir quantos ints o bloco tem?"
          antes: "void usa(int *p) { p[0] = 7; }"
          pecas:
            - "Não: p é só um endereço, e o número tem de vir em outro parâmetro"
            - "Consegue: o ponteiro carrega o tamanho do bloco"
            - "Consegue, com sizeof p"
          certa: [[0]]
          certa_texto: "Não: p é só um endereço, e o número tem de vir em outro parâmetro"
          erros:
            - exata: [1]
              retorno: "Em p cabe um endereço, e mais nada. O tamanho ficou com o alocador, e a função não tem como perguntar a ele."
            - exata: [2]
              retorno: "sizeof p mede o ponteiro, e não o bloco. Quantos ints há, só quem pediu sabe: o número vai em outro parâmetro."
          retorno_geral: "p é só um endereço. Quantos ints o bloco tem, a função recebe em outro parâmetro."
        - pede: "A função recebe q. Ela consegue descobrir quantos ints o bloco tem?"
          antes: "void zera(int *q) { q[0] = 0; }"
          pecas:
            - "Consegue, com sizeof q"
            - "Não: q é só um endereço, e o número tem de vir em outro parâmetro"
            - "Consegue: o ponteiro carrega o tamanho do bloco"
          certa: [[1]]
          certa_texto: "Não: q é só um endereço, e o número tem de vir em outro parâmetro"
          erros:
            - exata: [2]
              retorno: "Em q cabe um endereço, e mais nada. O tamanho ficou com o alocador, e a função não tem como perguntar a ele."
            - exata: [0]
              retorno: "sizeof q mede o ponteiro, e não o bloco. Quantos ints há, só quem pediu sabe: o número vai em outro parâmetro."
          retorno_geral: "q é só um endereço. Quantos ints o bloco tem, a função recebe em outro parâmetro."

    - id: esc_kc09_B1_5
      guiado: false
      forma: escolher
      codigo: true
      frases: []
      versoes:
        - pede: "Qual destas linhas devolve o bloco de p?"
          antes: |-
            int *p;

            p = malloc(5 * sizeof(int));
          pecas: ["free(p);", "free(p, 5);", "free(5 * sizeof(int));"]
          certa: [[0]]
          certa_texto: "free(p);"
          invalidas: [1, 2]
          erros:
            - exata: [1]
              retorno: "free recebe uma coisa só: com dois valores o compilador reclama. O tamanho não se diz, porque o alocador anotou: free(p);"
            - exata: [2]
              retorno: "Essa conta é um tamanho, e free recebe um endereço: o compilador reclama. O endereço do bloco está em p: free(p);"
          retorno_geral: "free recebe o endereço do bloco, e só: free(p);"
        - pede: "Qual destas linhas devolve o bloco de q?"
          antes: |-
            int *q;

            q = malloc(8 * sizeof(int));
          pecas: ["free(8 * sizeof(int));", "free(q, 8);", "free(q);"]
          certa: [[2]]
          certa_texto: "free(q);"
          invalidas: [0, 1]
          erros:
            - exata: [1]
              retorno: "free recebe uma coisa só: com dois valores o compilador reclama. O tamanho não se diz, porque o alocador anotou: free(q);"
            - exata: [0]
              retorno: "Essa conta é um tamanho, e free recebe um endereço: o compilador reclama. O endereço do bloco está em q: free(q);"
          retorno_geral: "free recebe o endereço do bloco, e só: free(q);"

B2:
  revisao:
    frases:
      - "free é uma função como as outras: em free(p) o que entra é uma cópia do valor de p."
      - "A variável p fica com quem chamou. A função não tem como escrever nela."
    codigo: |
      void esvazia(int *x) { x = NULL; }

      int *p;

      p = malloc(sizeof(int));
      *p = 7;
      esvazia(p);
      printf("%d\n", *p);
      free(p);
    saida: "7"
  cena:
    atores:
      - {nome: esvazia, tipo: bancada, de: void esvazia(int *x)}
      - {nome: x, tipo: ponteiro, de: int *}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
    passos:
      - {linha: 3, faz: [{cria: p}]}
      - {linha: 5, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 6, faz: [{segue: p}, {guarda: {em: bloco, valor: 7}}]}
      - {linha: 7, faz: [{le: p}, {chama: esvazia}, {cria: x}, {aponta: {de: x, para: bloco}}]}
      - {linha: 1, faz: [{nulo: x}]}
      - {linha: 7, faz: [{volta: esvazia}, {diz: 'p continua com o endereço do bloco: esvazia mudou a cópia'}]}
      - {linha: 8, faz: [{segue: p}, {le: bloco}, {mostra: '7'}]}
      - {linha: 9, faz: [{devolve: bloco}]}
  # Ponteiro para ponteiro, que é o tópico seguinte.
  fora_da_trilha: [ciu_kc09_006, ciu_kc09_t06]
  provas:
    - crenca: function_gets_original
      programa: |
        void esvazia(int *x) { x = NULL; }

        int *p;

        p = malloc(sizeof(int));
        esvazia(p);
        printf("%d\n", p == NULL);
        free(p);
      previsao:
        pergunta: >
          A função escreve NULL no parâmetro dela. Depois da chamada, o
          trecho pergunta se p vale NULL. O que aparece?
        opcoes:
          - "1: a função recebeu o próprio p, e o apagou"
          - "0"
        real: 1
        crenca: 0
      espera: "0"
      afirma: >
        Saiu 0. A função recebeu uma cópia do endereço e escreveu NULL na
        cópia. O p de quem chamou é outra variável, e continua com o
        endereço do bloco. Com free(p) é igual: entra uma cópia.
  degraus:
    - id: esc_kc09_B2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "free é uma função como as outras: na chamada, o que entra nela é uma cópia do valor do argumento."
        - "O valor de p é um endereço. A variável p fica com quem chamou."
      versoes:
        - pede: "Na última linha, o que entra na função free?"
          antes: |-
            int *p;

            p = malloc(sizeof(int));
            free(p);
          pecas:
            - "Uma cópia do endereço que está em p"
            - "A própria variável p: a função recebe a original, e não uma cópia"
            - "O bloco inteiro"
          certa: [[0]]
          certa_texto: "Uma cópia do endereço que está em p"
          erros:
            - exata: [1]
              crenca: function_gets_original
              retorno: "Em C toda chamada copia, e free não é exceção. O que entra nela é uma cópia do endereço guardado em p; a variável p fica com quem chamou."
            - exata: [2]
              retorno: "O bloco fica no monte, onde estava. O que viaja na chamada é um endereço: uma cópia do que está em p."
          retorno_geral: "Em free(p) entra uma cópia do endereço que está em p."
        - pede: "Na última linha, o que entra na função free?"
          antes: |-
            int *q;

            q = malloc(sizeof(int));
            free(q);
          pecas:
            - "O bloco inteiro"
            - "Uma cópia do endereço que está em q"
            - "A própria variável q: a função recebe a original, e não uma cópia"
          certa: [[1]]
          certa_texto: "Uma cópia do endereço que está em q"
          erros:
            - exata: [2]
              crenca: function_gets_original
              retorno: "Em C toda chamada copia, e free não é exceção. O que entra nela é uma cópia do endereço guardado em q; a variável q fica com quem chamou."
            - exata: [0]
              retorno: "O bloco fica no monte, onde estava. O que viaja na chamada é um endereço: uma cópia do que está em q."
          retorno_geral: "Em free(q) entra uma cópia do endereço que está em q."

    - id: esc_kc09_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "A cópia do endereço leva ao mesmo bloco: é por ela que a função chega lá."
        - "Mas apagar a cópia, x = NULL;, não mexe no p de quem chamou."
      versoes:
        - pede: "A função escreve 9 no bloco e depois apaga o parâmetro dela. Que número aparece?"
          mostra: |-
            void marca(int *x) { *x = 9; x = NULL; }

            int *p;

            p = malloc(sizeof(int));
            *p = 7;
            marca(p);
            printf("%d\n", *p);
            free(p);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "A função recebeu uma cópia do endereço, e por ela chegou ao bloco: o 9 foi escrito lá."
            - texto: "0"
              retorno: "x = NULL; apagou só a cópia. O p de quem chamou continua com o endereço do bloco, que agora guarda 9."
          retorno_geral: "O 9 chegou ao bloco pela cópia do endereço. Apagar a cópia não mexeu em p."
        - pede: "A função escreve 20 no bloco e depois apaga o parâmetro dela. Que número aparece?"
          mostra: |-
            void marca(int *x) { *x = 20; x = NULL; }

            int *q;

            q = malloc(sizeof(int));
            *q = 15;
            marca(q);
            printf("%d\n", *q);
            free(q);
          aceitas: ["20"]
          certa_texto: "20"
          erros:
            - texto: "15"
              retorno: "A função recebeu uma cópia do endereço, e por ela chegou ao bloco: o 20 foi escrito lá."
            - texto: "0"
              retorno: "x = NULL; apagou só a cópia. O q de quem chamou continua com o endereço do bloco, que agora guarda 20."
          retorno_geral: "O 20 chegou ao bloco pela cópia do endereço. Apagar a cópia não mexeu em q."

    - id: esc_kc09_B2_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "free recebe uma cópia do endereço guardado em p, como toda função recebe cópias."
        - "Com a cópia do endereço ela chega ao bloco; o p de quem chamou é outra caixa."
      versoes:
        - pede: "O que free consegue fazer com a cópia que recebeu?"
          antes: |-
            int *p;

            p = malloc(sizeof(int));
            free(p);
          pecas:
            - "Achar o bloco e devolvê-lo"
            - "Mudar o que está guardado em p"
            - "Apagar a variável p"
          certa: [[0]]
          certa_texto: "Achar o bloco e devolvê-lo"
          erros:
            - exata: [1]
              retorno: "free recebeu uma cópia do endereço, e não a variável p. Com a cópia ela acha o bloco; em p, ela não escreve."
            - exata: [2]
              retorno: "A variável p é de quem chamou, e free nem sabe onde ela fica: recebeu só uma cópia do endereço. Com ela, acha o bloco e o devolve."
          retorno_geral: "Com a cópia do endereço, free acha o bloco e o devolve. Em p ela não toca."
        - pede: "O que free consegue fazer com a cópia que recebeu?"
          antes: |-
            int *q;

            q = malloc(sizeof(int));
