          antes: |-
            int *p;

            p = malloc(sizeof(int));
            free(p);
          pecas:
            - "Continua onde estava: é uma variável de quem chamou"
            - "Vai junto: o ponteiro mora no monte, dentro do bloco que aponta"
            - "Passa a ser da função free"
          certa: [[0]]
          certa_texto: "Continua onde estava: é uma variável de quem chamou"
          erros:
            - exata: [1]
              crenca: pointer_lives_in_heap
              retorno: "Apontar para o monte não é morar nele. A caixa de p foi declarada como qualquer variável, e fica onde estava; o que voltou ao alocador foi só o bloco."
            - exata: [2]
              retorno: "free recebeu uma cópia do endereço, e não a caixa. A caixa de p continua sendo de quem a declarou."
          retorno_geral: "O bloco voltou ao alocador. A caixa de p continua onde foi declarada."
