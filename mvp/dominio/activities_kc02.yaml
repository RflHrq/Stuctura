testes_de_mesa:

  B1:
    colunas: ["idade", "&idade", "outra", "&outra"]
    linhas:
      - codigo: "int idade = 20;"
        valores: ["20", "0000009B22FFF84C", "", ""]
      - codigo: "int outra = 7;"
        valores: ["20", "0000009B22FFF84C", "7", "0000009B22FFF848"]

  B2:
    colunas: ["x", "&x", "p", "&p"]
    linhas:
      - codigo: "int x = 42;"
        valores: ["42", "000000411EFFFD0C", "", ""]
      - codigo: "int *p = &x;"
        valores: ["42", "000000411EFFFD0C", "000000411EFFFD0C", "000000411EFFFD00"]

  B3:
    colunas: ["x", "&x", "p", "&p"]
    linhas:
      - codigo: "int x = 42;"
        valores: ["42", "0000008D467FFA5C", "", ""]
      - codigo: "int *p = &x;"
        valores: ["42", "0000008D467FFA5C", "0000008D467FFA5C", "0000008D467FFA50"]
      - codigo: "*p = 7;"
        valores: ["7", "0000008D467FFA5C", "0000008D467FFA5C", "0000008D467FFA50"]

  I1:
    colunas: ["x", "&x", "y", "&y", "p", "&p"]
    linhas:
      - codigo: "int x = 42, y = 7;"
        valores: ["42", "0000009D597FFCAC", "7", "0000009D597FFCA8", "", ""]
      - codigo: "int *p = &x;"
        valores: ["42", "0000009D597FFCAC", "7", "0000009D597FFCA8", "0000009D597FFCAC", "0000009D597FFCA0"]
      - codigo: "p = &y;"
