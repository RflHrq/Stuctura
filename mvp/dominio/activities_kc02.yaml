  # ------------------------------------------------------------------
  # I3 — guardar um endereço permite alcançar a mesma caixa de longe
  # crença do nó: pointer_is_pointless
  # ------------------------------------------------------------------

  - id: ciu_kc02_016
    node: kc02:I3
    formato: reconhecer_conceito
    tipo: teorica
    enunciado: "Para que serve passar o endereço de uma variável para uma função?"
    alternativas:
      a: "Para a função chegar à variável original, e não a uma cópia dela"
      b: "Para nada que uma variável comum não resolva: é o jeito difícil"
      c: "Para a função guardar o valor com mais segurança"
    gabarito: a
    crencas:
      b: pointer_is_pointless
      c: pointer_is_data

  - id: ciu_kc02_017
    node: kc02:I3
    formato: comparar_casos
    tipo: codigo
    codigo: |
      void a(int  v) { v = 99; }
      void b(int *v) { *v = 99; }

      int n = 1;
      a(n);   printf("%d\n", n);
      b(&n);  printf("%d\n", n);
    enunciado: "O que as duas impressões mostram?"
    alternativas:
      a: "1 e depois 99: só b alcançou o n de fora"
      b: "99 e 99: as duas mudam n, só muda o jeito de escrever"
      c: "1 e 1: função nenhuma consegue mudar uma variável de fora"
    gabarito: a
    crencas:
      b: pointer_is_pointless
      c: pointer_is_pointless

  - id: ciu_kc02_018
    node: kc02:I3
    formato: prever_saida
    tipo: codigo
    codigo: |
      void zera(int *v) { *v = 0; }

      int n = 7;
      zera(&n);
      printf("%d\n", n);
    enunciado: "O que sai?"
    alternativas:
      a: "0 — zera recebeu o endereço de n e escreveu no lugar certo"
      b: "7 — a função trabalhou numa cópia e a cópia morreu no fim"
      c: "0, mas só porque n é global"
    gabarito: a
    crencas:
      b: pointer_is_pointless
      c: pointer_has_no_address

  - id: ciu_kc02_t16
    node: kc02:I3
    uso: treino
    formato: reconhecer_conceito
    tipo: teorica
    enunciado: >
      Uma função precisa devolver dois resultados. Como o endereço ajuda?
    alternativas:
      a: "Quem chama passa o endereço de duas variáveis, e a função escreve nelas"
      b: "Não ajuda: para devolver dois resultados só mudando de linguagem"
      c: "A função guarda os dois dentro de um ponteiro só"
    gabarito: a
    crencas:
      b: pointer_is_pointless
      c: pointer_is_data

  - id: ciu_kc02_t17
    node: kc02:I3
    uso: treino
    formato: prever_saida
    tipo: codigo
    codigo: |
      void troca(int *a, int *b) {
          int t = *a; *a = *b; *b = t;
      }

      int x = 1, y = 2;
      troca(&x, &y);
      printf("%d %d\n", x, y);
    enunciado: "O que sai?"
    alternativas:
      a: "2 1 — a função chegou às duas variáveis originais"
      b: "1 2 — trocar dentro da função não muda nada fora"
      c: "2 1, e x e y agora são a mesma variável"
    gabarito: a
    crencas:
      b: pointer_is_pointless
      c: pointer_and_target_are_one

  - id: ciu_kc02_t18
    node: kc02:I3
    uso: treino
    formato: achar_o_erro
    tipo: codigo
    codigo: |
      void zera(int v) { v = 0; }

      int n = 7;
      zera(n);
    enunciado: "Depois disso n continua 7. Por quê?"
    alternativas:
      a: "zera recebeu uma cópia do valor; sem o endereço não dá para alcançar n"
      b: "Porque faltou chamar zera uma segunda vez, depois da primeira"
      c: "Não continua: n vira 0, a função mexeu na variável"
    gabarito: a
    crencas:
      c: pointer_is_pointless

