      printf("%d\n", x);
    enunciado: "As duas linhas imprimem coisas diferentes. O que a primeira mostra?"
    alternativas:
      a: "O lugar da memória onde x está guardado"
      b: "42, igual à segunda: o endereço de x é o conteúdo dele"
      c: "O nome x convertido em número"
    gabarito: a
    crencas:
