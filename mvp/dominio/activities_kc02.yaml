  # ------------------------------------------------------------------

  - id: ciu_kc02_001
    node: kc02:B1
    formato: reconhecer_conceito
    tipo: teorica
    enunciado: "O que é o endereço de uma variável?"
    alternativas:
      a: "O número do lugar da memória onde ela está"
      b: "O nome dela — é por ele que o programa a encontra enquanto roda"
      c: "O valor que está guardado dentro dela"
    gabarito: a
    crencas:
      b: memory_is_by_name
      c: pointer_is_data

