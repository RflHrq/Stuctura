# Banco de atividades — kc_02, "o que é um ponteiro"
#
# TRÊS de diagnóstico e TRÊS de treino por nó, contra as 2+2 do kc_00. A
# revisão final mediu o custo do banco pequeno: com dois itens de
# diagnóstico, uma razão que aponta o vizinho gasta os dois e o nó termina
# `desconhecido` — aconteceu em 9 de 30 sessões.
#
# REGRA DE DISTRATOR, que vem de `motor.razoes_de`: as razões da camada 2
# são montadas DAS ALTERNATIVAS DO PRÓPRIO ITEM. Um item cujos distratores
# não apontam crença nenhuma deixa a camada 2 com uma opção só, e a
# camada 2 é onde o diagnóstico mora.
#
# Por isso, em todo item de diagnóstico:
#   - um distrator aponta a crença DO PRÓPRIO NÓ (para o nó poder receber
#     atribuição e não morrer de fome, que foi o defeito do kc_00);
#   - outro aponta a crença de um VIZINHO (a atribuição cruzada da CS-2,
#     que é desenho, não acidente).
#
# Nos itens de TREINO a camada 2 não roda (`_resolve_treino` só olha
# certo/errado), mas o distrator com a crença do nó continua: é dele que
# sai `crenca_em_jogo`, que o reteste lê.
#
# Três alternativas, não duas: 13 dos 20 itens do kc_00 são binários, e
# dois terços do banco em cara ou coroa é a fraqueza mais barata de
# corrigir que existe.

# A METÁFORA DO TÓPICO: a rua de casas numeradas.
#
# Declarada aqui e declarada onde quebra, como manda docs/linguagem.md.
analogy: >
  Rua de casas numeradas. Cada lugar da memória é uma casa: tem um número
  na porta, que é o endereço, e alguma coisa dentro, que é o valor. Um
  ponteiro é uma casa como as outras — e o que está guardado dentro dela é
  o número de outra casa, escrito num papel.
  ONDE QUEBRA: números de casa andam de um em um, endereços andam do
  tamanho do objeto (isso é kc_11, e aqui a metáfora cala). E a casa que
  guarda o papel não deixa de ser casa — é por isso que nunca se diz que
  o ponteiro É a seta: seta não tem número na porta, e aí &p perde o
  sentido.

# A analogia de resgate de CADA nó. É ela que aparece no passo de
# validação — o resumo acima mapeia os seis de uma vez e entregaria a
# resposta dos itens que ainda não foram feitos.
resgates:

  B1: >
    Numa rua, o que identifica uma casa é o número na porta, não quem mora
    nela nem o que tem na sala. Duas casas podem ter sofás iguais e
    continuam sendo duas casas, com dois números. Na memória é igual: o
    endereço é o número do lugar, e não tem nada a ver com o valor que
    está guardado ali.

  B2: >
    O papel com o número da casa 1000 escrito nele está em algum lugar —
    em cima de uma mesa, dentro de outra casa, que também tem número na
    porta. O papel não flutua. Um ponteiro é essa casa: ela guarda um
    número, e ela mesma tem o seu.

  B3: >
    Quando você abre o papel que está dentro da casa 2A00, não encontra o
    sofá da outra casa: encontra o número dela. O que está guardado num
    ponteiro é o endereço, não o conteúdo do destino — para ver o
    conteúdo é preciso ir até lá.

  I1: >
    A casa do papel e a casa do número escrito nele são duas casas, em
    dois pontos da rua. Rasgar o papel e escrever outro número não derruba
    nenhuma parede da outra casa; trocar o sofá da outra casa não muda o
    que está escrito no papel.

  I2: >
    O número 1000 numa conta de luz e o número 1000 numa porta de rua são
    o mesmo rabisco e não são a mesma coisa: um você soma, o outro você
    usa para chegar a um lugar. Quem sabe qual é qual não é o papel: é
    quem lê. No programa, quem lê é o compilador, pela declaração.

  I3: >
    Para um vizinho regar a sua planta, você não manda a planta para a
    casa dele: manda o número da sua casa. Com o endereço na mão ele chega
    à mesma planta — a sua, não uma cópia. É para isso que o endereço
    serve.

# O código que acompanha cada premissa na tela de ENSINO. A frase sozinha
# fica abstrata para quem nunca escreveu um ponteiro; o exemplo ancora.
exemplos:

  B1: |
    int idade = 20;
    int outra = 7;
    printf("%d\n", idade);            /* o que tem nele */
    printf("%d\n", &idade == &outra); /* 0: lugares diferentes */

  B2: |
    int x = 42;
    int *p = &x;

  B3: |
    int x = 42;
    int *p = &x;
    printf("%d\n", *p);          /* 42: o conteudo que mora la */
    *p = 7;                      /* escreve no lugar apontado */
    printf("%d\n", x);           /* 7: mudou sem nomear x */

  I1: |
    int x = 42, y = 7;
    int *p = &x;
    p = &y;        /* muda p  */
    *p = 99;       /* muda y  */

  # primeiro nao e ensinado em lugar nenhum da programacao, e o segundo
  # e aritmetica de ponteiro, que o cabecalho deste grafo manda calar
  # porque e kc_11. Uma segunda versao usou %zu e caiu no mesmo
  # defeito: construto obscuro aparecendo sem explicacao.
  #
  # Agora a pergunta e feita com ==, que devolve 0 ou 1 e imprime com
  # %d -- o que o exemplo do B1 ja faz, e cuja leitura a ampliacao do B1
  # ja ensina ("1 quer dizer mesmo lugar, 0 quer dizer lugares
  # diferentes"). Conferido: compila limpo ate com -pedantic, sai 0 e 1.
  I2: |
    int  x = 42;   int  *p = &x;
    char c = 'a';  char *q = &c;
    printf("%d\n", sizeof(*p) == sizeof(*q));  /* 0: nao sao do mesmo tamanho */
    printf("%d\n", sizeof(*p) == sizeof(x));   /* 1: no fim de p mora um int  */

  I3: |
    void dobra(int *q) { *q = *q * 2; }

    int n = 10;
    dobra(&n);     /* n agora e 20 */

# ---------------------------------------------------------------------
# O MATERIAL DE ENSINO PROFUNDO, aplicado dos candidatos de 08/11/2026.
#
# A MEDICAO QUE PEDIU ISTO: a unidade do kc_02 oferecia 811 palavras de
# ensino para seis premissas sobre ponteiros, e a refutacao, que e o
# mecanismo da tese, tinha 24 palavras por tela. O dono usou o sistema
# e disse que nao conseguia aprender. Com estes tres campos sao 3.465.
#
# SAO LISTAS DE BLOCOS porque `_paragrafos` preserva linha em branco e
# COLA o resto: o material escrito como prosa com codigo no meio saia
# com os printf grudados numa linha so.
#
# SEM CRASE na prosa: o cliente escreve com textContent, e crase no
# YAML vira crase na cara da pessoa. A primeira aplicacao trouxe 58, e
# foi um teste que ja existia que as pegou.
#
# A revisao esta em candidatos/kc_02/REVISAO-kc02.md.
# ---------------------------------------------------------------------

narracoes:

  I2:
    - linha: "int x = 42;"
      diz: >
        Uma caixa com 42 dentro, como sempre.
    - linha: "int *p = &x;"
      diz: >
        p guarda o endereço de x. E a declaração registra, no
        compilador, que o que mora nesse endereço é um int.
    - linha: "printf(\"%p\\n\", (void *)(p + 1));"
      diz: >
        Sai um endereço maior que o de x. O quanto maior depende do
        tipo declarado, não do número guardado — e esse "quanto" é
        assunto de outro tópico. Aqui basta: o tipo entra na conta.

  I3:
    - linha: "void dobra(int *q) { *q = *q * 2; }"
      diz: >
        A função recebe um endereço, não um número. Dentro dela, q é
        uma caixa nova com uma cópia desse endereço — e *q vai até a
        caixa original para ler e escrever.
    - linha: "int n = 10;"
      diz: >
        Uma caixa com 10 dentro, na função que chama.
    - linha: "dobra(&n);"
      diz: >
        Passa o ENDEREÇO de n, não o 10. A cópia que chega lá dentro
        aponta para a mesma caixa, e por isso o que a função escreve
        chega aqui.
    - linha: "/* n agora é 20 */"
      diz: >
        Confirmado pela máquina. Com a assinatura dobra(int v) e a
        chamada dobra(n), n continua 10 — a função teria mexido numa
        cópia.

casos_resolvidos:

  B1:
    - prosa: >
        Vamos resolver um junto.
    - codigo: |
        int a = 20;
        int b = 20;
    - prosa: >
        As duas guardam o mesmo valor. Pergunta: &a == &b dá 1 ou 0?
    - prosa: >
        A tentação é responder 1 — os valores são iguais, então "é a
        mesma coisa". Siga a declaração em vez do valor. São duas
        declarações, e cada declaração reserva um lugar. Dois
        lugares.
    - prosa: >
        O endereço é o número do lugar, não o que está guardado
        nele. Dois lugares diferentes têm números diferentes, mesmo
        com o mesmo 20 dentro. Então sai 0.
    - prosa: >
        A máquina confirma:
    - saida: |
        a=20 b=20   &a==&b -> 0
        &a=...FE4C  &b=...FE48
    - prosa: >
        Os dois números terminam diferentes, e a diferença entre
        eles é 4 — o tamanho de um int. Duas caixas, lado a lado.

  B2:
    - prosa: >
        Vamos resolver um junto, do começo ao fim.
    - codigo: |
        int x = 42;
        int *p = &x;
    - prosa: >
        Pergunta: depois dessas duas linhas, quantas caixas existem,
        e o que tem dentro de cada uma?
    - prosa: >
        Comece contando as declarações. São duas, x e p. Toda
        declaração reserva uma caixa — então são duas caixas, não
        uma.
    - prosa: >
        Agora veja o que entra em cada uma. Em x entra 42. Em p
        entra &x, que é o número do lugar de x. Fica assim:
    - saida: |
        caixa x   num lugar, digamos 0x1000   dentro: 42
        caixa p   em outro, digamos 0x2A00    dentro: 0x1000
    - prosa: >
        Repare no que a segunda linha NÃO fez. Ela não mudou x. Ela
        não criou um apelido para x. E ela não deixou p sem lugar: p
        é uma caixa nova, preenchida com um número — e esse número
        por acaso é o endereço de outra caixa.
    - prosa: >
        Se alguém perguntar "onde fica p?", a resposta é 0x2A00. A
        pergunta tem resposta, e é isso que esta premissa afirma.

  B3:
    - prosa: >
        Vamos resolver um junto.
    - codigo: |
        int x = 42;
        int *p = &x;
    - prosa: >
        Pergunta: qual a diferença entre imprimir p e imprimir *p?
    - prosa: >
        Comece pelo que está guardado. Dentro de p está o endereço
        de x — digamos 0x1000. Esse é o conteúdo da caixa p, do
        mesmo jeito que 42 é o conteúdo da caixa x.
    - saida: |
        p    é o conteúdo de p      -> 0x1000, um endereço
        *p   é o conteúdo do lugar  -> 42, o que mora em 0x1000
             cujo número está em p
    - prosa: >
        O asterisco é a viagem. Sem ele você fica na caixa p e lê o
        número que está nela; com ele você usa esse número para
        chegar a outra caixa e lê o que está lá.
    - prosa: >
        É por isso que *p = 7; muda x. A linha não nomeia x em lugar
        nenhum — ela diz "vá ao lugar cujo número está em p, e
        escreva 7 ali". E o número que está em p é justamente o
        lugar de x. A máquina confirma: depois dessa linha, x vale
        7.

  I1:
    - prosa: >
        Vamos resolver um junto, contando as caixas antes de
        responder.
    - codigo: |
        int a = 42, b = 7;
        int *q = &a;
        q = &b;
        *q = 99;
    - prosa: >
        Pergunta: no fim, quanto valem a e b?
    - prosa: >
        Primeiro, quantas caixas? Três declarações, três caixas: a,
        b e q.
    - prosa: >
        Agora linha por linha, anotando só o que MUDA:
    - saida: |
        int *q = &a;   q passa a guardar o endereço de a
        q = &b;        q passa a guardar o endereço de b
                       (a não foi tocado: continua 42)
        *q = 99;       vai ao lugar guardado em q, que é o de b,
                       e escreve 99 lá
    - prosa: >
        Então a continua 42 e b vira 99. A máquina confirma: a -> 42
        e b -> 99.
    - prosa: >
        O erro comum é esperar que a terceira linha, ao "desligar" q
        de a, mexesse em a. Ela não mexe, e o motivo é esta
        premissa: q e a são duas caixas. Apagar o que está escrito
        num papel não derruba parede nenhuma.

  I2:
    - prosa: >
        Vamos resolver um junto, e este é o caso que mais convence.
    - codigo: |
        int x = 42;
        int *p = x;
    - prosa: >
        Pergunta: o compilador aceita isso?
    - prosa: >
        A tentação é dizer que sim. Se um endereço é um número, e 42
        é um número, por que não? Pergunte a ele:
    - saida: |
        initialization of 'int *' from 'int' makes pointer
        from integer without a cast [-Wint-conversion]
    - prosa: >
        Ele reclama. Repare no que a frase dele diz: não que o
        número esteja errado, e sim que ponteiro e inteiro são tipos
        diferentes e que ele não vai fingir que não são. Dependendo
        da versão do compilador isso vem como erro, e aí nem
        executável existe, ou como aviso, e aí o programa compila
        mesmo assim. A reclamação é a mesma.
    - prosa: >
        Agora troque por int *p = &x; e ele fica quieto. A diferença
        não está no número — o endereço de x também é um número.
        Está em o compilador saber, pela declaração, o que cada
        coisa é.

  I3:
    - prosa: >
        Vamos resolver um junto, com as duas versões lado a lado.
    - codigo: |
        void dobra_valor(int v)  { v = v * 2; }
        void dobra(int *q)       { *q = *q * 2; }

        int m = 10;   dobra_valor(m);
        int n = 10;   dobra(&n);
    - prosa: >
        Pergunta: quanto valem m e n no fim?
    - prosa: >
        Comece pela primeira. dobra_valor(m) entrega o VALOR 10. Lá
        dentro, v é uma caixa nova com 10. A linha v = v * 2 põe 20
        nessa caixa nova. A função termina, a caixa v some, e m
        nunca foi tocado. m = 10.
    - prosa: >
        Agora a segunda. dobra(&n) entrega o ENDEREÇO de n. Lá
        dentro, q é uma caixa nova com uma cópia desse endereço. A
        linha *q = *q * 2 não escreve em q: usa o endereço que está
        em q para chegar à caixa de n e escrever lá. n = 20.
    - prosa: >
        A máquina confirma: m -> 10 e n -> 20.
    - prosa: >
        Repare no que as duas têm em comum: as duas receberam uma
        cópia. A diferença é do que era a cópia. Cópia de um valor é
        um valor novo; cópia de um endereço aponta para a mesma
        caixa de antes.

outras_rotas:

  B1:
    - prosa: >
        Outro caminho, agora sem analogia. Pegue duas variáveis com
        o MESMO valor e pergunte duas coisas à máquina:
    - codigo: |
        int a = 20, b = 20;
        printf("%d\n", a == b);     /* os valores */
        printf("%d\n", &a == &b);   /* os lugares */
    - prosa: >
        A primeira linha sai 1: os valores são iguais. A segunda sai
        0: os lugares não são.
    - prosa: >
        Se o endereço fosse o valor, as duas sairiam iguais. Se o
        endereço fosse o nome, a pergunta nem faria sentido — não dá
        para comparar dois nomes com ==. Ele é uma terceira coisa: o
        número do lugar.

  B2:
    - prosa: >
        Outro caminho para a mesma ideia, agora sem analogia
        nenhuma. Peça os três números à máquina:
    - codigo: |
        int x = 42;
        int *p = &x;
        printf("%p\n",  (void *)&x);   /* onde x mora    */
        printf("%p\n",  (void *)&p);   /* onde p mora    */
        printf("%zu\n", sizeof(p));    /* quanto p ocupa */
    - prosa: >
        Os dois primeiros saem diferentes, e isso já responde a
        pergunta: se p não ocupasse lugar nenhum, &p não teria o que
        imprimir. O terceiro sai 8 — espaço ocupado, medido pelo
        compilador.
    - prosa: >
        Uma seta desenhada no quadro não tem endereço nem tamanho. A
        caixa p tem os dois, e a máquina diz quais são.

  B3:
    - prosa: >
        Outro caminho, pela pergunta ao contrário: o que teria de
        ser verdade para *p sair o mesmo que p?
    - codigo: |
        int x = 42;
        int *p = &x;
        printf("%p\n", (void *)p);   /* um endereço */
        printf("%d\n", *p);          /* 42          */
    - prosa: >
        As duas linhas leem a MESMA caixa p, e saem coisas
        diferentes. Isso só é possível porque a segunda não para em
        p: ela usa o que está dentro de p como um caminho e vai
        adiante.
    - prosa: >
        Se o que estivesse dentro de p fosse o próprio 42, não
        haveria para onde ir, e as duas linhas sairiam iguais. Saem
        diferentes. Então o que está dentro é endereço, não dado.

  I1:
    - prosa: >
        Outro caminho: conte os endereços em vez de seguir a
        história.
    - codigo: |
        int a = 42, b = 7;
        int *q = &a;
        printf("%d\n", &a == &b);   /* 0 */
        printf("%d\n", &a == &q);   /* 0 */
    - prosa: >
        Três perguntas, três números de lugar, e nenhum igual ao
        outro. Se o ponteiro e a caixa apontada fossem a mesma
        coisa, &a == &q daria 1 — e dá 0.
    - prosa: >
        É a mesma conta do B2 e do B3, agora as duas de uma vez: p
        tem lugar (B2), dentro de p mora um endereço (B3), e um
        endereço é de OUTRO lugar. Duas caixas.

  I2:
    - prosa: >
        Outro caminho, e este não precisa de conta nenhuma. Pegue
        dois ponteiros que guardam, os dois, um endereço:
    - codigo: |
        int  x = 42;   int  *p = &x;
        char c = 'a';  char *q = &c;
        p = q;
    - prosa: >
        Se ponteiro fosse só um número, a última linha seria copiar
        um número para outro lugar — a coisa mais simples do mundo.
        O compilador reclama:
    - saida: |
        assignment to 'int *' from incompatible pointer type 'char *'
    - prosa: >
        Os dois guardam endereço. Os dois são números. E ainda assim
        ele recusa trocar um pelo outro, porque para ele não são a
        mesma espécie de coisa. Isso é o tipo, e ele não está no
        número: está na declaração que você escreveu.

  I3:
    - prosa: >
        Outro caminho: tente fazer sem ponteiro e veja onde trava.
    - prosa: >
        Você quer uma função que troque duas variáveis de lugar. Com
        valores, a função recebe cópias, troca as cópias, e as suas
        duas variáveis continuam exatamente como estavam — não
        existe jeito de consertar isso de dentro da função, porque o
        nome das suas variáveis não existe lá.
    - prosa: >
        Com endereços, a função recebe os dois lugares e vai até
        eles. Não é um estilo diferente de escrever a mesma coisa: é
        a diferença entre conseguir e não conseguir.
    - prosa: >
        O mesmo aparece quando a função precisa devolver dois
        resultados. return devolve um. Com um endereço recebido, ela
        escreve o segundo direto na caixa de quem chamou.


