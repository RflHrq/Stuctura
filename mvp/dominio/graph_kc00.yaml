topic: kc_00

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "Uma variavel e um espaco de memoria com nome e tipo."
    plain_text: >
      Toda variavel tem um nome e um tipo — o tipo diz que especie de
      valor cabe ali.
    negated_by:
      - type_is_a_hint

  B2:
    type: observavel
    role: espinha
    support: []
    text: "Declarar ja reserva o espaco, antes de qualquer valor entrar."
    plain_text: >
      Quando voce escreve int x;, a caixa de x ja existe — so o que tem
      dentro ainda nao esta definido.
    negated_by:
      - no_value_no_memory

  B3:
    type: observavel
    role: espinha
    support: []
    text: "Variavel local declarada sem valor tem conteudo indeterminado, nao zero."
    plain_text: >
      C nao limpa a caixa para voce. O que estava la antes continua la
      ate voce escrever algo.
    negated_by:
      - declaration_zeroes

  B4:
    type: observavel
    role: espinha
    support: []
    text: "Atribuir um valor novo substitui o anterior; cabe um valor de cada vez."
    plain_text: >
      Escrever um valor novo apaga o antigo. A caixa nunca guarda dois
      valores ao mesmo tempo.
    negated_by:
      - variable_remembers

  I1:
    type: inferencia
    role: conclusao
    support: [B1, B2, B3, B4]
    text: >
      Inicializar e declarar-depois-atribuir chegam ao mesmo lugar: uma
      variavel com espaco reservado e valor conhecido.
    plain_text: >
      No fim das contas, dar o valor na hora de declarar ou declarar e
      so depois atribuir chegam no mesmo lugar: uma variavel pronta.
    negated_by:
      - assignment_symmetric
