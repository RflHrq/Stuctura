topic: kc_00

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "Uma variavel e um espaco de memoria com nome e tipo."
    plain_text: >
      Toda variavel tem um nome e um tipo — o tipo diz que especie de
      valor cabe ali.
    negated_by:
      - type_is_a_hint

    # A EVIDENCIA DO kc_00, 12/11/2026. O `afirma` e TEXTO DE TELA:
    # `_prova` o manda inteiro ao cliente, que o escreve com textContent.
    # Por isso ele e curto e diz uma coisa so -- o que aquele programa
    # prova. O resto fica nestes comentarios.
    #
    # NENHUM PROGRAMA DESTE TOPICO USA PONTEIRO, e nao e por causa do
    # portao: `conceitos.construtos_de` nao enxerga ponteiro. E porque
    # este e o PRIMEIRO topico, e mostrar `int *p` a quem esta na
    # declaracao de variaveis repetiria o defeito que o portao existe
    # para evitar -- so que sem ninguem para barrar.
    evidencia:
      - afirma: >
          O nome chega sempre ao mesmo espaço, e o tipo decide o que
          cabe nele: o mesmo 2.9 vira 2 num int e continua 2.9 num
          double.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int n;
              int cortado = 2.9;
              double inteiro = 2.9;

              n = 7;
              puts(n == 7 ? "o nome n leva ao mesmo espaco: guardou 7, devolveu 7"
                          : "FALHOU");
              puts(cortado == 2 ? "e o tipo decide o que cabe: 2.9 virou 2 no int"
                                : "FALHOU");
              puts(inteiro > 2.8 ? "o mesmo 2.9 no double continua com a fracao"
                                 : "FALHOU");
              return 0;
          }
        espera: |-
          o nome n leva ao mesmo espaco: guardou 7, devolveu 7
          e o tipo decide o que cabe: 2.9 virou 2 no int
          o mesmo 2.9 no double continua com a fracao
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Declarar uma variável cria um espaço na memória e lhe dá duas
      coisas: um nome e um tipo. O nome é por onde você chega lá — escreva
      o nome e você está falando daquele espaço, sempre do mesmo. O tipo é
      o que decide que espécie de valor cabe ali, e quanto espaço é
      preciso para guardá-lo.


      O nome não é lembrete seu. Ele é o endereço pelo qual o programa
      encontra o espaço: duas variáveis com nomes diferentes são dois
      espaços diferentes, e mexer em uma não mexe na outra. Escrever no
      mesmo nome duas vezes é escrever no mesmo lugar duas vezes.


      E o tipo não é aviso ao compilador: é parte do que a variável é. Um
      valor que não cabe no tipo não entra como estava — ele é convertido,
      e pode chegar diferente do que saiu. Guardar um número com fração
      num tipo que só guarda inteiros perde a fração, e o programa segue
      com o que sobrou.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "Declarar ja reserva o espaco, antes de qualquer valor entrar."
    plain_text: >
      Quando voce escreve int x;, a caixa de x ja existe — so o que tem
      dentro ainda nao esta definido.
    negated_by:
      - no_value_no_memory

    # DUAS DEMONSTRACOES, e a primeira esta BARRADA pelo portao: `sizeof`
    # tem cartao, mas no kc_02, e disponibilidade no inventario e condicao
    # necessaria, nao suficiente. Ela continua valendo como evidencia.
    #
    # `sizeof x` NAO LE A VARIAVEL: o operando nao e avaliado, entao nao
    # ha leitura de valor indeterminado aqui.
    #
    # A SEGUNDA CHEGA A TELA, e ataca a mesma premissa pela recusa: se a
    # variavel so passasse a existir quando um valor entra, usar o nome
    # antes da declaracao seria aceito.
    evidencia:
      - afirma: >
          O espaço já existe antes de qualquer valor entrar: logo depois
          da declaração a variável já tem tamanho, e o valor que chega
          depois entra no espaço que já estava lá.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x;

              puts(sizeof x > 0 ? "logo apos a declaracao o espaco ja tem tamanho"
                                : "FALHOU");
              x = 7;
              puts(x == 7 ? "e o valor entrou depois, no espaco que ja estava la"
                          : "FALHOU");
              return 0;
          }
        espera: |-
          logo apos a declaracao o espaco ja tem tamanho
          e o valor entrou depois, no espaco que ja estava la
      - afirma: >
          Quem põe a variável no mundo é a declaração: antes da linha
          que declara, o nome não existe para o compilador.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              x = 7;
              int x;

              puts(x == 7 ? "ok" : "FALHOU");
              return 0;
          }
        nao_compila: true
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall. Usar um nome que
          ainda não foi declarado é violação de restrição, e o padrão
          exige diagnóstico de todo compilador conforme; o que se
          observa aqui é a recusa deste.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O espaço nasce na declaração. Quando você escreve o tipo e o nome, o
      lugar passa a existir — com o tamanho que o tipo pede, e alcançável
      pelo nome que você deu. O valor é outra coisa, e vem depois, se
      vier.


      A ideia contrária tem de onde vir, e é a nossa maneira de falar:
      dizemos que a variável "foi criada" quando ela recebe o primeiro
      valor, porque é aí que ela passa a servir para algo. E há linguagens
      em que declarar e inicializar são a mesma operação, o que reforça a
      confusão. Em C são dois momentos, e eles podem estar longe um do
      outro.


      Separar os dois é o que deixa a próxima pergunta possível. Se o
      espaço só existisse junto com o valor, não haveria sentido em
      perguntar o que há dentro de uma variável declarada e não atribuída
      — a pergunta não teria sujeito. Ela tem, e a resposta é o assunto do
      nó seguinte.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "Variavel local declarada sem valor tem conteudo indeterminado, nao zero."
    plain_text: >
      C nao limpa a caixa para voce. O que estava la antes continua la
      ate voce escrever algo.
    negated_by:
      - declaration_zeroes

    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          O conteúdo não é zero, e o compilador não deixa passar calado:
          ele avisa que a variável está sendo usada sem ter recebido
          valor. Este programa não é executado — o que ele leria é
          justamente o que não se pode prever.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x;
              int copia = x;

              return copia;
          }
        avisa: >
          is used uninitialized
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      A declaração reserva o espaço e para aí. Ela não escreve nada
      dentro: o que estiver naquele trecho de memória continua lá — sobra
      do que o programa já fez, ou do que nunca usou. A linguagem não
      promete nada sobre esse conteúdo, e não prometer nada é diferente de
      prometer lixo: não há valor nenhum em que você possa contar.


      A ideia contrária tem uma origem razoável, e ela é outra linguagem.
      Há várias em que declarar já põe um valor padrão — zero, vazio, nulo
      — e quem aprendeu lá traz a expectativa para cá. Em C essa garantia
      não existe para variável local, e o programa que conta com ela
      funciona por acaso.


      Então o valor inicial é trabalho de quem declara. Escrever o valor
      antes de ler não é zelo: é o que faz o programa ter um resultado
      previsível. Somar a partir de uma variável que ninguém escreveu é
      partir de um número que ninguém escolheu — e o programa pode acertar
      hoje e errar amanhã, com o mesmo código.
  B4:
    type: observavel
    role: espinha
    support: []
    text: "Atribuir um valor novo substitui o anterior; cabe um valor de cada vez."
    plain_text: >
      Escrever um valor novo apaga o antigo. A caixa nunca guarda dois
      valores ao mesmo tempo.
    negated_by:
      - variable_remembers

    evidencia:
      - afirma: >
          Atribuir um valor novo substitui o anterior: depois de x = 2 o
          espaço responde 2, e o 1 que estava lá não está em lugar
          nenhum.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int x = 1;

              x = 2;
              puts(x == 2 ? "o valor novo entrou: x responde 2" : "FALHOU");
              puts(x != 1 ? "e o anterior nao esta mais la: cabe um de cada vez"
                          : "FALHOU");
              return 0;
          }
        espera: |-
          o valor novo entrou: x responde 2
          e o anterior nao esta mais la: cabe um de cada vez
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Atribuir é escrever por cima. O espaço da variável guarda um valor,
      e quando o próximo entra o anterior deixa de estar lá — não vai para
      outro lugar, não fica numa lista, não é recuperável. A caixa tem
      lugar para um, e sempre o mais recente.


      A ideia contrária tem de onde vir, e a linha que mais a alimenta é a
      mais comum de todas: contador igual a contador mais um. Ela parece
      usar dois valores ao mesmo tempo, o antigo e o novo, e de fato os
      dois aparecem na mesma linha. O que acontece em ordem é outra coisa:
      o valor atual é lido, a conta é feita, e o resultado é escrito por
      cima. Entre a leitura e a escrita não há momento em que a caixa
      guarde os dois.


      Quando você precisa do valor antigo, a resposta é uma segunda caixa.
      Copie antes de sobrescrever, e o que você terá são duas variáveis
      com dois valores — não uma variável com memória. Essa distinção é
      pequena de dizer e grande de usar: é a diferença entre um programa
      que você consegue acompanhar linha por linha e um em que você não
      sabe mais o que há onde.
  I1:
    type: inferencia
    role: conclusao
    support: [B1, B2, B3, B4]
    text: >
      Inicializar e declarar-depois-atribuir chegam ao mesmo lugar: uma
      variavel com espaco reservado e valor conhecido.
    plain_text: >
      No fim das contas, dar o valor na hora de declarar ou declarar e
      so depois atribuir chegam no mesmo lugar: uma variavel pronta.
    negated_by:
      - assignment_symmetric
    evidencia:
      - afirma: >
          As duas rotas chegam ao mesmo lugar: inicializar na declaração
          e declarar para atribuir depois dão o mesmo valor, e daí em
          diante as duas variáveis se comportam igual.
        programa: |
          #include <stdio.h>

          int main(void)
          {
              int a = 5;
              int b;

              b = 5;
              puts(a == b ? "inicializar e atribuir depois chegam ao mesmo valor"
                          : "FALHOU");
              a = a + 1;
              b = b + 1;
              puts(a == b ? "e dai em diante as duas andam juntas: mesmo espaco"
                          : "FALHOU");
              return 0;
          }
        espera: |-
          inicializar e atribuir depois chegam ao mesmo valor
          e dai em diante as duas andam juntas: mesmo espaco
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto é o fecho dos quatro nós anteriores. A variável é um espaço com
      nome e tipo, o espaço nasce na declaração, o conteúdo dele é
      indeterminado até alguém escrever, e escrever substitui o que havia.
      Então dar o valor na linha da declaração ou dar o valor três linhas
      depois leva ao mesmo estado: um espaço reservado, com um valor que
      você escolheu. A diferença entre as duas rotas é quando, e não o
      quê.


      E a atribuição tem uma direção. Ela não é uma afirmação de que os
      dois lados são iguais: é uma ordem para copiar o que está à direita
      para o lugar que está à esquerda. Por isso o lado esquerdo precisa
      ser um lugar — um nome de variável, algo que receba. Um número não é
      lugar, e não há como pôr nada dentro dele.


      A ideia da troca vem do sinal. Em matemática, o igual é simétrico:
      trocar os dois lados de lugar não muda o que a frase diz. Em C o
      mesmo símbolo quer dizer outra coisa, e a assimetria é inteira —
      quem lê e quem é escrito são papéis diferentes, e duas atribuições
      em direções opostas não desfazem uma à outra. Elas fazem as duas
      variáveis terminarem com o mesmo valor.
