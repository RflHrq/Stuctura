topic: kc_08

# Este tópico fecha o buraco que o kc_09 declarava: ele era pré-requisito
# do kc_09 e não existia (pergunta em aberto 8). Agora existe.
#
# A METÁFORA DESTE TÓPICO: alugar o terreno.
#
# Continua o terreno alugado do kc_01, e mostra o momento em que ele é
# alugado. `malloc(n)` é pedir à prefeitura um terreno de n METROS — não
# de n casas: quantos metros cada casa tem é conta sua. A prefeitura
# responde com o NÚMERO do lote, ou diz que não tem lote. E ela não limpa
# o terreno antes de entregar: o que estiver lá é sobra do último
# inquilino. O papel com o número fica na sua gaveta e o terreno fica no
# loteamento — duas coisas, dois lugares. E o terreno é seu até você
# devolver: ninguém devolve por você.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Pedir à prefeitura" sugere que você negocia e sai com o terreno.
#      Não: "não tem lote" é uma das respostas possíveis, e conferir isso
#      é obrigação sua. Quando a metáfora empurrar para "sempre consigo",
#      ela cala.
#   2. A metáfora não diz nada sobre o que acontece com o terreno depois
#      que você devolve. Isso é do kc_09, e lá o ponto é outro: o papel
#      que fica na sua mão.
#
# OITO NÓS CURADOS, SEIS AQUI. A curadoria tem duas crenças (em I2 e I3),
# e seis dos oito nós são marcados "órfão" — este é o tópico com a
# estrutura mais solta de todos. Duas dobras, as duas de
# premissa-e-aplicação:
#
#   curado B3 ("o bloco devolvido não tem conteúdo definido") + I3 ("o
#     conteúdo precisa ser escrito antes de lido") -> B3 deste grafo;
#   curado B4 ("o bloco não morre com a função que o pediu") + I4
#     ("ninguém libera o bloco por você") -> I3 deste grafo, a conclusão.
#     A curadoria registra que B4 é importado de kc_01:B3, e as duas
#     pontas são negadas pela mesma crença.
#
# Quatro nós ganharam crença de fora ou nova, e as de fora vêm dos
# tópicos que a curadoria declara como pré-requisito (kc_01, kc_02).

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "malloc(n) pede n bytes ao alocador."
    plain_text: >
      malloc(n) pede emprestado um pedaço de memória com n BYTES. Quantos
      bytes cada elemento ocupa é conta sua.
    negated_by:
      - malloc_conta_elementos

    # A EVIDENCIA DO kc_08, 12/11/2026. BLOCOS DE `char`, E DE PROPOSITO:
    # `sizeof` so tem cartao no kc_02, entao `malloc(n * sizeof(int))`
    # ficaria barrado pelo portao. Um char e 1 por definicao da linguagem,
    # entao `malloc(n)` pede n bytes sem afirmar tamanho de tipo nenhum --
    # que e o que a premissa deste no diz.
    #
    # E SEM `a[i]`: o indice literal (`b[0]`) e o que
    # `conceitos.construtos_de` le como `array`, e array so tem cartao no
    # kc_07. `*(bloco + i)` diz a mesma coisa e passa.
    evidencia:
      - afirma: >
          malloc(n) pede n bytes ao alocador: o bloco devolvido aceita
          escrita nas n posições, e a última ainda é dele.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              int quantos = 6;
              char *bloco = malloc(quantos);
              int i = 0;
              int conferidos = 0;

              if (bloco == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              while (i < quantos) {
                  *(bloco + i) = 'a' + i;
                  i = i + 1;
              }
              i = 0;
              while (i < quantos) {
                  if (*(bloco + i) == 'a' + i) {
                      conferidos = conferidos + 1;
                  }
                  i = i + 1;
              }
              puts(conferidos == 6 ? "os seis bytes pedidos aceitaram escrita e leitura"
                                   : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          os seis bytes pedidos aceitaram escrita e leitura
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O número que você passa a malloc é uma quantidade de bytes. Não de
      elementos, não de posições: bytes. malloc(10) reserva dez bytes, e o
      que você vai guardar neles é assunto seu.


      O alocador não sabe o tipo. Ele recebe um número e devolve um bloco
      daquele tamanho — a mesma chamada serve para dez letras, para dois
      números grandes ou para qualquer outra coisa que caiba em dez bytes.
      Não há no pedido nenhuma informação sobre o que vai morar ali.


      Por isso a conta é sua. Para guardar n elementos de um tipo, o que
      se pede é n vezes o tamanho daquele tipo — e sizeof é quem responde
      esse tamanho. Esquecer a multiplicação não dá erro no pedido: o
      bloco vem, menor do que você precisa, e o problema aparece longe
      dali.
  B2:
    type: observavel
    role: espinha
    support: []
    text: "malloc devolve o endereço do bloco, ou NULL."
    plain_text: >
      Ele devolve o endereço do pedaço que arrumou — ou NULL, se não
      conseguiu arrumar.
    negated_by:
      - pointer_is_data

    # O TAMANHO IMPOSSIVEL E CALCULADO RODANDO, e nao escrito no codigo.
    # Com a constante a vista, o gcc responde
    # `-Walloc-size-larger-than`, e aviso invalida evidencia. Calculado em
    # execucao, o pedido e o mesmo e o compilador nao tem o que avisar.
    evidencia:
      - afirma: >
          malloc devolve o endereço do bloco, ou NULL: o pedido comum
          volta com um endereço que funciona, e um pedido grande demais
          volta NULL — as duas saídas acontecem de verdade.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *bom = malloc(4);
              size_t enorme = 1;
              char *impossivel = NULL;
              int voltas = 0;

              while (voltas < 6) {
                  enorme = enorme * 1000;
                  voltas = voltas + 1;
              }
              impossivel = malloc(enorme);
              if (bom == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *bom = 'k';
              puts(*bom == 'k' ? "o pedido comum voltou com um endereco que funciona"
                               : "FALHOU");
              puts(impossivel == NULL
                   ? "e o pedido grande demais voltou NULL: a outra saida existe"
                   : "FALHOU");
              free(bom);
              free(impossivel);
              return 0;
          }
        espera: |-
          o pedido comum voltou com um endereco que funciona
          e o pedido grande demais voltou NULL: a outra saida existe
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O que malloc devolve é um endereço: o número do lote que ele
      reservou. O bloco em si fica onde está — ele não é entregue, não é
      copiado para dentro do seu ponteiro, não cabe ali. O que cabe é o
      caminho até ele.


      Por isso o ponteiro e o bloco são duas coisas. Em int *p =
      malloc(4), a caixa de p guarda um endereço, e o bloco de quatro
      bytes está em outro lugar. Para chegar ao conteúdo é preciso viajar
      — e é isso que a estrela faz.


      E há uma segunda resposta possível. Quando o pedido não pode ser
      atendido, o que volta é NULL — um valor de ponteiro como o outro, e
      que significa "não tem lote". As duas respostas chegam pelo mesmo
      caminho e cabem na mesma caixa, e distinguir uma da outra é assunto
      de outro nó deste tópico.
  B3:
    type: observavel
    role: espinha
    support: []
    text: "O bloco devolvido não tem conteúdo definido."
    plain_text: >
      O que está dentro desse pedaço é sobra: ninguém limpou antes de
      entregar. É preciso escrever ali antes de ler.
    negated_by:
      - malloc_initializes_zero

    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          O bloco devolvido não tem conteúdo definido: ler o que veio
          nele faz o compilador avisar, e por isso este programa não é
          executado.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *b = malloc(1);
              char lido;

              if (b == NULL) {
                  return 1;
              }
              lido = *b;
              free(b);
              return lido;
          }
        avisa: >
          may be used uninitialized
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      O alocador reserva o espaço e para por aí. Ele não escreve nada
      dentro: o que estiver naquele trecho de memória continua lá — sobra
      do que o programa já fez, ou do que nunca usou. O padrão não promete
      nada sobre esse conteúdo.


      A confusão tem uma origem razoável, e ela é a própria biblioteca.
      Existe uma função que zera o bloco ao entregá-lo, e justamente por
      isso ela é outra função, com outro nome: se malloc já zerasse, não
      haveria por que ter as duas.


      Então o valor inicial é trabalho de quem pediu. Escrever em todas as
      posições antes de ler qualquer uma não é zelo: é o que faz o
      programa ter um resultado previsível. Somar dentro de um bloco
      recém-pedido, sem pôr o zero antes, é partir de um número que
      ninguém escolheu — e o programa pode acertar hoje e errar amanhã,
      com o mesmo código.
  I1:
    type: inferencia
    role: espinha
    support: [B2]
    text: "O ponteiro é uma variável; o bloco é outra coisa."
    plain_text: >
      A caixa do ponteiro e o pedaço emprestado são duas coisas
      diferentes, em áreas diferentes.
    negated_by:
      - pointer_lives_in_heap

    evidencia:
      - afirma: >
          O ponteiro é uma variável e o bloco é outra coisa: apagar o
          ponteiro não apaga o bloco, que continua lá e continua
          alcançável por outro ponteiro.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);
              char *guarda = NULL;

              if (p == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *p = 'z';
              guarda = p;
              p = NULL;
              puts(p == NULL ? "o ponteiro foi apagado" : "FALHOU");
              puts(*guarda == 'z'
                   ? "e o bloco continua la, alcancavel pelo outro ponteiro"
                   : "FALHOU");
              free(guarda);
              return 0;
          }
        espera: |-
          o ponteiro foi apagado
          e o bloco continua la, alcancavel pelo outro ponteiro
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é a contagem do que o B2 descreveu. Se o que
      volta de malloc é um endereço, então ele precisa de uma caixa para
      ficar guardado — e o bloco que ele nomeia é outra coisa, em outro
      lugar. Duas coisas, sempre.


      A caixa do ponteiro é uma variável comum. Se você a declarou dentro
      de uma função, ela vive o que a função viver, como qualquer local:
      no fim da chamada ela some. O bloco não — ele foi pedido ao
      alocador, e a vida dele segue outra regra.


      Por isso as duas podem se separar. O ponteiro pode receber outro
      endereço e passar a indicar outro bloco; pode receber NULL e não
      indicar nada. Em nenhum desses movimentos o bloco original se mexe —
      e se mais ninguém guardou o endereço dele, ele continua existindo
      sem que ninguém saiba chegar lá.
  I2:
    type: inferencia
    role: espinha
    support: [B2]
    text: "Verificar NULL é necessário: falhar é resultado possível."
    plain_text: >
      Como NULL é uma das respostas possíveis, é preciso conferir antes de
      usar o que veio.
    negated_by:
      - malloc_always_succeeds

    evidencia:
      - afirma: >
          Verificar NULL é necessário porque falhar é resultado
          possível: quando o pedido falha, quem testou segue em frente,
          e o teste é o que separa os dois caminhos.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              size_t enorme = 1;
              char *bloco = NULL;
              int caminho = 0;
              int voltas = 0;

              while (voltas < 6) {
                  enorme = enorme * 1000;
                  voltas = voltas + 1;
              }
              bloco = malloc(enorme);
              if (bloco == NULL) {
                  caminho = 1;
              } else {
                  *bloco = 'x';
                  caminho = 2;
              }
              puts(caminho == 1 ? "o pedido falhou, e o teste pegou a falha" : "FALHOU");
              puts(caminho != 2 ? "sem o teste, a escrita teria ido para o nada"
                                : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          o pedido falhou, e o teste pegou a falha
          sem o teste, a escrita teria ido para o nada
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Pedir memória é pedir, e quem pede pode ouvir não. O alocador
      trabalha com o que o sistema tem para dar, e isso não é infinito nem
      igual todo dia. Quando não há como atender, ele responde NULL — e
      essa é uma resposta regular, prevista, e não um defeito.


      Por isso o teste não é precaução: é a leitura da resposta. Entre
      pedir e usar há uma pergunta a fazer, e quem não a faz está tratando
      as duas respostas possíveis como se fossem uma. Com NULL em p,
      escrever em p[0] é mandar escrever onde não há lote.


      E "nunca vi falhar" não diz nada sobre o programa. Pedidos pequenos,
      numa máquina com memória sobrando, quase sempre são atendidos — e é
      por isso que o erro atravessa testes inteiros sem aparecer. Ele
      aparece quando o pedido cresce, ou quando a máquina está apertada,
      que é justamente quando o programa precisava funcionar.
  I3:
    type: inferencia
    role: conclusao
    support: [B1, B3, I1, I2]
    text: "O bloco vive até o free: ninguém o libera por você."
    plain_text: >
      Esse pedaço não some quando a função que o pediu termina, e ninguém
      o devolve por você. Enquanto não devolver, ele continua ocupado.
    negated_by:
      - system_frees_auto
    evidencia:
      - afirma: >
          O bloco vive até o free: ele atravessa chamadas de função e
          continua com o que você escreveu — ninguém o devolve por você.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          static int trabalho(void)
          {
              int n = 0;

              while (n < 1000) {
                  n = n + 1;
              }
              return n;
          }

          int main(void)
          {
              char *bloco = malloc(1);

              if (bloco == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *bloco = 'q';
              trabalho();
              trabalho();
              puts(*bloco == 'q'
                   ? "duas funcoes rodaram inteiras, e o bloco continua com o q"
                   : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          duas funcoes rodaram inteiras, e o bloco continua com o q
    # A AMPLIACAO, do candidato assinado em 12/11/2026.
    interpretation: >
      Isto não é regra nova: é o I1 levado adiante. O ponteiro e o bloco
      são duas coisas, e cada uma acaba do seu jeito. A variável que
      guarda o endereço some quando o escopo dela fecha — e o bloco, que
      não é ela, continua reservado até alguém devolvê-lo.


      A ideia contrária tem de onde vir. Variáveis comuns somem sozinhas
      no fim da função, e isso funciona tão bem que passa despercebido;
      quando o programa termina, o sistema operacional recolhe tudo mesmo.
      Entre um e outro, porém, está o tempo em que o programa roda — e é
      nesse tempo que o bloco não recolhido fica.


      Por isso o free é seu. Enquanto o programa vive, cada bloco pedido e
      não devolvido continua ocupado, e o alocador não tem como saber que
      você não precisa mais dele. Num programa que pede muitas vezes, o
      que se acumula não é um erro visível: é memória que some aos poucos,
      sem nada quebrar na hora.
