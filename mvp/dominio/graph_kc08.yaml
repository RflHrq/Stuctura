topic: kc_08

# Este tópico fecha o buraco que o kc_09 declarava: ele era pré-requisito
# do kc_09 e não existia (pergunta em aberto 8). Agora existe.
#
# A METÁFORA DESTE TÓPICO: alugar o terreno.
#
# Continua o terreno alugado do kc_01, e mostra o momento em que ele é
# alugado. `malloc(n)` é pedir à prefeitura um terreno de n METROS — não
# de n casas: quantos metros cada casa tem é conta sua. A prefeitura
# responde com o NÚMERO do lote, ou diz que não tem lote. E ela não limpa
# o terreno antes de entregar: o que estiver lá é sobra do último
# inquilino. O papel com o número fica na sua gaveta e o terreno fica no
# loteamento — duas coisas, dois lugares. E o terreno é seu até você
# devolver: ninguém devolve por você.
#
# ONDE QUEBRA, declarado como manda o contrato de linguagem:
#
#   1. "Pedir à prefeitura" sugere que você negocia e sai com o terreno.
#      Não: "não tem lote" é uma das respostas possíveis, e conferir isso
#      é obrigação sua. Quando a metáfora empurrar para "sempre consigo",
#      ela cala.
#   2. A metáfora não diz nada sobre o que acontece com o terreno depois
#      que você devolve. Isso é do kc_09, e lá o ponto é outro: o papel
#      que fica na sua mão.
#
# OITO NÓS CURADOS, SEIS AQUI. A curadoria tem duas crenças (em I2 e I3),
# e seis dos oito nós são marcados "órfão" — este é o tópico com a
# estrutura mais solta de todos. Duas dobras, as duas de
# premissa-e-aplicação:
#
#   curado B3 ("o bloco devolvido não tem conteúdo definido") + I3 ("o
#     conteúdo precisa ser escrito antes de lido") -> B3 deste grafo;
#   curado B4 ("o bloco não morre com a função que o pediu") + I4
#     ("ninguém libera o bloco por você") -> I3 deste grafo, a conclusão.
#     A curadoria registra que B4 é importado de kc_01:B3, e as duas
#     pontas são negadas pela mesma crença.
#
# Quatro nós ganharam crença de fora ou nova, e as de fora vêm dos
# tópicos que a curadoria declara como pré-requisito (kc_01, kc_02).

nodes:

  B1:
    type: observavel
    role: espinha
    support: []
    text: "malloc(n) pede n bytes ao alocador."
    plain_text: >
      malloc(n) pede emprestado um pedaço de memória com n BYTES. Quantos
      bytes cada elemento ocupa é conta sua.
    negated_by:
      - malloc_conta_elementos

    # A EVIDENCIA DO kc_08, 12/11/2026. BLOCOS DE `char`, E DE PROPOSITO:
    # `sizeof` so tem cartao no kc_02, entao `malloc(n * sizeof(int))`
    # ficaria barrado pelo portao. Um char e 1 por definicao da linguagem,
    # entao `malloc(n)` pede n bytes sem afirmar tamanho de tipo nenhum --
    # que e o que a premissa deste no diz.
    #
    # E SEM `a[i]`: o indice literal (`b[0]`) e o que
    # `conceitos.construtos_de` le como `array`, e array so tem cartao no
    # kc_07. `*(bloco + i)` diz a mesma coisa e passa.
    evidencia:
      - afirma: >
          malloc(n) pede n bytes ao alocador: o bloco devolvido aceita
          escrita nas n posições, e a última ainda é dele.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              int quantos = 6;
              char *bloco = malloc(quantos);
              int i = 0;
              int conferidos = 0;

              if (bloco == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              while (i < quantos) {
                  *(bloco + i) = 'a' + i;
                  i = i + 1;
              }
              i = 0;
              while (i < quantos) {
                  if (*(bloco + i) == 'a' + i) {
                      conferidos = conferidos + 1;
                  }
                  i = i + 1;
              }
              puts(conferidos == 6 ? "os seis bytes pedidos aceitaram escrita e leitura"
                                   : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          os seis bytes pedidos aceitaram escrita e leitura
  B2:
    type: observavel
    role: espinha
    support: []
    text: "malloc devolve o endereço do bloco, ou NULL."
    plain_text: >
      Ele devolve o endereço do pedaço que arrumou — ou NULL, se não
      conseguiu arrumar.
    negated_by:
      - pointer_is_data

    # O TAMANHO IMPOSSIVEL E CALCULADO RODANDO, e nao escrito no codigo.
    # Com a constante a vista, o gcc responde
    # `-Walloc-size-larger-than`, e aviso invalida evidencia. Calculado em
    # execucao, o pedido e o mesmo e o compilador nao tem o que avisar.
    evidencia:
      - afirma: >
          malloc devolve o endereço do bloco, ou NULL: o pedido comum
          volta com um endereço que funciona, e um pedido grande demais
          volta NULL — as duas saídas acontecem de verdade.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *bom = malloc(4);
              size_t enorme = 1;
              char *impossivel = NULL;
              int voltas = 0;

              while (voltas < 6) {
                  enorme = enorme * 1000;
                  voltas = voltas + 1;
              }
              impossivel = malloc(enorme);
              if (bom == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *bom = 'k';
              puts(*bom == 'k' ? "o pedido comum voltou com um endereco que funciona"
                               : "FALHOU");
              puts(impossivel == NULL
                   ? "e o pedido grande demais voltou NULL: a outra saida existe"
                   : "FALHOU");
              free(bom);
              free(impossivel);
              return 0;
          }
        espera: |-
          o pedido comum voltou com um endereco que funciona
          e o pedido grande demais voltou NULL: a outra saida existe
  B3:
    type: observavel
    role: espinha
    support: []
    text: "O bloco devolvido não tem conteúdo definido."
    plain_text: >
      O que está dentro desse pedaço é sobra: ninguém limpou antes de
      entregar. É preciso escrever ali antes de ler.
    negated_by:
      - malloc_initializes_zero

    # A TERCEIRA FORMA DO CONTRATO, 12/11/2026, e este no foi um dos nove
    # que a pediram. A premissa fala de valor indeterminado ou de
    # comportamento indefinido, e as duas formas antigas nao a alcancam:
    # rodar o programa exibiria o proprio UB como prova, e o compilador
    # nao RECUSA, porque o padrao nao exige recusa -- exige diagnostico.
    #
    # Entao a demonstracao e o diagnostico: o programa compila, o
    # compilador avisa, e o programa NAO E EXECUTADO. Nao executar e a
    # premissa, e nao economia -- `_demonstracoes` recusa na carga uma
    # prova por aviso que prometa saida.
    evidencia:
      - afirma: >
          O bloco devolvido não tem conteúdo definido: ler o que veio
          nele faz o compilador avisar, e por isso este programa não é
          executado.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *b = malloc(1);
              char lido;

              if (b == NULL) {
                  return 1;
              }
              lido = *b;
              free(b);
              return lido;
          }
        avisa: >
          may be used uninitialized
        ambiente: >
          gcc 16.2.0 (MinGW-W64), com -std=c17 -Wall -c. O programa
          COMPILA — o padrão não exige recusa, exige diagnóstico — e não
          é executado aqui: executá-lo seria justamente o comportamento
          que a premissa diz não ter resultado previsível.
  I1:
    type: inferencia
    role: espinha
    support: [B2]
    text: "O ponteiro é uma variável; o bloco é outra coisa."
    plain_text: >
      A caixa do ponteiro e o pedaço emprestado são duas coisas
      diferentes, em áreas diferentes.
    negated_by:
      - pointer_lives_in_heap

    evidencia:
      - afirma: >
          O ponteiro é uma variável e o bloco é outra coisa: apagar o
          ponteiro não apaga o bloco, que continua lá e continua
          alcançável por outro ponteiro.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              char *p = malloc(1);
              char *guarda = NULL;

              if (p == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *p = 'z';
              guarda = p;
              p = NULL;
              puts(p == NULL ? "o ponteiro foi apagado" : "FALHOU");
              puts(*guarda == 'z'
                   ? "e o bloco continua la, alcancavel pelo outro ponteiro"
                   : "FALHOU");
              free(guarda);
              return 0;
          }
        espera: |-
          o ponteiro foi apagado
          e o bloco continua la, alcancavel pelo outro ponteiro
  I2:
    type: inferencia
    role: espinha
    support: [B2]
    text: "Verificar NULL é necessário: falhar é resultado possível."
    plain_text: >
      Como NULL é uma das respostas possíveis, é preciso conferir antes de
      usar o que veio.
    negated_by:
      - malloc_always_succeeds

    evidencia:
      - afirma: >
          Verificar NULL é necessário porque falhar é resultado
          possível: quando o pedido falha, quem testou segue em frente,
          e o teste é o que separa os dois caminhos.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(void)
          {
              size_t enorme = 1;
              char *bloco = NULL;
              int caminho = 0;
              int voltas = 0;

              while (voltas < 6) {
                  enorme = enorme * 1000;
                  voltas = voltas + 1;
              }
              bloco = malloc(enorme);
              if (bloco == NULL) {
                  caminho = 1;
              } else {
                  *bloco = 'x';
                  caminho = 2;
              }
              puts(caminho == 1 ? "o pedido falhou, e o teste pegou a falha" : "FALHOU");
              puts(caminho != 2 ? "sem o teste, a escrita teria ido para o nada"
                                : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          o pedido falhou, e o teste pegou a falha
          sem o teste, a escrita teria ido para o nada
  I3:
    type: inferencia
    role: conclusao
    support: [B1, B3, I1, I2]
    text: "O bloco vive até o free: ninguém o libera por você."
    plain_text: >
      Esse pedaço não some quando a função que o pediu termina, e ninguém
      o devolve por você. Enquanto não devolver, ele continua ocupado.
    negated_by:
      - system_frees_auto
    evidencia:
      - afirma: >
          O bloco vive até o free: ele atravessa chamadas de função e
          continua com o que você escreveu — ninguém o devolve por você.
        programa: |
          #include <stdio.h>
          #include <stdlib.h>

          static int trabalho(void)
          {
              int n = 0;

              while (n < 1000) {
                  n = n + 1;
              }
              return n;
          }

          int main(void)
          {
              char *bloco = malloc(1);

              if (bloco == NULL) {
                  puts("FALHOU");
                  return 1;
              }
              *bloco = 'q';
              trabalho();
              trabalho();
              puts(*bloco == 'q'
                   ? "duas funcoes rodaram inteiras, e o bloco continua com o q"
                   : "FALHOU");
              free(bloco);
              return 0;
          }
        espera: |-
          duas funcoes rodaram inteiras, e o bloco continua com o q
