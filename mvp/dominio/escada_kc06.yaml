# A escada do kc_06 — passagem por referência.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# QUEM CHEGA AQUI já chamou uma função de uma linha, com um parâmetro,
# recebendo valor (`zera(idade);`) e recebendo endereço
# (`zera(&idade);`) — no kc_02 e no kc_04. Este tópico para em cima da
# chamada e diz o que acontece nela, passo a passo: nasce uma variável
# nova, o parâmetro; entra nela uma CÓPIA; e o que muda tudo é o que foi
# copiado — um valor, ou um endereço.
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   "parâmetro", "local"   o nome da variável da função        B1, degrau 1
#   "argumento"            o que vai na chamada                B1, degrau 2
#   dois parâmetros        (int a, int b)                      B1, degrau 4
#   variável declarada dentro da função, e printf lá dentro    B1, degrau 4
#   mostra(idade + 1);     uma conta na chamada                B2, degrau 2
#   "por valor", "por referência"   os dois nomes              I4, degrau 1
#   duas funções no trecho                                     I4, degrau 1
#
# O B1 TEM UM PASSO GUIADO A MAIS que as outras premissas: é nele que a
# função ganha o segundo parâmetro e uma variável declarada dentro das
# chaves. Sete questões do banco (a troca de dois valores entre elas)
# usam uma coisa ou a outra, e sem esse passo ficariam fora da trilha.
# As duas novidades vão juntas, numa ideia só — "as variáveis da função
# são os parâmetros e as que ela declara" —, para não virar dois passos.
#
# O QUE O B1 E O I1 TÊM DE DIFERENTE. As duas premissas se medem pelo
# mesmo experimento: a função muda o parâmetro, e a variável de quem
# chamou fica como estava. Para não ser a mesma pergunta duas vezes, a
# prática do B1 pergunta pela IDENTIDADE do parâmetro (o mesmo nome da
# variável de fora, e ainda assim outra; uma variável de verdade mesmo
# quando a chamada entrega só um número), e a do I1 pela CONSEQUÊNCIA
# (mexer na cópia não mexe no original).
#
# DUAS PROVAS MOSTRAM ENDEREÇO, a do B1 e a do I4: o que desmente "o
# parâmetro é a variável de quem chamou" e "a cópia do ponteiro é o
# próprio ponteiro" é cada um ter o SEU lugar. A saída vem com endereços
# de exemplo, e o conferidor exige a forma: dois endereços diferentes.
#
# A PROVA DO B2 USA UM PONTEIRO NO LUGAR DA VARIÁVEL GLOBAL. A crença é
# "o que se passa é a conta escrita na chamada", e o que a desmente é a
# variável da conta mudar DEPOIS da chamada e o parâmetro não acompanhar.
# No banco isso é feito com uma variável declarada fora da função, que a
# função altera — e variável global nenhuma escada ensinou. Aqui a função
# recebe também o endereço, e muda a variável por ele.
#
# AS QUESTÕES DE MARCAR. Sete das 36 questões de diagnóstico e de
# treino usavam o que as escadas não ensinam — variável global,
# `return`, `++`, ponteiro para ponteiro, `malloc` — e ficaram em
# `fora_da_trilha`. O B2 era a premissa que mais perdia: ficava com as
# duas de conceito, e abria com uma delas. Em 16/11/2026, com o Rafael
# de acordo, as duas que usavam variável global (`ciu_kc06_005` e
# `ciu_kc06_t06`) foram reescritas com o endereço no lugar dela, como a
# prova do B2, e voltaram: o B2 fica com quatro e abre com código. Ficam
# fora cinco.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "O parâmetro é uma variável da função: nasce quando ela é chamada, e é só dela."
      - "Em zera(idade); existem duas variáveis: idade, de quem chamou, e n, da função."
    codigo: |
      void zera(int n) { n = 0; }

      int idade;

      idade = 15;
      zera(idade);
      printf("%d\n", idade);
    saida: "15"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: zera, tipo: bancada, de: void zera(int n)}
      - {nome: n, tipo: caixa, de: int}
    passos:
      - {linha: 3, faz: [{cria: idade}]}
      - {linha: 5, faz: [{guarda: {em: idade, valor: 15}}]}
      - {linha: 6, faz: [{le: idade}, {chama: zera}, {cria: n}, {guarda: {em: n, valor: 15}}]}
      - {linha: 1, faz: [{guarda: {em: n, valor: 0}}]}
      - {linha: 6, faz: [{volta: zera}, {diz: 'idade continua 15: zera mexeu na cópia'}]}
      - {linha: 7, faz: [{le: idade}, {mostra: '15'}]}
  # Variável global, e parâmetro com o mesmo nome dela.
  fora_da_trilha: [ciu_kc06_003]
  provas:
    - crenca: funcao_usa_a_variavel_do_chamador
      programa: |
        void mostra(int n) { printf("%p\n", (void *)&n); }

        int idade;

        idade = 15;
        printf("%p\n", (void *)&idade);
        mostra(idade);
      previsao:
        pergunta: >
          O primeiro printf mostra o endereço de idade. O de dentro da
          função mostra o endereço do parâmetro n. O que os dois mostram?
        opcoes:
          - "O mesmo endereço: n é a própria idade"
          - "Dois endereços diferentes"
        real: 1
        crenca: 0
      espera: "0x1000\n0x2A00"
      ambiente: >
        Os números dos lugares mudam de máquina para máquina; aqui eles
        aparecem como números de exemplo. O que foi conferido é que as
        duas linhas saem com endereços diferentes.
      afirma: >
        Saíram dois endereços diferentes. O parâmetro n tem o lugar
        dele: é uma variável nova, da função, e não a idade de quem
        chamou.
  degraus:
    - id: esc_kc06_B1_1
      guiado: true
      forma: tocar
      codigo: true
      frases:
        - "O que fica entre os parênteses da função é o parâmetro."
        - "Em void zera(int n) o parâmetro se chama n: é uma variável local, só da função."
      versoes:
        - pede: "Toque no nome do parâmetro."
          mostra: "void zera(int n) { n = 0; }"
          pecas: ["void zera(", "int", "n", ") { n = 0; }"]
          certa: [[2]]
          certa_texto: "n"
          erros:
            - exata: [1]
              retorno: "int é o tipo do parâmetro. O nome dele é a palavra seguinte: n."
            - exata: [0]
              retorno: "zera é o nome da função. O parâmetro é a variável que fica entre os parênteses: n."
            - exata: [3]
              retorno: "Esse é o corpo da função: o que ela faz. O parâmetro é a variável entre os parênteses: n."
          retorno_geral: "O parâmetro é a variável entre os parênteses da função: n."
        - pede: "Toque no nome do parâmetro."
          mostra: "void marca(int v) { v = 9; }"
          pecas: ["void marca(", "int", "v", ") { v = 9; }"]
          certa: [[2]]
          certa_texto: "v"
          erros:
            - exata: [1]
              retorno: "int é o tipo do parâmetro. O nome dele é a palavra seguinte: v."
            - exata: [0]
              retorno: "marca é o nome da função. O parâmetro é a variável que fica entre os parênteses: v."
            - exata: [3]
              retorno: "Esse é o corpo da função: o que ela faz. O parâmetro é a variável entre os parênteses: v."
          retorno_geral: "O parâmetro é a variável entre os parênteses da função: v."

    - id: esc_kc06_B1_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Na chamada zera(idade); o que vai entre os parênteses é o argumento."
        - "O parâmetro não é o argumento: é uma variável nova, criada na chamada, com o seu próprio lugar."
      versoes:
        - pede: "Durante a chamada da última linha, quantas variáveis existem?"
          antes: |-
            void zera(int n) { n = 0; }

            int idade;

            idade = 15;
            zera(idade);
          pecas:
            - "Duas: idade, de quem chamou, e n, da função"
            - "Uma: a função usa a própria idade, e n não é variável nova"
            - "Nenhuma: a função só usa o valor"
          certa: [[0]]
          certa_texto: "Duas: idade, de quem chamou, e n, da função"
          erros:
            - exata: [1]
              crenca: funcao_usa_a_variavel_do_chamador
              retorno: "A função não usa a idade: ela ganha uma variável nova, n, com o lugar dela. São duas variáveis."
            - exata: [2]
              retorno: "O valor precisa de onde ficar, dentro da função: é o parâmetro n, uma variável nova. Com idade, são duas."
          retorno_geral: "São duas variáveis: idade, de quem chamou, e o parâmetro n, que é da função."
        - pede: "Durante a chamada da última linha, quantas variáveis existem?"
          antes: |-
            void marca(int v) { v = 9; }

            int nota;

            nota = 7;
            marca(nota);
          pecas:
            - "Duas: nota, de quem chamou, e v, da função"
            - "Uma: a função usa a própria nota, e v não é variável nova"
            - "Nenhuma: a função só usa o valor"
          certa: [[0]]
          certa_texto: "Duas: nota, de quem chamou, e v, da função"
          erros:
            - exata: [1]
              crenca: funcao_usa_a_variavel_do_chamador
              retorno: "A função não usa a nota: ela ganha uma variável nova, v, com o lugar dela. São duas variáveis."
            - exata: [2]
              retorno: "O valor precisa de onde ficar, dentro da função: é o parâmetro v, uma variável nova. Com nota, são duas."
          retorno_geral: "São duas variáveis: nota, de quem chamou, e o parâmetro v, que é da função."

    - id: esc_kc06_B1_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Como o parâmetro é outra variável, o que a função escreve nele fica nele."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            void zera(int n) { n = 0; }

            int idade;

            idade = 15;
            zera(idade);
            printf("%d\n", idade);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "A função escreveu 0 em n, que é a variável dela. idade é outra variável, e continua com 15."
          retorno_geral: "O 0 foi para o parâmetro n. idade, de quem chamou, continua com 15."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            void marca(int v) { v = 9; }

            int nota;

            nota = 7;
            marca(nota);
            printf("%d\n", nota);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "9"
              retorno: "A função escreveu 9 em v, que é a variável dela. nota é outra variável, e continua com 7."
          retorno_geral: "O 9 foi para o parâmetro v. nota, de quem chamou, continua com 7."

    - id: esc_kc06_B1_4
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "A função pode ter mais de um parâmetro, separados por vírgula."
        - "E pode declarar variáveis dentro das chaves. Todas são locais: só dela."
      versoes:
        - pede: "A função soma os dois parâmetros numa variável dela, t, e mostra t. Que número aparece?"
          mostra: |-
            void soma(int a, int b) { int t = a + b; printf("%d\n", t); }

            int idade;
            int nota;

            idade = 15;
            nota = 7;
            soma(idade, nota);
          aceitas: ["22"]
          certa_texto: "22"
          erros:
            - texto: "15"
              retorno: "15 é o que entrou em a. A função soma a com b, 15 mais 7, guarda em t e mostra t: 22."
            - texto: "7"
              retorno: "7 é o que entrou em b. A função soma a com b, 15 mais 7, guarda em t e mostra t: 22."
          retorno_geral: "a nasce com 15 e b com 7. t, declarada dentro da função, recebe a soma: 22."
        - pede: "A função soma os dois parâmetros numa variável dela, t, e mostra t. Que número aparece?"
          mostra: |-
            void soma(int a, int b) { int t = a + b; printf("%d\n", t); }

            int pontos;
            int nota;

            pontos = 3;
            nota = 7;
            soma(pontos, nota);
          aceitas: ["10"]
          certa_texto: "10"
          erros:
            - texto: "3"
              retorno: "3 é o que entrou em a. A função soma a com b, 3 mais 7, guarda em t e mostra t: 10."
            - texto: "7"
              retorno: "7 é o que entrou em b. A função soma a com b, 3 mais 7, guarda em t e mostra t: 10."
          retorno_geral: "a nasce com 3 e b com 7. t, declarada dentro da função, recebe a soma: 10."

    - id: esc_kc06_B1_5
      nome: "Mesmo nome, e ainda assim duas variáveis"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Aqui o parâmetro tem o mesmo nome da variável de quem chamou. Que número este trecho mostra na tela?"
          mostra: |-
            void zera(int idade) { idade = 0; }

            int idade;

            idade = 15;
            zera(idade);
            printf("%d\n", idade);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "O nome é igual, mas são duas variáveis. O 0 foi para a idade da função; a de quem chamou continua com 15."
          retorno_geral: "São duas variáveis com o mesmo nome. A função zerou a dela; a de quem chamou continua com 15."
        - pede: "Aqui o parâmetro tem o mesmo nome da variável de quem chamou. Que número este trecho mostra na tela?"
          mostra: |-
            void marca(int nota) { nota = 9; }

            int nota;

            nota = 7;
            marca(nota);
            printf("%d\n", nota);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "9"
              retorno: "O nome é igual, mas são duas variáveis. O 9 foi para a nota da função; a de quem chamou continua com 7."
          retorno_geral: "São duas variáveis com o mesmo nome. A função escreveu na dela; a de quem chamou continua com 7."

    - id: esc_kc06_B1_6
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "Aqui a chamada entrega o número 15 direto, sem variável nenhuma. Que número aparece?"
          mostra: |-
            void conta(int n) { n = n + 1; printf("%d\n", n); }

            conta(15);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "15"
              retorno: "O 15 foi copiado para n, e n é uma variável da função: ela soma 1 em n, e mostra 16."
          retorno_geral: "n é uma variável da função, mesmo quando o argumento é só um número. Ela nasce com 15, vira 16, e é o 16 que aparece."
        - pede: "Aqui a chamada entrega o número 7 direto, sem variável nenhuma. Que número aparece?"
          mostra: |-
            void conta(int n) { n = n + 2; printf("%d\n", n); }

            conta(7);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "O 7 foi copiado para n, e n é uma variável da função: ela soma 2 em n, e mostra 9."
          retorno_geral: "n é uma variável da função, mesmo quando o argumento é só um número. Ela nasce com 7, vira 9, e é o 9 que aparece."

B2:
  revisao:
    frases:
      - "Na chamada, o valor é calculado e copiado para o parâmetro."
      - "Se a chamada tem uma conta, como mostra(idade + 1);, a conta é feita antes, e entra o resultado."
    codigo: |
      void mostra(int v) { printf("%d\n", v); }

      int idade;

      idade = 15;
      mostra(idade + 1);
    saida: "16"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: mostra, tipo: bancada, de: void mostra(int v)}
      - {nome: v, tipo: caixa, de: int}
    passos:
      - {linha: 3, faz: [{cria: idade}]}
      - {linha: 5, faz: [{guarda: {em: idade, valor: 15}}]}
      - {linha: 6, faz: [{le: idade}, {diz: idade + 1 dá 16}, {chama: mostra}, {cria: v}, {guarda: {em: v, valor: 16}}]}
      - {linha: 1, faz: [{le: v}, {mostra: '16'}]}
      - {linha: 6, faz: [{volta: mostra}]}
  # return e (void); o ++. (A 005 e a t06 saíram daqui em 16/11/2026:
  # foram reescritas sem a variável global.)
  fora_da_trilha: [ciu_kc06_t05, ciu_kc06_006]
  provas:
    - crenca: passa_a_expressao
      programa: |
        void mostra(int v, int *p) { *p = 100; printf("%d\n", v); }

        int nota;

        nota = 7;
        mostra(nota + 1, &nota);
      previsao:
        pergunta: >
          A chamada entrega nota + 1 e o endereço de nota. Lá dentro, a
          função muda nota para 100 e só depois mostra v. O que aparece?
        opcoes:
          - "8"
          - "101"
        real: 0
        crenca: 1
      espera: "8"
      afirma: >
        Saiu 8. A conta nota + 1 foi feita na chamada, quando nota valia
        7, e o que entrou em v foi o resultado. Mudar nota depois não
        muda o que já tinha sido copiado: o que se passa é o valor, e
        não a conta.
  degraus:
    - id: esc_kc06_B2_1
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Chamar a função copia o valor para o parâmetro."
        - "Em mostra(idade); o parâmetro v nasce com o valor que idade tem naquele momento."
      versoes:
        - pede: "A função mostra na tela o parâmetro dela. Que número aparece?"
          mostra: |-
            void mostra(int v) { printf("%d\n", v); }

            int idade;

            idade = 15;
            mostra(idade);
          aceitas: ["15"]
          certa_texto: "15"
          erros:
            - texto: "0"
              retorno: "O parâmetro não nasce zerado: nasce com a cópia do valor que foi na chamada, o 15 de idade."
          retorno_geral: "v nasce com uma cópia do valor de idade: 15."
        - pede: "A função mostra na tela o parâmetro dela. Que número aparece?"
          mostra: |-
            void mostra(int v) { printf("%d\n", v); }

            int nota;

            nota = 7;
            mostra(nota);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "0"
              retorno: "O parâmetro não nasce zerado: nasce com a cópia do valor que foi na chamada, o 7 de nota."
          retorno_geral: "v nasce com uma cópia do valor de nota: 7."

    - id: esc_kc06_B2_2
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "A chamada pode trazer uma conta: mostra(idade + 1);"
        - "A conta é feita ANTES, e o que entra no parâmetro é o resultado: um valor."
      versoes:
        - pede: "Que número aparece?"
          mostra: |-
            void mostra(int v) { printf("%d\n", v); }

            int idade;

            idade = 15;
            mostra(idade + 1);
          aceitas: ["16"]
          certa_texto: "16"
          erros:
            - texto: "15"
              retorno: "A conta idade + 1 é feita antes da chamada, e o que entra em v é o resultado: 16."
          retorno_geral: "A conta é feita antes: idade + 1 dá 16, e é o 16 que entra em v."
        - pede: "Que número aparece?"
          mostra: |-
            void mostra(int v) { printf("%d\n", v); }

            int nota;

            nota = 7;
            mostra(nota + 2);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "7"
              retorno: "A conta nota + 2 é feita antes da chamada, e o que entra em v é o resultado: 9."
          retorno_geral: "A conta é feita antes: nota + 2 dá 9, e é o 9 que entra em v."

    - id: esc_kc06_B2_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "O que chega à função é sempre um valor pronto."
        - "Ela não recebe a conta, nem a variável: recebe o número que a conta deu."
      versoes:
        - pede: "Na última linha, o que entra em v?"
          antes: |-
            void mostra(int v) { printf("%d\n", v); }

            int idade;

            idade = 15;
            mostra(idade + 1);
          pecas:
            - "O número 16, já calculado"
            - "A conta idade + 1: o que se passa é o que está escrito na chamada"
            - "A variável idade"
          certa: [[0]]
          certa_texto: "O número 16, já calculado"
          erros:
            - exata: [1]
              crenca: passa_a_expressao
              retorno: "A função não recebe a conta para resolver lá dentro. A conta é feita na chamada, e entra o resultado: 16."
            - exata: [2]
              retorno: "A variável idade fica com quem chamou. O que entra em v é um valor: o 16 que a conta deu."
          retorno_geral: "Entra o valor que a conta deu, já calculado: 16."
        - pede: "Na última linha, o que entra em v?"
          antes: |-
            void mostra(int v) { printf("%d\n", v); }

            int nota;

            nota = 7;
            mostra(nota + 2);
          pecas:
            - "O número 9, já calculado"
            - "A conta nota + 2: o que se passa é o que está escrito na chamada"
            - "A variável nota"
          certa: [[0]]
          certa_texto: "O número 9, já calculado"
          erros:
