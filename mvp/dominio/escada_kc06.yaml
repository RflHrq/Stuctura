I4:
  revisao:
    frases:
      - "Em C toda chamada copia: muda(idade); copia o valor, e alcanca(&idade); copia o endereço."
      - "É a mesma regra nas duas: passagem por valor. A cópia do endereço é o que dá acesso à variável de quem chamou."
    codigo: |
      void muda(int v) { v = 9; }
      void alcanca(int *p) { *p = 9; }

      int idade;

      idade = 15;
      muda(idade);
      printf("%d\n", idade);
      alcanca(&idade);
      printf("%d\n", idade);
    saida: "15\n9"
  cena:
    atores:
      - {nome: idade, tipo: caixa, de: int}
      - {nome: muda, tipo: bancada, de: void muda(int v)}
      - {nome: v, tipo: caixa, de: int}
      - {nome: alcanca, tipo: bancada, de: void alcanca(int *p)}
      - {nome: p, tipo: ponteiro, de: int *}
    passos:
      - {linha: 4, faz: [{cria: idade}]}
      - {linha: 6, faz: [{guarda: {em: idade, valor: 15}}]}
      - {linha: 7, faz: [{le: idade}, {chama: muda}, {cria: v}, {guarda: {em: v, valor: 15}}]}
      - {linha: 1, faz: [{guarda: {em: v, valor: 9}}]}
      - {linha: 7, faz: [{volta: muda}]}
      - {linha: 8, faz: [{le: idade}, {mostra: '15'}]}
      - {linha: 9, faz: [{chama: alcanca}, {cria: p}, {aponta: {de: p, para: idade}}]}
      - {linha: 2, faz: [{segue: p}, {guarda: {em: idade, valor: 9}}]}
      - {linha: 9, faz: [{volta: alcanca}]}
      - {linha: 10, faz: [{le: idade}, {mostra: '9'}]}
  provas:
    - crenca: pointer_copy_is_alias
      programa: |
        void mostra(int *p) { printf("%p\n", (void *)&p); }

        int idade;
        int *q;

        q = &idade;
        printf("%p\n", (void *)&q);
        mostra(q);
      previsao:
        pergunta: >
          O primeiro printf mostra o endereço do ponteiro q. O de dentro
          da função mostra o endereço do parâmetro p, que recebeu q. O
          que os dois mostram?
        opcoes:
          - "Dois endereços diferentes"
          - "O mesmo endereço: p e q são a mesma variável"
        real: 0
        crenca: 1
      espera: "0x1000\n0x2A00"
      ambiente: >
        Os números dos lugares mudam de máquina para máquina; aqui eles
        aparecem como números de exemplo. O que foi conferido é que as
        duas linhas saem com endereços diferentes.
      afirma: >
        Saíram dois endereços diferentes: p e q são dois ponteiros, cada
        um no seu lugar. Guardam o mesmo endereço, o de idade, e é por
        isso que os dois levam a ela.
  degraus:
    - id: esc_kc06_I4_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Em C a chamada sempre copia o argumento: é a passagem por valor."
        - "Passar o endereço, que muita gente chama de passagem por referência, também é cópia: a do endereço."
      versoes:
        - pede: "As duas chamadas copiam alguma coisa. O que cada uma copia?"
          antes: |-
