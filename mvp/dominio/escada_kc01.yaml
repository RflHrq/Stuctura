# A escada do kc_01 — modelo de memória.
#
# O QUE É. Para cada premissa do tópico, os degraus do mais mecânico até
# a ideia, e a prova de cada crença que nega a premissa. Segue o molde
# do kc_00, e a mesma régua do texto (docs/trilha.md, 6.16).
#
# ONDE ELE FICA NA ORDEM. O kc_01 é o segundo tópico do curso, mas na
# trilha vem depois do kc_07: ele fala de função e de `malloc`, e só faz
# sentido para quem já chamou função (kc_06) e já viu `sizeof` (kc_07).
#
# O QUE ESTE TÓPICO APRESENTA, e onde:
#
#   return, e a função que devolve um valor                    B2, degrau 1
#   (void) nos parênteses: função sem parâmetro                B2, degrau 2
#   a função escrita em várias linhas                          B2, degrau 3
#   malloc(sizeof(int)) e a palavra "bloco"                    B3, degrau 1
#   free(p);                                                   B3, degrau 2
#   "pilha" e "monte"                                          I2, degrau 1
#
# A FUNÇÃO EM VÁRIAS LINHAS. Até o kc_07 a escada só mostrava função de
# uma linha. O banco deste tópico escreve sete questões com a função em
# várias linhas, que é como ela aparece em qualquer programa; a escada
# passa a mostrar uma, num passo guiado, e o conferidor a põe fora do
# `main` como já fazia com a de uma linha.
#
# O QUE A PROVA DO B1 MOSTRA, E O QUE NÃO MOSTRA. A premissa é "a memória
# é do programa, e outro programa não mexe nela". De dentro de um
# programa não se vê outro programa: o grafo do tópico já diz isso. O que
# se mostra é a consequência — o C não promete nada sobre o que há num
# lugar em que esta execução não escreveu, e o compilador reclama de
# quem lê ali. A nota de ambiente da prova diz o limite com todas as
# letras.
#
# AS PROVAS, e o que cada uma usa:
#
#   B1  a memória é do computador  o compilador reclama de ler sem valor
#   B2  a local continua lá        o compilador reclama do return &n
#   B3  o sistema recolhe sozinho  o analisador aponta o bloco que vazou
#   I1  o bloco some com a função  o bloco lido depois do return: 7
#   I2  memória é uma só           o compilador reclama de free(&nota)
#
# A do B3 pede o analisador de fluxo do gcc (-fanalyzer), que segue o
# caminho do programa; a nota de ambiente diz isso.
#
# AS QUESTÕES DE MARCAR. O banco do kc_01 não foi mexido. Cinco das 30
# questões de diagnóstico e de treino usam o que as escadas não ensinam
# — variável global, o `+=`, a multiplicação (`100 * sizeof(int)`), o
# tamanho da pilha — e estão em `fora_da_trilha`.
#
# A CRENÇA DE CADA PREMISSA aparece dita, com todas as letras, numa
# alternativa de um degrau guiado, e só ali o erro leva `crenca`.
#
# gerado_por: Claude Fable 5.2, em 13/11/2026
# revisado_por:
#   (em branco até o Rafael ler; só então este conteúdo vai para o ramo
#   principal)

B1:
  revisao:
    frases:
      - "Cada vez que o programa roda, ele recebe uma memória só dele."
      - "Quando termina, ela volta para o sistema: o que ele guardou não fica esperando a próxima execução."
    codigo: |
      int nota;

      nota = 7;
      printf("%d\n", nota);
    saida: "7"
  cena:
    atores:
      - {nome: nota, tipo: caixa, de: int}
    passos:
      - {linha: 1, faz: [{cria: nota}]}
      - {linha: 3, faz: [{guarda: {em: nota, valor: 7}}]}
      - {linha: 4, faz: [{le: nota}, {mostra: '7'}]}
  # Variável global, que nenhuma escada ensinou.
  fora_da_trilha: [ciu_kc01_t03]
  provas:
    - crenca: memoria_e_do_computador
      programa: |
        int nota;

        printf("%d\n", nota);
      previsao:
        pergunta: >
          O programa só lê nota: não escreve nada nela. O compilador
          reclama de alguma coisa?
        opcoes:
          - "Não: nota tem o que ficou na memória do computador"
          - "Sim: nota é lida sem valor garantido"
        real: 1
        crenca: 0
      reclama: "'nota' is used uninitialized"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa
        não é executado. Isto é o que se vê de dentro de um programa; que
        um não alcança a memória do outro, programa nenhum mostra
        sozinho.
      afirma: >
        O compilador reclama: nota é lida sem ter recebido valor ("used
        uninitialized"). Para o C não existe o que ficou do último
        programa: a memória que a execução recebe é só dela, e o que há
        num lugar em que ela não escreveu não tem garantia nenhuma.
  degraus:
    - id: esc_kc01_B1_1
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Enquanto o programa roda, a memória que ele recebeu é só dele."
        - "Ninguém de fora mexe nela: o que ele escreveu continua lá."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int nota;
            int idade;

            nota = 7;
            idade = 15;
            idade = idade + 1;
            printf("%d\n", nota);
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "16"
              retorno: "16 é o que ficou em idade. nota recebeu 7, e ninguém mais escreveu nela: continua 7."
            - texto: "8"
              retorno: "A soma foi feita em idade, que é outra variável. nota recebeu 7, e ninguém mais escreveu nela."
          retorno_geral: "nota recebeu 7, e ninguém mais escreveu nela: continua 7."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int nota;
            int idade;

            nota = 9;
            idade = 20;
            idade = idade + 5;
            printf("%d\n", nota);
          aceitas: ["9"]
          certa_texto: "9"
          erros:
            - texto: "25"
              retorno: "25 é o que ficou em idade. nota recebeu 9, e ninguém mais escreveu nela: continua 9."
            - texto: "14"
              retorno: "A soma foi feita em idade, que é outra variável. nota recebeu 9, e ninguém mais escreveu nela."
          retorno_geral: "nota recebeu 9, e ninguém mais escreveu nela: continua 9."

    - id: esc_kc01_B1_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Quando o programa termina, a memória dele volta para o sistema."
        - "Na próxima vez que rodar, ele recebe outra memória, que pode ter sido de qualquer programa."
      versoes:
        - pede: "O programa roda, guarda 7 em nota e termina. Depois roda de novo. O que a segunda execução encontra em nota, antes de escrever nela?"
          antes: |-
            int nota;

            nota = 7;
          pecas:
            - "Um valor sem garantia: a memória da outra execução não é a dela"
            - "O 7: a memória é do computador, e guarda o que o último programa deixou"
            - "Zero: toda memória começa zerada"
          certa: [[0]]
          certa_texto: "Um valor sem garantia: a memória da outra execução não é a dela"
          erros:
            - exata: [1]
              crenca: memoria_e_do_computador
              retorno: "A memória não fica guardando o que um programa deixou. Cada execução recebe a dela, e a da execução anterior voltou para o sistema. O 7 não está lá."
            - exata: [2]
              retorno: "O C não promete zero numa variável em que ninguém escreveu: o valor não tem garantia. O que é certo é que o 7 da outra execução não está lá."
          retorno_geral: "Cada execução recebe a memória dela. O que a anterior guardou não está lá, e nota começa sem valor garantido."
        - pede: "O programa roda, guarda 42 em pontos e termina. Depois roda de novo. O que a segunda execução encontra em pontos, antes de escrever nela?"
          antes: |-
            int pontos;

            pontos = 42;
          pecas:
            - "O 42: a memória é do computador, e guarda o que o último programa deixou"
            - "Zero: toda memória começa zerada"
            - "Um valor sem garantia: a memória da outra execução não é a dela"
          certa: [[2]]
          certa_texto: "Um valor sem garantia: a memória da outra execução não é a dela"
          erros:
            - exata: [0]
              crenca: memoria_e_do_computador
              retorno: "A memória não fica guardando o que um programa deixou. Cada execução recebe a dela, e a da execução anterior voltou para o sistema. O 42 não está lá."
            - exata: [1]
              retorno: "O C não promete zero numa variável em que ninguém escreveu: o valor não tem garantia. O que é certo é que o 42 da outra execução não está lá."
          retorno_geral: "Cada execução recebe a memória dela. O que a anterior guardou não está lá, e pontos começa sem valor garantido."

    - id: esc_kc01_B1_3
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "Dois programas rodando ao mesmo tempo têm, cada um, a sua memória e a sua numeração de endereços."
        - "Um não lê nem muda a do outro, mesmo que as variáveis tenham o mesmo nome."
      versoes:
        - pede: "Os dois programas rodam ao mesmo tempo, e cada um tem uma variável idade. O programa B escreve 0 na dele. Quanto vale a idade do programa A?"
          antes: |-
            /* programa A */  int idade = 15;
            /* programa B */  int idade = 0;
          pecas:
            - "15: a memória de A é só de A"
            - "0: o nome é o mesmo, e a memória é uma só"
            - "Não dá para saber: um programa bagunça o outro"
          certa: [[0]]
          certa_texto: "15: a memória de A é só de A"
          erros:
            - exata: [1]
              retorno: "O nome igual não junta as duas: cada programa tem a memória dele, e a idade de B fica na de B. A de A continua com 15."
            - exata: [2]
              retorno: "Um programa não alcança a memória do outro: nada que B faça muda a idade de A. Ela continua com 15."
          retorno_geral: "A idade de A fica na memória de A, que B não alcança: 15."
        - pede: "Os dois programas rodam ao mesmo tempo, e cada um tem uma variável nota. O programa B escreve 10 na dele. Quanto vale a nota do programa A?"
          antes: |-
            /* programa A */  int nota = 7;
            /* programa B */  int nota = 10;
          pecas:
            - "10: o nome é o mesmo, e a memória é uma só"
            - "Não dá para saber: um programa bagunça o outro"
            - "7: a memória de A é só de A"
          certa: [[2]]
          certa_texto: "7: a memória de A é só de A"
          erros:
            - exata: [0]
              retorno: "O nome igual não junta as duas: cada programa tem a memória dele, e a nota de B fica na de B. A de A continua com 7."
            - exata: [1]
              retorno: "Um programa não alcança a memória do outro: nada que B faça muda a nota de A. Ela continua com 7."
          retorno_geral: "A nota de A fica na memória de A, que B não alcança: 7."

    - id: esc_kc01_B1_4
      nome: "Cada execução começa com a memória dela"
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "O programa quer contar quantas vezes já foi rodado, somando 1 numa variável a cada execução. Funciona?"
          antes: |-
            int vezes;

            vezes = vezes + 1;
            printf("%d\n", vezes);
          pecas:
            - "Não: cada execução recebe outra memória, e vezes começa sem valor garantido"
            - "Funciona: vezes guarda o que a execução anterior deixou"
            - "Funciona, enquanto o computador não for desligado"
          certa: [[0]]
          certa_texto: "Não: cada execução recebe outra memória, e vezes começa sem valor garantido"
          erros:
            - exata: [1]
              retorno: "A variável não guarda nada entre uma execução e outra: a memória da execução anterior voltou para o sistema. vezes começa sem valor garantido."
            - exata: [2]
              retorno: "Desligar não é a questão: basta o programa terminar. A memória dele volta para o sistema, e a execução seguinte recebe outra."
          retorno_geral: "Cada execução recebe outra memória: vezes não traz nada da execução anterior."
        - pede: "O jogo guarda os pontos numa variável. Você fecha o jogo e abre de novo. Os pontos da partida anterior estão lá?"
          antes: "int pontos;"
          pecas:
            - "Estão: ficam na memória do computador até outro programa usar"
            - "Não: a memória daquela execução voltou para o sistema"
            - "Estão, se a variável tiver o mesmo nome"
          certa: [[1]]
          certa_texto: "Não: a memória daquela execução voltou para o sistema"
          erros:
            - exata: [0]
              retorno: "A memória não fica guardando o que um programa deixou: quando o jogo fechou, a dele voltou para o sistema. A nova execução recebe outra."
            - exata: [2]
              retorno: "O nome da variável não segura valor nenhum. A memória da execução anterior voltou para o sistema, e a nova começa com outra."
          retorno_geral: "Quando o jogo fechou, a memória dele voltou para o sistema. A nova execução recebe outra."

    - id: esc_kc01_B1_5
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Os programas A e B rodam ao mesmo tempo. A termina. O que muda na memória de B?"
          pecas:
            - "Nada: a memória de B é só de B"
            - "B passa a enxergar o que A tinha guardado"
            - "B perde o que tinha: a memória foi devolvida"
          certa: [[0]]
          certa_texto: "Nada: a memória de B é só de B"
          erros:
            - exata: [1]
              retorno: "O que A guardou estava na memória de A, que voltou para o sistema. B continua só com a dele, e não enxerga a de mais ninguém."
            - exata: [2]
              retorno: "Quem devolveu a memória foi A, e a memória devolvida era a de A. A de B continua com B, como estava."
          retorno_geral: "Cada programa tem a sua memória. O fim de A não muda nada na de B."
        - pede: "O programa A tem um erro, e escreve sem parar em todas as variáveis dele. O que acontece com as variáveis do programa B, que roda ao mesmo tempo?"
          pecas:
            - "São sobrescritas: a memória é do computador, e os dois dividem"
            - "Somem quando A terminar"
            - "Nada: A não alcança a memória de B"
          certa: [[2]]
          certa_texto: "Nada: A não alcança a memória de B"
          erros:
            - exata: [0]
              retorno: "Os dois não dividem a memória: cada programa tem a dele. O que A escreve fica na de A, e não chega nas variáveis de B."
            - exata: [1]
              retorno: "Quando A termina, o que volta para o sistema é a memória de A. As variáveis de B estão na de B, e continuam lá."
          retorno_geral: "Cada programa tem a sua memória. A não alcança as variáveis de B."

B2:
  revisao:
    frases:
      - "A variável declarada dentro da função é local: nasce quando a chamada começa e acaba quando a chamada termina."
      - "Na chamada seguinte nasce outra, do zero: a função não lembra de nada."
    codigo: |
      int conta(void) { int n = 0; n = n + 1; return n; }

      conta();
      printf("%d\n", conta());
    saida: "1"
  cena:
    atores:
      - {nome: conta, tipo: bancada, de: int conta(void)}
      - {nome: n, tipo: caixa, de: int}
    passos:
      - {linha: 3, faz: [{chama: conta}]}
      - {linha: 1, faz: [{cria: n}, {guarda: {em: n, valor: 0}}, {guarda: {em: n, valor: 1}}, {diz: conta devolve 1}]}
      - {linha: 3, faz: [{volta: conta}, {diz: o 1 que voltou não vai para variável nenhuma}]}
      - {linha: 4, faz: [{chama: conta}]}
      - {linha: 1, faz: [{cria: n}, {guarda: {em: n, valor: 0}}, {guarda: {em: n, valor: 1}}, {diz: 'este n é outro, e começa de novo em 0'}]}
      - {linha: 4, faz: [{volta: conta}, {mostra: '1'}]}
  # O +=, e variável declarada fora da função.
  fora_da_trilha: [ciu_kc01_t06]
  provas:
    - crenca: local_sobrevive
      programa: |
        int *valor(void) { int n = 7; return &n; }

        int *p;

        p = valor();
      previsao:
        pergunta: >
          A função devolve o endereço de n, a variável dela, e p guarda
          esse endereço. O compilador reclama de alguma coisa?
        opcoes:
          - "Não: n continua lá depois que a função termina"
          - "Sim: reclama de devolver o endereço de uma variável da função"
        real: 1
        crenca: 0
      reclama: "function returns address of local variable"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa
        não é executado: o que haveria naquele lugar, ninguém sabe.
      afirma: >
        O compilador reclama do return: a função devolve o endereço de
        uma variável local ("address of local variable"). n acaba quando
        a chamada termina, e o endereço fica apontando para um lugar que
        não é mais de n.
  degraus:
    - id: esc_kc01_B2_1
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Uma função pode devolver um valor, com return. O tipo antes do nome diz o que ela devolve."
        - "Com int dobro(int n) { return n + n; } a chamada dobro(4) vale 8."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int dobro(int n) { return n + n; }

            printf("%d\n", dobro(5));
          aceitas: ["10"]
          certa_texto: "10"
          erros:
            - texto: "5"
              retorno: "5 é o que entrou em n. A função devolve n + n, e é esse valor que a chamada passa a valer: 10."
          retorno_geral: "A chamada dobro(5) vale o que a função devolve: 5 mais 5, 10."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int mais3(int n) { return n + 3; }

            printf("%d\n", mais3(4));
          aceitas: ["7"]
          certa_texto: "7"
          erros:
            - texto: "4"
              retorno: "4 é o que entrou em n. A função devolve n + 3, e é esse valor que a chamada passa a valer: 7."
          retorno_geral: "A chamada mais3(4) vale o que a função devolve: 4 mais 3, 7."

    - id: esc_kc01_B2_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "A variável declarada dentro da função é local: nasce quando a chamada começa e acaba quando ela termina."
        - "(void) nos parênteses quer dizer que a função não tem parâmetro."
      versoes:
        - pede: "A função é chamada duas vezes. Quando a segunda chamada começa, o que há com o n da primeira?"
          antes: |-
            int conta(void) { int n = 0; n = n + 1; return n; }

            conta();
            conta();
          pecas:
            - "Acabou: a segunda chamada cria outro n"
            - "Continua lá, com o 1 que tinha: a variável da função não some"
            - "Continua lá, mas zerado"
          certa: [[0]]
          certa_texto: "Acabou: a segunda chamada cria outro n"
          erros:
            - exata: [1]
              crenca: local_sobrevive
              retorno: "A variável local acaba quando a chamada termina. O n da primeira chamada não existe mais; a segunda cria outro, que começa do zero."
            - exata: [2]
              retorno: "Não é o mesmo n, zerado: o da primeira chamada acabou. A segunda cria outro, e a linha int n = 0; dá o valor dele."
          retorno_geral: "O n da primeira chamada acabou com ela. A segunda cria outro."
        - pede: "A função é chamada duas vezes. Quando a segunda chamada começa, o que há com o t da primeira?"
          antes: |-
            int soma(int v) { int t = 10; t = t + v; return t; }

            soma(5);
            soma(1);
          pecas:
            - "Continua lá, com o 15 que tinha: a variável da função não some"
            - "Continua lá, mas de volta em 10"
            - "Acabou: a segunda chamada cria outro t"
          certa: [[2]]
          certa_texto: "Acabou: a segunda chamada cria outro t"
          erros:
            - exata: [0]
              crenca: local_sobrevive
              retorno: "A variável local acaba quando a chamada termina. O t da primeira chamada não existe mais; a segunda cria outro, que começa do zero."
            - exata: [1]
              retorno: "Não é o mesmo t, de volta em 10: o da primeira chamada acabou. A segunda cria outro, e a linha int t = 10; dá o valor dele."
          retorno_geral: "O t da primeira chamada acabou com ela. A segunda cria outro."

    - id: esc_kc01_B2_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "Por isso a função não lembra de nada entre uma chamada e outra."
        - "Ela pode ser escrita em várias linhas, entre as chaves: é a mesma função."
      versoes:
        - pede: "A função é chamada duas vezes, e só a segunda é mostrada. Que número aparece?"
          mostra: |-
            int conta(void) {
                int n = 0;
                n = n + 1;
                return n;
            }

            conta();
            printf("%d\n", conta());
          aceitas: ["1"]
          certa_texto: "1"
          erros:
            - texto: "2"
              retorno: "O n da primeira chamada acabou junto com ela. A segunda cria outro n, que começa em 0 e vira 1."
          retorno_geral: "Cada chamada cria o seu n, que começa em 0 e vira 1. A segunda devolve 1."
        - pede: "A função é chamada duas vezes, e só a segunda é mostrada. Que número aparece?"
          mostra: |-
            int passo(void) {
                int n = 5;
                n = n + 5;
                return n;
            }

            passo();
            printf("%d\n", passo());
          aceitas: ["10"]
          certa_texto: "10"
          erros:
            - texto: "15"
              retorno: "O n da primeira chamada acabou junto com ela. A segunda cria outro n, que começa em 5 e vira 10."
          retorno_geral: "Cada chamada cria o seu n, que começa em 5 e vira 10. A segunda devolve 10."

    - id: esc_kc01_B2_4
      nome: "A variável local acaba com a chamada"
      guiado: false
      forma: digitar
      codigo: true
      frases: []
      versoes:
        - pede: "A função é chamada duas vezes, e só a segunda é mostrada. Que número aparece?"
