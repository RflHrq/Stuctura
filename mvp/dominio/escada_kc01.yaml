B3:
  revisao:
    frases:
      - "malloc pede um bloco de memória e devolve o endereço dele. O bloco é seu até você devolver, com free."
      - "A função terminar não devolve o bloco, e o sistema não recolhe sozinho enquanto o programa roda."
    codigo: |
      int *p;

      p = malloc(sizeof(int));
      *p = 7;
      printf("%d\n", *p);
      free(p);
    saida: "7"
  cena:
    atores:
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
    passos:
      - {linha: 1, faz: [{cria: p}]}
      - {linha: 3, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 4, faz: [{segue: p}, {guarda: {em: bloco, valor: 7}}]}
      - {linha: 5, faz: [{segue: p}, {le: bloco}, {mostra: '7'}]}
      - {linha: 6, faz: [{devolve: bloco}]}
  # A multiplicação, em malloc(100 * sizeof(int)).
  fora_da_trilha: [ciu_kc01_t08]
  provas:
    - crenca: system_frees_auto
      programa: |
        void devolve(void) { int *p = malloc(sizeof(int)); free(p); }
        void esquece(void) { int *p; p = malloc(sizeof(int)); }

        devolve();
        esquece();
      previsao:
        pergunta: >
          As duas funções pedem um bloco. Só a primeira chama free.
          Seguindo o caminho do programa, de qual delas o compilador
          reclama?
        opcoes:
          - "Da segunda: o bloco dela vazou"
          - "De nenhuma: o sistema recolhe sozinho o bloco da segunda"
        real: 0
        crenca: 1
      reclama: "leak of 'p'"
      avisos: "-fanalyzer"
      ambiente: >
        Mensagem do gcc 16.2 com o analisador de fluxo ligado
        (-fanalyzer), que segue o caminho do programa. "leak" é
        vazamento: memória pedida e nunca devolvida. O programa não é
        executado.
      afirma: >
        O compilador reclama da segunda função: o bloco de p vazou ("leak
        of 'p'"). Foi pedido, a função terminou, e ninguém o devolveu. Se
        o sistema recolhesse sozinho, não haveria vazamento para apontar.
