            q = malloc(sizeof(int));
            *q = idade + 5;
            printf("%d\n", *q);
            free(q);
          aceitas: ["20"]
          certa_texto: "20"
          erros:
            - texto: "15"
              retorno: "O bloco recebeu idade + 5: 15 mais 5. idade, na pilha, continua com 15; *q, no monte, vale 20."
          retorno_geral: "idade, na pilha, vale 15. O bloco, no monte, recebeu 15 mais 5: 20."

    - id: esc_kc01_I2_4
      nome: "Pilha e monte têm regras diferentes"
      guiado: false
      forma: escolher
      codigo: false
      frases: []
      versoes:
        - pede: "Cada função é chamada mil vezes. Em qual das duas a memória vai se enchendo?"
          antes: |-
            void local(void) { int n = 7; printf("%d\n", n); }
            void aluga(void) { int *p = malloc(sizeof(int)); *p = 7; }
          pecas:
            - "Na aluga: cada chamada pede um bloco do monte e não devolve"
            - "Na local: cada chamada cria mais um n na pilha"
            - "Em nenhuma: a memória é uma só, e o sistema arruma"
          certa: [[0]]
          certa_texto: "Na aluga: cada chamada pede um bloco do monte e não devolve"
          erros:
            - exata: [1]
              retorno: "O n da pilha acaba sozinho no fim de cada chamada: não sobra nada. Quem acumula é a aluga, que pede um bloco do monte a cada chamada e não devolve."
            - exata: [2]
              retorno: "As duas áreas têm regras diferentes. A pilha se arruma sozinha a cada chamada; o monte, só com free — e a aluga nunca chama."
          retorno_geral: "A pilha se arruma sozinha. O monte, não: os blocos da aluga vão se acumulando."
        - pede: "Cada função é chamada mil vezes. Em qual das duas a memória vai se enchendo?"
          antes: |-
            void pede(void) { int *q = malloc(sizeof(int)); *q = 9; }
            void conta(void) { int v = 9; printf("%d\n", v); }
          pecas:
            - "Em nenhuma: a memória é uma só, e o sistema arruma"
            - "Na conta: cada chamada cria mais um v na pilha"
            - "Na pede: cada chamada pede um bloco do monte e não devolve"
          certa: [[2]]
          certa_texto: "Na pede: cada chamada pede um bloco do monte e não devolve"
          erros:
            - exata: [1]
              retorno: "O v da pilha acaba sozinho no fim de cada chamada: não sobra nada. Quem acumula é a pede, que pede um bloco do monte a cada chamada e não devolve."
            - exata: [0]
              retorno: "As duas áreas têm regras diferentes. A pilha se arruma sozinha a cada chamada; o monte, só com free — e a pede nunca chama."
          retorno_geral: "A pilha se arruma sozinha. O monte, não: os blocos da pede vão se acumulando."

    - id: esc_kc01_I2_5
