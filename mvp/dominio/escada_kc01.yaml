I2:
  revisao:
    frases:
      - "A memória do programa tem duas áreas. A pilha guarda as variáveis locais, e o compilador a arruma sozinho."
      - "O monte guarda os blocos do malloc, e quem arruma é você, com free."
    codigo: |
      int nota;
      int *p;

      nota = 7;
      p = malloc(sizeof(int));
      *p = nota;
      printf("%d\n", *p);
      free(p);
    saida: "7"
  cena:
    atores:
      - {nome: nota, tipo: caixa, de: int}
      - {nome: p, tipo: ponteiro, de: int *}
      - {nome: bloco, tipo: bloco, de: int}
    passos:
      - {linha: 1, faz: [{cria: nota}]}
      - {linha: 2, faz: [{cria: p}]}
      - {linha: 4, faz: [{guarda: {em: nota, valor: 7}}]}
      - {linha: 5, faz: [{aluga: {nome: bloco, para: p}}]}
      - {linha: 6, faz: [{le: nota}, {segue: p}, {guarda: {em: bloco, valor: 7}}]}
      - {linha: 7, faz: [{segue: p}, {le: bloco}, {mostra: '7'}]}
      - {linha: 8, faz: [{devolve: bloco}]}
  # Vetor de um milhão de posições, a multiplicação, e o tamanho da
  # pilha, que a escada não diz.
  fora_da_trilha: [ciu_kc01_t15]
  provas:
    - crenca: memory_is_uniform
      programa: |
        int nota;
        int *p;

        nota = 7;
        p = malloc(sizeof(int));
        free(p);
        free(&nota);
      previsao:
        pergunta: >
          O trecho chama free duas vezes: para o bloco que p aponta, e
          para a variável nota. De qual das duas o compilador reclama?
        opcoes:
          - "De nenhuma: memória é uma só, e free serve para qualquer lugar"
          - "Da última: nota não foi pedida com malloc"
        real: 1
        crenca: 0
      reclama: "'free' called on unallocated object 'nota'"
      ambiente: >
        Mensagem do gcc 16.2 com os avisos ligados (-Wall). O programa
        não é executado: devolver o que não foi pedido não tem resultado
        definido.
      afirma: >
        O compilador aceita free(p); e reclama de free(&nota);: nota não
        é um bloco pedido ("unallocated object"). As duas áreas têm
        regras diferentes: o que é da pilha acaba sozinho, e free só
        serve para o que veio do monte.
  degraus:
    - id: esc_kc01_I2_1
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "As variáveis locais ficam numa área chamada pilha. Quem arruma a pilha é o compilador, a cada chamada."
        - "Os blocos do malloc ficam em outra área, o monte. Quem arruma o monte é você, com free."
      versoes:
        - pede: "Onde fica cada coisa?"
          antes: |-
            int nota;
            int *p;

            p = malloc(sizeof(int));
          pecas:
            - "nota e p na pilha; o bloco no monte"
            - "Tudo no mesmo lugar: memória é uma só, com uma regra só"
            - "nota na pilha; p e o bloco no monte"
          certa: [[0]]
          certa_texto: "nota e p na pilha; o bloco no monte"
          erros:
            - exata: [1]
              crenca: memory_is_uniform
              retorno: "A memória do programa tem duas áreas, com regras diferentes. nota e p são variáveis locais, e ficam na pilha; o bloco pedido com malloc fica no monte."
            - exata: [2]
              retorno: "p é uma variável local como nota: fica na pilha. No monte está só o bloco que p aponta."
          retorno_geral: "As variáveis nota e p ficam na pilha. O bloco pedido com malloc fica no monte."
        - pede: "Onde fica cada coisa?"
          antes: |-
            int *q;
            int idade;

            q = malloc(sizeof(int));
          pecas:
            - "idade na pilha; q e o bloco no monte"
            - "idade e q na pilha; o bloco no monte"
            - "Tudo no mesmo lugar: memória é uma só, com uma regra só"
          certa: [[1]]
          certa_texto: "idade e q na pilha; o bloco no monte"
          erros:
            - exata: [2]
              crenca: memory_is_uniform
              retorno: "A memória do programa tem duas áreas, com regras diferentes. idade e q são variáveis locais, e ficam na pilha; o bloco pedido com malloc fica no monte."
            - exata: [0]
              retorno: "q é uma variável local como idade: fica na pilha. No monte está só o bloco que q aponta."
          retorno_geral: "As variáveis idade e q ficam na pilha. O bloco pedido com malloc fica no monte."

    - id: esc_kc01_I2_2
      guiado: true
      forma: escolher
      codigo: false
      frases:
        - "As regras são diferentes: o que está na pilha acaba sozinho; o que está no monte, só com free."
        - "Por isso free só serve para bloco do monte."
      versoes:
        - pede: "Qual destas linhas devolve memória do jeito certo?"
          antes: |-
            int nota;
            int *p;

            p = malloc(sizeof(int));
          pecas: ["free(p);", "free(&nota);", "free(nota);"]
          certa: [[0]]
          certa_texto: "free(p);"
          erros:
            - exata: [1]
              retorno: "nota fica na pilha, e acaba sozinha: não foi pedida com malloc, e free não serve para ela. O compilador reclama. Quem se devolve é o bloco: free(p);"
            - exata: [2]
              retorno: "free recebe o endereço de um bloco do monte, e nota é um número, de uma variável da pilha: o compilador reclama. Quem se devolve é o bloco: free(p);"
          retorno_geral: "free serve para o bloco do monte, pelo endereço dele: free(p);"
        - pede: "Qual destas linhas devolve memória do jeito certo?"
          antes: |-
            int *q;
            int idade;

            q = malloc(sizeof(int));
          pecas: ["free(&idade);", "free(idade);", "free(q);"]
          certa: [[2]]
          certa_texto: "free(q);"
          erros:
            - exata: [0]
              retorno: "idade fica na pilha, e acaba sozinha: não foi pedida com malloc, e free não serve para ela. O compilador reclama. Quem se devolve é o bloco: free(q);"
            - exata: [1]
              retorno: "free recebe o endereço de um bloco do monte, e idade é um número, de uma variável da pilha: o compilador reclama. Quem se devolve é o bloco: free(q);"
          retorno_geral: "free serve para o bloco do monte, pelo endereço dele: free(q);"

    - id: esc_kc01_I2_3
      guiado: true
      forma: digitar
      codigo: true
      frases:
        - "As duas áreas trabalham juntas: a variável da pilha guarda o endereço, e o valor fica no bloco do monte."
      versoes:
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int nota;
            int *p;

            nota = 7;
            p = malloc(sizeof(int));
            *p = nota + 1;
            printf("%d\n", *p);
            free(p);
          aceitas: ["8"]
          certa_texto: "8"
          erros:
            - texto: "7"
              retorno: "O bloco recebeu nota + 1: 7 mais 1. nota, na pilha, continua com 7; *p, no monte, vale 8."
          retorno_geral: "nota, na pilha, vale 7. O bloco, no monte, recebeu 7 mais 1: 8."
        - pede: "Que número este trecho mostra na tela?"
          mostra: |-
            int idade;
